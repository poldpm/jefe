                '<p class="menut">Aquests no porten el nom del comerç: el banc hi ha ' +
                  'posat una etiqueta genèrica. Cada un és una compra diferent, i per ' +
                  'això no s\'aprenen mai.</p>' +
                '<div class="revisar">' +
                  d.solts.map(function (m) {
                    return '<div class="rev-fila" data-mov="' + esc(m.id) + '">' +
                      '<div class="rev-cap">' +
                        '<b>' + esc(m.descripcio) + '</b>' +
                        '<span class="num menut">' + eur(m.import) + '</span>' +
                      '</div>' +
                      '<div class="menut">' + esc(fmt.relativa(m.data)) + ' · ' +
                        (m.tipus === 'i' ? 'ingrés' : 'despesa') + '</div>' +
                      triador(m.tipus, 'data-tria-mov') +
                    '</div>';
                  }).join('') +
                '</div>'
              : '') +
          '</section>' +
        '</div>';

      lligaCapcalera();

      /* En triar, s'aplica i la fila se'n va. Sense botó de desar: afegir un
         segon toc a cada decisió és tornar a posar la fricció que treiem. */
      arrel.querySelectorAll('[data-tria-grup]').forEach(function (sel) {
        sel.addEventListener('change', function () {
          if (!sel.value) return;
          var fila = sel.closest('.rev-fila');
          fila.dataset.fent = '1'; sel.disabled = true;
          crida('finances', 'decideix', { clau: fila.dataset.clau, categoria: sel.value })
            .then(function (r) {
              fila.dataset.fet = '1';
              Cau.oblida('finances.');
              App.brindis(r.tocats + (r.tocats === 1 ? ' moviment classificat' : ' moviments classificats'));
              setTimeout(function () { fila.remove(); comprovaBuit(); }, 260);
            })
            .catch(function (err) {
              fila.dataset.fent = '0'; sel.disabled = false;
              App.brindis(err.message, 'error');
            });
        });
      });

      arrel.querySelectorAll('[data-tria-mov]').forEach(function (sel) {
        sel.addEventListener('change', function () {
          if (!sel.value) return;
          var fila = sel.closest('.rev-fila');
          fila.dataset.fent = '1'; sel.disabled = true;
          crida('finances', 'decideixUn', { id: fila.dataset.mov, categoria: sel.value })
            .then(function () {
              fila.dataset.fet = '1';
              Cau.oblida('finances.');
              setTimeout(function () { fila.remove(); comprovaBuit(); }, 260);
            })
            .catch(function (err) {
              fila.dataset.fent = '0'; sel.disabled = false;
              App.brindis(err.message, 'error');
            });
        });
      });

      function comprovaBuit() {
        if (!arrel.querySelector('.rev-fila')) {
          App.brindis('Safata buida');
          App.ves('finances', { mes: mes, periode: 'mes' });
        }
      }
    }

    // -------------------------------------------------------------- accions

    function lligaCapcalera() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-salt]').forEach(function (b) {
        b.addEventListener('click', function () {
          var nou = mouMes(mes, Number(b.dataset.salt));
          if (nou > new Date().toISOString().slice(0, 7)) return;
          App.ves('finances', { mes: nou, periode: periode });
        });
      });

      var bp = arrel.querySelector('[data-obre-periode]');
      if (bp) bp.addEventListener('click', obrePeriode);

      arrel.querySelectorAll('[data-apunta]').forEach(function (b) {
        b.addEventListener('click', function () { obreApunt(null); });
      });

      var brev = arrel.querySelector('[data-revisar]');
      if (brev) brev.addEventListener('click', function () {
        App.ves('finances', { mes: mes, periode: 'revisar' });
      });

      var baj = arrel.querySelector('[data-ajustos]');
      if (baj) baj.addEventListener('click', obreAjustos);
    }

    /**
     * Portar-hi l'històric de l'app antiga. En dos temps: un assaig que no
     * escriu res i diu què faria, i només després l'escriptura. Amb dades de
     * diners, ensenyar el resultat abans de tocar-les no és una cortesia.
     */
    function obreAjustos() {
      var cos = App.modal('Finances',
        '<div class="form-ajustos">' +
          '<p class="marge">Categories</p>' +
          '<div id="fin-cats" class="cats-gest"></div>' +

          '<div class="cat-nova">' +
            '<div class="tipus-tria" role="group">' +
              '<button data-nova-mena="d" aria-pressed="true">Despesa</button>' +
              '<button data-nova-mena="i">Ingrés</button>' +
            '</div>' +
            '<div class="cat-nova-fila">' +
              '<input data-nova-emoji placeholder="🛒" maxlength="4" class="camp-emoji" autocomplete="off">' +
              '<input data-nova-nom placeholder="Nom de la categoria" autocomplete="off">' +
            '</div>' +
            '<label class="cat-exclou">' +
              '<input type="checkbox" data-nova-exclou>' +
              '<span>Fora dels comptes (com els traspassos)</span>' +
            '</label>' +
            '<button class="btn btn-secundari" data-crea-cat>Crea la categoria</button>' +
          '</div>' +

          '<hr>' +
          '<p class="marge">Portar-hi les dades de l\'app antiga</p>' +
          '<p class="menut">Tria el fitxer que exportes des de finances. Primer et diré què hi ' +
            'trobo i què faria; no s\'escriu res fins que ho confirmis. No esborra ni sobreescriu ' +
            'mai, i es pot repetir sense duplicar.</p>' +
          '<input type="file" accept="application/json,.json" data-fitxer>' +
          '<div id="fin-import"></div>' +
        '</div>');

      // ---- categories
      var menaNova = 'd';
      var llista = cos.querySelector('#fin-cats');

      function pintaCats() {
        llista.innerHTML = ['d', 'i'].map(function (mena) {
          var d_ = cats.filter(function (c) { return c.mena === mena; });
          if (!d_.length) return '';
          return '<p class="menut cat-mena">' + (mena === 'd' ? 'Despeses' : 'Ingressos') + '</p>' +
            d_.map(function (c) {
              return '<div class="cat-gest">' +
                '<span class="cat-gest-nom">' + esc((c.emoji ? c.emoji + ' ' : '') + c.nom) +
                  (c.exclou ? ' <span class="menut">· fora dels comptes</span>' : '') + '</span>' +
                '<button class="btn btn-fantasma btn-icona" data-treu-cat="' + esc(c.id) +
                  '" aria-label="Treu ' + esc(c.nom) + '">' + ic('tancar', 'ic-p') + '</button>' +
              '</div>';
            }).join('');
        }).join('');

        llista.querySelectorAll('[data-treu-cat]').forEach(function (b) {
          b.addEventListener('click', function () {
            b.disabled = true;
            crida('finances', 'arxivaCategoria', { id: b.dataset.treuCat })
              .then(refrescaCats)
              .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
          });
        });
      }

      function refrescaCats() {
        Cau.oblida('finances.');
        return crida('finances', 'categories', {}).then(function (l) {
          cats = l; pintaCats();
        });
      }
      pintaCats();

      cos.querySelectorAll('[data-nova-mena]').forEach(function (b) {
        b.addEventListener('click', function () {
          menaNova = b.dataset.novaMena;
          cos.querySelectorAll('[data-nova-mena]').forEach(function (x) {
            x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
          });
        });
      });

      cos.querySelector('[data-crea-cat]').addEventListener('click', function () {
        var nom = cos.querySelector('[data-nova-nom]');
        var emoji = cos.querySelector('[data-nova-emoji]');
        var exclou = cos.querySelector('[data-nova-exclou]');
        if (!nom.value.trim()) { App.brindis('Posa-hi un nom', 'error'); nom.focus(); return; }

        var b = this;
        b.disabled = true;
        crida('finances', 'creaCategoria', {
          nom: nom.value.trim(), emoji: emoji.value.trim(),
          mena: menaNova, exclou: exclou.checked
        }).then(function () {
          nom.value = ''; emoji.value = ''; exclou.checked = false;
          b.disabled = false;
          App.brindis('Categoria creada');
          return refrescaCats();
        }).catch(function (err) {
          b.disabled = false; App.brindis(err.message, 'error');
        });
      });

      // ---- importació
      var fitxer = cos.querySelector('[data-fitxer]');
      var sortida = cos.querySelector('#fin-import');

      fitxer.addEventListener('change', function () {
        var f = fitxer.files && fitxer.files[0];
        if (!f) return;
        sortida.innerHTML = '<p class="menut">Llegint el fitxer…</p>';

        var lector = new FileReader();
        lector.onerror = function () {
          sortida.innerHTML = '<p class="menut" style="color:var(--avis)">No he pogut llegir el fitxer.</p>';
        };
        lector.onload = function () {
          var text = String(lector.result || '');
          crida('finances', 'importa', { dades: text, simulacio: true })
            .then(function (r) { mostraAssaig(r, text); })
            .catch(function (err) {
              sortida.innerHTML = '<p class="menut" style="color:var(--avis)">' + esc(err.message) + '</p>';
            });
        };
        lector.readAsText(f);
      });

      function mostraAssaig(r, text) {
        var res = r.moviments + r.categories + r.recurrents + r.pressupostos + r.actius + r.valorsPatrimoni;
        sortida.innerHTML =
          '<div class="fitxa" style="margin-top:var(--e3)">' +
            '<p class="marge">Què hi he trobat</p>' +
            '<p>' + r.moviments + ' moviments · ' + r.categories + ' categories' +
              (r.actius ? ' · ' + r.actius + ' actius de patrimoni amb ' + r.valorsPatrimoni + ' valors' : '') +
              (r.recurrents ? ' · ' + r.recurrents + ' recurrents' : '') +
              (r.pressupostos ? ' · ' + r.pressupostos + ' pressupostos' : '') +
              (r.jaHiEren ? ' · ' + r.jaHiEren + ' que ja hi eren i no tornaré a posar' : '') + '</p>' +
            (r.comercos
              ? '<p class="menut">I em quedaré la categoria de <b>' + r.comercos + ' comerços</b> ' +
                'que ja havies classificat. D\'aquests no te\'n tornaré a preguntar mai més.</p>' : '') +
            (r.senseCategoria
              ? '<p class="menut">' + r.senseCategoria + ' moviments venen sense categoria clara. ' +
                'Entren igual i els podràs canviar des d\'aquí.</p>' : '') +
            (r.avisos && r.avisos.length
              ? '<p class="menut" style="color:var(--avis)">' + r.avisos.map(esc).join('<br>') + '</p>' : '') +
            (res > 0
              ? '<button class="btn btn-primari" data-confirma style="width:100%;margin-top:var(--e3)">' +
                  'Importa-ho</button>'
              : '<p class="menut">No hi ha res de nou per importar.</p>') +
          '</div>';

        var b = sortida.querySelector('[data-confirma]');
        if (!b) return;
        b.addEventListener('click', function () {
          b.disabled = true; b.textContent = 'Important…';
          crida('finances', 'importa', { dades: text, simulacio: false })
            .then(function (fet) {
              sortida.innerHTML = '<p class="menut">Importat: ' + fet.moviments + ' moviments i ' +
                fet.categories + ' categories.</p>';
              App.brindis('Dades de finances importades');
              cats = []; sugg = [];
              Cau.oblida('finances.');
              carrega();
            })
            .catch(function (err) {
              b.disabled = false; b.textContent = 'Torna-ho a provar';
              App.brindis(err.message, 'error');
            });
        });
      }
    }

    function lligaMoviments() {
      arrel.querySelectorAll('[data-edita]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.dataset.edita, m = null;
          for (var i = 0; i < dades.moviments.length; i++) {
            if (dades.moviments[i].id === id) m = dades.moviments[i];
          }
          if (m) obreApunt(m);
        });
      });

      arrel.querySelectorAll('[data-cat]').forEach(function (b) {
        b.addEventListener('click', function () {
          obrePressupost(b.dataset.cat, b.dataset.nom, Number(b.dataset.limit) || 0);
        });
      });
    }

    // ------------------------------------------------------------- apuntar

    /**
     * El formulari d'apuntar. Si li passes un moviment, l'edita.
     * L'import va primer i amb el teclat numèric: és l'únic camp que
     * sempre has d'omplir, i la resta se sol endevinar sola.
     */
    function obreApunt(m) {
      var editant = !!m;
      var cos = App.modal(editant ? 'Edita el moviment' : 'Apunta un moviment',
        '<div class="form-ajustos form-apunt">' +
          '<div class="tipus-tria" role="group">' +
            '<button data-tipus="d"' + (!editant || m.tipus === 'd' ? ' aria-pressed="true"' : '') + '>Despesa</button>' +
            '<button data-tipus="i"' + (editant && m.tipus === 'i' ? ' aria-pressed="true"' : '') + '>Ingrés</button>' +
          '</div>' +

          '<label><span class="marge">Import</span>' +
            '<input data-c="import" inputmode="decimal" class="num camp-import" placeholder="0,00" value="' +
              (editant ? String(m.import).replace('.', ',') : '') + '" autocomplete="off"></label>' +

          '<label><span class="marge">Què era</span>' +
            '<input data-c="descripcio" autocomplete="off" placeholder="p. ex. Mercadona" value="' +
              (editant ? esc(m.descripcio) : '') + '"></label>' +
          '<div class="sugg" id="sugg"></div>' +

          '<label><span class="marge">Categoria</span>' +
            '<select data-c="categoria"></select></label>' +

          '<label><span class="marge">Com ho has pagat</span>' +
            '<select data-c="metode">' +
              ['targeta', 'efectiu', 'online', 'transf', 'domic'].map(function (x) {
                return '<option value="' + x + '"' +
                       (editant && m.metode === x ? ' selected' : '') + '>' + x + '</option>';
              }).join('') +
            '</select></label>' +

          '<label><span class="marge">Data</span>' +
            '<input data-c="data" type="date" value="' +
              (editant ? esc(m.data) : fmt.avui()) + '" autocomplete="off"></label>' +

          '<button class="btn btn-primari" data-desa>' + (editant ? 'Desa' : 'Apunta') + '</button>' +
          (editant ? '<button class="btn btn-secundari" data-treu style="margin-top:var(--e2)">Treu-lo</button>' : '') +
        '</div>');

      var tipus = editant ? m.tipus : 'd';
      var camps = {};
      cos.querySelectorAll('[data-c]').forEach(function (i) { camps[i.dataset.c] = i; });

      function pintaCategories() {
        var opcions = cats.filter(function (c) { return c.mena === tipus; });
        camps.categoria.innerHTML = opcions.map(function (c) {
          return '<option value="' + esc(c.id) + '"' +
                 (editant && m.categoria === c.id ? ' selected' : '') + '>' +
                 esc((c.emoji ? c.emoji + ' ' : '') + c.nom) + '</option>';
        }).join('');
      }
      pintaCategories();

      cos.querySelectorAll('[data-tipus]').forEach(function (b) {
        b.addEventListener('click', function () {
          tipus = b.dataset.tipus;
          cos.querySelectorAll('[data-tipus]').forEach(function (x) {
            x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
          });
          pintaCategories();
        });
      });

      /* Suggeriments: el que ja has apuntat abans, amb la seva categoria i el
         seu mètode. Un toc omple tres camps. */
      var caixaSugg = cos.querySelector('#sugg');
      function pintaSugg(llista) {
        caixaSugg.innerHTML = (llista || []).slice(0, 6).map(function (s) {
          return '<button data-s="' + esc(s.descripcio) + '">' + esc(s.descripcio) + '</button>';
        }).join('');
        caixaSugg.querySelectorAll('[data-s]').forEach(function (b) {
          b.addEventListener('click', function () {
            var t = null;
            for (var i = 0; i < sugg.length; i++) {
              if (sugg[i].descripcio === b.dataset.s) t = sugg[i];
            }
            if (!t) return;
            camps.descripcio.value = t.descripcio;
            if (t.tipus && t.tipus !== tipus) {
              tipus = t.tipus;
              cos.querySelectorAll('[data-tipus]').forEach(function (x) {
                x.setAttribute('aria-pressed', x.dataset.tipus === tipus ? 'true' : 'false');
              });
              pintaCategories();
            }
            if (t.categoria) camps.categoria.value = t.categoria;
            if (t.metode) camps.metode.value = t.metode;
            caixaSugg.innerHTML = '';
            camps['import'].focus();
          });
        });
      }
      if (!editant) pintaSugg(sugg);

      camps.descripcio.addEventListener('input', function () {
        var q = camps.descripcio.value.trim().toLowerCase();
        if (!q) { pintaSugg(sugg); return; }
        pintaSugg(sugg.filter(function (s) {
          return s.descripcio.toLowerCase().indexOf(q) !== -1;
        }));
      });

      cos.querySelector('[data-desa]').addEventListener('click', function () {
        var imp = num(camps['import'].value);
        if (imp <= 0) { App.brindis('Posa-hi un import', 'error'); camps['import'].focus(); return; }
        if (!camps.descripcio.value.trim()) {
          App.brindis('Digues què era', 'error'); camps.descripcio.focus(); return;
        }

        var p = {
          'import': imp,
          tipus: tipus,
          descripcio: camps.descripcio.value.trim(),
          categoria: camps.categoria.value,
          metode: camps.metode.value,
          data: camps.data.value || fmt.avui()
        };

        var b = this;
        b.disabled = true;
        escriu('finances', editant ? 'edita' : 'afegeix', editant ? Object.assign({ id: m.id }, p) : p, quePinto())
          .then(function (nova) {
            App.tancaModal();
            App.brindis(editant ? 'Moviment desat' : 'Apuntat');
            if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
            Cau.oblida('finances.');
            aplica(nova);
          })
          .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });

      var bt = cos.querySelector('[data-treu]');
      if (bt) bt.addEventListener('click', function () {
        bt.disabled = true;
        escriu('finances', 'treu', { id: m.id }, quePinto())
          .then(function (r) {
            App.tancaModal(); App.brindis('Moviment tret');
            Cau.oblida('finances.'); aplica(r);
          })
          .catch(function (err) { bt.disabled = false; App.brindis(err.message, 'error'); });
      });
    }

    // --------------------------------------------------------------- càrrega

    /* PRIMER EL QUE JA SABEM, DESPRÉS EL QUE ARRIBA.
       Cada petició a Apps Script costa entre un segon i mig i dos i mig, i
       això no ho pot arreglar cap codi nostre: és la plataforma. El que sí que
       podem arreglar és esperar-la amb la pantalla en blanc. Es pinta l'últim
       que vam veure a l'instant i es corregeix quan torna el servidor.

       La safata no es guarda mai: allà les dades canvien a cada decisió que
       prens, i ensenyar-ne una còpia vella seria fer-te decidir dues vegades. */
    function claded() { return 'finances.' + periode + '.' + (mes || 'ara'); }

    function repinta(d) {
      if (periode === 'revisar') pintaRevisar(d);
      else if (periode === 'recurrents') pintaRecurrents(d);
      else if (periode === 'patrimoni') pintaPatrimoni(d);
      else if (periode === 'mesos') pintaMesos(d);
      else if (periode === 'estad') pintaEstad(d);
      else pintaMes(d);
    }

    var previPintat = null;   // JSON del que hi ha pintat ara mateix
    var ajornat = null;       // pantalla que espera que pari de tocar coses

    /** Els paràmetres que necessita `pantalla` per tornar el que mirem ara. */
    function quePinto() { return { periode: periode, mes: mes, quants: 12 }; }

    /**
     * Rebre una pantalla i pintar-la si toca.
     *
     * La torna tant `pantalla` com qualsevol escriptura —vegeu `escriu()`—,
     * perquè desar i tornar a demanar el mes eren dos viatges al servidor i a
     * Apps Script el viatge és tot el cost. Buidar la safata de revisió, que
     * són vint decisions seguides, era vint esperes dobles.
     *
     * Si no ha canviat res no es refà la pantalla: repintar-la només serviria
     * per tancar-te el que tinguis obert. I si ha canviat però estàs tocant
     * alguna cosa, s'espera que acabis.
     */
    function aplica(r, dEnCau) {
      cats = r.categories || cats;
      if (r.suggeriments && r.suggeriments.length) sugg = r.suggeriments;
      if (!mes && r.dades && r.dades.mes) mes = r.dades.mes;
      if (periode !== 'revisar' && periode !== 'recurrents' && periode !== 'patrimoni') {
        Cau.set(claded(), r);
      }

      var nou = JSON.stringify(r.dades);
      if (nou === previPintat) return;

      /* Només té sentit ajornar si ja hi ha alguna cosa pintada: si la
         pantalla és buida, repintar no pot destruir res i no fer-ho et deixa
         mirant l'esquelet de càrrega per sempre. */
      if (previPintat !== null && App.interactuant()) {
        var primer = !ajornat;
        ajornat = r;
        if (primer) setTimeout(quanPari, 400);
        return;
      }
      previPintat = nou;
      repinta(r.dades);
    }

    /* Es mira cada tant si ja ha acabat, en comptes d'esperar que salti el
       focus: un tauler obert sense cap camp enfocat no dispara `focusout` en
       tancar-se, i llavors el que hi ha ajornat no es pinta mai. */
    function quanPari() {
      if (!arrel.isConnected) { ajornat = null; return; }
      if (App.interactuant()) { setTimeout(quanPari, 400); return; }
      var r = ajornat;
      ajornat = null;
      if (r) aplica(r);
    }

    function carrega() {
      var volatil = periode === 'revisar' || periode === 'recurrents' || periode === 'patrimoni';
      var desat = volatil ? null : Cau.get(claded(), null);
      if (desat && desat.dades) {
        cats = desat.categories || cats;
        sugg = desat.suggeriments || sugg;
        try { previPintat = JSON.stringify(desat.dades); repinta(desat.dades); }
        catch (e) { previPintat = null; }
      }

      crida('finances', 'pantalla', quePinto())
        .then(function (r) { aplica(r); })
        .catch(function (err) {
          // Amb alguna cosa pintada, un error no ha de deixar-te sense res.
          if (desat) App.brindis(err.message, 'error');
          else arrel.innerHTML = Comp.error(err, true);
        });
    }

    /* OBRIR AQUESTA PANTALLA NO VA A MIRAR EL BANC, I ÉS A POSTA.
       El banc només deixa que s'hi miri unes quantes vegades al dia sense que
       en Pol hi sigui al davant, i entrar a finances vuit vegades un matí se
       les menjaria totes. S'hi mira tres cops al dia —sis, tres i vuit— i el
       que es veu aquí porta escrit de quan és, que ve amb la pantalla i no
       costa cap viatge de més. */

    if (!mes) mes = new Date().toISOString().slice(0, 7);
    arrel.innerHTML = Comp.carregant(4);
    carrega();
  }
});
</script>

<script>
/* JEFE — MÒDUL · Tasques i captura ràpida
   Món: full de mapa topogràfic.

   LA DECISIÓ QUE MANA: el camp de capturar és el primer que hi ha i està
   sempre obert. No demana context ni data ni prioritat, perquè cada camp
   obligatori al moment de capturar és una excusa per no capturar, i el que no
   s'apunta es perd. Tot cau a la safata i ja ho classificaràs.

   La safata va a dalt i les pendents a sota: primer el que has de decidir,
   després el que has de fer.

   I EL QUE APUNTES SURT A L'INSTANT, sense esperar el servidor. Vegeu
   `afegeixEsperant` més avall: capturar sis coses seguides no ha de ser sis
   pauses de segon i mig mirant la pantalla. */

App.registraVista('tasques', {
  render: function (arrel, params) {

    var dades = null;
    var previPintat = null;    // JSON del que hi ha pintat ara mateix
    var ajornat = null;        // pantalla que espera que pari d'escriure
    var esperant = 0;          // captures enviades i encara sense resposta

    // ------------------------------------------------------------- capçalera

    function capcalera() {
      return '<header class="capcalera capcalera-nutri">' +
        '<div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa', 'ic-p') + '</button>' +
          '<span class="titol-periode" style="cursor:default">' +
            '<b>Tasques</b>' +
            '<span>' + (dades ? dades.tasques.length + ' pendents' : '') +
              (dades && dades.vencudes ? ' · ' + dades.vencudes + ' vençudes' : '') + '</span>' +
          '</span>' +
        '</div>' +
      '</header>';
    }

    // ---------------------------------------------------------------- pintura

    function pinta(d, dEnCau) {
      dades = d;

      arrel.innerHTML = capcalera() +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' +
            /* Sempre obert i sempre a dalt. Si has de prémer un botó per
               obrir-lo, ja has perdut la meitat del que volies apuntar. */
            '<label class="camp-captura">' +
              '<span class="marge">Apunta-ho i segueix</span>' +
              '<div class="captura-fila">' +
                '<input id="t-captura" placeholder="Què t\'acaba de passar pel cap?" autocomplete="off">' +
                '<button class="btn btn-primari" data-captura>' + ic('mes') + '</button>' +
              '</div>' +
            '</label>' +
          '</section>' +

          '<section class="nutri-apats">' +
            blocSafata(d) +
            blocPendents(d) +
          '</section>' +

          '<section class="nutri-tanca">' + blocFetes(d) + '</section>' +
          (dEnCau ? '<p class="menut">Última còpia desada al telèfon.</p>' : '') +
        '</div>';

      lliga();
    }

    /* La safata és el que has capturat i encara no has decidit què era.
       Cada línia porta els tres contextos a un toc: classificar-la la treu
       d'aquí sola, sense haver de dir a més que és «per fer».

       El contenidor s'escriu SEMPRE, encara que estigui buit i amagat: és on
       aterren les captures que encara no han tornat del servidor, i si no hi
       fos les hauria de fer aparèixer repintant mitja pàgina. */
    function blocSafata(d) {
      return '<div id="t-safata-bloc"' + (d.safata.length ? '' : ' hidden') + '>' +
        '<p class="marge">A la safata</p>' +
        '<p class="menut">Toca on va cadascuna. Amb això surt de la safata.</p>' +
        '<div class="safata-t" id="t-safata">' +
          d.safata.map(function (t) {
            return '<div class="safata-fila" data-fila="' + esc(t.id) + '">' +
              '<div class="safata-text">' + esc(t.text) + '</div>' +
              '<div class="safata-tria">' +
                d.contextos.map(function (c) {
                  return '<button data-ctx="' + esc(c.clau) + '" data-id="' + esc(t.id) + '">' +
                         esc(c.nom) + '</button>';
                }).join('') +
                '<button class="safata-fora" data-treu="' + esc(t.id) + '" aria-label="Treu-ho">' +
                  ic('tancar', 'ic-p') + '</button>' +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>';
    }

    function blocPendents(d) {
      if (!d.tasques.length) {
        return '<p class="marge" style="margin-top:var(--e5)">Per fer</p>' +
               '<p class="menut">Res pendent. Bon senyal.</p>';
      }

      return '<p class="marge" style="margin-top:var(--e5)">Per fer</p>' +
        '<div class="tasques">' +
          d.tasques.map(function (t) {
            return '<div class="tasca" data-t="' + esc(t.id) + '"' +
              (t.vencuda ? ' data-vencuda="1"' : '') + '>' +
              '<button class="tasca-marca" data-fet="' + esc(t.id) + '"' +
                ' aria-label="Fet: ' + esc(t.text) + '"></button>' +
              '<button class="tasca-cos" data-obre="' + esc(t.id) + '">' +
                '<span class="tasca-text">' + esc(t.text) + '</span>' +
                '<span class="menut">' +
                  (t.contextNom ? esc(t.contextNom) : 'sense context') +
                  (t.vencEl ? ' · ' + (t.vencuda ? 'vencia ' : '') + esc(fmt.relativa(t.vencEl)) : '') +
                  (t.prioritat === 'alta' ? ' · prioritària' : '') +
                '</span>' +
              '</button>' +
            '</div>';
          }).join('') +
        '</div>';
    }

    function blocFetes(d) {
      if (!d.fetes.length) return '';
      return '<div class="fetes-titol">' +
          '<p class="marge">Fetes</p>' +
          '<button class="btn btn-fantasma btn-menut" data-neteja>Buida-les</button>' +
        '</div>' +
        '<div class="tasques">' +
          d.fetes.map(function (t) {
            return '<div class="tasca" data-feta="1">' +
              '<button class="tasca-marca" data-desfes="' + esc(t.id) + '"' +
                ' data-fet="1" aria-label="Desfés"></button>' +
              '<span class="tasca-cos">' +
                '<span class="tasca-text">' + esc(t.text) + '</span>' +
                '<span class="menut">' + esc(fmt.relativa(t.fetEl)) + '</span>' +
              '</span>' +
            '</div>';
          }).join('') +
        '</div>';
    }

    // ---------------------------------------------------------------- accions

    function lliga() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      var camp = arrel.querySelector('#t-captura');

      /**
       * APUNTAR NO POT FER ESPERAR.
       *
       * La línia surt a la safata abans de sortir del telèfon i el camp queda
       * lliure de seguida: pots dir-ne quatre de seguides sense que la
       * pantalla et pari entre l'una i l'altra. Quan el servidor contesta,
       * torna la llista de debò i la provisional desapareix sola.
       *
       * Si falla, es desfà i el text et torna al camp. No es perd.
       */
      function captura() {
        var t = camp.value.trim();
        if (!t) return;
        camp.value = '';
        if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }

        var provisional = afegeixEsperant(t);
        esperant++;

        escriu('tasques', 'captura', { text: t })
          .then(function (r) { esperant--; aplica(r); })
          .catch(function (err) {
            esperant--;
            if (provisional.parentNode) provisional.parentNode.removeChild(provisional);
            camp.value = t;
            App.brindis(err.message, 'error');
          });
      }
      arrel.querySelector('[data-captura]').addEventListener('click', captura);
      camp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); captura(); }
      });

      arrel.querySelectorAll('[data-ctx]').forEach(function (b) {
        b.addEventListener('click', function () {
          var fila = b.closest('.safata-fila');
          fila.dataset.fet = '1';
          escriu('tasques', 'edita', { id: b.dataset.id, context: b.dataset.ctx })
            .then(aplica)
            .catch(function (err) { fila.dataset.fet = '0'; App.brindis(err.message, 'error'); });
        });
      });

      arrel.querySelectorAll('[data-treu]').forEach(function (b) {
        b.addEventListener('click', function () {
          b.disabled = true;
          escriu('tasques', 'treu', { id: b.dataset.treu })
            .then(aplica)
            .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
        });
      });

      arrel.querySelectorAll('[data-fet]:not([data-fet="1"])').forEach(function (b) {
        b.addEventListener('click', function () {
          var t = b.closest('.tasca');
          t.dataset.fent = '1';
          escriu('tasques', 'completa', { id: b.dataset.fet })
            .then(aplica)
            .catch(function (err) { t.dataset.fent = '0'; App.brindis(err.message, 'error'); });
        });
      });

      arrel.querySelectorAll('[data-desfes]').forEach(function (b) {
        b.addEventListener('click', function () {
          escriu('tasques', 'completa', { id: b.dataset.desfes, desfes: true })
            .then(aplica)
            .catch(function (err) { App.brindis(err.message, 'error'); });
        });
      });

      var bn = arrel.querySelector('[data-neteja]');
      if (bn) bn.addEventListener('click', neteja);

      arrel.querySelectorAll('[data-obre]').forEach(function (b) {
        b.addEventListener('click', function () {
          var t = null;
          for (var i = 0; i < dades.tasques.length; i++) {
            if (dades.tasques[i].id === b.dataset.obre) t = dades.tasques[i];
          }
          if (t) obreTasca(t);
        });
      });
    }

    /** Una línia provisional a la safata, mentre el servidor no contesta. */
    function afegeixEsperant(text) {
      var bloc = arrel.querySelector('#t-safata-bloc');
      bloc.hidden = false;
      var el = document.createElement('div');
      el.className = 'safata-fila';
      el.dataset.esperant = '1';
      el.innerHTML = '<div class="safata-text">' + esc(text) + '</div>';
      arrel.querySelector('#t-safata').appendChild(el);
      return el;
    }

    /* Buidar les fetes es pregunta: són moltes de cop i no es veu venir. Al
       full hi continuen totes; el que es buida és la pantalla. */
    function neteja() {
      if (!dades || !dades.fetes.length) return;
      var n = dades.fetes.length;

      var cos = App.modal('Buidar les fetes',
        '<div class="form-ajustos">' +
          '<p>Desapareixeran de la llista ' + n + (n === 1 ? ' tasca feta' : ' tasques fetes') + '.</p>' +
          '<p class="menut">Al full de càlcul hi continuen totes. El que es buida és la pantalla.</p>' +
          '<button class="btn btn-primari" data-si>Buida-les</button>' +
          '<button class="btn btn-secundari" data-no style="margin-top:var(--e2)">Deixa-ho estar</button>' +
        '</div>');

      cos.querySelector('[data-no]').addEventListener('click', App.tancaModal);
      cos.querySelector('[data-si]').addEventListener('click', function () {
        var b = this;
        b.disabled = true;
        escriu('tasques', 'neteja', {})
          .then(function (r) {
            App.tancaModal();
            App.brindis(n === 1 ? 'Buidada' : 'Buidades');
            aplica(r);
          })
          .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });
    }

    function obreTasca(t) {
      var cos = App.modal('Tasca',
        '<div class="form-ajustos">' +
          '<label><span class="marge">Què s\'ha de fer</span>' +
            '<input data-c="text" value="' + esc(t.text) + '" autocomplete="off"></label>' +
          '<label><span class="marge">Context</span>' +
            '<select data-c="context">' +
              '<option value="">Sense context</option>' +
              dades.contextos.map(function (c) {
                return '<option value="' + esc(c.clau) + '"' +
                       (t.context === c.clau ? ' selected' : '') + '>' + esc(c.nom) + '</option>';
              }).join('') +
            '</select></label>' +
          '<label><span class="marge">Per quan</span>' +
            '<input data-c="venc_el" type="date" value="' + esc(t.vencEl || '') + '" autocomplete="off"></label>' +
          '<label class="cat-exclou"><input type="checkbox" data-c="prioritat"' +
            (t.prioritat === 'alta' ? ' checked' : '') + '><span>Prioritària</span></label>' +
          '<label><span class="marge">Nota</span>' +
            '<textarea data-c="nota" rows="3">' + esc(t.nota || '') + '</textarea></label>' +
          '<button class="btn btn-primari" data-desa>Desa</button>' +
          '<button class="btn btn-secundari" data-treu-t style="margin-top:var(--e2)">Treu-la</button>' +
        '</div>');

      var camps = {};
      cos.querySelectorAll('[data-c]').forEach(function (i) { camps[i.dataset.c] = i; });

      cos.querySelector('[data-desa]').addEventListener('click', function () {
        var b = this;
        b.disabled = true;
        escriu('tasques', 'edita', {
          id: t.id,
          text: camps.text.value,
          context: camps.context.value,
          venc_el: camps.venc_el.value,
          prioritat: camps.prioritat.checked ? 'alta' : '',
          nota: camps.nota.value
        }).then(function (r) {
          App.tancaModal(); App.brindis('Desat');
          aplica(r);
        }).catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });

      cos.querySelector('[data-treu-t]').addEventListener('click', function () {
        var b = this;
        b.disabled = true;
        escriu('tasques', 'treu', { id: t.id })
          .then(function (r) {
            App.tancaModal(); App.brindis('Treta');
            aplica(r);
          })
          .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });
    }

    // ---------------------------------------------------------------- càrrega

    /**
     * Rebre una pantalla del servidor i pintar-la si toca.
     *
     * Ara la torna CADA escriptura, no només `pantalla`: desar i tornar a
     * demanar la llista eren dos viatges, i a Apps Script el viatge és tot el
     * cost. Amb un, apuntar una tasca passa de tres segons a un i mig.
     *
     * No es repinta mentre té un camp obert: repintar li tancaria el desplegable
     * o li esborraria el que estava escrivint. S'espera i es pinta quan pari.
     */
    function aplica(r, dEnCau) {
      Cau.set('tasques.llista', r);
      var nou = JSON.stringify(r);
      if (nou === previPintat && !esperant) return;

      if (previPintat !== null && App.interactuant()) {
        var primer = !ajornat;
        ajornat = r;
        if (primer) setTimeout(quanPari, 400);
        return;
      }
      previPintat = nou;
      pinta(r, !!dEnCau);
    }

    /* Es mira cada tant si ja ha acabat, en comptes d'esperar que salti el
       focus: mentre escrius al camp de captura les línies provisionals es
       queden a la vista, que és el que vols, i quan pares es posa al dia.
       Amb `focusout` n'hi ha prou de tancar un tauler sense cap camp enfocat
       perquè no salti mai i el que hi ha ajornat no es pinti. */
    function quanPari() {
      if (!arrel.isConnected) { ajornat = null; return; }
      if (App.interactuant()) { setTimeout(quanPari, 400); return; }
      var r = ajornat;
      ajornat = null;
      if (r) aplica(r);
    }

    function carrega() {
      var desat = Cau.get('tasques.llista', null);
      if (desat) {
        try { previPintat = JSON.stringify(desat); pinta(desat, true); }
        catch (e) { previPintat = null; }
      }

      crida('tasques', 'pantalla', {})
        .then(function (r) { aplica(r); })
        .catch(function (err) {
          if (desat) App.brindis(err.message, 'error');
          else arrel.innerHTML = Comp.error(err, true);
        });
    }

    arrel.innerHTML = Comp.carregant(3);
    carrega();
  }
});
</script>

<script>
/* JEFE — MÒDUL · Diari i revisió
   Món: full de mapa topogràfic. Aquí, el quadern de camp del marge.

   LA DECISIÓ QUE MANA: el que escrius tu i el que t'escriu ell van a la
   MATEIXA línia de temps. D'aquí a dos anys, quan vulguis saber com va anar
   aquell octubre, voldràs llegir-ho tot seguit i no anar saltant de pantalla.

   I el camp d'escriure és el primer que hi ha i està sempre obert, com a
   tasques i pel mateix motiu: cada toc que separa el pensament del paper és
   una excusa per no escriure. */

App.registraVista('diari', {
  render: function (arrel, params) {

    var data = params.data || fmt.avui();
    var dades = null;
    var previPintat = null;
    var ajornat = null;
    var brut = false;          // hi ha canvis al camp sense desar

    var ANIMS = [
      { n: 1, mot: 'malament' },
      { n: 2, mot: 'fluix' },
      { n: 3, mot: 'normal' },
      { n: 4, mot: 'bé' },
      { n: 5, mot: 'molt bé' }
    ];

    // ------------------------------------------------------------- capçalera

    function capcalera() {
      var r = dades ? dades.ratxa : 0;
      return '<header class="capcalera capcalera-nutri">' +
        '<div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa', 'ic-p') + '</button>' +
          '<span class="titol-periode" style="cursor:default">' +
            '<b>Diari</b>' +
            '<span>' + (r ? r + (r === 1 ? ' dia seguit' : ' dies seguits') : 'sense ratxa') + '</span>' +
          '</span>' +
          /* No hi va el triangle d'avís: demanar-li que escrigui no és cap
             alarma, i una icona que crida perill per a una cosa que no ho és
             et fa deixar de fer cas a les que sí que ho són. */
          '<button class="btn btn-fantasma btn-icona" data-genera="1" aria-label="Demana-li que escrigui">' +
            ic('llegenda', 'ic-p') + '</button>' +
        '</div>' +
      '</header>';
    }

    // ---------------------------------------------------------------- pintura

    function pinta(d, dEnCau) {
      dades = d;
      var e = d.entrada;
      var esAvui = d.data === d.avui;

      arrel.innerHTML = capcalera() +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' +
            '<div class="camp-captura">' +
              '<div class="dia-cap">' +
                '<button class="btn btn-fantasma btn-icona" data-salt="-1" aria-label="Dia anterior">' +
                  ic('esquerra', 'ic-p') + '</button>' +
                '<span class="marge">' + esc(fmt.relativa(d.data)) + '</span>' +
                '<button class="btn btn-fantasma btn-icona" data-salt="1" aria-label="Dia següent"' +
                  (esAvui ? ' disabled' : '') + '>' + ic('dreta', 'ic-p') + '</button>' +
              '</div>' +
              '<textarea id="d-text" rows="5" autocomplete="off" ' +
                'placeholder="' + esc(esAvui ? 'Com ha anat el dia?' : 'Què va passar aquell dia?') + '">' +
                esc(e ? e.text : '') + '</textarea>' +
              blocAnim(e) +
              '<div class="dia-desa">' +
                '<span class="menut" id="d-estat">' + (e ? 'Desat' : '') + '</span>' +
                '<button class="btn btn-primari" data-desa>Desa</button>' +
              '</div>' +
            '</div>' +
          '</section>' +

          '<section class="nutri-apats">' + blocLinia(d) + '</section>' +
          (dEnCau ? '<p class="menut">Última còpia desada al telèfon.</p>' : '') +
        '</div>';

      lliga();
    }

    /* Cinc caselles i prou. L'ànim és per rellegir-ho d'aquí a un any, no per
       omplir cap gràfic, i mai no bloqueja res: pots escriure sense marcar-ne
       cap i marcar-ne una sense escriure. */
    function blocAnim(e) {
      var sel = e && e.anim ? Number(e.anim) : 0;
      var mot = ANIMS.filter(function (a) { return a.n === sel; })[0];
      return '<div class="anim">' +
        '<span class="marge">Com ha anat' + (mot ? ' · ' + esc(mot.mot) : '') + '</span>' +
        '<div class="anim-tria" role="group" aria-label="Com ha anat el dia">' +
          ANIMS.map(function (a) {
            return '<button data-anim="' + a.n + '"' +
                   (a.n === sel ? ' aria-pressed="true"' : ' aria-pressed="false"') +
                   ' aria-label="' + esc(a.mot) + '">' + a.n + '</button>';
          }).join('') +
        '</div>' +
      '</div>';
    }

    function blocLinia(d) {
      /* L'entrada del dia que estàs editant NO es repeteix aquí sota: la
         tens oberta al camp de dalt. Sortia dues vegades a la mateixa
         pantalla, i la de sota semblava una altra cosa que havies escrit. El
         que SÍ que hi surt d'aquell dia és el que t'hi va escriure ell. */
      var linia = d.linia.filter(function (x) {
        return !(x.data === d.data && x.tipus === 'entrada');
      });

      if (!linia.length) {
        return '<p class="menut" style="margin-top:var(--e5)">' +
               'Encara no hi ha res més escrit. Amb una línia al dia ja té sentit tornar-hi.</p>';
      }

      var htmlPerData = {};
      var ordre = [];
      linia.forEach(function (x) {
        if (!htmlPerData[x.data]) { htmlPerData[x.data] = []; ordre.push(x.data); }
        htmlPerData[x.data].push(x);
      });

      return '<p class="marge" style="margin-top:var(--e5)">Enrere</p>' +
        ordre.map(function (dia) {
          return '<div class="dia-bloc">' +
            '<button class="dia-titol" data-ves="' + esc(dia) + '">' +
              esc(fmt.relativa(dia)) + '</button>' +
            htmlPerData[dia].map(apunt).join('') +
          '</div>';
        }).join('');
    }

    function apunt(x) {
      /* «Resum del dia» i no «tancament»: tancar el dia és el que fas tu a
         nutrició quan hi poses les calories cremades. Si les dues coses es
         diuen igual, no saps quina de les dues t'està parlant. */
      var qui = x.tipus === 'entrada' ? '' : (x.tipus === 'revisio' ? 'Revisió de la setmana' : 'Resum del dia');
      var mot = ANIMS.filter(function (a) { return a.n === Number(x.anim); })[0];

      return '<article class="apunt" data-tipus="' + esc(x.tipus) + '">' +
        (qui ? '<p class="apunt-qui">' + esc(qui) + '</p>' : '') +
        (mot ? '<p class="apunt-anim">' + esc(mot.mot) + '</p>' : '') +
        '<div class="apunt-text">' + esc(x.text).replace(/\n/g, '<br>') + '</div>' +
      '</article>';
    }

    // ---------------------------------------------------------------- accions

    function lliga() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-salt]').forEach(function (b) {
        b.addEventListener('click', function () {
          var nova = fmt.suma(data, Number(b.dataset.salt));
          if (nova > fmt.avui()) return;
          desaSiCal(function () { App.ves('diari', { data: nova }); });
        });
      });
      arrel.querySelectorAll('[data-ves]').forEach(function (b) {
        b.addEventListener('click', function () {
          desaSiCal(function () { App.ves('diari', { data: b.dataset.ves }); });
        });
      });

      var camp = arrel.querySelector('#d-text');
      camp.addEventListener('input', function () {
        brut = true;
        var e = arrel.querySelector('#d-estat');
        if (e) e.textContent = 'Sense desar';
      });
      /* Desar en sortir del camp, a més del botó. El que has escrit no es pot
         perdre perquè hagis tocat una altra cosa sense pensar-hi. */
      camp.addEventListener('blur', function () { if (brut) desa(); });

      arrel.querySelector('[data-desa]').addEventListener('click', function () { desa(); });

      arrel.querySelectorAll('[data-anim]').forEach(function (b) {
        b.addEventListener('click', function () {
          var ja = b.getAttribute('aria-pressed') === 'true';
          arrel.querySelectorAll('[data-anim]').forEach(function (o) {
            o.setAttribute('aria-pressed', 'false');
          });
          // Tornar a tocar la mateixa la treu: no hi ha manera de desmarcar-la si no.
          if (!ja) b.setAttribute('aria-pressed', 'true');
          brut = true;
          desa();
        });
      });

      var bg = arrel.querySelector('[data-genera]');
      if (bg) bg.addEventListener('click', obreGenera);
    }

    function animTriat() {
      var b = arrel.querySelector('[data-anim][aria-pressed="true"]');
      return b ? Number(b.dataset.anim) : 0;
    }

    function desa(alAcabar) {
      var camp = arrel.querySelector('#d-text');
      if (!camp) { if (alAcabar) alAcabar(); return; }

      var text = camp.value;
      var anim = animTriat();
      var estat = arrel.querySelector('#d-estat');
      if (estat) estat.textContent = 'Desant…';
      brut = false;

      escriu('diari', 'escriu', { data: data, text: text, anim: anim },
             { data: data, quants: 30 })
        .then(function (r) {
          var e2 = arrel.querySelector('#d-estat');
          if (e2) e2.textContent = 'Desat';
          aplica(r);
          if (alAcabar) alAcabar();
        })
        .catch(function (err) {
          brut = true;
          var e2 = arrel.querySelector('#d-estat');
          if (e2) e2.textContent = 'No s\'ha pogut desar';
          App.brindis(err.message, 'error');
          if (alAcabar) alAcabar();
        });
    }

    /** Abans de marxar del dia, desa el que hi hagi sense desar. */
    function desaSiCal(seguent) {
      if (!brut) return seguent();
      desa(seguent);
    }

    /* Poder demanar-li el resum ara. Serveix per no haver d'esperar a les deu
       del vespre, i sobretot per veure què t'escriurà abans de fiar-t'hi. */
    function obreGenera() {
      var cos = App.modal('Demana-li que escrigui',
        '<div class="form-ajustos">' +
          '<p class="menut">Ho escriu amb les dades que hi ha ara mateix i ho deixa al diari. ' +
            'Es pot repetir: reescriu el del mateix dia, no n\'acumula.' +
            (dades && dades.iaActiva ? ''
              : ' <b>La capa d\'IA està apagada</b>, o sigui que sortiran les xifres sense cap comentari.') +
          '</p>' +
          '<button class="btn btn-primari" data-fes="dia">Tancament d\'avui</button>' +
          '<button class="btn btn-secundari" data-fes="setmana" style="margin-top:var(--e2)">' +
            'Revisió de la setmana</button>' +
        '</div>');

      cos.querySelectorAll('[data-fes]').forEach(function (b) {
        b.addEventListener('click', function () {
          cos.querySelectorAll('[data-fes]').forEach(function (o) { o.disabled = true; });
          b.dataset.carregant = '1';
          escriu('diari', 'generaAra',
                 { data: fmt.avui(), setmanal: b.dataset.fes === 'setmana' },
                 { data: data, quants: 30 })
            .then(function (r) {
              App.tancaModal();
              App.brindis('Escrit');
              aplica(r);
            })
            .catch(function (err) {
              cos.querySelectorAll('[data-fes]').forEach(function (o) { o.disabled = false; });
              b.dataset.carregant = '0';
              App.brindis(err.message, 'error');
            });
        });
      });
    }

    // ---------------------------------------------------------------- càrrega

    function aplica(r, dEnCau) {
      Cau.set('diari.' + data, r);
      var nou = JSON.stringify(r);
      if (nou === previPintat) return;

      /* Mentre escriu no es repinta res: li esborraria el que està teclejant.
         I si hi ha canvis sense desar, encara menys. */
      if (previPintat !== null && (brut || App.interactuant())) {
        var primer = !ajornat;
        ajornat = r;
        if (primer) setTimeout(quanPari, 400);
        return;
      }
      previPintat = nou;
      pinta(r, !!dEnCau);
    }

    function quanPari() {
      if (!arrel.isConnected) { ajornat = null; return; }
      if (brut || App.interactuant()) { setTimeout(quanPari, 400); return; }
      var r = ajornat;
      ajornat = null;
      if (r) aplica(r);
    }

    function carrega() {
      var desat = Cau.get('diari.' + data, null);
      if (desat) {
        try { previPintat = JSON.stringify(desat); pinta(desat, true); }
        catch (e) { previPintat = null; }
      }

      crida('diari', 'pantalla', { data: data, quants: 30 })
        .then(function (r) { aplica(r); })
        .catch(function (err) {
          if (desat) App.brindis(err.message, 'error');
          else arrel.innerHTML = Comp.error(err, true);
        });
    }

    arrel.innerHTML = Comp.carregant(3);
    carrega();
  }
});
</script>

<script>
/* JEFE — MÒDUL · Calendari
   Món: full de mapa topogràfic. Aquí, la quadrícula UTM del full.

   LA DECISIÓ QUE MANA: la graella del mes ensenya ON hi ha coses, no QUÈ hi
   ha. Set columnes en una pantalla de mòbil donen cinquanta píxels per dia:
   no hi cap cap títol sense mentir. El que hi cap és un punt per cita, i
   això ja respon la pregunta que fas mirant un mes —«quins dies tinc plens»—.
   El què és a sota, del dia que toquis, amb tot l'espai i sense retallar res. */

App.registraVista('calendari', {
  render: function (arrel, params) {

    var mes = params.mes || null;          // AAAA-MM
    var dia = params.data || null;
    var dades = null, cals = [];
    var previPintat = null, ajornat = null;
    /* Els mesos que han portat les respostes. Canviar de mes cap a un
       que ja tenim NO va al servidor: és el que fa que passi de set segons a
       instantani. Vegeu `pantalla()` al mòdul. */
    var mesosTinguts = {};                 // els mesos que ja tenim llegits
    var enCami = null;                     // el mes que estem demanant ara
    /* Va AQUÍ i no dins d'obreCalendaris: qui la marca és `lligaCals`, que és
       una funció germana i no filla. Declarada allà dins, l'assignació de fora
       creava una variable global i la de dins es quedava a fals per sempre: el
       tauler es tancava i la pantalla no s'assabentava de res. */
    var caCanviar = false;

    var DIES = ['dl', 'dt', 'dc', 'dj', 'dv', 'ds', 'dg'];
    var MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol',
                 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];

    function nomMes(m) {
      var t = MESOS[Number(m.slice(5, 7)) - 1];
      return t.charAt(0).toUpperCase() + t.slice(1) + ' del ' + m.slice(0, 4);
    }
    function mouMes(m, n) {
      var y = Number(m.slice(0, 4)), i = Number(m.slice(5, 7)) - 1 + n;
      var d = new Date(y, i, 1);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    }

    // ------------------------------------------------------------- capçalera

    function capcalera(d) {
      var esActual = d.mes === d.avui.slice(0, 7);
      return '<header class="capcalera capcalera-nutri">' +
        '<div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa', 'ic-p') + '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-salt="-1" aria-label="Mes anterior">' +
            ic('esquerra', 'ic-p') + '</button>' +
          '<button class="titol-periode" data-avui="1">' +
            '<b>' + esc(nomMes(d.mes)) + '</b>' +
            '<span>' + (d.provisional
              ? 'carregant…'
              : d.quants + (d.quants === 1 ? ' cita' : ' cites') +
                (esActual ? ' · en curs' : '')) + '</span>' +
          '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-salt="1" aria-label="Mes següent">' +
            ic('dreta', 'ic-p') + '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-nou="1" aria-label="Apunta al calendari">' +
            ic('mes', 'ic-p') + '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-ajustos="1" aria-label="Quins calendaris">' +
            ic('ajust', 'ic-p') + '</button>' +
        '</div>' +
      '</header>';
    }

    // ---------------------------------------------------------------- pintura

    function pinta(d, dEnCau) {
      dades = d;
      arrel.innerHTML = capcalera(d) +
        /* Disposició pròpia i no la de nutrició: allà la columna estreta és
           la de l'esquerra i la gran la de la dreta, i aquí és al revés. Amb
           les seves classes, a l'escriptori la graella del mes quedava
           encaixada en 340 px al racó d'una pantalla de 1.900. */
        '<div class="pagina cal-pagina">' +
          '<section class="cal-graella">' + blocMes(d) + '</section>' +
          '<section class="cal-costat" id="c-dia">' + blocDia(d) + '</section>' +
          (dEnCau ? '<p class="menut">Última còpia desada al telèfon.</p>' : '') +
        '</div>';
      lliga();
    }

    /* La graella. Cada casella és un botó de 44 px d'alt: el dia que toques
       és el que s'obre a sota, i tocar-ne un no és mai una acció que canviï
       res, o sigui que no cal confirmar res ni patir per equivocar-se. */
    function blocMes(d) {
      return '<div class="mes-graella" role="grid" aria-label="' + esc(nomMes(d.mes)) + '">' +
        DIES.map(function (n) {
          return '<span class="mes-cap" aria-hidden="true">' + n + '</span>';
        }).join('') +
        d.caselles.map(function (c) {
          return '<button class="mes-dia" data-dia="' + esc(c.data) + '"' +
            (c.delMes ? '' : ' data-fora="1"') +
            (c.esAvui ? ' data-avui="1"' : '') +
            (c.data === d.diaTriat ? ' aria-current="date"' : '') +
            ' aria-label="' + esc(diuCasella(c)) + '">' +
            '<span class="n">' + c.dia + '</span>' +
            /* Els punts i els títols hi són tots dos, i el full d'estil tria
               què s'ensenya segons l'amplada. Decidir-ho aquí amb JavaScript
               voldria dir tornar a pintar la graella cada cop que gires el
               telèfon o canvies la finestra de mida. */
            '<span class="punts">' +
              c.mostra.map(function (e) {
                return '<i' + (e.totElDia ? ' data-tot="1"' : '') +
                       (e.color ? ' style="background:' + esc(e.color) + '"' : '') + '></i>';
              }).join('') +
            '</span>' +
            '<span class="cal-titols">' +
              c.mostra.map(function (e) {
                return '<span class="cal-cita"' + (e.totElDia ? ' data-tot="1"' : '') +
                  (e.color ? ' style="--seu:' + esc(e.color) + '"' : '') + '>' +
                  (e.totElDia || !e.hora ? '' : '<b>' + esc(e.hora) + '</b> ') +
                  esc(e.titol || '') + '</span>';
              }).join('') +
              (c.quants > 3 ? '<span class="cal-mes-n">+' + (c.quants - 3) + '</span>' : '') +
            '</span>' +
          '</button>';
        }).join('') +
      '</div>';
    }

    function diuCasella(c) {
      var d = fmt.llarga(c.data);
      if (!c.quants) return d + ', res';
      return d + ', ' + c.quants + (c.quants === 1 ? ' cita' : ' cites');
    }

    function blocDia(d) {
      var l = d.esdeveniments || [];
      return '<div class="dia-cap-cal">' +
          '<p class="marge">' + esc(fmt.relativa(d.diaTriat)) + ' · ' +
            esc(fmt.llarga(d.diaTriat)) + '</p>' +
        '</div>' +
        (d.provisional
          ? '<p class="menut">Buscant les cites d\'aquest mes…</p>'
          : l.length
            ? '<div class="cites">' + l.map(cita).join('') + '</div>'
            : '<p class="menut">Res apuntat aquest dia. ' +
              '<button class="enllac" data-nou="1">Apunta-hi alguna cosa</button></p>');
    }

    function cita(e) {
      return '<button class="cita" data-obre="' + esc(e.id) + '"' +
        (e.passat ? ' data-passat="1"' : '') + '>' +
        '<span class="cita-quan">' +
          (e.totElDia ? '<span class="tot">tot el dia</span>'
                      : '<b>' + esc(e.hora) + '</b>' +
                        (e.horaFi ? '<span>' + esc(e.horaFi) + '</span>' : '')) +
        '</span>' +
        '<span class="cita-cos">' +
          '<span class="cita-titol">' + esc(e.titol) + '</span>' +
          (e.lloc ? '<span class="menut">' + esc(e.lloc) + '</span>' : '') +
          (cals.length > 1 ? '<span class="menut">' + esc(e.calendariNom) + '</span>' : '') +
        '</span>' +
        (e.color ? '<span class="cita-color" style="background:' + esc(e.color) + '"></span>' : '') +
      '</button>';
    }

    // ---------------------------------------------------------------- accions

    function lliga() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-salt]').forEach(function (b) {
        b.addEventListener('click', function () {
          /* Des de `mes`, no des de `dades.mes`: si encara s'està carregant,
             el que es veu és el mes d'abans i clicar dues vegades seguides
             es menjava el segon clic. */
          vesAlMes(mouMes(mes || dades.mes, Number(b.dataset.salt)));
        });
      });
      var ba = arrel.querySelector('[data-avui]');
      if (ba) ba.addEventListener('click', function () {
        vesAlMes(dades.avui.slice(0, 7));
      });

      /* Triar dia NO va al servidor: el mes ja porta tot el que hi ha, i
         demanar-ho un altre cop per ensenyar el que ja tens seria un segon i
         mig d'espera per res. */
      arrel.querySelectorAll('[data-dia]').forEach(function (b) {
        b.addEventListener('click', function () {
          dia = b.dataset.dia;
          dades.diaTriat = dia;
          dades.esdeveniments = deLDia(dia);
          arrel.querySelectorAll('[data-dia]').forEach(function (o) {
            o.removeAttribute('aria-current');
          });
          b.setAttribute('aria-current', 'date');
          arrel.querySelector('#c-dia').innerHTML = blocDia(dades);
          lligaDia();
        });
      });

      lligaDia();

      arrel.querySelectorAll('[data-nou]').forEach(function (b) {
        b.addEventListener('click', function () { obreFitxa(null); });
      });
      var bj = arrel.querySelector('[data-ajustos]');
      if (bj) bj.addEventListener('click', obreCalendaris);
    }

    /**
     * Canviar de mes.
     *
     * Si és un dels que ja tenim, es pinta a l'instant i prou. Només es
     * torna a demanar quan surts del tram, i llavors en tornen cinc més
     * al voltant del nou.
     */
    function pintaDelTram(quin) {
      if (!mesosTinguts[quin]) return false;
      dades = mesosTinguts[quin];
      dades.diaTriat = (quin === dades.avui.slice(0, 7)) ? dades.avui : quin + '-01';
      dades.esdeveniments = deLDia(dades.diaTriat);
      previPintat = JSON.stringify(dades);
      pinta(dades, false);
      return true;
    }

    /* Un mes que encara no tenim: la graella es dibuixa a l'instant, buida, i
       les cites hi cauen quan arriben. Quedar-se mirant el mes d'abans fins
       que contesta el servidor fa pensar que el botó no ha anat, i llavors el
       cliques un altre cop. */
    function mesProvisional(quin) {
      var avui = (dades && dades.avui) || fmt.avui();
      var primer = new Date(Number(quin.slice(0, 4)), Number(quin.slice(5, 7)) - 1, 1);
      var ini = new Date(primer);
      ini.setDate(1 - ((primer.getDay() + 6) % 7));      // el dilluns d'abans

      var caselles = [];
      for (var i = 0; i < 42; i++) {
        var x = new Date(ini);
        x.setDate(ini.getDate() + i);
        var iso = x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) +
                  '-' + ('0' + x.getDate()).slice(-2);
        caselles.push({ data: iso, dia: x.getDate(), delMes: iso.slice(0, 7) === quin,
                        esAvui: iso === avui, quants: 0, mostra: [] });
      }
      // L'última fila sobra si el mes s'ha acabat abans d'arribar-hi.
      while (caselles.length > 28 &&
             !caselles.slice(-7).some(function (c) { return c.delMes; })) {
        caselles = caselles.slice(0, -7);
      }

      return { mes: quin, avui: avui, caselles: caselles, quants: 0, tots: [],
               diaTriat: quin === avui.slice(0, 7) ? avui : quin + '-01',
               esdeveniments: [], provisional: true };
    }

    function vesAlMes(nou) {
      mes = nou;
      dia = null;
      if (pintaDelTram(nou)) return;
      previPintat = null;                 // el provisional no ha de bloquejar el bo
      pinta(mesProvisional(nou), false);
      carrega();
    }

    function lligaDia() {
      arrel.querySelectorAll('[data-obre]').forEach(function (b) {
        b.addEventListener('click', function () {
          var e = null;
          (dades.esdeveniments || []).forEach(function (x) { if (x.id === b.dataset.obre) e = x; });
          if (e) obreFitxa(e);
        });
      });
      arrel.querySelectorAll('#c-dia [data-nou]').forEach(function (b) {
        b.addEventListener('click', function () { obreFitxa(null); });
      });
    }

    /** Els del dia, del que ja tenim del mes. */
    function deLDia(d) {
      var out = [];
      (dades.tots || []).forEach(function (e) {
        if (d >= e.data && d <= e.dataFi) out.push(e);
      });
      return out;
    }

    // ----------------------------------------------------------------- fitxa

    /**
     * A QUIN CALENDARI VA.
     *
     * En crear, es tria. Es recorda l'últim que has fet servir, perquè si
     * apuntes tres coses de l'escola seguides no has de triar-ho tres cops.
     *
     * En editar, NO es pot canviar: moure un esdeveniment d'un calendari a un
     * altre no és editar-lo, és esborrar-lo aquí i crear-lo allà, i això amb
     * els convidats a sobre no és el mateix esdeveniment. S'ensenya on és i
     * prou; per moure'l, des de Google Calendar.
     */
    function blocOnVa(nou, e) {
      if (!nou) {
        var seu = cals.filter(function (c) { return c.id === e.calendari; })[0];
        if (!seu || cals.length < 2) return '';
        return '<p class="menut">És al calendari <b>' + esc(seu.nom) + '</b>. ' +
               'Per canviar-lo de calendari, des de Google Calendar.</p>';
      }

      var on = cals.filter(function (c) { return c.mostra; });
      if (on.length < 2) return '';

      /* La clau NO comença per «calendari.»: quan es refresca la pantalla es
         crida `Cau.oblida('calendari.')`, que s'emportaria també això. */
      var ultim = Cau.get('ultimCalendari', '');
      var triat = on.filter(function (c) { return c.id === ultim; })[0]
               || on.filter(function (c) { return c.principal; })[0] || on[0];

      return '<label><span class="marge">A quin calendari</span>' +
        '<select data-c="calendari">' +
          on.map(function (c) {
            return '<option value="' + esc(c.id) + '"' +
                   (c.id === triat.id ? ' selected' : '') + '>' +
                   esc(c.nom) + (c.meu ? '' : ' · compartit') + '</option>';
          }).join('') +
        '</select></label>';
    }

    function obreFitxa(e) {
      var nou = !e;
      var quan = nou ? (dades.diaTriat || dades.avui) : e.data;

      var cos = App.modal(nou ? 'Apunta al calendari' : 'Aquesta cita',
        '<div class="form-ajustos">' +
          '<label><span class="marge">Què és</span>' +
            '<input data-c="titol" value="' + esc(nou ? '' : e.titol) + '" ' +
            'placeholder="Reunió, visita, sortida…" autocomplete="off"></label>' +
          '<label><span class="marge">Dia</span>' +
            '<input data-c="data" type="date" value="' + esc(quan) + '" autocomplete="off"></label>' +
          '<label class="cat-exclou"><input type="checkbox" data-c="totdia"' +
            ((nou || e.totElDia) && (nou ? false : e.totElDia) ? ' checked' : '') +
            '><span>Tot el dia</span></label>' +
          '<div class="cal-hores">' +
            '<label><span class="marge">Hora</span>' +
              '<input data-c="hora" type="time" value="' + esc(nou ? '09:00' : (e.hora || '09:00')) + '" autocomplete="off"></label>' +
            '<label><span class="marge">Minuts que dura</span>' +
              '<input data-c="durada" type="number" min="5" step="5" value="' +
              esc(nou ? 60 : (e.minuts || 60)) + '" autocomplete="off"></label>' +
          '</div>' +
          '<label><span class="marge">On</span>' +
            '<input data-c="lloc" value="' + esc(nou ? '' : (e.lloc || '')) + '" autocomplete="off"></label>' +
          '<label><span class="marge">Nota</span>' +
            '<textarea data-c="nota" rows="2">' + esc(nou ? '' : (e.nota || '')) + '</textarea></label>' +
          blocOnVa(nou, e) +
          '<button class="btn btn-primari" data-desa>' + (nou ? 'Apunta-ho' : 'Desa') + '</button>' +
          (nou ? '' :
            '<button class="btn btn-secundari" data-treu style="margin-top:var(--e2)">' +
              'Treu-la del calendari</button>') +
        '</div>');

      var camps = {};
      cos.querySelectorAll('[data-c]').forEach(function (i) { camps[i.dataset.c] = i; });

      function refrescaHores() {
        cos.querySelector('.cal-hores').hidden = camps.totdia.checked;
      }
      camps.totdia.addEventListener('change', refrescaHores);
      refrescaHores();

      cos.querySelector('[data-desa]').addEventListener('click', function () {
        var b = this;
        if (!camps.titol.value.trim()) { App.brindis('Digues què és', 'error'); return; }
        b.disabled = true;

        var p = {
          titol: camps.titol.value.trim(),
          data: camps.data.value,
          hora: camps.totdia.checked ? '' : camps.hora.value,
          durada: Number(camps.durada.value) || 60,
          lloc: camps.lloc.value,
          nota: camps.nota.value
        };
        if (!nou) {
          p.id = e.id; p.calendari = e.calendari;
        } else if (camps.calendari) {
          p.calendari = camps.calendari.value;
          // El pròxim ja vindrà triat: normalment n'apuntes uns quants seguits.
          Cau.set('ultimCalendari', p.calendari);
        }

        escriu('calendari', nou ? 'crea' : 'edita', p, quePinto())
          .then(function (r) {
            App.tancaModal();
            App.brindis(nou ? 'Apuntat' : 'Desat');
            Cau.oblida('calendari.'); mesosTinguts = {};
            aplica(r, false, true);
          })
          .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });

      var bt = cos.querySelector('[data-treu]');
      if (bt) bt.addEventListener('click', function () { confirmaTreure(e); });
    }

    /* Treure una cita del calendari és l'única cosa de tot JEFE que esborra
       de debò: Google Calendar no té «arxivat». Per això es pregunta, i es
       diu clar que no es podrà desfer. */
    function confirmaTreure(e) {
      App.tancaModal();
      setTimeout(function () {
        var cos = App.modal('Treure «' + e.titol + '»?',
          '<div class="form-ajustos">' +
            '<p>Del ' + esc(fmt.llarga(e.data)) +
              (e.totElDia ? '' : ', a les ' + esc(e.hora)) + '.</p>' +
            '<p class="menut"><strong>Això s\'esborra del calendari de Google i no es pot ' +
              'desfer.</strong> No és com treure una tasca, que es queda arxivada al full.</p>' +
            '<button class="btn btn-primari" data-si>Sí, treu-la</button>' +
            '<button class="btn btn-secundari" data-no style="margin-top:var(--e2)">Deixa-ho estar</button>' +
          '</div>');
        cos.querySelector('[data-no]').addEventListener('click', App.tancaModal);
        cos.querySelector('[data-si]').addEventListener('click', function () {
          var b = this;
          b.disabled = true;
          escriu('calendari', 'treu', { id: e.id, calendari: e.calendari }, quePinto())
            .then(function (r) {
              App.tancaModal(); App.brindis('Treta');
              Cau.oblida('calendari.'); mesosTinguts = {};
              aplica(r, false, true);
            })
            .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
        });
      }, 220);
    }

    // ------------------------------------------------------ quins calendaris

    function obreCalendaris() {
      caCanviar = false;
      var cos = App.modal('Quins calendaris vols veure',
        '<div class="form-ajustos">' +
          '<div id="cal-llista">' + llistaCals() + '</div>' +
          '<button class="btn btn-secundari" data-meus>Encén tots els meus</button>' +
          '<button class="btn btn-secundari" data-sinc style="margin-top:var(--e2)">' +
            'Torna a buscar els meus calendaris</button>' +
          '<p class="menut">«Els meus» són els que has fet tu. Els que et comparteixen ' +
            '—festius, calendaris d\'equips— venen apagats: n\'hi pot haver deu i no els ' +
            'vols tots a sobre.</p>' +
          '<p class="menut">Els esdeveniments no es copien enlloc: es llegeixen del teu ' +
            'Google Calendar cada cop. El que canviïs aquí només decideix què mires.</p>' +
        '</div>',
        function () {
          // En tancar, i només si has tocat res.
          if (!caCanviar) return;
          Cau.oblida('calendari.'); mesosTinguts = {};
          carrega();
        });

      lligaCals(cos);

      cos.querySelector('[data-meus]').addEventListener('click', function () {
        var b = this;
        b.disabled = true; b.dataset.carregant = '1';
        crida('calendari', 'elsMeus', {})
          .then(function (r) {
            App.brindis(r.encesos.length
              ? r.encesos.length + (r.encesos.length === 1 ? ' encès' : ' encesos')
              : 'Ja els tenies tots encesos');
            return crida('calendari', 'calendaris', {});
          })
          .then(function (l) {
            cals = l;
            cos.querySelector('#cal-llista').innerHTML = llistaCals();
            lligaCals(cos);
            b.disabled = false; b.dataset.carregant = '0';
            caCanviar = true;
          })
          .catch(function (err) {
            b.disabled = false; b.dataset.carregant = '0';
            App.brindis(err.message, 'error');
          });
      });

      cos.querySelector('[data-sinc]').addEventListener('click', function () {
        var b = this;
        b.disabled = true; b.dataset.carregant = '1';
        crida('calendari', 'sincronitza', {})
          .then(function (r) {
            App.brindis(r.total + ' calendaris trobats');
            return crida('calendari', 'calendaris', {});
          })
          .then(function (l) {
            cals = l;
            cos.querySelector('#cal-llista').innerHTML = llistaCals();
            lligaCals(cos);
            b.disabled = false; b.dataset.carregant = '0';
          })
          .catch(function (err) {
            b.disabled = false; b.dataset.carregant = '0';
            App.brindis(err.message, 'error');
          });
      });
    }

    function llistaCals() {
      if (!cals.length) {
        return '<p class="menut">Encara no s\'han llegit. Prem el botó de sota.</p>';
      }
      return cals.map(function (c) {
        return '<label class="cat-exclou">' +
          '<input type="checkbox" data-cal="' + esc(c.id) + '"' + (c.mostra ? ' checked' : '') + '>' +
          '<span>' + esc(c.nom) + (c.principal ? ' · el teu' : '') + '</span>' +
        '</label>';
      }).join('');
    }

    function lligaCals(cos) {
      cos.querySelectorAll('[data-cal]').forEach(function (i) {
        i.addEventListener('change', function () {
          i.disabled = true;
          crida('calendari', 'mostra', { id: i.dataset.cal, mostra: i.checked })
            .then(function () {
              i.disabled = false;
              cals.forEach(function (c) { if (c.id === i.dataset.cal) c.mostra = i.checked; });
              caCanviar = true;
            })
            .catch(function (err) {
              i.disabled = false; i.checked = !i.checked;
              App.brindis(err.message, 'error');
            });
        });
      });
    }

    // ---------------------------------------------------------------- càrrega

    function quePinto() { return { mes: mes, data: dia }; }
    function claCau() { return 'calendari.' + (mes || 'ara'); }

    function aplica(r, dEnCau, forca) {
      cals = r.calendaris || cals;
      var d = r.dades;
      /* Els mesos que porta s'afegeixen als que ja tenim: passejant endavant
         i enrere se'n va acumulant el tram, i tornar sobre els passos no ha
         de tornar a preguntar res. */
      if (r.mesos) Object.keys(r.mesos).forEach(function (k) { mesosTinguts[k] = r.mesos[k]; });

      Cau.set('calendari.' + (d.mes || 'ara'), r);

      /* SI MENTRE ESPERÀVEM JA HA CANVIAT DE MES, aquesta resposta és vella.
         Pintar-la li mouria la pantalla sota els peus i el deixaria en un mes
         que ja no mirava. Del que porta ens hem quedat els mesos, que si de
         cas ja serveixen per pintar el que sí que vol. */
      if (mes && d.mes && d.mes !== mes) { pintaDelTram(mes); return; }

      var nou = JSON.stringify(d);
      if (nou === previPintat) return;

      if (!forca && previPintat !== null && App.interactuant()) {
        var primer = !ajornat;
        ajornat = r;
        if (primer) setTimeout(quanPari, 400);
        return;
      }
      previPintat = nou;
      mes = d.mes;
      dia = d.diaTriat;
      pinta(d, !!dEnCau);
    }

    function quanPari() {
      if (!arrel.isConnected) { ajornat = null; return; }
      if (App.interactuant()) { setTimeout(quanPari, 400); return; }
      var r = ajornat;
      ajornat = null;
      if (r) aplica(r);
    }

    function carrega() {
      var desat = Cau.get(claCau(), null);
      if (desat && desat.dades) {
        cals = desat.calendaris || cals;
        if (desat.mesos) mesosTinguts = desat.mesos;
        try { previPintat = JSON.stringify(desat.dades); pinta(desat.dades, true); }
        catch (e) { previPintat = null; }
      }

      /* Clicar tres cops seguits la fletxa no ha de fer tres peticions del
         mateix mes. Si ja n'hi ha una de demanada per aquest mes, s'espera. */
      if (enCami === (mes || 'ara')) return;
      enCami = mes || 'ara';

      crida('calendari', 'pantalla', quePinto())
        .then(function (r) { enCami = null; aplica(r); })
        .catch(function (err) {
          enCami = null;
          if (desat) App.brindis(err.message, 'error');
          else arrel.innerHTML = Comp.error(err, true);
        });
    }

    arrel.innerHTML = Comp.carregant(4);
    carrega();
  }
});
</script>

<script>
/* JEFE — LA PÀGINA DEL DIA
   Món: full de mapa topogràfic. Aquí, el full de ruta del dia.

   NO ÉS UN MÒDUL I NO TÉ BOTÓ. Només s'obre si li ho demanes a JEFE
   —«ensenya'm la pàgina del dia»—, i és a posta: un botó més a la fila de
   sota voldria dir una decisió més cada cop que obres l'app. Això no és un
   lloc on vagis a treballar; és la resposta a una pregunta que fas de tant
   en tant, i que quan la fas la vols sencera i d'una ullada.

   NO HI HA RES A TOCAR. Tot són coses per llegir. Si en vols fer alguna,
   el títol de cada bloc et porta al seu apartat, que és on hi ha les eines
   per fer-la. Repetir-les aquí seria mantenir dues vegades el mateix. */

App.registraVista('dia', {
  render: function (arrel, params) {

    var data = params.data || fmt.avui();
    var previPintat = null;

    function pinta(d, dEnCau) {
      var buit = !d.blocs.length;

      /* QUANT PORTES DEL DIA. No ve del servidor: surt del que ja hi ha a la
         pantalla —les coses marcades com a fetes sobre el total—, que és
         exactament el que estàs mirant. Inventar-se una altra xifra al
         servidor seria tenir dues veritats del mateix. */
      var totes = 0, fetes = 0;
      d.blocs.forEach(function (b) {
        b.coses.forEach(function (c) { totes++; if (c.fet) fetes++; });
      });
      var pct = totes ? Math.round((fetes / totes) * 100) : 0;
