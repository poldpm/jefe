          var canvi = Math.round((cur.cintura - ref.cintura) * 10) / 10;
          if (delta >= -L.pesEstable && canvi <= 0) {
            a.push({ id: 'senyal_bo', nivell: 'be',
              text: 'Pes ' + ambSigne(delta, 1) + ' kg i cintura ' + ambSigne(canvi, 1) +
                    ' cm. Això és exactament el que vols: la bàscula quieta i la cintura no. ' +
                    'Progrés, no estancament.' });
          }
        }

        if (rar) {
          a.push({ id: 'interval_rar', nivell: 'info',
            text: 'Han passat ' + d0 + ' dies des de l\'últim control: el ritme per setmana ' +
                  'és una estimació, no una mesura.' });
        }
        if (perSetmana !== null && perSetmana > L.perdRapida) {
          a.push({ id: 'massa_rapid', nivell: 'avis',
            text: '−' + coma(perSetmana, 2) + ' kg per setmana: massa. La franja bona és ' +
                  '0,4-0,7. A aquest ritme part del que se\'n va és múscul. Menja més els ' +
                  'dies de trail gros.' });
        } else if (perSetmana !== null &&
                   perSetmana >= L.perdSana[0] && perSetmana <= L.perdSana[1]) {
          a.push({ id: 'ritme_bo', nivell: 'be',
            text: '−' + coma(perSetmana, 2) + ' kg per setmana: just a la franja bona.' });
        }
        return a;
      },

      cinturaAnterior: function (h, i) {
        for (var k = i - 1; k >= 0; k--) {
          if (h[k].cinturaValida && h[k].cintura !== null) {
            return { cintura: h[k].cintura, data: h[k].data, dies: dies(h[k].data, h[i].data) };
          }
        }
        return null;
      },

      veredicte: function (a) {
        if (a.some(function (x) { return x.nivell === 'avis'; })) return 'Hi ha coses a corregir';
        if (a.some(function (x) { return x.id === 'senyal_bo'; })) return 'Bona setmana';
        return 'Setmana correcta';

    };

    // -------------------------------------------------------------- capçalera
    function capcalera() {
      var f = d && d.fase;
      return '<header class="capcalera"><div class="capcalera-fila">' +
        '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
          ic('conversa', 'ic-p') + '</button>' +
        '<div style="flex:1;min-width:0">' +
          '<h1 style="font-size:1.0625rem;margin:0">Seguiment FitFat</h1>' +
          '<p class="marge" style="margin:2px 0 0">' +
            esc(f ? f.nom : 'sense fase definida') + '</p>' +
        '</div>' +
        '<button class="btn btn-primari" data-nou="1">' + ic('mes') + 'Control</button>' +
      '</div></header>';
    }

    // ----------------------------------------------------------------- pinta
    function pinta() {
      var h = d.historic;
      var L = d.llindars;

      if (!h.length) {
        arrel.innerHTML = capcalera() +
          '<div class="pagina">' +
            '<div class="estat">' + ic('seguiment', 'ic-g') +
            '<h2>Encara no hi ha cap control</h2>' +
            '<p>El primer marca el punt de partida. Pesa\'t i mesura\'t al matí, en dejú, ' +
            'i apunta-ho: a partir del segon control ja hi haurà línia i veredicte.</p>' +
            '<button class="btn btn-primari" data-nou="1">' + ic('mes') + 'Primer control</button>' +
            '</div>' +
          '</div>';

      }

      var i = h.length - 1;
      if (triat) for (var k = 0; k < h.length; k++) if (h[k].data === triat) i = k;
      var cur = h[i];
      var avisos = Regles.analitza(h, i, L);
      var ver = Regles.veredicte(avisos);
      var prev = i > 0 ? h[i - 1] : null;

      var deltaPes = prev && cur.pes !== null && prev.pes !== null
        ? Math.round((cur.pes - prev.pes) * 100) / 100 : null;
      var refC = Regles.cinturaAnterior(h, i);
      var deltaCintura = refC && cur.cintura !== null && cur.cinturaValida
        ? Math.round((cur.cintura - refC.cintura) * 10) / 10 : null;

      var pesos = h.filter(function (c) { return c.pes !== null; })
                   .map(function (c) { return { data: c.data, v: c.pes }; });
      var cintures = h.filter(function (c) { return c.cintura !== null && c.cinturaValida; })
                      .map(function (c) { return { data: c.data, v: c.cintura }; });

      arrel.innerHTML = capcalera() +
        '<div class="pagina">' +

          (d.estat.pendent
            ? '<button class="seg-reclama" data-nou="1">' +
                '<b>Aquesta setmana encara no l\'has fet</b>' +
                '<span>Pesa\'t i mesura\'t al matí, en dejú, abans d\'esmorzar</span>' +
              '</button>'
            : '') +

          /* EL VEREDICTE PRIMER. És el que has vingut a saber. */
          '<section class="fitxa viu seg-veredicte" data-mena="' + esc(mena(avisos)) + '">' +
            '<p class="marge">' + esc(curta(cur.data)) +
              (i === h.length - 1 ? ' · últim control' : '') + '</p>' +
            '<h2 style="margin:var(--e1) 0 var(--e3)">' + esc(ver) + '</h2>' +
            '<div class="seg-xifres">' +
              '<div><span class="marge">Pes</span><b>' + coma(cur.pes, 1) + '<i>kg</i></b>' +
                '<span class="seg-delta">' + (deltaPes === null ? '' : ambSigne(deltaPes, 1)) + '</span></div>' +
              '<div><span class="marge">Cintura</span><b>' +
                (cur.cintura === null ? '—' : coma(cur.cintura, 1)) + '<i>cm</i></b>' +
                '<span class="seg-delta">' + (deltaCintura === null ? '' : ambSigne(deltaCintura, 1)) + '</span></div>' +
              '<div><span class="marge">Força</span><b>' + (cur.forca === null ? '—' : cur.forca) + '</b>' +
                '<span class="seg-delta">' + (cur.trail === null ? '' : cur.trail + ' trail') + '</span></div>' +
            '</div>' +

          (avisos.length

          /* Les gràfiques */
          '<section class="seg-grafiques">' +
            '<div class="fitxa"><p class="marge">Pes</p>' + GrafSeg.html(pesos, 'kg', 1) + '</div>' +

          '</section>' +

          '<section>' +
            '<p class="marge" style="margin:var(--e4) 0 var(--e2)">Controls</p>' +
            '<div class="seg-controls">' + h.slice().reverse().map(function (c) {
              var j = h.indexOf(c);
              var v = Regles.veredicte(Regles.analitza(h, j, L));
              return '<div class="franja-fila"><button class="franja seg-fila" data-va="' +
                esc(c.data) + '"' + (c.data === cur.data ? ' aria-current="true"' : '') + '>' +
                '<span><span class="franja-nom">' + esc(curta(c.data)) + '</span>' +

            }).join('') + '</div>' +
          '</section>' +
        '</div>';

      lliga();
    }

    function mena(avisos) {
      if (avisos.some(function (a) { return a.nivell === 'avis'; })) return 'avis';
      if (avisos.some(function (a) { return a.id === 'senyal_bo' || a.id === 'ritme_bo'; })) return 'be';
      return 'neutre';
    }

    // ------------------------------------------------------------------ fotos
    /* EL MATEIX ANGLE, UN AL COSTAT DE L'ALTRE.
       Una foto sola no diu res; dues del mateix angle separades per un mes, sí.

    function fotos(cur) {
      var h = d.historic;
      var ambFoto = h.filter(function (c) {
        return c.fotos.frontal || c.fotos.perfil || c.fotos.esquena;

      var ANGLES = [['frontal', 'Frontal'], ['perfil', 'Perfil'], ['esquena', 'Esquena']];

                    /* El boto de treure-la. Petit i a la cantonada, pero de 32

                    '<button class="seg-treu" data-treu="' + esc(a[0]) +

                }).join('') + '</div></div>';
            }).join('')
          : '<p class="menut">Encara no n\'hi ha cap. Van a una carpeta privada del teu Drive; ' +

        '<div class="seg-puja">' + ANGLES.map(function (a) {
          return '<label class="btn btn-secundari">' + ic('mes') + esc(a[1]) +

      '</section>';
    }

    // -------------------------------------------------------------- formulari
    /* ELS ESTÀNDARDS, AL COSTAT DEL CAMP.
       No en una pantalla d'ajuda que no obriràs: aquí, mentre tens la cinta a

    function obreControl(c) {
      var esNou = !c;
      var v = c || { data: d.estat.avui, cinturaValida: true, forca: 0, trail: 0, trailGros: 0 };

      var tria = function (nom, etiqueta, opcions, ara) {

      var cos = App.modal(esNou ? 'Control setmanal' : 'Control del ' + curta(v.data),

          '<div class="camp"><label for="s-data">Dia</label>' +

          /* TEXT I NO NUMBER, A POSTA. `type=number` rebutja la coma: escrius

          '<div class="camp"><label for="s-pes">Pes (kg)</label>' +
            '<input class="entrada" id="s-pes" type="text" inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" autocomplete="off" ' +
              'value="' + (v.pes === null || v.pes === undefined ? '' : v.pes) + '">' +
            '<p class="menut">' + esc(d.comEsMesura.pes) + '</p></div>' +

          '<div class="camp"><label for="s-cintura">Cintura (cm)</label>' +
            '<input class="entrada" id="s-cintura" type="text" inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" autocomplete="off" ' +

            '<p class="menut">' + esc(d.comEsMesura.cintura) + '</p>' +

          '<div class="camp-fila">' +
            '<div class="camp"><label for="s-forca">Força</label>' +

                'value="' + (v.trailGros === null ? 0 : v.trailGros) + '"></div>' +
          '</div>' +

          tria('energia', 'Energia', ['baixa', 'normal', 'alta'], v.energia) +
          tria('son', 'Son', ['malament', 'normal', 'bé'], v.son) +
          tria('gana', 'Gana', ['poca', 'normal', 'molta'], v.gana) +
          tria('dieta', 'Dieta', ['malament', 'a mitges', 'bé'], v.dieta) +

          '<div class="camp"><label for="s-notes">Notes</label>' +
            '<textarea class="entrada" id="s-notes" rows="2">' + esc(v.notes || '') + '</textarea></div>' +

          '<button class="btn btn-primari" type="submit" style="width:100%">Desa el control</button>' +
        '</form>');

      var tries = { energia: v.energia || '', son: v.son || '', gana: v.gana || '', dieta: v.dieta || '' };
      cos.querySelectorAll('.tria-bt').forEach(function (b) {
        b.addEventListener('click', function () {
          var camp = b.dataset.camp;
          var ja = tries[camp] === b.dataset.val;
          tries[camp] = ja ? '' : b.dataset.val;
          cos.querySelectorAll('[data-camp="' + camp + '"]').forEach(function (x) {
            x.setAttribute('aria-pressed', x.dataset.val === tries[camp] ? 'true' : 'false');
          });
        });
      });

      cos.querySelector('#f-seg').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var bt = cos.querySelector('button[type="submit"]');
        bt.disabled = true; bt.textContent = 'Desant…';
        var buit = function (id) {
          var x = cos.querySelector(id).value.trim();
          return x === '' ? null : Number(x.replace(',', '.'));
        };
        crida('seguiment', 'desa', {
          data: cos.querySelector('#s-data').value,
          pes: buit('#s-pes'),
          cintura: buit('#s-cintura'),
          cinturaValida: !cos.querySelector('#s-cintura-mala').checked,
          forca: buit('#s-forca'), trail: buit('#s-trail'), trailGros: buit('#s-gros'),
          energia: tries.energia, son: tries.son, gana: tries.gana, dieta: tries.dieta,
          notes: cos.querySelector('#s-notes').value.trim()
        }).then(function (r) {
          App.tancaModal();
          App.brindis('Control desat');
          triat = r.data;
          carrega(true);
        }).catch(function (err) {
          bt.disabled = false; bt.textContent = 'Desa el control';
          App.brindis(err.message, 'error');
        });
      });
    }

    // ------------------------------------------------------------------ lliga
    function lliga() {
      GrafSeg.dibuixa(arrel);
      /* Si canvies l'amplada —girar el telèfon, obrir-ho a l'escriptori— les
         coordenades d'abans ja no valen. Es tornen a calcular, i prou: no és
         cap animació, és el mateix dibuix a la mida nova. */
      if (!arrel._redibuixa) {
        arrel._redibuixa = function () { GrafSeg.dibuixa(arrel); };
        window.addEventListener('resize', arrel._redibuixa);
      }

      var t = arrel.querySelector('[data-torna]');
      if (t) t.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-nou]').forEach(function (b) {
        b.addEventListener('click', function () { obreControl(null); });
      });

      arrel.querySelectorAll('[data-va]').forEach(function (b) {
        b.addEventListener('click', function () { triat = b.dataset.va; pinta(); });
      });

      var c = arrel.querySelector('[data-comenta]');
      if (c) c.addEventListener('click', function () {
        var caixa = arrel.querySelector('#seg-comentari');
        c.disabled = true; c.textContent = 'Pensant…';
        caixa.innerHTML = '<div class="esquelet" style="height:64px"></div>';
        crida('seguiment', 'comenta', { data: c.dataset.comenta }).then(function (r) {
          caixa.innerHTML = '<blockquote class="seg-diu">' + esc(r.comentari) + '</blockquote>';
          c.remove();
        }).catch(function (err) {
          caixa.innerHTML = '';
          c.disabled = false; c.innerHTML = ic('conversa') + 'Què en penses?';
          App.brindis(err.message, 'error');
        });
      });

      /* TREURE UNA FOTO: SEMPRE PREGUNTANT.
         És l'única cosa d'aquesta pantalla que no es pot desfer tocant un altre
         botó, i una foto del cos d'un dia concret no es pot tornar a fer. Per
         això hi ha una pregunta pel mig i per això diu on va a parar: a la
         paperera del Drive, on la tens trenta dies. */
      arrel.querySelectorAll('[data-treu]').forEach(function (b) {
        b.addEventListener('click', function () {
          var cos = App.modal('Treure la foto?',
            '<p>La ' + esc(b.dataset.nom.toLowerCase()) + ' del ' +
              esc(curta(b.dataset.dia)) + '.</p>' +
            '<p class="menut">El fitxer va a la paperera del teu Drive i el pots ' +
              'recuperar durant trenta dies. Del control, en desapareix ara.</p>' +
            '<div class="formulari">' +
              '<button class="btn btn-perill" data-si="1" style="width:100%">Treu-la</button>' +
              '<button class="btn btn-secundari" data-no="1" style="width:100%">Deixa-la</button>' +
            '</div>');
          cos.querySelector('[data-no]').addEventListener('click', App.tancaModal);
          cos.querySelector('[data-si]').addEventListener('click', function () {
            var bt = cos.querySelector('[data-si]');
            bt.disabled = true; bt.textContent = 'Traient-la…';
            crida('seguiment', 'esborraFoto', { data: b.dataset.dia, angle: b.dataset.treu })
              .then(function (r) {
                App.tancaModal();
                App.brindis(r.paperera ? 'Foto treta i llençada a la paperera' : 'Foto treta');
                carrega(true);
              })
              .catch(function (err) {
                bt.disabled = false; bt.textContent = 'Treu-la';
                App.brindis(err.message, 'error');
              });
          });
        });
      });

      /* LES FOTOS PUGEN D'UNA EN UNA i sense bloquejar la pantalla. Es redueixen
         abans d'enviar-les: del telèfon surten a quatre mil píxels i per
         comparar-les no en calen més de mil dos-cents. */
      arrel.querySelectorAll('[data-foto]').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var f = inp.files && inp.files[0];
          if (!f) return;
          App.brindis('Pujant la foto…');
          redueix(f).then(function (dataUrl) {
            return crida('seguiment', 'pujaFoto',
              { data: inp.dataset.data, angle: inp.dataset.foto, contingut: dataUrl });
          }).then(function () {
            App.brindis('Foto desada');
            /* En puges tres seguides: si cada una et torna a dalt, has de baixar
               tres vegades fins a la tira de fotos. */
            App.mantenintLaVista(function () { carrega(true); });
          }).catch(function (err) { App.brindis(err.message, 'error'); });
        });
      });
    }

    function redueix(fitxer) {
      return new Promise(function (ok, no) {
        var lector = new FileReader();
        lector.onerror = function () { no(new Error('No he pogut llegir la imatge.')); };
        lector.onload = function () {
          var img = new Image();
          img.onerror = function () { no(new Error('Això no sembla una imatge.')); };
          img.onload = function () {
            var MAX = 1200;
            var e = Math.min(1, MAX / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.round(img.width * e); c.height = Math.round(img.height * e);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            ok(c.toDataURL('image/jpeg', 0.82));
          };
          img.src = lector.result;
        };
        lector.readAsDataURL(fitxer);
      });
    }

    // ----------------------------------------------------------------- càrrega
    function carrega(refresca) {
      var cau = Cau.get('seguiment', null);
      if (cau && !refresca) { d = cau; pinta(); }
      else if (!cau) arrel.innerHTML = Comp.carregant(3);

      crida('seguiment', 'pantalla', {}).then(function (r) {
        d = r; Cau.set('seguiment', r); pinta();
      }).catch(function (err) {
        if (d) { App.brindis('Sense connexió: dades del telèfon', 'error'); return; }
        arrel.innerHTML = Comp.error(err, true);
        var b = arrel.querySelector('[data-reintenta]');
        if (b) b.addEventListener('click', function () { App.ves('seguiment'); });
      });
    }

    if (params && params.data) triat = params.data;
    carrega(false);
  }
});
</script>

<script>
/* JEFE — MÒDUL · Escola

   QUÈ ENSENYA I EN QUIN ORDRE, i l'ordre és la decisió:

     1. AVUI      la columna d'hores. El que ve, i les hores lliures dites com
                  a lliures, que també és informació.
     2. PENDENTS  el que has de fer, en una línia cadascun.
     3. ACCESSOS  les tres eines de fora.
     4. AVISOS    el que ha arribat, amb campaneta perquè es reconegui: sense
                  una marca que ho digui, una fitxa és una fitxa i prou.
     5. CONSULTES les quatre preguntes a l'escola, al peu. S'obren en un full
                  a part i d'una en una: són consulta, no el motiu d'entrar.

   Les hores i els pendents surten del resum que arriba cada matí a les set i
   que ja és al full: aquesta pantalla no va a buscar res enlloc. */

App.registraVista('escola', {
  render: function (arrel) {

    var d = null;
    var veureVistos = false;
    var viu = null;            // els pendents d'ara mateix, quan l'escola contesti
    var demanantViu = false;

    var ENLLACOS = [
      ['VedrunApp',      'escola', 'https://poldpm.github.io/VedrunApp/#home'],
      ['Coordinació 2n', 'cicle',  'https://poldpm.github.io/coordinaci-_2nPrim/'],
      ['BiblioWeb',      'Recursos',
       'https://script.google.com/a/macros/escorialvic.cat/s/AKfycbyg_SyFmoHPXUH63xoS3bSGjP0HwnXz9ynejyiaSejegJWQ4IHyxr0qEdaIIVeqOkzh/exec']
    ];

    var MENES = { acta: 'Acta', tasca: 'Tasca', event: 'Cita', drive: 'Drive',
                  resum: 'Resum', resposta: 'Resposta', avis: 'Avís' };

    function quan(iso) {
      if (!iso) return '';
      var x = new Date(String(iso).replace(' ', 'T'));
      if (isNaN(x)) return String(iso).slice(0, 16);
      var h = ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2);
      if (x.toDateString() === new Date().toDateString()) return h;
      return x.getDate() + ' ' + ['gen','feb','març','abr','maig','juny','jul','ag','set','oct','nov','des'][x.getMonth()];
    }

    /* Una substitució no és un avís més: si te'n perds una, una classe es queda
       sense mestre. És l'única cosa d'aquesta pantalla que es marca en vermell. */
    function esSubstitucio(t) {
      return /substituci/i.test(String(t || ''));
    }

    function ara() {
      var x = new Date();
      return ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2);
    }

    // --------------------------------------------------- un sol comptador
    /* La capçalera deia «3 sense llegir» i el títol de la secció «Notificacions

       missatges sense llegir i l'altre els que la pantalla ENSENYA —el resum
       d'avui no hi surt com a fitxa perquè el seu contingut ja és la pàgina—.
       Dos números diferents per a la mateixa cosa fan dubtar dels dos, o sigui
       que ara tothom compta el mateix: el que pots tocar aquí. */
    function visibles() {
      return (d && d.missatges || []).filter(function (x) {
        return !(x.mena === 'resum' && String(x.rebut_el).slice(0, 10) === d.avui);
      });
    }
    function nous() { return visibles().filter(function (x) { return !x.llegit_el; }); }
    function vistos() { return visibles().filter(function (x) { return !!x.llegit_el; }); }

    // ------------------------------------------------------------- capçalera
    function capcalera() {
      var n = d ? nous().length : 0;

        '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
          ic('conversa', 'ic-p') + '</button>' +
        '<div style="flex:1;min-width:0">' +
          '<h1 style="font-size:1.0625rem;margin:0">Escola</h1>' +
          '<p class="marge" id="esc-compte" style="margin:2px 0 0">' +
            esc(fmt.relativa(d ? d.avui : fmt.avui())) + ' · ' + esc(ara()) +

        '</div>' +
      '</div></header>';
    }

    // ------------------------------------------------------ la columna d'hores
    /* LES HORES LLIURES ES DIUEN. Un forat entre dues cites no és un buit del
       disseny: és una hora que tens, i saber-ho és la meitat del que vens a
       mirar. Només s'omplen els forats INTERIORS: abans de la primera i
       després de l'última no hi ha res a dir. */
    function columna(hores) {
      if (!hores.length) return '';
      var files = [];
      var h0 = Number(hores[0].hora.slice(0, 2));
      var h1 = Number(hores[hores.length - 1].hora.slice(0, 2));

      /* ON ETS ARA. La pantalla diu que véns a veure «l'hora que ve», i fins
         ara la columna no deia enlloc per on anaves: les quatre hores eren
         iguals a les nou del matí i a dos quarts de sis. La marca ho resol amb
         una línia i prou. Només si el que mires és avui: en un altre dia, «ara»
         no vol dir res. */
      var araNum = null;
      if (!d || d.avui === fmt.avui()) {
        var x0 = new Date();
        araNum = x0.getHours() + x0.getMinutes() / 60;
      }
      var posat = false;
      var marcaAra = function () {
        posat = true;
        files.push('<div class="esc-ara"><i class="esc-hora">' + esc(ara()) + '</i>' +
                   '<span>ara</span></div>');
      };

      var buides = [];
      var buidaFora = function () {
        if (!buides.length) return;
        /* Un tram lliure seguit va en UNA línia i no en cinc. Cinc «lliure»
           un sota l'altre entre les onze i les cinc omplien mitja pantalla
           per dir una cosa que cap en set caràcters.
           L'hora d'inici va a la canal, amb les altres hores: si es queda dins
           la caixa, la columna d'hores deixa de ser una columna. */
        var a = ('0' + buides[0]).slice(-2) + ':00';
        var b = ('0' + (buides[buides.length - 1] + 1)).slice(-2) + ':00';
        files.push('<div class="esc-lliure"><i class="esc-hora">' + a + '</i>' +
          '<span>' + (buides.length === 1 ? 'lliure' : 'lliure fins a les ' + b) + '</span></div>');
        buides = [];
      };

      for (var h = h0; h <= h1; h++) {
        if (!posat && araNum !== null && araNum < h) { buidaFora(); marcaAra(); }

        var aquesta = hores.filter(function (x) { return Number(x.hora.slice(0, 2)) === h; });
        if (aquesta.length) {
          buidaFora();
          aquesta.forEach(function (x) {
            var subs = esSubstitucio(x.que);
            /* «SUBSTITUCIÓ · Substitució Medi 2nB» era dir-ho dues vegades.
               L'etiqueta hi ha de ser —el vermell no pot anar sol—, o sigui

            var que = subs ? String(x.que).replace(/^substituci[óo]\s*(de\s+|d'\s*)?/i, '') : x.que;
            files.push('<div class="esc-h' + (subs ? ' esc-subs' : '') + '">' +
              '<i class="esc-hora">' + esc(x.hora) + '</i>' +
              (subs ? '<span class="esc-et">Substitució</span>' : '') +
              '<b>' + esc(que || x.que) + '</b>' +
            '</div>');

        } else {
          buides.push(h);
        }

       feina que feia el claudàtor, i el nom es diu un cop. */
    function agrupa(pendents) {
      var ordre = [], per = {};
      (pendents || []).forEach(function (x) {
        var k = String(x.llista || '').trim() || 'Sense llista';
        if (!per[k]) { per[k] = []; ordre.push(k); }

    /**
     * Les caixes.

     * `ambAfegir` només és cert a la pantalla: al full d'una resposta, el «+»

        return '<section class="caixa" data-caixa="' + esc(g.nom) + '">' +

    function pendents() {

          (x.cos ? '<p>' + esc(x.cos) + '</p>' : '') +

            '<div id="esc-nous">' +
              (elsNous.length
                ? '<div class="esc-safata">' + elsNous.map(fitxa).join('') + '</div>'
                : '<p class="menut">Res nou. Quan l\'escola enviï alguna cosa, ' +
                  't\'arribarà al telèfon i sortirà aquí.</p>') +
            '</div>' +
            (elsVistos.length
              ? '<button class="desplega" data-vistos="1" aria-expanded="' +
                  (veureVistos ? 'true' : 'false') + '">' +
                  ic('dreta', 'ic-p') + '<span>' + (veureVistos ? 'Amaga' : 'Veure') +
                  ' les ' + elsVistos.length + ' ja vistes</span>' +
                '</button>' +
                (veureVistos ? '<div class="esc-safata">' + elsVistos.map(fitxa).join('') + '</div>' : '')
              : '') +
          '</section>' +

          // ---- 5. CONSULTES
          '<section class="secc esc-consultes">' +
            '<p class="marge">Preguntar a l\'escola</p>' +
            (d.pont
              ? '<div class="esc-cmd">' +
                  [['agenda', 'Agenda'], ['pendents', 'Pendents'],
                   ['correus', 'Correus'], ['setmana', 'Setmana']].map(function (c) {
                    return '<button data-cmd="' + c[0] + '">' + esc(c[1]) + '</button>';
                  }).join('') +
                '</div>'
              : '<p class="menut">Falta engegar el pont amb el compte de l\'escola. ' +
                'El que t\'enviï sí que arriba.</p>') +
          '</section>' +
        '</div>';

      lliga();
    }

    // --------------------------------------------------- apuntar a una llista
    /* EL CAMP S'OBRE DINS LA CAIXA, com al Google Tasks: hi escrius i prems
       Enter. Un full a part per apuntar quatre paraules seria fer-t'ho pensar
       dues vegades, i el que no s'apunta es perd.
       Enter apunta i el camp es queda obert, buit, per si en tens una altra;
       Escape el tanca. */
    function obreCamp(caixa, llista) {
      var vell = caixa.querySelector('.caixa-nova');
      if (vell) { vell.querySelector('input').focus(); return; }

      var fila = document.createElement('div');
      fila.className = 'caixa-nova';
      fila.innerHTML = '<input type="text" placeholder="Què s\'ha de fer?" autocomplete="off"' +
                       ' aria-label="Nova tasca a ' + esc(llista) + '">';
      caixa.appendChild(fila);

      var camp = fila.querySelector('input');
      camp.focus();

      camp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') { ev.preventDefault(); fila.remove(); return; }
        if (ev.key !== 'Enter') return;
        ev.preventDefault();

        var text = camp.value.trim();
        if (!text) { fila.remove(); return; }

        camp.value = '';
        camp.disabled = true;
        fila.dataset.esperant = '1';

        /* Es pinta a la caixa abans de sortir del telèfon: el viatge fins al
           compte de l'escola i tornada són un parell de segons, i mirar-los és
           el que fa que deixis d'apuntar coses. Si falla, es desfà i el text et
           torna al camp. */
        var provisional = document.createElement('li');
        provisional.textContent = text;
        provisional.dataset.esperant = '1';
        caixa.querySelector('.caixa-coses').appendChild(provisional);

        crida('escola', 'creaTasca', { llista: llista, titol: text })
          .then(function (r) {
            /* Si l'escola ha apuntat la tasca però no ha pogut tornar la
               llista al dia, la posem nosaltres: el que no pot passar és que
               la tasca hi sigui i la caixa no ho digui. */
            if (r && r.pendents) viu = r.pendents;
            else (viu = viu || []).push({ llista: llista, que: text });
            camp.disabled = false;
            refesPendents();
            var altre = arrel.querySelector('[data-caixa="' + llista.replace(/"/g, '') + '"]');
            if (altre) obreCamp(altre, llista);
            App.brindis('Apuntada a ' + llista);
          })
          .catch(function (err) {
            provisional.remove();
            fila.removeAttribute('data-esperant');
            camp.disabled = false; camp.value = text; camp.focus();
            App.brindis(err.message, 'error');
          });
      });
    }

    function lligaPendents() {
      arrel.querySelectorAll('[data-afegeix]').forEach(function (b) {
        b.addEventListener('click', function () {
          obreCamp(b.closest('.caixa'), b.dataset.afegeix);
        });
      });
    }

    /* Els pendents d'ara mateix, demanats en segon pla just després de pintar.
       No es fa abans perquè la pàgina s'ha de veure de seguida: el resum del
       matí ja és al full i no costa cap viatge. */
    function demanaViu() {
      if (!d || !d.pont || demanantViu) return;
      demanantViu = true;
      crida('escola', 'pendentsViu', {})
        .then(function (r) {
          demanantViu = false;
          viu = (r && r.pendents) || [];
          if (arrel.isConnected && !arrel.querySelector('.caixa-nova')) refesPendents();
        })
        .catch(function () {
          /* Si l'escola no contesta, no es diu res: el que hi ha pintat és el
             resum del matí, que és informació bona encara que sigui d'abans. */
          demanantViu = false;
        });
    }

    // ------------------------------------------------------------------ lliga
    function lliga() {
      var t = arrel.querySelector('[data-torna]');
      if (t) t.addEventListener('click', function () { App.ves('conversa'); });

      lligaPendents();

      var ov = arrel.querySelector('[data-vistos]');
      if (ov) ov.addEventListener('click', function () { veureVistos = !veureVistos; pinta(); });

      arrel.querySelectorAll('[data-vist]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.disabled) return;
          b.disabled = true;
          despatxa(b.dataset.vist, b);
        });
      });

      /* LA RESPOSTA S'OBRE EN UN FULL A PART, i d'una en una.
         Abans queia a la pàgina i s'hi acumulava: preguntaves tres coses i
         tenies tres respostes llargues una sota l'altra, que és exactament el
         que no vols quan mires això entre classe i classe. Un full, una
         resposta, i el tanques. */
      arrel.querySelectorAll('[data-cmd]').forEach(function (b) {
        b.addEventListener('click', function () {
          var abans = b.textContent;
          b.disabled = true; b.textContent = '…';
          crida('escola', 'comanda', { quina: b.dataset.cmd }).then(function (r) {
            b.disabled = false; b.textContent = abans;
            obreResposta(abans, String(r && r.text || '(sense resposta)'));
          }).catch(function (err) {
            b.disabled = false; b.textContent = abans;
            App.brindis(err.message, 'error');
          });
        });
      });
    }

    /* La resposta de «Pendents» arriba amb el mateix «[llista] títol» que el
       resum del matí, o sigui que es capsa igual. Les línies amb claudàtor
       s'acumulen i surten totes juntes en caixes; qualsevol altra cosa les
       tanca i es pinta al seu lloc, que és com estaven. */
    function obreResposta(titol, text) {
      var linies = String(text).split('\n').filter(function (l) { return l.trim(); });
      var trossos = [], cua = [];

      var tancaCua = function () {
        if (!cua.length) return;
        trossos.push(caixesPendents(cua));
        cua = [];
      };

      linies.forEach(function (l) {
        var net = l.replace(/^[·•\-*]\s*/, '').trim();

        var g = net.match(/^\[([^\]]+)\]\s*(.+)$/);
        if (g) { cua.push({ llista: g[1].trim(), que: g[2].trim() }); return; }

        tancaCua();
        var m = net.match(/^(\d{1,2}[:.]\d{2})\s*[·\-–]?\s*(.+)$/);
        if (m) {
          trossos.push('<div class="esc-p"><i class="esc-hora-p">' + esc(m[1].replace('.', ':')) +
                       '</i><span>' + esc(m[2]) + '</span></div>');
          return;
        }
        if (net.slice(-1) === ':' || /^\d+$/.test(net)) {
          trossos.push('<p class="marge" style="margin:var(--e3) 0 var(--e1)">' +
                       esc(net.replace(/:$/, '')) + '</p>');
          return;
        }
        trossos.push('<div class="esc-p"><i>·</i><span>' + esc(net) + '</span></div>');
      });
      tancaCua();

      App.modal(titol, '<div class="esc-resp">' + trossos.join('') + '</div>');
    }

    // ------------------------------------------------------------- despatxar
    /* Es toca només el que canvia: la fitxa, el comptador de la capçalera i el
       de les vistes. Refer la pàgina et tornaria a dalt de tot. */
    function despatxa(id, boto) {
      var art = boto.closest('.esc-msg');

      (d.missatges || []).forEach(function (x) {
        if (x.id === id && !x.llegit_el) x.llegit_el = 'ara';
      });
      /* Els mateixos comptadors que fa servir `pinta`, i per la mateixa
         raó: aquí és on abans se separaven de la capçalera. */
      var quantsNous = nous().length;
      var quantsVistos = vistos().length;
      d.pendents = quantsNous;
      Cau.set('escola', d);

      var compte = arrel.querySelector('#esc-compte');
      if (compte) {
        compte.textContent = fmt.relativa(d.avui) + ' · ' + ara() +
          (quantsNous ? ' · ' + quantsNous + ' sense llegir' : '');
      }
      var tit = arrel.querySelector('.esc-titol-avisos');
      if (tit) {
        var s = tit.querySelector('svg');
        tit.innerHTML = (s ? s.outerHTML : '') + 'Notificacions' +
          (quantsNous ? ' · ' + quantsNous : '');
      }
      var ov = arrel.querySelector('[data-vistos] span');
      if (ov) ov.textContent = (veureVistos ? 'Amaga' : 'Veure') + ' les ' + quantsVistos + ' ja vistes';

      var acaba = function () {
        if (art) art.remove();
        if (!quantsNous) {
          var caixa = arrel.querySelector('#esc-nous');
          if (caixa) {
            caixa.innerHTML = '<p class="menut">Res nou. Quan l\'escola enviï alguna cosa, ' +
              't\'arribarà al telèfon i sortirà aquí.</p>';
          }
        }
      };
      var quiet = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (art && !quiet) {
        art.style.height = art.offsetHeight + 'px';
        art.classList.add('esc-despatxat');
        setTimeout(acaba, 200);
      } else { acaba(); }

      crida('escola', 'marcaLlegit', { id: id })
        .catch(function (err) { App.brindis(err.message, 'error'); carrega(true); });
    }

    // ----------------------------------------------------------------- càrrega
    function carrega(refresca) {
      var cau = Cau.get('escola', null);
      if (cau && !refresca) { d = cau; pinta(); }
      else if (!cau) arrel.innerHTML = Comp.carregant(3);

      crida('escola', 'pantalla', {}).then(function (r) {
        d = r; Cau.set('escola', r); pinta();
        demanaViu();
      }).catch(function (err) {
        if (d) { App.brindis('Sense connexió: dades del telèfon', 'error'); return; }
        arrel.innerHTML = Comp.error(err, true);
        var b = arrel.querySelector('[data-reintenta]');
        if (b) b.addEventListener('click', function () { App.ves('escola'); });
      });
    }

    carrega(false);
  }
});
</script>

<script>
/* JEFE — MÒDUL · Tasques (Google Tasks)
   Món: full de mapa topogràfic.

   QUÈ ENSENYA I PER QUÈ AIXÍ:

     1. EL CAMP D'APUNTAR, sempre obert i a dalt. No demana llista ni data ni
        prioritat: cada camp obligatori al moment de capturar és una excusa per
        no capturar, i el que no s'apunta es perd. Cau a la llista principal de
        Google Tasks i ja ho mouràs.

     2. UNA CAIXA PER LLISTA, les mateixes caixes que a Escola —perquè és el
        mateix: llistes del Google Tasks—. Les vençudes NO surten en un bloc a
        part: sortirien dues vegades, i ja hem vist què passa llavors. Es
        marquen allà on són i el compte va a la capçalera.

     3. LES FETES es demanen, no es carreguen. No les mires cada cop que obres
        i costen una volta per llista.

   AQUÍ LA CASELLA ÉS DE DEBÒ. A Escola no n'hi ha perquè allò només mira; això
   escriu al Google Tasks, i el que marquis aquí ho veuràs al mòbil.

   I EL QUE APUNTES SURT A L'INSTANT, sense esperar el servidor: vegeu
   `afegeixEsperant`. Apuntar sis coses seguides no ha de ser sis pauses de
   segon i mig mirant la pantalla. */

App.registraVista('tasques', {
  render: function (arrel, params) {

    var dades = null;
    var previPintat = null;    // JSON del que hi ha pintat ara mateix
    var ajornat = null;        // pantalla que espera que pari d'escriure
    var esperant = 0;          // captures enviades i encara sense resposta
    var veureFetes = false;
    var lesFetes = null;       // les fetes, quan les hagi demanades
    var demanantFetes = false;

    // ------------------------------------------------------------- capçalera

    function capcalera() {
      var n = dades ? dades.tasques.length : 0;
      return '<header class="capcalera capcalera-nutri">' +
        '<div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa', 'ic-p') + '</button>' +
          '<span class="titol-periode" style="cursor:default">' +
            '<b>Tasques</b>' +
            '<span>' + (dades ? n + (n === 1 ? ' pendent' : ' pendents') : '') +
              (dades && dades.vencudes
                ? ' · ' + dades.vencudes + (dades.vencudes === 1 ? ' vençuda' : ' vençudes')
                : '') + '</span>' +
          '</span>' +
          '<button class="btn btn-fantasma btn-icona" data-ajustos="1" aria-label="Quines llistes vull veure">' +
            ic('ajust', 'ic-p') + '</button>' +
        '</div>' +
      '</header>';
    }

    // ---------------------------------------------------------------- pintura

    /* Una fila per tasca: la rodona de completar i el cos, que obre el detall.
       El text petit diu el que has de saber sense obrir-la —quan venç, si és
       prioritària, si hi estàs— i res més. */
    function fila(t) {
      var menut = [];
      if (t.vencEl) menut.push((t.vencuda ? 'vencia ' : '') + fmt.relativa(t.vencEl));
      if (t.prioritat === 'alta') menut.push('prioritària');
      if (t.fent) menut.push('hi estic');
      if (t.nota) menut.push('amb nota');

      return '<div class="tasca" data-t="' + esc(t.id) + '"' +
        (t.vencuda ? ' data-vencuda="1"' : '') + '>' +
        '<button class="tasca-marca" data-fet="' + esc(t.id) + '"' +
          ' data-llista="' + esc(t.llista) + '"' +
          ' aria-label="Fet: ' + esc(t.text) + '"></button>' +
        '<button class="tasca-cos" data-obre="' + esc(t.id) + '">' +
          '<span class="tasca-text">' + esc(t.text) + '</span>' +
          /* EL PRIMER PAS VA A LA FILA, i va per sobre de la resta del text
             petit. El títol d'una tasca encallada és justament el que fa que
             no la miris; el primer pas és el que sí que pots fer ara. Si l'has
             escrit, que es vegi sense haver d'obrir res. */
          (t.primerPas
            ? '<span class="tasca-pas">' + esc(t.primerPas) +
              (t.passQuan ? ' · ' + esc(t.passQuan) : '') + '</span>'
            : '') +
          (menut.length ? '<span class="menut">' + esc(menut.join(' · ')) + '</span>' : '') +
        '</button>' +
      '</div>';
    }

    /* El contenidor d'una caixa s'escriu SEMPRE, encara que la llista estigui
       buida i amagada: és on aterren les captures que encara no han tornat del
       servidor, i si no hi fos les hauria de fer aparèixer repintant. */
    function caixes(d) {
      if (!d.blocs.length) return '';
      return '<div class="caixes">' + d.blocs.map(function (b) {
        return '<section class="caixa" data-llista="' + esc(b.id) + '"' +
            (b.tasques.length ? '' : ' hidden') + '>' +
          /* Sense comptador, com a Escola: les tasques hi són totes a la vista
             i el número no deia res que no es veiés. */
          '<h3 class="caixa-cap"><span>' + esc(b.nom) + '</span></h3>' +
          '<div class="caixa-cos" data-coses="' + esc(b.id) + '">' +
            b.tasques.map(fila).join('') +
          '</div>' +
        '</section>';
      }).join('') + '</div>';
    }

    function blocFetes() {
      return '<div class="tsq-fetes">' +
        '<button class="desplega" data-fetes="1" aria-expanded="' +
          (veureFetes ? 'true' : 'false') + '">' +
          ic('dreta', 'ic-p') + '<span>' +
          (veureFetes ? 'Amaga les fetes' : 'Veure les fetes') + '</span>' +
        '</button>' +
        (veureFetes
          ? '<div id="tsq-fetes-cos">' +
              (lesFetes === null
                ? '<p class="menut">Un moment…</p>'
                : (lesFetes.length
                    /* Dins de `caixes` perquè a l'escriptori no faci una fila
                       de mil pixels d'ample amb quatre paraules a l'esquerra:
                       les fetes són una caixa més. */
                    ? '<div class="caixes"><div class="caixa"><div class="caixa-cos">' +
                        lesFetes.map(function (t) {
                          return '<div class="tasca" data-feta="1">' +
                            '<button class="tasca-marca" data-desfes="' + esc(t.id) + '"' +
                              ' data-llista="' + esc(t.llista) + '" data-fet="1"' +
                              ' aria-label="Torna-la a pendent: ' + esc(t.text) + '"></button>' +
                            '<span class="tasca-cos">' +
                              '<span class="tasca-text">' + esc(t.text) + '</span>' +
                              '<span class="menut">' + esc(t.llistaNom +
                                (t.fetEl ? ' · ' + fmt.relativa(t.fetEl) : '')) + '</span>' +
                            '</span>' +
                          '</div>';
                        }).join('') +
                      '</div></div></div>'
                    : '<p class="menut">Cap de feta aquestes tres setmanes.</p>')) +
            '</div>'
          : '') +
      '</div>';
    }

    function pinta(d, dEnCau) {
      dades = d;

      if (!d.hiHaServei) {
        arrel.innerHTML = capcalera() +
          '<div class="pagina">' +
            '<p class="marge">Google Tasks</p>' +
            '<p class="menut">Encara no li has donat permís. Obre l\'editor d\'Apps Script ' +
              'i executa <b>preparaTasques()</b> una vegada: després aquí hi haurà les teves ' +
              'llistes tal com són al mòbil.</p>' +
          '</div>';
        lliga();
        return;
      }

      var quina = (d.llistes.filter(function (l) { return l.principal; })[0] ||
                   d.llistes.filter(function (l) { return l.mostra; })[0] || {}).nom || '';

      arrel.innerHTML = capcalera() +
        '<div class="pagina">' +
          '<section>' +
            /* Sempre obert i sempre a dalt. Si has de prémer un botó per
               obrir-lo, ja has perdut la meitat del que volies apuntar. */
            '<label class="camp-captura tsq-capt">' +
              '<span class="marge">Apunta-ho i segueix' +
                (quina ? ' · va a ' + esc(quina) : '') + '</span>' +
              '<div class="captura-fila">' +
                '<input id="t-captura" placeholder="Què t\'acaba de passar pel cap?" autocomplete="off">' +
                '<button class="btn btn-primari" data-captura>' + ic('mes') + '</button>' +
              '</div>' +
            '</label>' +
          '</section>' +

          '<section class="secc">' +
            (d.tasques.length
              ? caixes(d)
              : (d.blocs.length
                  ? '<p class="menut">Res pendent. Bon senyal.</p>' + caixes(d)
                  : '<p class="menut">No mires cap llista. Tria-les al botó de dalt a la dreta.</p>')) +
          '</section>' +

          '<section class="secc">' + blocFetes() + '</section>' +
          (dEnCau ? '<p class="menut">Última còpia desada al telèfon.</p>' : '') +
        '</div>';

      lliga();
    }

    // ---------------------------------------------------------------- accions

    function lliga() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      var ba = arrel.querySelector('[data-ajustos]');
      if (ba) ba.addEventListener('click', obreAjustos);

      var camp = arrel.querySelector('#t-captura');

      /**
       * APUNTAR NO POT FER ESPERAR.
       *
       * La línia surt a la seva caixa abans de sortir del telèfon i el camp
       * queda lliure de seguida: pots dir-ne quatre de seguides sense que la
       * pantalla et pari entre l'una i l'altra. Quan el servidor contesta,
       * torna la llista de debò i la provisional desapareix sola.
       *
       * Si falla, es desfà i el text et torna al camp. No es perd.
       */
      function captura() {
        var t = camp.value.trim();
        if (!t) return;
        camp.value = '';
        if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }

        var provisional = afegeixEsperant(t);
        esperant++;

        escriu('tasques', 'captura', { text: t })
          .then(function (r) { esperant--; aplica(r); })
          .catch(function (err) {
            esperant--;
            if (provisional && provisional.parentNode) provisional.parentNode.removeChild(provisional);
            camp.value = t;
            App.brindis(err.message, 'error');
          });
      }
      var bc = arrel.querySelector('[data-captura]');
      if (bc) bc.addEventListener('click', captura);
      if (camp) {
        camp.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') { ev.preventDefault(); captura(); }
        });
      }

      arrel.querySelectorAll('[data-fet]:not([data-fet="1"])').forEach(function (b) {
        b.addEventListener('click', function () {
          var t = b.closest('.tasca');
          t.dataset.fent = '1';
          escriu('tasques', 'completa', { id: b.dataset.fet, llista: b.dataset.llista })
            .then(function (r) { lesFetes = null; aplica(r); })
            .catch(function (err) { t.dataset.fent = '0'; App.brindis(err.message, 'error'); });
        });
      });

      arrel.querySelectorAll('[data-desfes]').forEach(function (b) {
        b.addEventListener('click', function () {
          b.disabled = true;
          escriu('tasques', 'completa',
                 { id: b.dataset.desfes, llista: b.dataset.llista, desfes: true })
            .then(function (r) { lesFetes = null; aplica(r); })
            .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
        });
      });

      var bf = arrel.querySelector('[data-fetes]');
      if (bf) bf.addEventListener('click', function () {
        veureFetes = !veureFetes;
        repinta();
      });

      /* Marcar una tasca invalida les fetes —n'hi ha una de nova— i si el bloc
         era obert es quedava a «Un moment…» per sempre, perquè ningú les
         tornava a demanar. Es demanen aquí, que és per on passa cada pintada. */
      if (veureFetes && lesFetes === null && !demanantFetes) demanaFetes();

      arrel.querySelectorAll('[data-obre]').forEach(function (b) {
        b.addEventListener('click', function () {
          var t = null;
          for (var i = 0; i < dades.tasques.length; i++) {
            if (dades.tasques[i].id === b.dataset.obre) t = dades.tasques[i];
          }
          if (t) obreTasca(t);
        });
      });
    }

    function repinta() {
      App.mantenintLaVista(function () { pinta(dades, false); });
    }

    function demanaFetes() {
      demanantFetes = true;
      crida('tasques', 'fetes', {})
        .then(function (r) {
          demanantFetes = false; lesFetes = r.fetes || [];
          if (veureFetes) repinta();
        })
        .catch(function (err) {
          demanantFetes = false; lesFetes = [];
          App.brindis(err.message, 'error');
          if (veureFetes) repinta();
        });
    }

    /** Una línia provisional a la caixa on caurà, mentre el servidor no contesta. */
    function afegeixEsperant(text) {
      var quina = (dades.llistes.filter(function (l) { return l.principal; })[0] ||
                   dades.llistes.filter(function (l) { return l.mostra; })[0] || {}).id;
      var caixa = arrel.querySelector('.caixa[data-llista="' + quina + '"]');
      var coses = arrel.querySelector('[data-coses="' + quina + '"]');
      if (!caixa || !coses) return null;
      caixa.hidden = false;

      var el = document.createElement('div');
      el.className = 'tasca';
      el.dataset.esperant = '1';
      el.innerHTML = '<span class="tasca-marca"></span>' +
                     '<span class="tasca-cos"><span class="tasca-text">' + esc(text) + '</span></span>';
      coses.appendChild(el);
      return el;
    }

    // ------------------------------------------------------------- el detall

    function obreTasca(t) {
      var cos = App.modal('Tasca',
        '<div class="form-ajustos">' +
          '<label><span class="marge">Què s\'ha de fer</span>' +
            '<input data-c="text" value="' + esc(t.text) + '" autocomplete="off"></label>' +
          '<label><span class="marge">A quina llista</span>' +
            '<select data-c="llista">' +
              dades.llistes.map(function (l) {
                return '<option value="' + esc(l.id) + '"' +
                       (t.llista === l.id ? ' selected' : '') + '>' + esc(l.nom) + '</option>';
              }).join('') +
            '</select></label>' +
          '<label><span class="marge">Per quan</span>' +
            '<input data-c="venc_el" type="date" value="' + esc(t.vencEl || '') + '" autocomplete="off"></label>' +
          '<label class="cat-exclou"><input type="checkbox" data-c="prioritat"' +
            (t.prioritat === 'alta' ? ' checked' : '') + '><span>Prioritària</span></label>' +
          '<label class="cat-exclou"><input type="checkbox" data-c="fent"' +
            (t.fent ? ' checked' : '') + '><span>Hi estic</span></label>' +
          /* EL PRIMER PAS. Va aquí i no en una pantalla a part perquè el
             moment en què serveix és quan tens la tasca oberta al davant i no
             saps per on agafar-la.
             Dues caselles i no una: el que fa que un pla es compleixi és que
             digui QUÈ i QUAN. Amb el «què» sol, torna a ser una tasca. */
          '<label><span class="marge">El primer pas, de deu minuts</span>' +
            '<input data-c="primer_pas" value="' + esc(t.primerPas || '') + '"' +
              ' placeholder="Obrir el document i escriure el títol" autocomplete="off"></label>' +
          '<label><span class="marge">Quan</span>' +
            '<input data-c="pas_quan" value="' + esc(t.passQuan || '') + '"' +
              ' placeholder="demà després de dinar" autocomplete="off"></label>' +
          '<p class="menut">Ha de ser tan petit que faci riure. El que costa és ' +
            'començar, no fer-ho.</p>' +
          '<label><span class="marge">Nota</span>' +
            '<textarea data-c="nota" rows="3">' + esc(t.nota || '') + '</textarea></label>' +
          '<p class="menut">La prioritat, el «hi estic» i el primer pas se\'ls guarda ' +
            'en JEFE: Google Tasks no els sap desar. La resta és la tasca de debò.</p>' +
          /* POSAR-S'HI DES D'AQUÍ. El moment en què decideixes treballar en
             una cosa és quan la tens oberta al davant, no quan vas a buscar
             un rellotge en una altra pantalla. */
          '<button class="btn btn-secundari" data-focus>' + ic('focus') +
            'Posa-t\'hi ara</button>' +
          '<button class="btn btn-primari" data-desa style="margin-top:var(--e2)">Desa</button>' +
          '<button class="btn btn-secundari" data-esborra style="margin-top:var(--e2)">' +
            'Esborra-la de Google Tasks</button>' +
        '</div>');

      var camps = {};
      cos.querySelectorAll('[data-c]').forEach(function (i) { camps[i.dataset.c] = i; });

      cos.querySelector('[data-focus]').addEventListener('click', function () {
        App.tancaModal();
        App.ves('focus', { tasca: t.id, tasca_llista: t.llista, tasca_text: t.text });
      });

      cos.querySelector('[data-desa]').addEventListener('click', function () {
        var b = this;
        b.disabled = true;
        escriu('tasques', 'edita', {
          id: t.id,
          llista: t.llista,
          llistaNova: camps.llista.value !== t.llista ? camps.llista.value : '',
          text: camps.text.value,
          venc_el: camps.venc_el.value,
          prioritat: camps.prioritat.checked,
          fent: camps.fent.checked,
          primer_pas: camps.primer_pas.value,
          pas_quan: camps.pas_quan.value,
          nota: camps.nota.value
        }).then(function (r) {
          App.tancaModal(); App.brindis('Desat');
          lesFetes = null;
          aplica(r);
        }).catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });

      /* ESBORRAR ÉS ESBORRAR. Al full antic, treure una tasca hi deixava la
         fila amb una data; aquí la tasca no és nostra, és de Google, i el que
         es fa és el que diu. Per això es pregunta i el botó no diu «treure». */
      cos.querySelector('[data-esborra]').addEventListener('click', function () {
        var segon = App.modal('Esborrar la tasca',
          '<div class="form-ajustos">' +
            '<p>«' + esc(t.text) + '» desapareixerà de Google Tasks, també del mòbil.</p>' +
            '<p class="menut">Això no es pot desfer. Si només l\'has acabada, tanca això i ' +
              'marca-la amb la rodona: així es queda a les fetes.</p>' +
            '<button class="btn btn-primari" data-si>Esborra-la</button>' +
            '<button class="btn btn-secundari" data-no style="margin-top:var(--e2)">Deixa-ho estar</button>' +
          '</div>');

        segon.querySelector('[data-no]').addEventListener('click', App.tancaModal);
        segon.querySelector('[data-si]').addEventListener('click', function () {
          var b = this;
          b.disabled = true;
          escriu('tasques', 'treu', { id: t.id, llista: t.llista })
            .then(function (r) {
              App.tancaModal(); App.brindis('Esborrada');
              aplica(r);
            })
            .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
        });
      });
    }

    // ------------------------------------------------------------- ajustos

    /* Quines llistes mires. Igual que al calendari: les tens totes i tries.
       «Torna a llegir-les» hi és perquè una llista nova feta al mòbil no
       apareix sola: qui les llegeix és aquesta crida. */
    function obreAjustos() {
      var cos = App.modal('Les teves llistes',
        '<div class="form-ajustos">' +
          '<p class="menut">Les que marquis són les que veuràs. Les tasques són de ' +
            'Google Tasks: aquí només tries quines mires.</p>' +
          '<div id="tsq-llistes">' +
            (dades.llistes.length
              ? dades.llistes.map(function (l) {
                  return '<label class="cat-exclou"><input type="checkbox" data-l="' + esc(l.id) + '"' +
                    (l.mostra ? ' checked' : '') + '><span>' + esc(l.nom) +
                    (l.principal ? ' · la principal' : '') + '</span></label>';
                }).join('')
              : '<p class="menut">Encara no n\'hi ha cap. Toca «Torna a llegir-les».</p>') +
          '</div>' +
          '<button class="btn btn-secundari" data-sincro style="margin-top:var(--e3)">' +
            'Torna a llegir-les de Google</button>' +
        '</div>');

      cos.querySelectorAll('[data-l]').forEach(function (c) {
        c.addEventListener('change', function () {
          c.disabled = true;
          escriu('tasques', 'mostra', { id: c.dataset.l, mostra: c.checked })
            .then(function (r) { c.disabled = false; aplica(r); })
            .catch(function (err) {
              c.disabled = false; c.checked = !c.checked;
              App.brindis(err.message, 'error');
            });
        });
      });

      cos.querySelector('[data-sincro]').addEventListener('click', function () {
        var b = this;
        b.disabled = true; b.textContent = 'Un moment…';
        escriu('tasques', 'sincronitza', {})
          .then(function (r) {
            App.tancaModal(); App.brindis('Llistes al dia');
            aplica(r);
          })
          .catch(function (err) {
            b.disabled = false; b.textContent = 'Torna a llegir-les de Google';
            App.brindis(err.message, 'error');
          });
      });
    }

    // ---------------------------------------------------------------- càrrega

    /**
     * Rebre una pantalla del servidor i pintar-la si toca.
     *
     * La torna CADA escriptura, no només `pantalla`: desar i tornar a demanar
     * la llista eren dos viatges, i a Apps Script el viatge és tot el cost.
     *
     * No es repinta mentre té un camp obert: repintar li tancaria el
     * desplegable o li esborraria el que estava escrivint. S'espera i es pinta
     * quan pari.
     */
    function aplica(r, dEnCau) {
      Cau.set('tasques.llista', r);
      var nou = JSON.stringify(r);
      if (nou === previPintat && !esperant) return;

      if (previPintat !== null && App.interactuant()) {
        var primer = !ajornat;
        ajornat = r;
        if (primer) setTimeout(quanPari, 400);
        return;
      }
      previPintat = nou;
      /* Marcar una tasca refà la llista sencera —la feta se'n va i canvien els
         comptadors—, i això és correcte. El que no ho és, és que a sobre et
         torni a dalt de tot quan n'estaves marcant una de la setena. */
      App.mantenintLaVista(function () { pinta(r, !!dEnCau); });
    }

    /* Es mira cada tant si ja ha acabat, en comptes d'esperar que salti el
       focus: mentre escrius al camp de captura les línies provisionals es
       queden a la vista, que és el que vols, i quan pares es posa al dia. */
    function quanPari() {
      if (!arrel.isConnected) { ajornat = null; return; }
      if (App.interactuant()) { setTimeout(quanPari, 400); return; }
      var r = ajornat;
      ajornat = null;
      if (r) aplica(r);
    }

    function carrega() {
      var desat = Cau.get('tasques.llista', null);
      if (desat) {
        try { previPintat = JSON.stringify(desat); pinta(desat, true); }
        catch (e) { previPintat = null; }
      }

      crida('tasques', 'pantalla', {})
        .then(function (r) { aplica(r); })
        .catch(function (err) {
          if (desat) App.brindis(err.message, 'error');
          else arrel.innerHTML = Comp.error(err, true);
        });
    }

    arrel.innerHTML = Comp.carregant(3);
    carrega();
  }
});
</script>

<script>
/* JEFE — MÒDUL · Diari i revisió
   Món: full de mapa topogràfic. Aquí, el quadern de camp del marge.

   LA DECISIÓ QUE MANA: el que escrius tu i el que t'escriu ell van a la
   MATEIXA línia de temps. D'aquí a dos anys, quan vulguis saber com va anar
   aquell octubre, voldràs llegir-ho tot seguit i no anar saltant de pantalla.

   I el camp d'escriure és el primer que hi ha i està sempre obert, com a
   tasques i pel mateix motiu: cada toc que separa el pensament del paper és
   una excusa per no escriure. */

App.registraVista('diari', {
  render: function (arrel, params) {

    var data = params.data || fmt.avui();
    var dades = null;
    var previPintat = null;
    var ajornat = null;
    var brut = false;          // hi ha canvis al camp sense desar

    var ANIMS = [
      { n: 1, mot: 'malament' },
      { n: 2, mot: 'fluix' },
      { n: 3, mot: 'normal' },
      { n: 4, mot: 'bé' },
      { n: 5, mot: 'molt bé' }
    ];

    // ------------------------------------------------------------- capçalera

    function capcalera() {
      var r = dades ? dades.ratxa : 0;
      return '<header class="capcalera capcalera-nutri">' +
        '<div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa', 'ic-p') + '</button>' +
          '<span class="titol-periode" style="cursor:default">' +
            '<b>Diari</b>' +
            '<span>' + (r ? r + (r === 1 ? ' dia seguit' : ' dies seguits') : 'sense ratxa') + '</span>' +
          '</span>' +
          /* No hi va el triangle d'avís: demanar-li que escrigui no és cap
             alarma, i una icona que crida perill per a una cosa que no ho és
             et fa deixar de fer cas a les que sí que ho són. */
          '<button class="btn btn-fantasma btn-icona" data-genera="1" aria-label="Demana-li que escrigui">' +
            ic('llegenda', 'ic-p') + '</button>' +
        '</div>' +
      '</header>';
    }

    // ---------------------------------------------------------------- pintura

    function pinta(d, dEnCau) {
      dades = d;
      var e = d.entrada;
      var esAvui = d.data === d.avui;

      arrel.innerHTML = capcalera() +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' +
            '<div class="camp-captura">' +
              '<div class="dia-cap">' +
                '<button class="btn btn-fantasma btn-icona" data-salt="-1" aria-label="Dia anterior">' +
                  ic('esquerra', 'ic-p') + '</button>' +
                '<span class="marge">' + esc(fmt.relativa(d.data)) + '</span>' +
                '<button class="btn btn-fantasma btn-icona" data-salt="1" aria-label="Dia següent"' +
                  (esAvui ? ' disabled' : '') + '>' + ic('dreta', 'ic-p') + '</button>' +
              '</div>' +
              '<textarea id="d-text" rows="5" autocomplete="off" ' +
                'placeholder="' + esc(esAvui ? 'Com ha anat el dia?' : 'Què va passar aquell dia?') + '">' +
                esc(e ? e.text : '') + '</textarea>' +
              blocAnim(e) +
              '<div class="dia-desa">' +
                '<span class="menut" id="d-estat">' + (e ? 'Desat' : '') + '</span>' +
                '<button class="btn btn-primari" data-desa>Desa</button>' +
              '</div>' +
            '</div>' +
          '</section>' +

          '<section class="nutri-apats">' + blocLinia(d) + '</section>' +
          (dEnCau ? '<p class="menut">Última còpia desada al telèfon.</p>' : '') +
        '</div>';

      lliga();
    }

    /* Cinc caselles i prou. L'ànim és per rellegir-ho d'aquí a un any, no per
       omplir cap gràfic, i mai no bloqueja res: pots escriure sense marcar-ne
       cap i marcar-ne una sense escriure. */
    function blocAnim(e) {
      var sel = e && e.anim ? Number(e.anim) : 0;
      var mot = ANIMS.filter(function (a) { return a.n === sel; })[0];
      return '<div class="anim">' +
        '<span class="marge">Com ha anat' + (mot ? ' · ' + esc(mot.mot) : '') + '</span>' +
        '<div class="anim-tria" role="group" aria-label="Com ha anat el dia">' +
          ANIMS.map(function (a) {
            return '<button data-anim="' + a.n + '"' +
                   (a.n === sel ? ' aria-pressed="true"' : ' aria-pressed="false"') +
                   ' aria-label="' + esc(a.mot) + '">' + a.n + '</button>';
          }).join('') +
        '</div>' +
      '</div>';
    }

    function blocLinia(d) {
      /* L'entrada del dia que estàs editant NO es repeteix aquí sota: la
         tens oberta al camp de dalt. Sortia dues vegades a la mateixa
         pantalla, i la de sota semblava una altra cosa que havies escrit. El
         que SÍ que hi surt d'aquell dia és el que t'hi va escriure ell. */
      var linia = d.linia.filter(function (x) {
        return !(x.data === d.data && x.tipus === 'entrada');
      });

      if (!linia.length) {
        return '<p class="menut" style="margin-top:var(--e5)">' +
               'Encara no hi ha res més escrit. Amb una línia al dia ja té sentit tornar-hi.</p>';
      }

      var htmlPerData = {};
      var ordre = [];
      linia.forEach(function (x) {
        if (!htmlPerData[x.data]) { htmlPerData[x.data] = []; ordre.push(x.data); }
        htmlPerData[x.data].push(x);
      });

      return '<p class="marge" style="margin-top:var(--e5)">Enrere</p>' +
        ordre.map(function (dia) {
          return '<div class="dia-bloc">' +
            '<button class="dia-titol" data-ves="' + esc(dia) + '">' +
              esc(fmt.relativa(dia)) + '</button>' +
            htmlPerData[dia].map(apunt).join('') +
          '</div>';
        }).join('');
    }

    function apunt(x) {
      /* «Resum del dia» i no «tancament»: tancar el dia és el que fas tu a
         nutrició quan hi poses les calories cremades. Si les dues coses es
         diuen igual, no saps quina de les dues t'està parlant. */
      var qui = x.tipus === 'entrada' ? '' : (x.tipus === 'revisio' ? 'Revisió de la setmana' : 'Resum del dia');
      var mot = ANIMS.filter(function (a) { return a.n === Number(x.anim); })[0];

      return '<article class="apunt" data-tipus="' + esc(x.tipus) + '">' +
        (qui ? '<p class="apunt-qui">' + esc(qui) + '</p>' : '') +
        (mot ? '<p class="apunt-anim">' + esc(mot.mot) + '</p>' : '') +
        '<div class="apunt-text">' + esc(x.text).replace(/\n/g, '<br>') + '</div>' +
      '</article>';
    }

    // ---------------------------------------------------------------- accions

    function lliga() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-salt]').forEach(function (b) {
        b.addEventListener('click', function () {
          var nova = fmt.suma(data, Number(b.dataset.salt));
          if (nova > fmt.avui()) return;
          desaSiCal(function () { App.ves('diari', { data: nova }); });
        });
      });
      arrel.querySelectorAll('[data-ves]').forEach(function (b) {
        b.addEventListener('click', function () {
          desaSiCal(function () { App.ves('diari', { data: b.dataset.ves }); });
        });
      });

      var camp = arrel.querySelector('#d-text');
      camp.addEventListener('input', function () {
        brut = true;
        var e = arrel.querySelector('#d-estat');
        if (e) e.textContent = 'Sense desar';
      });
      /* Desar en sortir del camp, a més del botó. El que has escrit no es pot
         perdre perquè hagis tocat una altra cosa sense pensar-hi. */
      camp.addEventListener('blur', function () { if (brut) desa(); });

      arrel.querySelector('[data-desa]').addEventListener('click', function () { desa(); });

      arrel.querySelectorAll('[data-anim]').forEach(function (b) {
        b.addEventListener('click', function () {
          var ja = b.getAttribute('aria-pressed') === 'true';
          arrel.querySelectorAll('[data-anim]').forEach(function (o) {
            o.setAttribute('aria-pressed', 'false');
          });
          // Tornar a tocar la mateixa la treu: no hi ha manera de desmarcar-la si no.
          if (!ja) b.setAttribute('aria-pressed', 'true');
          brut = true;
          desa();
        });
      });

      var bg = arrel.querySelector('[data-genera]');
      if (bg) bg.addEventListener('click', obreGenera);
    }

    function animTriat() {
      var b = arrel.querySelector('[data-anim][aria-pressed="true"]');
      return b ? Number(b.dataset.anim) : 0;
    }

    /* UNA DESADA A LA VEGADA.
       Tocar el botó de l'ànim treu el focus del camp: salta el desat del
       `blur` i tot seguit el del botó, i les dues peticions se'n van juntes.
       El servidor ja no en fa dues files —hi ha un bloqueig—, però enviar-ne
       dues segueix sent dues anades per res, i la segona pot arribar abans
       que la primera i desar text vell.
       Si mentre n'hi ha una en marxa se'n demana una altra, s'apunta i es fa
       UNA sola quan torni: el que val és l'últim estat del camp, no quantes
       vegades l'has demanat. */
    var desant = false, pendent = null;

    function desa(alAcabar) {
      if (desant) {
        pendent = alAcabar || pendent || function () {};
        return;
      }
      var camp = arrel.querySelector('#d-text');
      if (!camp) { if (alAcabar) alAcabar(); return; }
      desant = true;

      var text = camp.value;
      var anim = animTriat();
      var estat = arrel.querySelector('#d-estat');
      if (estat) estat.textContent = 'Desant…';
      brut = false;

      escriu('diari', 'escriu', { data: data, text: text, anim: anim },
             { data: data, quants: 30 })
        .then(function (r) {
          var e2 = arrel.querySelector('#d-estat');
          if (e2) e2.textContent = 'Desat';
          aplica(r);
          if (alAcabar) alAcabar();
          acabaDesada();
        })
        .catch(function (err) {
          brut = true;
          var e2 = arrel.querySelector('#d-estat');
          if (e2) e2.textContent = 'No s\'ha pogut desar';
          App.brindis(err.message, 'error');
          if (alAcabar) alAcabar();
          acabaDesada();
        });
    }

    /* La que s'havia demanat mentre l'altra anava. Una i no les que fossin:
       totes deien el mateix —«desa el que hi ha al camp»— i el camp és un. */
    function acabaDesada() {
      desant = false;
      if (!pendent) return;
      var seguent = pendent;
      pendent = null;
      desa(seguent === true ? undefined : seguent);
    }

    /** Abans de marxar del dia, desa el que hi hagi sense desar. */
    function desaSiCal(seguent) {
      if (!brut) return seguent();
      desa(seguent);
    }

    /* Poder demanar-li el resum ara. Serveix per no haver d'esperar a les deu
       del vespre, i sobretot per veure què t'escriurà abans de fiar-t'hi. */
    function obreGenera() {
      var cos = App.modal('Demana-li que escrigui',
        '<div class="form-ajustos">' +
          '<p class="menut">Ho escriu amb les dades que hi ha ara mateix i ho deixa al diari. ' +
            'Es pot repetir: reescriu el del mateix dia, no n\'acumula.' +
            (dades && dades.iaActiva ? ''
              : ' <b>La capa d\'IA està apagada</b>, o sigui que sortiran les xifres sense cap comentari.') +
          '</p>' +
          '<button class="btn btn-primari" data-fes="dia">Tancament d\'avui</button>' +
          '<button class="btn btn-secundari" data-fes="setmana" style="margin-top:var(--e2)">' +
            'Revisió de la setmana</button>' +
        '</div>');

      cos.querySelectorAll('[data-fes]').forEach(function (b) {
        b.addEventListener('click', function () {
          cos.querySelectorAll('[data-fes]').forEach(function (o) { o.disabled = true; });
          b.dataset.carregant = '1';
          escriu('diari', 'generaAra',
                 { data: fmt.avui(), setmanal: b.dataset.fes === 'setmana' },
                 { data: data, quants: 30 })
            .then(function (r) {
              App.tancaModal();
              App.brindis('Escrit');
              aplica(r);
            })
            .catch(function (err) {
              cos.querySelectorAll('[data-fes]').forEach(function (o) { o.disabled = false; });
              b.dataset.carregant = '0';
              App.brindis(err.message, 'error');
            });
        });
      });
    }

    // ---------------------------------------------------------------- càrrega

    function aplica(r, dEnCau) {
      Cau.set('diari.' + data, r);
      var nou = JSON.stringify(r);
      if (nou === previPintat) return;

      /* Mentre escriu no es repinta res: li esborraria el que està teclejant.
         I si hi ha canvis sense desar, encara menys. */
      if (previPintat !== null && (brut || App.interactuant())) {
        var primer = !ajornat;
        ajornat = r;
        if (primer) setTimeout(quanPari, 400);
        return;
      }
      previPintat = nou;
      pinta(r, !!dEnCau);
    }

    function quanPari() {
      if (!arrel.isConnected) { ajornat = null; return; }
      if (brut || App.interactuant()) { setTimeout(quanPari, 400); return; }
      var r = ajornat;
      ajornat = null;
      if (r) aplica(r);
    }

    function carrega() {
      var desat = Cau.get('diari.' + data, null);
      if (desat) {
        try { previPintat = JSON.stringify(desat); pinta(desat, true); }
        catch (e) { previPintat = null; }
      }

      crida('diari', 'pantalla', { data: data, quants: 30 })
        .then(function (r) { aplica(r); })
        .catch(function (err) {
          if (desat) App.brindis(err.message, 'error');
          else arrel.innerHTML = Comp.error(err, true);
        });
    }

    arrel.innerHTML = Comp.carregant(3);
    carrega();
  }
});
</script>

<script>
/* JEFE — MÒDUL · Calendari
   Món: full de mapa topogràfic. Aquí, la quadrícula UTM del full.

   LA DECISIÓ QUE MANA: la graella del mes ensenya ON hi ha coses, no QUÈ hi
   ha. Set columnes en una pantalla de mòbil donen cinquanta píxels per dia:
   no hi cap cap títol sense mentir. El que hi cap és un punt per cita, i
   això ja respon la pregunta que fas mirant un mes —«quins dies tinc plens»—.
   El què és a sota, del dia que toquis, amb tot l'espai i sense retallar res. */

App.registraVista('calendari', {
  render: function (arrel, params) {

    var mes = params.mes || null;          // AAAA-MM
    var dia = params.data || null;
    var dades = null, cals = [];
    var previPintat = null, ajornat = null;
    /* Els mesos que han portat les respostes. Canviar de mes cap a un
       que ja tenim NO va al servidor: és el que fa que passi de set segons a
       instantani. Vegeu `pantalla()` al mòdul. */
    var mesosTinguts = {};                 // els mesos que ja tenim llegits
    var enCami = null;                     // el mes que estem demanant ara
    /* Va AQUÍ i no dins d'obreCalendaris: qui la marca és `lligaCals`, que és
       una funció germana i no filla. Declarada allà dins, l'assignació de fora
       creava una variable global i la de dins es quedava a fals per sempre: el
       tauler es tancava i la pantalla no s'assabentava de res. */
    var caCanviar = false;

    var DIES = ['dl', 'dt', 'dc', 'dj', 'dv', 'ds', 'dg'];
    var MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol',
                 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];

    function nomMes(m) {
      var t = MESOS[Number(m.slice(5, 7)) - 1];
      return t.charAt(0).toUpperCase() + t.slice(1) + ' del ' + m.slice(0, 4);
    }
    function mouMes(m, n) {
      var y = Number(m.slice(0, 4)), i = Number(m.slice(5, 7)) - 1 + n;
      var d = new Date(y, i, 1);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    }

    // ------------------------------------------------------------- capçalera

    function capcalera(d) {
      var esActual = d.mes === d.avui.slice(0, 7);
      return '<header class="capcalera capcalera-nutri">' +
        '<div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa', 'ic-p') + '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-salt="-1" aria-label="Mes anterior">' +
            ic('esquerra', 'ic-p') + '</button>' +
          '<button class="titol-periode" data-avui="1">' +
            '<b>' + esc(nomMes(d.mes)) + '</b>' +
            '<span>' + (d.provisional
              ? 'carregant…'
              : d.quants + (d.quants === 1 ? ' cita' : ' cites') +
                (esActual ? ' · en curs' : '')) + '</span>' +
          '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-salt="1" aria-label="Mes següent">' +
            ic('dreta', 'ic-p') + '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-nou="1" aria-label="Apunta al calendari">' +
            ic('mes', 'ic-p') + '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-ajustos="1" aria-label="Quins calendaris">' +
            ic('ajust', 'ic-p') + '</button>' +
        '</div>' +
      '</header>';
    }

    // ---------------------------------------------------------------- pintura

    function pinta(d, dEnCau) {
      dades = d;
      arrel.innerHTML = capcalera(d) +
        /* Disposició pròpia i no la de nutrició: allà la columna estreta és
           la de l'esquerra i la gran la de la dreta, i aquí és al revés. Amb
           les seves classes, a l'escriptori la graella del mes quedava
           encaixada en 340 px al racó d'una pantalla de 1.900. */
        '<div class="pagina cal-pagina">' +
          '<section class="cal-graella">' + blocMes(d) + '</section>' +
          '<section class="cal-costat" id="c-dia">' + blocDia(d) + '</section>' +
          (dEnCau ? '<p class="menut">Última còpia desada al telèfon.</p>' : '') +
        '</div>';
      lliga();
    }

    /* La graella. Cada casella és un botó de 44 px d'alt: el dia que toques
       és el que s'obre a sota, i tocar-ne un no és mai una acció que canviï
       res, o sigui que no cal confirmar res ni patir per equivocar-se. */
    function blocMes(d) {
      return '<div class="mes-graella" role="grid" aria-label="' + esc(nomMes(d.mes)) + '">' +
        DIES.map(function (n) {
          return '<span class="mes-cap" aria-hidden="true">' + n + '</span>';
        }).join('') +
        d.caselles.map(function (c) {
          return '<button class="mes-dia" data-dia="' + esc(c.data) + '"' +
            (c.delMes ? '' : ' data-fora="1"') +
            (c.esAvui ? ' data-avui="1"' : '') +
            (c.data === d.diaTriat ? ' aria-current="date"' : '') +
            ' aria-label="' + esc(diuCasella(c)) + '">' +
            '<span class="n">' + c.dia + '</span>' +
            /* Els punts i els títols hi són tots dos, i el full d'estil tria
               què s'ensenya segons l'amplada. Decidir-ho aquí amb JavaScript
               voldria dir tornar a pintar la graella cada cop que gires el
               telèfon o canvies la finestra de mida. */
            '<span class="punts">' +
              c.mostra.map(function (e) {
                return '<i' + (e.totElDia ? ' data-tot="1"' : '') +
                       (e.color ? ' style="background:' + esc(e.color) + '"' : '') + '></i>';
              }).join('') +
            '</span>' +
            '<span class="cal-titols">' +
              c.mostra.map(function (e) {
                return '<span class="cal-cita"' + (e.totElDia ? ' data-tot="1"' : '') +
