          objectiu_setmanal: cos.querySelector('#f-objectiu-setmanal').value
        };
        if (!esNou) p.id = h.id;
        boto.dataset.carregant = '1';
        crida('habits', esNou ? 'crea' : 'edita', p)
          .then(function () { App.tancaModal(); App.brindis(esNou ? 'Hàbit creat' : 'Desat');
                              carrega(); })
          .catch(function (err) { boto.dataset.carregant = '0'; App.brindis(err.message, 'error'); });
      });
    }

    function confirmaArxiu(h) {
      App.tancaModal();
      setTimeout(function () {
        var cos = App.modal('Arxivar «' + h.nom + '»?',
          '<p class="menut" style="margin-bottom:var(--e4)">Desapareix de la llista diària. ' +
          '<strong>No s\'esborra res:</strong> tot l\'històric es conserva i el pots recuperar.</p>' +
          '<button class="btn btn-primari btn-ple" data-si="1">Sí, arxiva\'l</button>' +
          '<button class="btn btn-fantasma btn-ple" data-no="1" style="margin-top:var(--e2)">Cancel·la</button>');
        cos.querySelector('[data-no]').addEventListener('click', App.tancaModal);
        cos.querySelector('[data-si]').addEventListener('click', function (ev) {
          ev.currentTarget.dataset.carregant = '1';
          crida('habits', 'arxiva', { id: h.id })
            .then(function () { App.tancaModal(); App.brindis('Arxivat'); carrega(); })
            .catch(function (err) { App.brindis(err.message, 'error'); });
        });
      }, 220);
    }

    /* Dir-ho amb un exemple i no amb una definició: la diferència entre
       «quantitat» i «comptador» és què vols que et digui després, i això no
       s'endevina del nom. */
    function explicaTipus(v) {
      if (v === 'quantitat') return 'Un toc en suma un. En arribar al nombre, queda fet.';
      if (v === 'comptador') return 'Un toc en suma un, sense objectiu ni ratxa. ' +
                                   'Per veure quant en fas i cap on va.';
      return 'Un toc el marca fet. Un altre el desmarca.';
    }

    function opcio(valor, text, actiu) {
      return '<button type="button" class="opcio" data-valor="' + esc(valor) + '" aria-pressed="' +
             (actiu ? 'true' : 'false') + '">' + esc(text) + '</button>';
    }
    function grupExclusiu(cos, sel, alCanviar) {
      cos.querySelectorAll(sel + ' .opcio').forEach(function (b) {
        b.addEventListener('click', function () {
          cos.querySelectorAll(sel + ' .opcio').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          alCanviar(b.dataset.valor);
        });
      });
    }
    function seleccionat(cos, sel) {
      var b = cos.querySelector(sel + ' .opcio[aria-pressed="true"]');
      return b ? b.dataset.valor : null;
    }

    // -------------------------------------------------------------- càrrega

    /* UNA SOLA ANADA PER A LES DUES COSES.
       La fila del dia i el full del mes es veuen alhora i es demanaven per
       separat: dues anades per obrir la pantalla i dues més cada cop que en
       marcaves un. Totes dues llegeixen el mateix full del servidor. */
    function carrega() {
      crida('habits', 'pantalla', { data: data, dies: 30 })
        .then(function (r) {
          if (r.mes) { mes = r.mes; Cau.set('habits.mes', r.mes); }

          var d = r.dia;
          /* Si mentre això arribava has tocat res, el que mana és el que has
             tocat: aquesta foto ja és vella. Es descarta i prou. */
          if (enVol || Object.keys(espera).length) { pintaMes(); return; }
          Cau.set('habits.' + data, d);
          if (App.interactuant()) { dades = d; pintaMes(); return; }
          pinta(d, false);
          pintaMes();
        })
        .catch(function (err) {
          if (dades) { App.brindis('Sense connexió', 'error'); return; }
          arrel.innerHTML = Comp.error(err, true);
          var r = arrel.querySelector('[data-reintenta]');
          if (r) r.addEventListener('click', carrega);
        });
    }

    // Es queda pel nom: tot el que la cridava ara ja te el mes amb carrega.
    function carregaMes() { carrega(); }

    if (!App._relleuLligat) {
      App._relleuLligat = true;
      window.addEventListener('resize', function () {
        clearTimeout(App._relleuTemps);
        App._relleuTemps = setTimeout(function () {
          if (App.actual === 'habits') dibuixaRelleu();
        }, 160);
      });
    }

    var cau = Cau.get('habits.' + data, null);
    mes = Cau.get('habits.mes', null);
    if (cau) pinta(cau, true);
    else arrel.innerHTML = '<div class="pagina"><div class="terreny">' +
      '<div class="esquelet franja-fantasma"></div><div class="esquelet franja-fantasma"></div>' +
      '<div class="esquelet franja-fantasma"></div></div></div>';
    carrega();
  }
});
</script>

<script>
/* JEFE — MÒDUL · Nutrició
   Món: full de mapa topogràfic. Ve de FitFat, però parla l'idioma de JEFE.

   LA DECISIÓ QUE MANA: apuntar un aliment ha de ser el camí més curt de la
   pantalla. Si costa, no s'usa, i un comptador que no s'omple no serveix de
   res. Per això el formulari d'afegir és sempre visible dins de cada àpat i
   la llista d'aliments guardats hi és al primer toc: la majoria de dies
   menges el mateix, i tornar a teclejar «pit de pollastre · 165 · 31» és
   exactament la fricció que fa abandonar l'eina.

   El balanç es llegeix com un perfil de terreny: el dèficit puja a la dreta,
   el superàvit baixa a l'esquerra, i la marca de l'objectiu és una fita. */

App.registraVista('nutricio', {
  render: function (arrel, params) {

    var data = params.data || fmt.avui();
    var periode = params.periode || 'dia';
    var apatObert = null;      // quin àpat té el formulari desplegat, si n'hi ha cap
    var dades = null, aliments = [], ajustos = null;

    var APATS = [
      { clau: 'dinar',   nom: 'Dinar'   },
      { clau: 'berenar', nom: 'Berenar' },
      { clau: 'sopar',   nom: 'Sopar'   }
    ];

    var r0 = function (n) { return Math.round(Number(n) || 0); };
    /* Amb coma, que aquí es parla català: «95,8 g» i no «95.8 g». I sense el
       decimal quan és zero, que «140,0 g» no diu res que no digui «140 g». */
    var r1 = function (n) {
      var v = Math.round((Number(n) || 0) * 10) / 10;
      return (v % 1 === 0 ? String(v) : v.toFixed(1)).replace('.', ',');
    };
    var num = function (v) {
      var n = parseFloat(String(v === undefined || v === null ? '' : v).replace(',', '.'));
      return isFinite(n) ? n : 0;
    };

    // ------------------------------------------------------------- capçalera

    var PERIODES = [['dia', 'Dia'], ['setmana', 'Setmana'], ['mes', 'Mes']];

    /* UNA SOLA LÍNIA. El títol diu on ets i, tocant-lo, tries.
       Abans hi havia la fila de la data i una tira de períodes a sota: dues
       franges fixes a dalt per una cosa que canvies un cop a la setmana. Les
       fletxes es queden perquè el dia sí que el canvies constantment. */
    function capcalera(esAvui) {
      var sota = (PERIODES.filter(function (p) { return p[0] === periode; })[0] || ['', 'Dia'])[1];
      return '<header class="capcalera capcalera-nutri">' +
        '<div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa', 'ic-p') + '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-salt="-1" aria-label="Anterior">' +
            ic('esquerra', 'ic-p') + '</button>' +
          '<button class="titol-periode" data-obre-periode="1">' +
            '<b>' + esc(titolPeriode()) + '</b>' +
            '<span>' + esc(sota) +
              (periode === 'dia' && esAvui ? ' · avui' : '') + ' ▾</span>' +
          '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-salt="1" aria-label="Següent"' +
            (esAvui ? ' disabled' : '') + '>' + ic('dreta', 'ic-p') + '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-ajustos="1" aria-label="Objectius">' +
            ic('ajust', 'ic-p') + '</button>' +
        '</div>' +
      '</header>';
    }

    function obrePeriode() {
      var cos = App.modal('Què vols veure', '<div class="tria-periode">' +
        PERIODES.map(function (p) {
          return '<button data-va="' + p[0] + '"' +
                 (p[0] === periode ? ' aria-current="true"' : '') + '>' + p[1] + '</button>';
        }).join('') +
        '<hr><button data-anar-avui="1">Anar a avui</button>' +
      '</div>');

      cos.querySelectorAll('[data-va]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.tancaModal();
          App.ves('nutricio', { data: data, periode: b.dataset.va });
        });
      });
      cos.querySelector('[data-anar-avui]').addEventListener('click', function () {
        App.tancaModal();
        App.ves('nutricio', { data: fmt.avui(), periode: periode });
      });
    }

    function etiquetaPeriode() {
      if (periode === 'dia') return fmt.relativa(data);
      return periode === 'setmana' ? 'Setmana' : 'Mes';
    }

    function titolPeriode() {
      if (periode === 'dia') return fmt.llarga(data);
      if (!dades || !dades.desde) return '…';
      if (periode === 'mes') {
        var d = new Date(Number(data.slice(0, 4)), Number(data.slice(5, 7)) - 1, 1);
        var m = d.toLocaleDateString('ca-ES', { month: 'long', year: 'numeric' });
        return m.charAt(0).toUpperCase() + m.slice(1);
      }
      return fmt.relativa(dades.desde) + ' → ' + fmt.relativa(dades.fins);
    }

    // ------------------------------------------------------------ vista dia

    /* L'ordre és el de FitFat, i és el bo: les xifres del dia a dalt de tot
       perquè és el que mires primer, després els àpats que és on treballes, i
       el tancament al final perquè és l'última cosa que fas del dia. */
    function pintaDia(d, dEnCau) {
      dades = d;
      arrel.innerHTML = capcalera(d.data === fmt.avui()) +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt" id="col-dalt"></section>' +
          '<section class="nutri-apats" id="col-apats"></section>' +
          '<section class="nutri-tanca" id="col-tanca"></section>' +
          (dEnCau ? '<p class="menut">Última còpia desada al telèfon.</p>' : '') +
        '</div>';

      /* `arrel.querySelector` i no `document.getElementById`: si la vista ja
         no és a la pantalla, ha d'escriure a la seva capsa i no a la del que
         hi hagi ara. Vegeu `App.ves` al nucli. */
      arrel.querySelector('#col-dalt').innerHTML = blocDalt(d);
      arrel.querySelector('#col-apats').innerHTML =
        APATS.map(function (m) { return blocApat(d, m); }).join('');
      arrel.querySelector('#col-tanca').innerHTML = blocTanca(d);

      lligaCapcalera();
      lligaBalanc();
      lligaApats();
    }

    /** Les tres xifres del dia, i la barra de proteïna si hi ha objectiu. */
    function blocDalt(d) {
      var t = d.totals;
      var teObjProt = d.objectius.proteina > 0;
      var pct = teObjProt ? Math.min(t.proteina / d.objectius.proteina * 100, 100) : 0;

      return '<div class="tres-xifres">' +
          xifra('Ingerides', r0(t.ingerides), 'kcal') +
          xifra('Proteïna', r1(t.proteina), 'g') +
          xifra('Cremades', d.teCremades ? r0(d.cremades) : '—', d.teCremades ? 'kcal' : '') +
        '</div>' +

        /* L'OBJECTIU DE PROTEÏNA, EN ANELL.
           Era una barra, i l'app ja té l'anell per dir «quant en portes»: una
           barra aquí i un anell a la pàgina del dia són dos idiomes per dir
           exactament el mateix. El que falta va al costat, en text, perquè no
           depengui de saber llegir un cercle. */
        (teObjProt
          ? '<div class="prot-bloc">' +
              '<div class="anell" style="--p:' + pct.toFixed(0) + '"' +
                ' role="img" aria-label="' + r1(t.proteina) + ' de ' + r0(d.objectius.proteina) + ' g de proteïna">' +
                '<b>' + pct.toFixed(0) + '%</b><small>proteïna</small>' +
              '</div>' +
              '<div class="prot-diu">' +
                '<span class="marge">Objectiu</span>' +
                '<span class="num">' + r1(t.proteina) + ' / ' + r0(d.objectius.proteina) + ' g</span>' +
                (t.proteina < d.objectius.proteina
                  ? '<span class="menut">Falten ' + r1(d.objectius.proteina - t.proteina) + ' g</span>'
                  : '<span class="menut">Assolit</span>') +
              '</div>' +
            '</div>'
          : '');
    }

    /** El tancament: què has cremat, i què en surt. */
    function blocTanca(d) {
      return '<p class="marge">Tancament del dia</p>' +

        '<label class="camp-activitat">' +
          '<span class="menut">Calories cremades (total del dia, del rellotge)</span>' +
          '<input id="n-activitat" inputmode="decimal" value="' +
            (d.teActivitat ? esc(String(d.activitat)) : '') + '" placeholder="p. ex. 2400">' +
        '</label>' +

        '<div class="fitxa" data-estat="' + esc(d.verdicte.estat) + '">' +
          '<div class="xifra-gran">' +
            (d.teCremades
              ? (d.net > 0 ? '−' : d.net < 0 ? '+' : '') + r0(Math.abs(d.net)) + '<span class="u">kcal</span>'
              : '—') +
          '</div>' +
          '<p class="verdicte">' + esc(d.verdicte.text) + '</p>' +
          (d.teCremades ? barraBalanc(d) : '') +
        '</div>';
    }

    function xifra(etiqueta, valor, unitat) {
      return '<div class="xifra"><span class="marge">' + esc(etiqueta) + '</span>' +
             '<b class="num">' + esc(String(valor)) +
             (unitat ? '<span class="u">' + esc(unitat) + '</span>' : '') + '</b></div>';
    }

    /** El mateix escalat que FitFat: el centre és l'equilibri. */
    function barraBalanc(d) {
      var obj = d.objectius.deficit;
      var escala = Math.max(800, obj * 1.4, Math.abs(d.net) * 1.15);
      var ample = Math.min(Math.abs(d.net) / escala * 50, 50);
      var deficit = d.net > 0;
      var fita = obj > 0 ? Math.min(obj / escala * 50, 50) : 0;

      return '<div class="balanc">' +
        '<div class="balanc-via">' +
          '<i style="left:' + (deficit ? 50 : 50 - ample) + '%;width:' + ample + '%" data-costat="' +
            (deficit ? 'deficit' : 'superavit') + '"></i>' +
          '<u></u>' +
          (fita > 0 ? '<b style="left:' + (50 + fita) + '%"></b>' : '') +
        '</div>' +
        '<div class="balanc-peu"><span>← superàvit</span>' +
          (fita > 0 ? '<span class="fita-txt">objectiu</span>' : '') +
          '<span>dèficit →</span></div>' +
      '</div>';
    }

    function blocApat(d, m) {
      var apat = null;
      for (var i = 0; i < d.apats.length; i++) if (d.apats[i].clau === m.clau) apat = d.apats[i];
      if (!apat) apat = { items: [], kcal: 0, proteina: 0 };
      var obert = apatObert === m.clau;

      return '<div class="apat" data-apat="' + esc(m.clau) + '">' +
        '<div class="apat-cap">' +
          '<h2>' + esc(m.nom) + '</h2>' +
          '<span class="num menut">' +
            (apat.items.length ? r0(apat.kcal) + ' kcal · ' + r1(apat.proteina) + ' g' : '') +
          '</span>' +
        '</div>' +

        '<div class="apat-items">' +
          (apat.items.length
            ? apat.items.map(function (i) {
                return '<div class="ingesta">' +
                  '<div style="flex:1;min-width:0">' +
                    '<div class="nm">' + esc(i.nom) + '</div>' +
                    '<div class="menut num">' + r0(i.grams) + ' g · ' + r0(i.kcal100) +
                      ' kcal/100 · ' + r1(i.prot100) + ' prot/100</div>' +
                  '</div>' +
                  '<div class="num" style="text-align:right">' +
                    '<div>' + r0(i.kcal) + '</div>' +
                    '<div class="menut">' + r1(i.prot) + ' g</div>' +
                  '</div>' +
                  '<button class="btn btn-fantasma btn-icona" data-treu="' + esc(i.id) +
                    '" aria-label="Treu ' + esc(i.nom) + '">' + ic('tancar', 'ic-p') + '</button>' +
                '</div>';
              }).join('')
            : '') +
        '</div>' +

        /* EL FORMULARI VE PLEGAT, I NOMÉS N'HI HA UN D'OBERT.
           Els tres àpats amb el formulari desplegat feien la pàgina de 2.325
           píxels: per veure el tancament del dia havies de passar per sobre de
           tres formularis buits. Plegats, la pantalla és la llista del que has
           menjat, que és el que véns a mirar. I obrir-ne un tanca l'altre
           perquè, si no, tornes a tenir-los tots desplegats en quatre tocs. */
        '<button class="btn btn-secundari btn-ple apat-obre" data-obre-form="' + esc(m.clau) + '"' +
          ' aria-expanded="' + (obert ? 'true' : 'false') + '">' +
          textObre(obert, m.nom) + '</button>' +

        '<div class="apat-form"' + (obert ? '' : ' hidden') + '>' +
          /* Llista pròpia i no un <select>: el desplegable natiu d'Android
             dibuixa cada opció amb l'estil del sistema i no admet dues mides
             de lletra a la mateixa línia. Amb el nom i les xifres iguals de
             grosses, trobar un aliment costa llegir-ho tot. */
          '<button class="btn btn-secundari tria-aliment" data-guardats>' +
            ic('mes', 'ic-p') + 'Tria un aliment guardat</button>' +
          '<input data-nom placeholder="Aliment" autocomplete="off">' +
          '<input data-grams inputmode="decimal" placeholder="grams" class="num" autocomplete="off">' +
          '<input data-kcal inputmode="decimal" placeholder="kcal/100 g" class="num" autocomplete="off">' +
          '<input data-prot inputmode="decimal" placeholder="prot/100 g" class="num" autocomplete="off">' +
          '<button class="btn btn-primari" data-afegeix>Afegeix</button>' +
          '<button class="btn btn-secundari" data-desa-aliment>Desa l\'aliment</button>' +
        '</div>' +
      '</div>';
    }

    function textObre(obert, nom) {
      return ic(obert ? 'menys' : 'mes', 'ic-p') +
             (obert ? 'Tanca' : 'Afegeix-hi') +
             '<span class="nomes-lectors"> a ' + esc(nom) + '</span>';
    }

    /**
     * Obrir el formulari d'un àpat en tanca qualsevol altre.
     *
     * Es fa tocant el DOM i no repintant la pàgina: repintar-la enmig d'un
     * toc et tanca el teclat i et fa perdre el que estiguessis escrivint a
     * l'altre àpat.
     */
    function obreForm(clau) {
      apatObert = (apatObert === clau) ? null : clau;
      arrel.querySelectorAll('.apat').forEach(function (sec) {
        var obert = sec.dataset.apat === apatObert;
        var f = sec.querySelector('.apat-form');
        var b = sec.querySelector('[data-obre-form]');
        if (f) f.hidden = !obert;
        if (b) {
          b.setAttribute('aria-expanded', obert ? 'true' : 'false');
          b.innerHTML = textObre(obert, sec.querySelector('.apat-cap h2').textContent);
        }
      });
      if (apatObert) enfocaCamp(apatObert);
    }

    function enfocaCamp(clau) {
      var camp = arrel.querySelector('.apat[data-apat="' + clau + '"] [data-nom]');
      if (camp) { try { camp.focus(); } catch (e) {} }
    }

    // -------------------------------------------------------- setmana i mes

    /* LA GRÀFICA DIBUIXA EL BALANÇ, i res més.
       Abans l'alçada eren les calories ingerides i el color el balanç: dues
       variables al mateix dibuix, i cap de les dues es podia llegir. Ara la
       línia del mig és l'equilibri, cap amunt és dèficit i cap avall superàvit.
       Una barra alta vol dir un dia bo, i prou.

       Setmana i mes són gràfiques diferents a posta: amb set dies hi caben el
       nom del dia i la xifra a cada fila, i amb trenta-un no. */
    function pintaPeriode(d) {
      dades = d;

      var nets = d.dies.map(function (x) { return x.net === null ? 0 : Math.abs(x.net); });
      var escala = Math.max(600, Math.max.apply(null, nets));
      var enDeficit = d.dies.filter(function (x) { return x.net !== null && x.net > 0; }).length;
      var enSuperavit = d.dies.filter(function (x) { return x.net !== null && x.net < 0; }).length;
      var teObjProt = d.objectius.proteina > 0;

      arrel.innerHTML = capcalera(true) +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' +
            '<div class="tres-xifres">' +
              xifra('Ingerides / dia', r0(d.mitjanaIngerides), 'kcal') +
              xifra('Proteïna / dia', r1(d.mitjanaProteina), 'g') +
              xifra('Balanç / dia',
                    d.diesAmbBalanc ? signe(d.mitjanaNet) + r0(Math.abs(d.mitjanaNet)) : '—',
                    d.diesAmbBalanc ? 'kcal' : '') +
            '</div>' +
            (teObjProt
              ? '<div class="prot-bloc">' +
                  '<div class="prot-cap"><span class="marge">Proteïna mitjana</span>' +
                    '<span class="num menut">' + r1(d.mitjanaProteina) + ' / ' +
                    r0(d.objectius.proteina) + ' g</span></div>' +
                  '<div class="prot-barra"><i style="width:' +
                    Math.min(d.mitjanaProteina / d.objectius.proteina * 100, 100).toFixed(1) +
                    '%"></i></div>' +
                '</div>'
              : '') +
          '</section>' +

          '<section>' +
            '<p class="marge">Balanç diari</p>' +
            (d.diesApuntats === 0
              ? '<p class="menut">Encara no hi ha res apuntat en aquest període.</p>'
              : (periode === 'setmana' ? graficSetmana(d, escala) : graficMes(d, escala))) +

            '<p class="menut" style="margin-top:var(--e3);border-top:1px solid var(--utm-suau);' +
              'padding-top:var(--e3)">' +
              d.diesApuntats + (d.diesApuntats === 1 ? ' dia apuntat' : ' dies apuntats') +
              ' · ' + enDeficit + ' en dèficit · ' + enSuperavit + ' en superàvit' +
              (d.diesAmbBalanc
                ? '<br>Balanç acumulat: <b class="num">' + signe(d.netAcumulat) +
                  r0(Math.abs(d.netAcumulat)) + ' kcal</b>'
                : '') +
            '</p>' +
          '</section>' +
        '</div>';

      lligaCapcalera();
      arrel.querySelectorAll('[data-dia]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.ves('nutricio', { data: b.dataset.dia, periode: 'dia' });
        });
      });
    }

    /** Menys davant d'un dèficit: el balanç es llegeix com el pes que perds. */
    function signe(n) { return n > 0 ? '−' : n < 0 ? '+' : ''; }

    function nomDiaCurt(iso) {
      var p = String(iso).split('-');
      var dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12);
      return dt.toLocaleDateString('ca-ES', { weekday: 'short', day: 'numeric' });
    }

    /** Set files: nom del dia, barra que surt del centre, i la xifra. */
    function graficSetmana(d, escala) {
      return '<div class="bal-setmana">' +
        d.dies.map(function (x) {
          if (x.net === null) {
            return '<div class="bal-fila" data-buit="1">' +
              '<span class="bal-nom">' + esc(nomDiaCurt(x.data)) + '</span>' +
              '<span class="bal-via"><u></u></span>' +
              '<span class="bal-xifra">' + (x.apuntat ? '·' : '—') + '</span></div>';
          }
          var deficit = x.net > 0;
          var f = Math.min(Math.abs(x.net) / escala * 50, 50);
          return '<button class="bal-fila" data-dia="' + esc(x.data) + '"' +
            ' aria-label="' + esc(fmt.llarga(x.data)) + ': ' +
              (deficit ? 'dèficit ' : 'superàvit ') + r0(Math.abs(x.net)) + ' kcal">' +
            '<span class="bal-nom">' + esc(nomDiaCurt(x.data)) + '</span>' +
            '<span class="bal-via"><u></u>' +
              '<i data-costat="' + (deficit ? 'deficit' : 'superavit') + '"' +
              ' style="left:' + (deficit ? 50 : 50 - f) + '%;width:' + f + '%"></i>' +
            '</span>' +
            '<span class="bal-xifra" data-costat="' + (deficit ? 'deficit' : 'superavit') + '">' +
              signe(x.net) + r0(Math.abs(x.net)) + '</span>' +
          '</button>';
        }).join('') +
      '</div>' +
      '<div class="balanc-peu"><span>← superàvit</span><span>dèficit →</span></div>';
    }

    /** Un mes sencer: columnes que pugen o baixen d'una línia central. */
    function graficMes(d, escala) {
      var n = d.dies.length;
      var barres = d.dies.map(function (x, i) {
        if (x.net === null) return '';
        var deficit = x.net > 0;
        var h = Math.min(Math.abs(x.net) / escala * 48, 48);
        var estil = 'left:' + ((i + 0.12) / n * 100).toFixed(2) + '%;' +
                    'width:' + (0.76 / n * 100).toFixed(2) + '%;' +
                    (deficit ? 'bottom:50%;' : 'top:50%;') + 'height:' + h.toFixed(2) + '%;';
        return '<i data-costat="' + (deficit ? 'deficit' : 'superavit') + '" style="' + estil +
               '" title="' + esc(fmt.llarga(x.data)) + ': ' + signe(x.net) +
               r0(Math.abs(x.net)) + ' kcal"></i>';
      }).join('');

      // Les fites van SOTA la gràfica, no a dins. A dins tapaven les barres.
      var fites = [1, 5, 10, 15, 20, 25, 30].filter(function (v) { return v <= n; });

      return '<div class="bal-mes">' +
          '<div class="bal-mes-caixa"><u></u>' + barres + '</div>' +
          '<div class="bal-mes-eix">' +
            fites.map(function (v) {
              return '<span style="left:' + ((v - 0.5) / n * 100).toFixed(2) + '%">' + v + '</span>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="balanc-peu"><span>▲ dèficit</span><span>superàvit ▼</span></div>';
    }

    // -------------------------------------------------------------- accions

    function lligaCapcalera() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-salt]').forEach(function (b) {
        b.addEventListener('click', function () {
          var n = Number(b.dataset.salt);
          var nova = periode === 'dia' ? fmt.suma(data, n)
                   : periode === 'setmana' ? fmt.suma(data, n * 7)
                   : mouMes(data, n);
          if (nova > fmt.avui() && periode === 'dia') return;
          App.ves('nutricio', { data: nova, periode: periode });
        });
      });

      var bp = arrel.querySelector('[data-obre-periode]');
      if (bp) bp.addEventListener('click', obrePeriode);

      var baj = arrel.querySelector('[data-ajustos]');
      if (baj) baj.addEventListener('click', obreAjustos);
    }

    function mouMes(iso, n) {
      var y = Number(iso.slice(0, 4)), m = Number(iso.slice(5, 7)) - 1 + n;
      var d = new Date(y, m, 1);
      var ultim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      var dia = Math.min(Number(iso.slice(8, 10)), ultim);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + dia).slice(-2);
    }

    function lligaBalanc() {
      var inp = arrel.querySelector('#n-activitat');
      if (!inp) return;
      var previ = inp.value;
      inp.addEventListener('change', function () {
        if (inp.value === previ) return;
        previ = inp.value;
        escriu('nutricio', 'activitat', { data: data, kcal: num(inp.value) }, quePinto())
          .then(function (r) { Cau.oblida('nutricio.'); aplica(r); })
          .catch(function (err) { App.brindis(err.message, 'error'); });
      });
    }

    /**
     * La llista d'aliments guardats.
     *
     * El nom mana i les xifres van petites i grises: el que busques és
     * «tonyina», no «185». Amb tot de la mateixa mida, cada aliment és una
     * frase que s'ha de llegir sencera per descartar-la.
     */
    function obreAliments(alTriar) {
      if (!aliments.length) {
        App.brindis('Encara no tens cap aliment guardat', 'error');
        return;
      }

      var cos = App.modal('Aliments guardats',
        '<input class="cerca-aliment" data-cerca placeholder="Cerca…" autocomplete="off">' +
        '<div class="aliments" id="llista-aliments"></div>');

      var llista = cos.querySelector('#llista-aliments');
      var cerca = cos.querySelector('[data-cerca]');

      function pinta(q) {
        var n = String(q || '').trim().toLowerCase();
        var mostrats = aliments.filter(function (a) {
          return !n || String(a.nom).toLowerCase().indexOf(n) !== -1;
        });
        llista.innerHTML = mostrats.length
          ? mostrats.map(function (a) {
              return '<button class="aliment-fila" data-a="' + esc(a.id) + '">' +
                '<span class="aliment-nom">' + esc(a.nom) + '</span>' +
                '<span class="aliment-dades">' + r0(a.kcal100) + ' kcal · ' +
                  r1(a.prot100) + ' g prot · per 100 g</span>' +
              '</button>';
            }).join('')
          : '<p class="menut">Cap aliment amb aquest nom.</p>';

        llista.querySelectorAll('[data-a]').forEach(function (b) {
          b.addEventListener('click', function () {
            var t = null;
            for (var i = 0; i < aliments.length; i++) {
              if (aliments[i].id === b.dataset.a) t = aliments[i];
            }
            App.tancaModal();
            if (t) alTriar(t);
          });
        });
      }

      pinta('');
      cerca.addEventListener('input', function () { pinta(cerca.value); });
    }

    function lligaApats() {
      arrel.querySelectorAll('[data-obre-form]').forEach(function (b) {
        b.addEventListener('click', function () { obreForm(b.dataset.obreForm); });
      });

      arrel.querySelectorAll('.apat').forEach(function (sec) {
        var apat = sec.dataset.apat;
        var sel  = sec.querySelector('[data-guardats]');
        var nom  = sec.querySelector('[data-nom]');
        var gr   = sec.querySelector('[data-grams]');
        var kc   = sec.querySelector('[data-kcal]');
        var pr   = sec.querySelector('[data-prot]');
        var bt   = sec.querySelector('[data-afegeix]');
        var bd   = sec.querySelector('[data-desa-aliment]');

        sel.addEventListener('click', function () { obreAliments(function (a) {
          nom.value = a.nom; kc.value = a.kcal100; pr.value = a.prot100;
          refresca(); gr.focus();
        }); });

        function llest() { return nom.value.trim() && num(gr.value) > 0; }

        // El botó ensenya el resultat abans de prémer-lo. Així no cal afegir
        // per veure si t'has equivocat de coma.
        function refresca() {
          if (llest()) {
            bt.textContent = 'Afegeix · ' + r0(num(gr.value) * num(kc.value) / 100) + ' kcal · ' +
                             r1(num(gr.value) * num(pr.value) / 100) + ' g';
          } else {
            bt.textContent = 'Afegeix';
          }
        }

        [nom, gr, kc, pr].forEach(function (i) {
          i.addEventListener('input', refresca);
          i.addEventListener('keydown', function (e) { if (e.key === 'Enter') afegeix(); });
        });

        function afegeix() {
          if (!llest()) return;
          bt.disabled = true;
          escriu('nutricio', 'afegeix', {
            data: data, apat: apat, nom: nom.value.trim(),
            grams: num(gr.value), kcal100: num(kc.value), prot100: num(pr.value)
          }, quePinto()).then(function (r) {
            nom.value = gr.value = kc.value = pr.value = '';
            bt.disabled = false;
            /* El botó torna a dir «Afegeix». Si no, es queda amb la previsió
               del que acabes d'apuntar i sembla que encara ho hagis de prémer. */
            refresca();
            if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
            Cau.oblida('nutricio.');
            aplica(r, false, true);
            /* El formulari es queda obert i amb el cursor a punt: després d'un
               aliment normalment en ve un altre del mateix àpat. */
            enfocaCamp(apat);
          }).catch(function (err) {
            bt.disabled = false;
            App.brindis(err.message, 'error');
          });
        }

        bt.addEventListener('click', afegeix);

        bd.addEventListener('click', function () {
          if (!nom.value.trim() || num(kc.value) <= 0) {
            App.brindis('Per desar-lo cal el nom i les kcal per 100 g', 'error');
            return;
          }
          bd.disabled = true;
          escriu('nutricio', 'desaAliment', {
            nom: nom.value.trim(), kcal100: num(kc.value), prot100: num(pr.value)
          }, quePinto()).then(function (r) {
            // La llista es munta cada cop que s'obre, o sigui que amb tenir
            // `aliments` al dia ja hi surt: `aplica` ho fa i, amb el tauler
            // obert, s'espera a repintar fins que el tanquis.
            Cau.oblida('nutricio.');
            bd.disabled = false;
            App.brindis('«' + nom.value.trim() + '» desat a la teva llista');
            aplica(r);
          }).catch(function (err) {
            bd.disabled = false;
            App.brindis(err.message, 'error');
          });
        });

        sec.querySelectorAll('[data-treu]').forEach(function (b) {
          b.addEventListener('click', function () {
            b.disabled = true;
            escriu('nutricio', 'treu', { id: b.dataset.treu }, quePinto())
              // Treure'n un és una cosa que vols veure feta: es pinta encara
              // que tinguis el formulari de l'àpat obert.
              .then(function (r) { Cau.oblida('nutricio.'); aplica(r, false, true); })
              .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
          });
        });
      });
    }

    // -------------------------------------------------------------- ajustos

    function obreAjustos() {
      var a = ajustos || {};
      var cos = App.modal('Objectius i cos',
        '<div class="form-ajustos">' +
          camp('objectiuDeficit', 'Dèficit diari objectiu (kcal)', a.objectiuDeficit) +
          camp('objectiuProteina', 'Proteïna diària objectiu (g)', a.objectiuProteina) +
          '<button class="btn btn-primari" data-desa-ajustos>Desa</button>' +
          '<hr>' +
          '<p class="marge">Portar-hi les dades de FitFat</p>' +
          '<p class="menut">Tria el fitxer de «⚙ → Còpia de seguretat → Exporta». ' +
            'Primer et diré què hi trobo i què faria; no s\'escriu res fins que ho confirmis. ' +
            'No esborra ni sobreescriu mai res, i es pot repetir sense duplicar.</p>' +
          '<input type="file" accept="application/json,.json" data-fitxer>' +
          '<div id="aj-import"></div>' +
        '</div>');

      lligaImportacio(cos);

      cos.querySelector('[data-desa-ajustos]').addEventListener('click', function () {
        var p = {};
        cos.querySelectorAll('[data-c]').forEach(function (i) { p[i.dataset.c] = i.value; });
        escriu('nutricio', 'desaAjustos', p, quePinto())
          .then(function (r) {
            App.tancaModal();
            App.brindis('Objectius desats');
            Cau.oblida('nutricio.');
            aplica(r);
          })
          .catch(function (err) { App.brindis(err.message, 'error'); });
      });
    }

    /**
     * Importació en dos temps: primer un assaig que no escriu res i diu què
     * faria, i només després l'escriptura. Amb dades que només existeixen en
     * un telèfon, ensenyar el resultat abans de tocar-les no és una cortesia.
     */
    function lligaImportacio(cos) {
      var fitxer = cos.querySelector('[data-fitxer]');
      var sortida = cos.querySelector('#aj-import');
      if (!fitxer) return;

      fitxer.addEventListener('change', function () {
        var f = fitxer.files && fitxer.files[0];
        if (!f) return;
        sortida.innerHTML = '<p class="menut">Llegint el fitxer…</p>';

        var lector = new FileReader();
        lector.onerror = function () {
          sortida.innerHTML = '<p class="menut" style="color:var(--avis)">No he pogut llegir el fitxer.</p>';
        };
        lector.onload = function () {
          var text = String(lector.result || '');
          crida('nutricio', 'importaFitFat', { dades: text, simulacio: true })
            .then(function (r) { mostraAssaig(r, text); })
            .catch(function (err) {
              sortida.innerHTML = '<p class="menut" style="color:var(--avis)">' + esc(err.message) + '</p>';
            });
        };
        lector.readAsText(f);
      });

      function mostraAssaig(r, text) {
        var res = r.ingestes + r.aliments + r.activitats;
        sortida.innerHTML =
          '<div class="fitxa" style="margin-top:var(--e3)">' +
            '<p class="marge">Què hi he trobat</p>' +
            '<p>' + r.ingestes + ' ingestes · ' + r.activitats + ' dies amb activitat · ' +
              r.aliments + ' aliments' +
              (r.jaHiEren ? ' · ' + r.jaHiEren + ' que ja hi eren i no tornaré a posar' : '') + '</p>' +
            (r.ajustos ? '<p class="menut">També hi ha objectius i dades del cos.</p>' : '') +
            (r.avisos && r.avisos.length
              ? '<p class="menut" style="color:var(--avis)">' + r.avisos.map(esc).join('<br>') + '</p>' : '') +
            (res > 0
              ? '<button class="btn btn-primari" data-confirma style="width:100%;margin-top:var(--e3)">' +
                  'Importa-ho' + '</button>'
              : '<p class="menut">No hi ha res de nou per importar.</p>') +
          '</div>';

        var b = sortida.querySelector('[data-confirma]');
        if (!b) return;
        b.addEventListener('click', function () {
          b.disabled = true;
          b.textContent = 'Important…';
          crida('nutricio', 'importaFitFat', { dades: text, simulacio: false })
            .then(function (fet) {
              sortida.innerHTML = '<p class="menut">Importat: ' + fet.ingestes + ' ingestes, ' +
                fet.activitats + ' dies i ' + fet.aliments + ' aliments.</p>';
              App.brindis('Dades de FitFat importades');
                      Cau.oblida('nutricio.');
              carrega();
            })
            .catch(function (err) {
              b.disabled = false;
              b.textContent = 'Torna-ho a provar';
              App.brindis(err.message, 'error');
            });
        });
      }
    }

    function camp(clau, etiqueta, valor) {
      return '<label><span class="marge">' + esc(etiqueta) + '</span>' +
             '<input data-c="' + clau + '" inputmode="decimal" class="num" value="' +
             esc(valor === undefined || valor === null || valor === 0 ? '' : String(valor)) + '" autocomplete="off"></label>';
    }

    // --------------------------------------------------------------- càrrega

    /* PRIMER EL QUE JA SABEM, DESPRÉS EL QUE ARRIBA.
       Una petició a Apps Script costa entre un segon i mig i dos i mig i això
       no ho arregla cap codi nostre: és la plataforma. El que sí que podem
       arreglar és esperar-la amb la pantalla en blanc. */
    function claCau() { return 'nutricio.' + periode + '.' + data; }

    var previPintat = null;   // JSON de les dades que hi ha pintades ara
    var ajornat = null;       // pantalla que espera que pari de tocar coses

    /**
     * Rebre una pantalla i pintar-la si toca.
     *
     * La torna tant `pantalla` com qualsevol escriptura —vegeu `escriu()`—,
     * perquè desar i tornar a demanar el dia eren dos viatges al servidor i a
     * Apps Script el viatge és tot el cost. Entrar un aliment ha passat de dos
     * segons llargs a un.
     *
     * NO REFER LA PANTALLA SI NO CAL: si el servidor diu exactament el mateix
     * que ja teníem, repintar només serveix per destruir el que tinguis obert
     * o a mig escriure. I si ha canviat però estàs tocant alguna cosa,
     * s'espera que acabis.
     */
    /**
     * @param forca  Repinta encara que tinguis un camp obert.
     *
     * PER QUÈ CAL AQUEST «FORÇA», que és un error que va estar-hi de debò:
     * l'ajornament hi és per no esborrar-te el que estàs escrivint. Però
     * després d'AFEGIR un aliment el formulari es queda obert i amb el cursor
     * al camp del nom —a posta, perquè darrere d'un aliment normalment en ve
     * un altre—, i això vol dir que sempre hi ha un camp enfocat. La pantalla
     * s'ajornava, l'ajornament es tornava a ajornar cada quatre dècimes, i
     * l'aliment que acabaves d'apuntar no sortia MAI a la llista: semblava que
     * no s'hagués desat.
     *
     * Quan el que ha canviat és conseqüència del que acabes de fer tu, i els
     * camps ja han quedat buits, no hi ha res a protegir: es pinta.
     */
    function aplica(r, dEnCau, forca) {
      if (r.aliments && r.aliments.length) aliments = r.aliments;
      ajustos = r.ajustos || ajustos;
      Cau.set(claCau(), r);

      var nou = JSON.stringify(r.dades);
      if (nou === previPintat) return;

      /* Només té sentit ajornar si ja hi ha alguna cosa pintada: si la
         pantalla és buida, repintar no pot destruir res i no fer-ho et deixa
         mirant l'esquelet de càrrega per sempre. */
      if (!forca && previPintat !== null && App.interactuant()) {
        var primer = !ajornat;
        ajornat = r;
        if (primer) setTimeout(quanPari, 400);
        return;
      }
      previPintat = nou;
      if (periode === 'dia') pintaDia(r.dades, !!dEnCau); else pintaPeriode(r.dades);
    }

    /* Es mira cada tant si ja ha acabat, en comptes d'esperar que salti el
       focus. Un tauler obert sense cap camp enfocat no dispara `focusout` en
       tancar-se, i llavors el que hi ha ajornat no es pinta mai. */
    function quanPari() {
      if (!arrel.isConnected) { ajornat = null; return; }
      if (App.interactuant()) { setTimeout(quanPari, 400); return; }
      var r = ajornat;
      ajornat = null;
      if (r) aplica(r);
    }

    /** Els paràmetres que necessita `pantalla` per tornar el que mirem ara. */
    function quePinto() { return { periode: periode, data: data }; }

    function carrega() {
      var desat = Cau.get(claCau(), null);
      if (desat && desat.dades) {
        aliments = desat.aliments && desat.aliments.length ? desat.aliments : aliments;
        ajustos = desat.ajustos || ajustos;
        try {
          previPintat = JSON.stringify(desat.dades);
          if (periode === 'dia') pintaDia(desat.dades, true); else pintaPeriode(desat.dades);
        } catch (e) { previPintat = null; }
      }

      crida('nutricio', 'pantalla', quePinto())
        .then(function (r) { aplica(r); })
        .catch(function (err) {
          if (desat) App.brindis(err.message, 'error');
          else arrel.innerHTML = Comp.error(err, true);
        });
    }

    arrel.innerHTML = Comp.carregant(4);
    carrega();
  }
});
</script>

<script>
/* JEFE — MÒDUL · Finances
   Món: full de mapa topogràfic. Ve de l'app «finances» i parla l'idioma de JEFE.

   LA DECISIÓ QUE MANA, i és la seva pròpia: apuntar una despesa ha de ser
   instantani. Per això el botó d'apuntar és el primer que es veu i el
   formulari s'omple sol amb el que ja has apuntat abans —la majoria de
   compres es repeteixen, i tornar a teclejar «Mercadona · Alimentació ·
   targeta» cada dimarts és exactament la fricció que fa abandonar l'eina.

   El mes es llegeix com un terreny: els ingressos són l'altura de partida,
   les despeses el que baixes, i el balanç la cota on acabes. */

App.registraVista('finances', {
  render: function (arrel, params) {

    var mes = params.mes || null;          // AAAA-MM; null = mes en curs
    var periode = params.periode || 'mes'; // mes | mesos | estad
    var dades = null, cats = [], sugg = [];

    var r0 = function (n) { return Math.round(Number(n) || 0); };
    var num = function (v) {
      var n = parseFloat(String(v === undefined || v === null ? '' : v).replace(',', '.'));
      return isFinite(n) ? Math.abs(n) : 0;
    };
    function eur(n, ambSigne) {
      var v = Math.round((Number(n) || 0) * 100) / 100;
      var s = Math.abs(v).toFixed(2).replace('.', ',') + ' €';
      if (!ambSigne) return (v < 0 ? '−' : '') + s;
      return (v > 0 ? '+' : v < 0 ? '−' : '') + s;
    }
    /* Nomes el numero. L'euro va a la ranura d'unitat: enganxat al numero es
       una paraula mes, i quan no hi cap el navegador el trenca i te'l deixa
       en una linia tot sol. */
    function eurNum(n, ambSigne) {
      var v = Math.round((Number(n) || 0) * 100) / 100;
      var t = Math.abs(v).toFixed(2).replace('.', ',');
      if (!ambSigne) return (v < 0 ? '−' : '') + t;
      return (v > 0 ? '+' : v < 0 ? '−' : '') + t;
    }

    function nomMes(m) {
      var d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1, 1);
      var t = d.toLocaleDateString('ca-ES', { month: 'long', year: 'numeric' });
      return t.charAt(0).toUpperCase() + t.slice(1);
    }
    function mouMes(m, n) {
      var y = Number(m.slice(0, 4)), i = Number(m.slice(5, 7)) - 1 + n;
      var d = new Date(y, i, 1);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    }

    // ------------------------------------------------------------- capçalera

    var PERIODES = [['mes', 'Mes'], ['mesos', 'Mesos'], ['estad', 'Estadístiques']];

    /* UNA SOLA LÍNIA.
       Abans hi havia la fila de la data i, a sota, una tira amb els tres
       períodes: dues files fixes a dalt de tot per dir-te on ets. El títol ja
       ho diu, i tocant-lo tries. El que es canvia cinc cops al dia —el mes—
       té les fletxes al costat; el que es canvia un cop a la setmana no s'ha
       de menjar una franja de pantalla per estar sempre a la vista. */
    function capcalera(esActual) {
      var mostraFletxes = periode === 'mes' || periode === 'estad';
      var titol = periode === 'mesos' ? 'Últims 12 mesos'
                : periode === 'revisar' ? 'Per classificar'
                : periode === 'recurrents' ? 'Cada mes'
                : periode === 'patrimoni' ? 'Patrimoni'
                : nomMes(mes);
      var sota = periode === 'revisar' ? 'safata'
               : periode === 'recurrents' ? 'recurrents'
               : periode === 'patrimoni' ? 'que tens'
               : (PERIODES.filter(function (p) { return p[0] === periode; })[0] || ['', 'Mes'])[1];

      return '<header class="capcalera capcalera-nutri">' +
        '<div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa', 'ic-p') + '</button>' +
          (mostraFletxes
            ? '<button class="btn btn-fantasma btn-icona" data-salt="-1" aria-label="Mes anterior">' +
              ic('esquerra', 'ic-p') + '</button>' : '') +
          '<button class="titol-periode" data-obre-periode="1">' +
            '<b>' + esc(titol) + '</b>' +
            '<span>' + esc(sota) + (esActual && periode === 'mes' ? ' · en curs' : '') + ' ▾</span>' +
          '</button>' +
          /* AQUÍ HI HAVIA «Banc mirat fa 3 minuts», i s'ha tret.
             L'argument era que el número de sota només vol dir alguna cosa si
             saps de quan és. Amb tres sincronitzacions al dia i el fitxer
             sempre al dia, la resposta és sempre «fa una estona»: una línia
             que diu el mateix cada vegada no informa de res, i en canvi
             s'espremia el títol del període i les fletxes al mòbil.
             De quan és l'última mirada al banc segueix sortint a
             `diagnostic()`, que és on es va a mirar quan de debò importa. */
          (mostraFletxes
            ? '<button class="btn btn-fantasma btn-icona" data-salt="1" aria-label="Mes següent"' +
              (esActual ? ' disabled' : '') + '>' + ic('dreta', 'ic-p') + '</button>' : '') +
          /* El «+» de la capçalera NOMÉS on no hi ha el botó gros.
             A la pantalla del mes, «Apunta un moviment» ja és just a sota del
             balanç i a amplada sencera: tenir-hi a més una creueta petita a
             dalt que fa exactament el mateix no dona cap opció, només fa
             dubtar de si són dues coses diferents. A la resta de pantalles
             —els mesos, les estadístiques, la safata— el botó gros no hi és,
             i sense la creueta et quedaries sense manera d'apuntar res. */
          (periode === 'mes' ? '' :
            '<button class="btn btn-fantasma btn-icona" data-apunta="1" aria-label="Apunta un moviment">' +
              ic('mes', 'ic-p') + '</button>') +
          '<button class="btn btn-fantasma btn-icona" data-ajustos="1" aria-label="Ajustos">' +
            ic('ajust', 'ic-p') + '</button>' +
        '</div>' +
      '</header>';
    }

    function obrePeriode() {
      var cos = App.modal('Què vols veure', '<div class="tria-periode">' +
        PERIODES.map(function (p) {
          return '<button data-va="' + p[0] + '"' +
                 (p[0] === periode ? ' aria-current="true"' : '') + '>' + p[1] + '</button>';
        }).join('') +
        '<button data-va="recurrents"' + (periode === 'recurrents' ? ' aria-current="true"' : '') +
          '>Cada mes</button>' +
        '<button data-va="patrimoni"' + (periode === 'patrimoni' ? ' aria-current="true"' : '') +
          '>Patrimoni</button>' +
        '<hr><button data-avui="1">Anar al mes actual</button>' +
      '</div>');

      cos.querySelectorAll('[data-va]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.tancaModal();
          App.ves('finances', { mes: mes, periode: b.dataset.va });
        });
      });
      cos.querySelector('[data-avui]').addEventListener('click', function () {
        App.tancaModal();
        /* SEMPRE AL MES, I NO AL PERÍODE ON ERES.
           Abans es conservava el període: si el premies des de «Últims 12
           mesos», de «Patrimoni» o de «Cada mes» —que no tenen mes— no es
           veia passar res, i des de fora això és un botó que no va. El que
           diu l'etiqueta és «anar al mes actual», i això és el que ha de fer:
           el mes en curs, a la vista del mes. */
        App.ves('finances', { mes: null, periode: 'mes' });
      });
    }

    // ------------------------------------------------------------ vista mes

    function pintaMes(d) {
      dades = d; mes = d.mes;
      var esActual = d.mes === new Date().toISOString().slice(0, 7);

      arrel.innerHTML = capcalera(esActual) +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' + blocBalanc(d) + '</section>' +
          '<section class="nutri-apats">' + blocMoviments(d) + '</section>' +
          '<section class="nutri-tanca">' + blocCategories(d) + '</section>' +
        '</div>';

      lligaCapcalera();
      lligaMoviments();
    }

    function blocBalanc(d) {
      var positiu = d.balanc >= 0;
      return '<div class="fitxa" data-estat="' + (positiu ? 'deficit_assolit' : 'superavit') + '">' +
          '<div class="xifra-gran">' + eur(d.balanc, true) + '</div>' +
          '<p class="verdicte">' +
            (positiu ? 'Has estalviat ' + eur(d.balanc) + ' aquest mes.'
                     : 'Has gastat ' + eur(-d.balanc) + ' més del que has ingressat.') +
          '</p>' +
        '</div>' +

        '<div class="tres-xifres">' +
          xifra('Ingressos', eurNum(d.ingressos), '€') +
          xifra('Despeses', eurNum(d.despeses), '€') +
          xifra('Moviments', d.moviments.length, '') +
        '</div>' +

        (d.ritme
          ? '<p class="menut">Portes ' + eur(d.ritme.perDia) + ' al dia. ' +
            'Si segueixes així, el mes acabarà a <b class="num">' + eur(d.ritme.projeccio) + '</b>.</p>'
          : '') +

        (d.traspassos
          ? '<p class="menut">' + eur(d.traspassos) + ' en traspassos, fora dels comptes.</p>'
          : '') +

        (d.perClassificar
          ? '<button class="btn btn-secundari" data-revisar="1" style="width:100%;margin-top:var(--e3)">' +
            ic('llapis') + d.perClassificar + ' per classificar</button>'
          : '') +

        '<button class="btn btn-primari" data-apunta="1" style="width:100%;margin-top:var(--e4)">' +
          ic('mes') + 'Apunta un moviment</button>';
    }

    function xifra(etiqueta, valor, unitat) {
      return '<div class="xifra"><span class="marge">' + esc(etiqueta) + '</span>' +
             '<b class="num">' + esc(String(valor)) +
             (unitat ? '<span class="u">' + esc(unitat) + '</span>' : '') + '</b></div>';
    }

    /** Els moviments agrupats per dia, amb el subtotal del dia. */
    function blocMoviments(d) {
      if (!d.moviments.length) {
        return '<p class="marge">Moviments</p>' +
               '<p class="menut">Cap moviment aquest mes.</p>';
      }

      var perDia = {}, ordre = [];
      d.moviments.forEach(function (m) {
        if (!perDia[m.data]) { perDia[m.data] = []; ordre.push(m.data); }
        perDia[m.data].push(m);
      });

      return '<p class="marge">Moviments</p>' +
        ordre.map(function (dia) {
          var llista = perDia[dia];
          var subtotal = llista.reduce(function (s, m) {
            return s + (m.tipus === 'i' ? m.import : -m.import);
          }, 0);

          return '<div class="apat">' +
            '<div class="apat-cap">' +
              '<h2>' + esc(fmt.relativa(dia)) + '</h2>' +
              '<span class="num menut">' + eur(subtotal, true) + '</span>' +
            '</div>' +
            '<div class="apat-items">' +
              llista.map(function (m) {
                return '<div class="ingesta">' +
                  '<div style="flex:1;min-width:0">' +
                    '<div class="nm">' + esc(m.emoji ? m.emoji + ' ' : '') + esc(m.descripcio) + '</div>' +
                    '<div class="menut">' + esc(m.categoriaNom) +
                      (m.pendent ? ' · pendent' : '') +
                      (!m.revisat ? ' · per revisar' : '') + '</div>' +
                  '</div>' +
                  '<div class="num" data-costat="' + (m.tipus === 'i' ? 'deficit' : '') + '"' +
                    ' style="text-align:right;font-weight:700">' +
                    (m.tipus === 'i' ? '+' : '−') + eur(m.import) +
                  '</div>' +
                  '<button class="btn btn-fantasma btn-icona" data-edita="' + esc(m.id) +
                    '" aria-label="Edita">' + ic('llapis', 'ic-p') + '</button>' +
                '</div>';
              }).join('') +
            '</div>' +
          '</div>';
        }).join('');
    }

    /**
     * On van els diners, i quant en tens de marge.
     *
     * La barra mesura contra el PRESSUPOST quan n'hi ha, i contra la
     * categoria més grossa quan no. Són dues preguntes diferents —«quant
     * m'he passat» i «on va més»— i cadascuna vol la seva referència.
     */
    function blocCategories(d) {
      if (!d.perCategoria.length) return '';
      var max = d.perCategoria[0].total || 1;
      var lim = {};
      (d.pressupostos || []).forEach(function (b) { lim[b.categoria] = b.limit; });

      return '<p class="marge">On van els diners</p>' +
        '<p class="menut">Toca una categoria per posar-hi un límit mensual.</p>' +
        '<div class="cats">' +
          d.perCategoria.map(function (c) {
            var l = lim[c.id] || 0;
            var pct = l ? Math.min(c.total / l * 100, 100) : (c.total / max * 100);
            var passat = l && c.total > l;
            return '<button class="cat-fila" data-cat="' + esc(c.id) + '"' +
              ' data-nom="' + esc(c.nom) + '" data-limit="' + l + '"' +
              ' aria-label="' + esc(c.nom) + ': ' + eur(c.total) +
                (l ? ' de ' + eur(l) : '') + '">' +
              '<span class="cat-nom">' + esc(c.emoji ? c.emoji + ' ' : '') + esc(c.nom) + '</span>' +
              '<span class="cat-via"' + (l ? ' data-limit="1"' : '') + '>' +
                '<i style="width:' + pct.toFixed(1) + '%"' +
                  (passat ? ' data-passat="1"' : '') + '></i></span>' +
              '<span class="cat-xifra num">' + eur(c.total) +
                (l ? '<small' + (passat ? ' data-costat="superavit"' : '') + '>de ' + eur(l) + '</small>' : '') +
              '</span>' +
            '</button>';
          }).join('') +
        '</div>';
    }

    /** El límit mensual d'una categoria. Buit o zero vol dir «sense límit». */
    function obrePressupost(idCat, nom, actual) {
      var cos = App.modal('Límit de ' + nom,
        '<div class="form-ajustos">' +
          '<p class="menut">Quant vols gastar-hi com a màxim cada mes. Deixa-ho ' +
            'buit per treure el límit.</p>' +
          '<label><span class="marge">Límit mensual (€)</span>' +
            '<input data-limit inputmode="decimal" class="num camp-import" value="' +
              (actual ? String(actual).replace('.', ',') : '') + '" autocomplete="off"></label>' +
          '<button class="btn btn-primari" data-desa-limit>Desa</button>' +
        '</div>');

      cos.querySelector('[data-desa-limit]').addEventListener('click', function () {
        var b = this;
        b.disabled = true;
        escriu('finances', 'pressupost', { categoria: idCat, limit: num(cos.querySelector('[data-limit]').value) }, quePinto())
          .then(function (r) {
            App.tancaModal();
            App.brindis('Límit desat');
            Cau.oblida('finances.');
            aplica(r);
          })
          .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });
    }

    // --------------------------------------------------------- mesos i estad

    function pintaMesos(d) {
      var max = 1;
      d.mesos.forEach(function (m) { max = Math.max(max, m.ingressos, m.despeses); });

      arrel.innerHTML = capcalera(true) +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' +
            '<div class="tres-xifres">' +
              xifra('Acumulat', eurNum(d.acumulat, true), '€') +
              xifra('Mesos', d.mesos.length, '') +
              xifra('En positiu', d.mesos.filter(function (m) { return m.balanc >= 0; }).length, '') +
            '</div>' +
          '</section>' +
          '<section class="nutri-apats">' +
            '<p class="marge">Ingressos i despeses, mes a mes</p>' +
            '<div class="mesos">' +
              d.mesos.map(function (m) {
                return '<button class="mes-fila" data-mes="' + esc(m.mes) + '">' +
                  '<span class="mes-nom">' + esc(m.mes.slice(5) + '/' + m.mes.slice(2, 4)) + '</span>' +
                  '<span class="mes-barres">' +
                    '<i data-mena="i" style="width:' + (m.ingressos / max * 100).toFixed(1) + '%"></i>' +
                    '<i data-mena="d" style="width:' + (m.despeses / max * 100).toFixed(1) + '%"></i>' +
                  '</span>' +
                  '<span class="mes-xifra num" data-costat="' + (m.balanc >= 0 ? 'deficit' : 'superavit') + '">' +
                    eur(m.balanc, true) + '</span>' +
                '</button>';
              }).join('') +
            '</div>' +
            '<p class="menut">Toca un mes per obrir-lo.</p>' +
          '</section>' +
        '</div>';

      lligaCapcalera();
      arrel.querySelectorAll('[data-mes]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.ves('finances', { mes: b.dataset.mes, periode: 'mes' });
        });
      });
    }

    function pintaEstad(d) {
      mes = d.mes;
      var maxMet = d.perMetode.length ? d.perMetode[0].total : 1;

      arrel.innerHTML = capcalera(d.mes === new Date().toISOString().slice(0, 7)) +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' +
            '<div class="tres-xifres">' +
              xifra('Despeses', eurNum(d.despeses), '€') +
              xifra('Anterior', eurNum(d.despesesAnterior), '€') +
              xifra('Diferència', eurNum(d.diferencia, true), '€') +
            '</div>' +
          '</section>' +

          '<section class="nutri-apats">' +
            '<p class="marge">Per categoria, contra el mes passat</p>' +
            '<div class="cats">' +
              (d.perCategoria.length
                ? d.perCategoria.map(function (c) {
                    var puja = c.diferencia > 0;
                    return '<div class="cat-fila" style="cursor:default">' +
                      '<span class="cat-nom">' + esc(c.emoji ? c.emoji + ' ' : '') + esc(c.nom) + '</span>' +
                      '<span class="cat-via"><i style="width:' + c.pct.toFixed(1) + '%"></i></span>' +
                      '<span class="cat-xifra num">' + eur(c.total) +
                        (c.anterior ? '<small data-costat="' + (puja ? 'superavit' : 'deficit') + '">' +
                          eur(c.diferencia, true) + '</small>' : '') +
                      '</span>' +
                    '</div>';
                  }).join('')
                : '<p class="menut">Cap despesa aquest mes.</p>') +
            '</div>' +

            (d.perMetode.length
              ? '<p class="marge" style="margin-top:var(--e5)">Com has pagat</p>' +
                '<div class="cats">' +
                  d.perMetode.map(function (m) {
                    return '<div class="cat-fila" style="cursor:default">' +
                      '<span class="cat-nom">' + esc(m.metode) + '</span>' +
                      '<span class="cat-via"><i style="width:' +
                        (m.total / maxMet * 100).toFixed(1) + '%"></i></span>' +
                      '<span class="cat-xifra num">' + eur(m.total) + '</span>' +
                    '</div>';
                  }).join('') +
                '</div>'
              : '') +

            (d.majors.length
              ? '<p class="marge" style="margin-top:var(--e5)">Les cinc més grosses</p>' +
                '<div class="apat"><div class="apat-items">' +
                  d.majors.map(function (m) {
                    return '<div class="ingesta">' +
                      '<div style="flex:1;min-width:0">' +
                        '<div class="nm">' + esc(m.descripcio) + '</div>' +
                        '<div class="menut">' + esc(fmt.relativa(m.data)) + ' · ' + esc(m.categoriaNom) + '</div>' +
                      '</div>' +
                      '<div class="num" style="font-weight:700">' + eur(m.import) + '</div>' +
                    '</div>';
                  }).join('') +
                '</div></div>'
              : '') +
          '</section>' +
        '</div>';

      lligaCapcalera();
    }

    // --------------------------------------------------------------- patrimoni

    /* «De quan» és tan important com «quant»: un valor de Trade Republic de fa
       dos mesos no és el teu capital, és el que era. Per això cada actiu diu
       quants dies fa del seu últim valor, i els que fa temps que no toques es
       marquen. El compte del banc s'actualitza sol; la resta només ho saps tu. */
    function pintaPatrimoni(d) {
      var actius = d.actius || [];

      arrel.innerHTML = capcalera(false) +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' +
            '<div class="fitxa">' +
              '<div class="xifra-gran">' + eurNum(d.total) + '<span class="u">€</span></div>' +
              '<p class="verdicte">Suma dels últims valors coneguts de cada actiu.</p>' +
            '</div>' +
            '<button class="btn btn-secundari" data-nou-actiu style="width:100%">' +
              ic('mes') + 'Afegeix un actiu</button>' +
          '</section>' +

          '<section class="nutri-apats">' +
            (actius.length
              ? '<div class="cats">' + actius.map(function (a) {
                  var vell = a.dies === null || a.dies >= 30;
                  return '<button class="act-fila" data-actiu="' + esc(a.id) + '"' +
                    ' data-nom="' + esc(a.nom) + '" data-auto="' + (a.automatic ? '1' : '0') + '">' +
                    '<span class="rec-cos">' +
                      '<b>' + esc(a.nom) + '</b>' +
                      '<span class="menut"' + (vell ? ' data-vell="1"' : '') + '>' +
                        (a.automatic ? 'del banc · ' : '') +
                        (a.data === null ? 'encara sense valor'
                          : a.dies === 0 ? 'avui'
                          : 'fa ' + a.dies + (a.dies === 1 ? ' dia' : ' dies')) +
                      '</span>' +
                    '</span>' +
                    (a.historic.length > 1 ? espurna(a.historic) : '') +
                    '<span class="rec-import num">' +
                      (a.valor === null ? '—' : eur(a.valor)) + '</span>' +
                  '</button>';
                }).join('') + '</div>'
              : '<p class="menut">Encara no hi tens res. El compte del banc hi apareixerà sol ' +
                'quan sincronitzi.</p>') +
          '</section>' +
        '</div>';

      lligaCapcalera();
      arrel.querySelector('[data-nou-actiu]').addEventListener('click', function () { obreActiu(null); });
      arrel.querySelectorAll('[data-actiu]').forEach(function (b) {
        b.addEventListener('click', function () {
          var a = null;
          for (var i = 0; i < actius.length; i++) if (actius[i].id === b.dataset.actiu) a = actius[i];
          if (a) obreActiu(a);
        });
      });
    }

    /** Una línia amb la forma dels últims valors. Diu si puja o baixa d'un cop d'ull. */
    function espurna(hist) {
      var vals = hist.map(function (h) { return h.valor; });
      var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
      var rang = max - min || 1;
      var punts = vals.map(function (v, i) {
        return (i / (vals.length - 1) * 100).toFixed(1) + ',' +
               (26 - (v - min) / rang * 22).toFixed(1);
      }).join(' ');
      var puja = vals[vals.length - 1] >= vals[0];
      return '<svg class="espurna" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">' +
             '<polyline points="' + punts + '" data-puja="' + (puja ? '1' : '0') + '"/></svg>';
    }

    function obreActiu(a) {
      var editant = !!a;
      var auto = editant && a.automatic;

      var cos = App.modal(editant ? a.nom : 'Nou actiu',
        '<div class="form-ajustos form-apunt">' +
          (editant
            ? '<label><span class="marge">Quant val ara</span>' +
                '<input data-valor inputmode="decimal" class="num camp-import" placeholder="0,00" value="' +
                  (a.valor === null ? '' : String(a.valor).replace('.', ',')) + '" autocomplete="off"></label>' +
              '<button class="btn btn-primari" data-anota>Anota el valor d\'avui</button>' +
              (auto
                ? '<p class="menut" style="margin-top:var(--e3)">Aquest el porta el banc i ' +
                  's\'actualitza sol cada matinada. Pots canviar-li el nom, però no el treguis: ' +
                  'el banc en crearia un de nou al costat.</p>'
                : '') +
              '<hr>'
            : '') +
          '<label><span class="marge">Nom</span>' +
            '<input data-nom autocomplete="off" placeholder="p. ex. Trade Republic" value="' +
              (editant ? esc(a.nom) : '') + '"></label>' +
          '<label><span class="marge">Tipus</span>' +
            '<input data-tipus autocomplete="off" placeholder="estalvi, borsa, cripto…" value="' +
              (editant ? esc(a.tipus || '') : '') + '"></label>' +
          '<button class="btn btn-secundari" data-desa-actiu>' + (editant ? 'Desa el nom' : 'Crea') + '</button>' +
          (editant && !auto
            ? '<button class="btn btn-secundari" data-treu-actiu style="margin-top:var(--e2)">Treu-lo</button>' : '') +
        '</div>');

      var ba = cos.querySelector('[data-anota]');
      if (ba) ba.addEventListener('click', function () {
        var v = cos.querySelector('[data-valor]').value;
        if (!String(v).trim()) { App.brindis('Posa-hi un valor', 'error'); return; }
        ba.disabled = true;
        escriu('finances', 'anotaValor', { id: a.id, valor: num(v) }, quePinto())
          .then(function (r) {
            App.tancaModal(); App.brindis('Valor anotat');
            Cau.oblida('finances.'); aplica(r);
          })
          .catch(function (err) { ba.disabled = false; App.brindis(err.message, 'error'); });
      });

      cos.querySelector('[data-desa-actiu]').addEventListener('click', function () {
        var nom = cos.querySelector('[data-nom]').value.trim();
        if (!nom) { App.brindis('Posa-hi un nom', 'error'); return; }
        var b = this;
        b.disabled = true;
        escriu('finances', 'desaActiu', {
          id: editant ? a.id : null, nom: nom,
          tipus: cos.querySelector('[data-tipus]').value.trim()
        }, quePinto()).then(function (r) {
          App.tancaModal(); App.brindis(editant ? 'Desat' : 'Creat');
          Cau.oblida('finances.'); aplica(r);
        }).catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });

      var bt = cos.querySelector('[data-treu-actiu]');
      if (bt) bt.addEventListener('click', function () {
        bt.disabled = true;
        escriu('finances', 'arxivaActiu', { id: a.id }, quePinto())
          .then(function (r) {
            App.tancaModal(); App.brindis('Tret');
            Cau.oblida('finances.'); aplica(r);
          })
          .catch(function (err) { bt.disabled = false; App.brindis(err.message, 'error'); });
      });
    }

    // -------------------------------------------------------------- recurrents

    /* El que passa cada mes sense que hi facis res: el lloguer, les
       subscripcions, la quota del gimnàs. Es creen sols de matinada el dia que
       toca, i el que veus aquí és la LLISTA del que passarà, no el que ja ha
       passat: això últim ja surt als moviments del mes com qualsevol altre. */
    function pintaRecurrents(d) {
      var llista = d.llista || [];
      var mesAra = new Date().toISOString().slice(0, 7);
      var totalD = llista.filter(function (r) { return r.actiu && r.tipus === 'd'; })
        .reduce(function (s, r) { return s + r.import; }, 0);
      var totalI = llista.filter(function (r) { return r.actiu && r.tipus === 'i'; })
        .reduce(function (s, r) { return s + r.import; }, 0);

      arrel.innerHTML = capcalera(false) +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' +
            '<div class="tres-xifres">' +
              xifra('Surten', eurNum(totalD), '€') +
              xifra('Entren', eurNum(totalI), '€') +
              xifra('Actius', llista.filter(function (r) { return r.actiu; }).length, '') +
            '</div>' +
            '<p class="menut">Es creen sols de matinada el dia que toca. Si el dia ' +
              'que hi poses ja ha passat aquest mes, el primer es crearà el mes que ve.</p>' +
            '<button class="btn btn-primari" data-nou-rec style="width:100%;margin-top:var(--e3)">' +
              ic('mes') + 'Afegeix-ne un</button>' +
          '</section>' +

          '<section class="nutri-apats">' +
            (llista.length
              ? '<div class="cats">' + llista.map(function (r) {
                  var fet = String(r.ultimMes) === mesAra;
                  return '<button class="rec-fila" data-rec="' + esc(r.id) + '"' +
                    (r.actiu ? '' : ' data-apagat="1"') + '>' +
                    '<span class="rec-dia">' + r.dia + '</span>' +
                    '<span class="rec-cos">' +
                      '<b>' + esc(r.descripcio) + '</b>' +
                      '<span class="menut">' + esc((r.emoji ? r.emoji + ' ' : '') + r.categoriaNom) +
                        ' · ' + esc(r.metode) +
                        (r.actiu ? (fet ? ' · fet aquest mes' : ' · pendent') : ' · aturat') +
                      '</span>' +
                    '</span>' +
                    '<span class="rec-import num" data-costat="' +
                      (r.tipus === 'i' ? 'deficit' : '') + '">' +
                      (r.tipus === 'i' ? '+' : '−') + eur(r.import) + '</span>' +
                  '</button>';
                }).join('') + '</div>'
              : '<p class="menut">Encara no en tens cap.</p>') +
          '</section>' +
        '</div>';

      lligaCapcalera();
      arrel.querySelector('[data-nou-rec]').addEventListener('click', function () { obreRecurrent(null); });
      arrel.querySelectorAll('[data-rec]').forEach(function (b) {
        b.addEventListener('click', function () {
          var r = null;
          for (var i = 0; i < llista.length; i++) if (llista[i].id === b.dataset.rec) r = llista[i];
          if (r) obreRecurrent(r);
        });
      });
    }

    function obreRecurrent(r) {
      var editant = !!r;
      var tipus = editant ? r.tipus : 'd';

      var cos = App.modal(editant ? 'Edita el recurrent' : 'Nou recurrent',
        '<div class="form-ajustos form-apunt">' +
          '<div class="tipus-tria" role="group">' +
            '<button data-tipus="d"' + (tipus === 'd' ? ' aria-pressed="true"' : '') + '>Surt</button>' +
            '<button data-tipus="i"' + (tipus === 'i' ? ' aria-pressed="true"' : '') + '>Entra</button>' +
          '</div>' +
          '<label><span class="marge">Import</span>' +
            '<input data-c="import" inputmode="decimal" class="num camp-import" placeholder="0,00" value="' +
              (editant ? String(r.import).replace('.', ',') : '') + '" autocomplete="off"></label>' +
          '<label><span class="marge">Què és</span>' +
            '<input data-c="descripcio" autocomplete="off" placeholder="p. ex. Lloguer" value="' +
              (editant ? esc(r.descripcio) : '') + '"></label>' +
          '<label><span class="marge">Categoria</span><select data-c="categoria"></select></label>' +
          '<label><span class="marge">Com es paga</span>' +
            '<select data-c="metode">' +
              ['domic', 'targeta', 'transf', 'efectiu', 'online'].map(function (x) {
                return '<option value="' + x + '"' +
                       (editant && r.metode === x ? ' selected' : '') + '>' + x + '</option>';
              }).join('') + '</select></label>' +
          '<label><span class="marge">Quin dia del mes</span>' +
            '<input data-c="dia" inputmode="numeric" class="num" value="' +
              (editant ? r.dia : 1) + '" autocomplete="off"></label>' +
          /* Fins al 28 i no fins al 31: així cau tots els mesos, també el
             febrer. Un rebut del dia 31 no existiria mig any. */
          '<p class="menut">Del 1 al 28. Més enllà no existeix tots els mesos.</p>' +
          (editant
            ? '<label class="cat-exclou"><input type="checkbox" data-c="actiu"' +
              (r.actiu ? ' checked' : '') + '><span>Actiu</span></label>' : '') +
          '<button class="btn btn-primari" data-desa-rec>' + (editant ? 'Desa' : 'Crea') + '</button>' +
          (editant ? '<button class="btn btn-secundari" data-treu-rec style="margin-top:var(--e2)">Treu-lo</button>' : '') +
        '</div>');

      var camps = {};
      cos.querySelectorAll('[data-c]').forEach(function (i) { camps[i.dataset.c] = i; });

      function pintaCategories() {
        camps.categoria.innerHTML = cats.filter(function (c) { return c.mena === tipus; })
          .map(function (c) {
            return '<option value="' + esc(c.id) + '"' +
                   (editant && r.categoria === c.id ? ' selected' : '') + '>' +
                   esc((c.emoji ? c.emoji + ' ' : '') + c.nom) + '</option>';
          }).join('');
      }
      pintaCategories();

      cos.querySelectorAll('[data-tipus]').forEach(function (b) {
        b.addEventListener('click', function () {
          tipus = b.dataset.tipus;
          cos.querySelectorAll('[data-tipus]').forEach(function (x) {
            x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
          });
          pintaCategories();
        });
      });

      cos.querySelector('[data-desa-rec]').addEventListener('click', function () {
        var imp = num(camps['import'].value);
        if (imp <= 0) { App.brindis('Posa-hi un import', 'error'); camps['import'].focus(); return; }
        if (!camps.descripcio.value.trim()) {
          App.brindis('Digues què és', 'error'); camps.descripcio.focus(); return;
        }
        var b = this;
        b.disabled = true;
        escriu('finances', 'desaRecurrent', {
          id: editant ? r.id : null,
          tipus: tipus, 'import': imp,
          descripcio: camps.descripcio.value.trim(),
          categoria: camps.categoria.value,
          metode: camps.metode.value,
          dia: num(camps.dia.value),
          actiu: camps.actiu ? camps.actiu.checked : true
        }, quePinto()).then(function (r) {
          App.tancaModal(); App.brindis(editant ? 'Desat' : 'Creat');
          Cau.oblida('finances.'); aplica(r);
        }).catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });

      var bt = cos.querySelector('[data-treu-rec]');
      if (bt) bt.addEventListener('click', function () {
        bt.disabled = true;
        escriu('finances', 'arxivaRecurrent', { id: r.id }, quePinto())
          .then(function (p) {
            App.tancaModal(); App.brindis('Tret');
            Cau.oblida('finances.'); aplica(p);
          })
          .catch(function (err) { bt.disabled = false; App.brindis(err.message, 'error'); });
      });
    }

    // ------------------------------------------------------ safata de revisió

    /* AGRUPADA PER COMERÇ, i això és tota la idea.
       Dotze compres a l'estanc són una sola decisió, no dotze. El que fa
       costa amunt revisar no és el nombre de moviments: és el nombre de
       vegades que t'han de preguntar. Un cop decidit, s'apren i no torna. */
    function pintaRevisar(d) {
      var cats = d.categories || [];

      function triador(valor, dades) {
        return '<select ' + dades + '>' +
          '<option value="">Tria…</option>' +
          cats.filter(function (c) { return c.mena === valor; }).map(function (c) {
            return '<option value="' + esc(c.id) + '">' +
                   esc((c.emoji ? c.emoji + ' ' : '') + c.nom) + '</option>';
          }).join('') +
        '</select>';
      }

      arrel.innerHTML = capcalera(false) +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' +
            '<div class="tres-xifres">' +
              xifra('Comerços', d.comercos.length, '') +
              xifra('Solts', d.solts.length, '') +
              xifra('Moviments', d.totalMoviments, '') +
            '</div>' +
            '<p class="menut">Cada comerç és una sola decisió: es queda apresa i ' +
              'no te\'n tornaré a preguntar mai més.</p>' +
          '</section>' +

          '<section class="nutri-apats">' +
            (d.comercos.length
              ? '<p class="marge">Comerços</p>' +
                '<div class="revisar">' +
                  d.comercos.map(function (g) {
                    return '<div class="rev-fila" data-clau="' + esc(g.clau) + '">' +
                      '<div class="rev-cap">' +
                        '<b>' + esc(g.mostra) + '</b>' +
                        '<span class="num menut">' + g.moviments + ' · ' + eur(g.total) + '</span>' +
                      '</div>' +
                      '<div class="menut">' + esc(fmt.relativa(g.primera)) +
                        (g.primera !== g.ultima ? ' → ' + esc(fmt.relativa(g.ultima)) : '') +
                        ' · ' + (g.tipus === 'i' ? 'ingrés' : 'despesa') + '</div>' +
                      triador(g.tipus, 'data-tria-grup') +
                    '</div>';
                  }).join('') +
                '</div>'
              : '<p class="menut">Cap comerç pendent. Ben fet.</p>') +

            (d.solts.length
              ? '<p class="marge" style="margin-top:var(--e5)">D\'un en un</p>' +
