      return '<p class="menut">Encara no hi ha prou dies per dibuixar res.</p>';
    }

    var W = 300, H = 90, marge = 4;
    var sostre = 1;
    punts.forEach(function (p) { if (p.valor > sostre) sostre = p.valor; });

    var pas = (W - marge * 2) / (punts.length - 1);
    var y = function (v) { return H - marge - (v / sostre) * (H - marge * 2); };
    var coords = punts.map(function (p, i) {
      return (marge + i * pas).toFixed(1) + ',' + y(p.valor).toFixed(1);
    });

    /* L'àrea de sota, fluixa: fa que la línia es llegeixi com un volum i no
       com un fil perdut enmig d'un rectangle buit. */
    var area = 'M' + marge + ',' + (H - marge) + ' L' + coords.join(' L') +
               ' L' + (marge + (punts.length - 1) * pas).toFixed(1) + ',' + (H - marge) + ' Z';

    var ultim = punts[punts.length - 1];
    var cx = marge + (punts.length - 1) * pas, cy = y(ultim.valor);

    /* La mitjana de la finestra, com a referència. Sense una ratlla al mig,
       un pic no es distingeix d'un nivell alt sostingut. */
    var suma = punts.reduce(function (a, p) { return a + p.valor; }, 0);
    var mitjana = suma / punts.length;
    var ym = y(mitjana);

    return '<svg class="corba-compt" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"' +
        ' role="img" aria-label="' + esc(c.nom + ': ' +
          (finestra === 'tot' ? 'total per mesos'
            : 'els últims ' + punts.length + ' dies') +
          '. Màxim ' + sostre + '. Mitjana ' + fmt.decimal(mitjana) + '.') + '">' +
        '<path class="corba-area" d="' + area + '"/>' +
        '<line class="corba-mitjana" x1="' + marge + '" y1="' + ym.toFixed(1) +
          '" x2="' + (W - marge) + '" y2="' + ym.toFixed(1) + '"/>' +
        '<polyline class="corba-linia" points="' + coords.join(' ') + '"/>' +
        '<circle class="corba-ultim" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="3.5"/>' +
      '</svg>';
  }

  
  /**
   * UN COMPTADOR DIBUIXAT: capçalera, tria de finestra, corba i peu.
   *
   * Viu aquí fora i no dins de la pantalla perquè el fan servir DOS llocs:
   * el full del mes i el visor, quan li demanes «ensenya'm la gràfica del
   * tabac». Dos dibuixos del mateix acabarien dient coses diferents el dia
   * que algú en toqués un.
   */
  function graf(c, finestra) {
    var TRIA = [['setmana', 'Setmana'], ['mes', 'Mes'], ['tot', 'Tot']];
    var punts = puntsDe(c, finestra);
    var suma = punts.reduce(function (a, p) { return a + p.valor; }, 0);
    var mitjana = punts.length ? suma / punts.length : 0;

    return '<div class="compt-graf" data-graf="' + esc(c.id) + '">' +
      '<div class="compt-graf-cap">' +
        '<p class="marge">' + esc(c.nom) + '</p>' +
        '<div class="compt-tria">' + TRIA.map(function (t) {
          return '<button data-finestra="' + t[0] + '"' +
                 (finestra === t[0] ? ' aria-pressed="true"' : '') + '>' +
                 t[1] + '</button>';
        }).join('') + '</div>' +
      '</div>' +
      corba(c, finestra) +
      '<div class="compt-graf-peu">' +
        '<span>' + esc(finestra === 'tot'
          ? fmt.decimal(mitjana) + ' al mes de mitjana'
          : fmt.decimal(mitjana) + ' al dia de mitjana') + '</span>' +
        '<span>' + esc(suma + ' en total') + '</span>' +
      '</div>' +
    '</div>';
  }

  return { graf: graf };
})();

/* ------------------------------------------------------------------------
   «ENSENYA'M LA GRÀFICA DEL TABAC»

   Una pregunta que es contesta amb un dibuix no s'ha de contestar amb text.
   Aquí es declara que aquesta pantalla en sap ensenyar un, i el nucli ja
   sap obrir-lo: no cal que sàpiga què és una corba.

   Es demana el full del mes al servidor, que és d'on surten els comptadors,
   però primer es mira el que hi ha desat al telèfon: si acabes de ser als
   hàbits, el plafó s'obre ple a l'instant.
   ------------------------------------------------------------------------ */
App.registraVisor('habits.comptador', {
  titol: function (p) { return p && p.nom ? p.nom : 'Comptador'; },

  render: function (arrel, params) {
    var finestra = Cau.get('habits.finestraCompt', 'mes');

    function pinta(mes) {
      var cs = (mes && mes.comptadors) || [];
      if (!cs.length) {
        arrel.innerHTML = '<p class="menut">Aquí no hi ha cap comptador per ensenyar.</p>';
        return;
      }
      /* El que demani, i si no en diu cap, el primer: amb un sol comptador
         —que és el cas— demanar-li quin vol seria fer-li triar entre un. */
      var com = function (t) { return String(t || '').toLowerCase().trim(); };
      var c = cs.filter(function (x) {
        return params && (x.id === params.id ||
          (params.nom && com(x.nom).indexOf(com(params.nom)) !== -1));
      })[0] || cs[0];

      arrel.innerHTML = CorbaCompt.graf(c, finestra);

      arrel.querySelectorAll('[data-finestra]').forEach(function (b) {
        b.addEventListener('click', function () {
          finestra = b.dataset.finestra;
          Cau.set('habits.finestraCompt', finestra);
          pinta(mes);
        });
      });
    }

    /* ES DEMANA AMB COMPTADORS, i només es desa si en porten.
       `habits.mes` el comparteix amb la pantalla d'hàbits. Desar-hi una
       versió sense corbes feia que el gràfic del tabac aparegués i
       desaparegués: la pantalla pintava del desat i allà no hi havia
       comptadors, i tornava quan el servidor contestava. */
    var desat = Cau.get('habits.mes', null);
    if (desat && desat.comptadors) pinta(desat);
    else arrel.innerHTML = Comp.carregant(1);

    crida('habits', 'mes', { comptadors: true }).then(function (m) {
      if (m && m.comptadors) Cau.set('habits.mes', m);
      pinta(m);
    }).catch(function (err) {
      if (!desat) arrel.innerHTML = Comp.error(err, false);
    });
  }
});

App.registraVista('habits', {
  render: function (arrel, params) {

    var data = params.data || fmt.avui();
    var dades = null, mes = null;
    var ordenant = false;      // mode de reordenar: les fites no es marquen

    // ------------------------------------------------------------- pintura

    function pinta(d, dEnCau) {
      dades = d;
      var esAvui = d.data === fmt.avui();

      arrel.innerHTML =
        '<header class="capcalera"><div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa') + '</button>' +
          '<div class="selector-data" style="flex:1">' +
            '<button class="btn btn-secundari btn-icona" data-dia="-1" aria-label="Dia anterior">' +
              ic('esquerra') + '</button>' +
            '<button class="data" data-avui="1" style="background:none;border:0;min-height:var(--toc);padding:4px">' +
              '<span class="marge" style="display:block">' + esc(fmt.relativa(d.data)) + '</span>' +
              '<span style="font-size:1.0625rem;font-weight:700">' + esc(fmt.llarga(d.data)) + '</span>' +
            '</button>' +
            '<button class="btn btn-secundari btn-icona" data-dia="1" aria-label="Dia següent"' +
              (esAvui ? ' disabled' : '') + '>' + ic('dreta') + '</button>' +
          '</div>' +
        '</div></header>' +

        '<div class="pagina"><div class="dues-columnes">' +
          '<section id="col-avui"></section>' +
          '<section id="col-mes"></section>' +
        '</div></div>';

      pintaAvui(d, esAvui, dEnCau);
      pintaMes();
      lligaCapcalera();
    }

    function pintaAvui(d, esAvui, dEnCau) {
      var col = arrel.querySelector('#col-avui');

      if (!d.habits.length) {
        col.innerHTML =
          '<div class="estat">' + ic('mapa', 'ic-g') +
          '<h2>El full és en blanc</h2>' +
          '<p>Encara no hi ha cap hàbit. Amb un de sol ja té sentit obrir això cada dia.</p>' +
          '<button class="btn btn-primari" data-nou="1">' + ic('mes') + 'Dibuixa el primer</button></div>';
        lligaAvui();
        return;
      }

      var html = '<div class="terreny-cap">' +
          '<p class="marge">' +
            (esAvui ? 'Control del dia' : 'Registre retroactiu · ' + esc(fmt.llarga(d.data))) + '</p>' +
          '<button class="btn btn-fantasma btn-menut" data-ordena="1">' +
            (ordenant ? 'Fet' : 'Ordena') + '</button>' +
        '</div>' +
        (ordenant ? '<p class="menut">Mou-les amb les fletxes. Es desa sol.</p>' : '') +
        '<div class="terreny"' + (ordenant ? ' data-ordenant="1"' : '') + '>' +
          d.habits.map(franja).join('') + '</div>' +
        '<button class="btn btn-secundari btn-ple" data-nou="1" style="margin-top:var(--e3)">' +
        ic('mes') + 'Nou hàbit</button>';

      if (dEnCau) html += '<p class="menut" style="margin-top:var(--e3)">Última còpia desada al telèfon.</p>';
      col.innerHTML = html;
      lligaAvui();
    }

    /* UNA FITA DE LA GRAELLA.
       Un toc suma un, sempre, sigui quin sigui l'hàbit: 0 → 1 → 2 → fet, i el
       següent torna a zero per desfer-ho. Amb un de fet-o-no-fet això és
       exactament el que ja feia.

       Cap a dins: símbol i nom a dalt, i al peu el que ha passat avui a
       l'esquerra i la ratxa a la dreta. Res de corbes darrere del text. */
    function franja(h) {
      if (h.esComptador) return franjaComptador(h);

      var estat = !h.existiaEncara ? 'notoca'
                : h.complert ? 'fet'
                : !h.exigit ? 'notoca'
                : h.registrat ? 'nofet' : 'pendent';

      /* Al peu hi cap una cosa i mitja, o sigui que hi va NOMÉS la que et diu
         com estàs ara. El percentatge de trenta dies és per a la fitxa. */
      var sota = h.tipus === 'quantitat' ? (h.valor || 0) + '/' + h.objectiu
               : (!h.exigit && h.existiaEncara) ? 'avui no toca'
               : h.frequencia === 'x_per_setmana' ? h.aquestaSetmana + '/' + h.objectiuSetmanal + ' setm.'
               : '';

      /* Llegit en veu alta, el contingut de la fita sonaria «Rentar-se les
         dents1/23d». L'etiqueta ho diu amb paraules. */
      var diu = h.nom + ', ' +
        (!h.exigit && h.existiaEncara ? 'avui no toca'
         : h.complert ? 'fet'
         : h.tipus === 'quantitat' ? (h.valor || 0) + ' de ' + h.objectiu
         : 'per fer');

      return '<div class="franja-fila" data-h="' + esc(h.id) + '">' +
        '<button class="franja" data-suma="' + esc(h.id) + '" data-estat="' + estat + '"' +
          ' aria-label="' + esc(diu) + '"' +
          ' aria-pressed="' + (h.complert ? 'true' : 'false') + '">' +
          Relleu.marcaHabit(h.nom) +
          '<span class="franja-nom">' + esc(h.nom) + '</span>' +
          '<span class="franja-peu">' +
            '<span class="franja-sota">' + esc(sota) + '</span>' +
            (h.complert
              ? '<svg class="punxo" aria-hidden="true"><use href="#ic-punxo"/></svg>'
              : (h.ratxa > 0
                  ? '<span class="franja-cota"><span class="n">' + h.ratxa + '</span>' +
                    '<span class="u">' + (h.unitatRatxa === 'setmanes' ? 'st' : 'd') + '</span></span>'
                  : '')) +
          '</span>' +
        '</button>' +
        botoDetall(h) +
      '</div>';
    }

    /**
     * UN COMPTADOR NO ES JUTJA: ES COMPTA.
     *
     * Ni ratxa, ni percentatge, ni el punxó de fet: aquí no hi ha «fet» ni «no
     * fet», hi ha més i menys.
     *
     * El que sí que hi ha, i abans era a la fitxa —on s'havia d'anar a
     * obrir—, són els catorze últims dies i el canvi respecte la setmana
     * passada. Comptar sense veure cap on vas és fer clics.
     *
     * Porta botó de restar perquè és l'únic que no es pot desfer sol: si en un
     * hàbit normal et passes de tocs, el següent torna a zero; aquí no es pot
     * tornar a zero sense perdre el compte del dia.
     */
    /* LA TARGETA ENSENYA LA XIFRA I PROU.
       Hi va haver una tira de barres dels últims catorze dies i el canvi
       respecte la setmana passada, aquí mateix. Fora: amb la corba a la
       mateixa pantalla, eren tres maneres de dir el mateix a dos dits de
       distància, i tres lectures d'una sola cosa és soroll per bones que
       siguin cadascuna. La xifra diu on ets; la corba, cap on vas. */
    function franjaComptador(h) {
      var n = h.valor || 0;
      return '<div class="franja-fila" data-h="' + esc(h.id) + '" data-comptador="1">' +
        '<button class="franja" data-suma="' + esc(h.id) + '" data-estat="compta"' +
          ' aria-label="Suma un a ' + esc(h.nom) + '. En portes ' + n + '.">' +
          Relleu.marcaHabit(h.nom) +
          '<span class="franja-nom">' + esc(h.nom) + '</span>' +
          /* Sense la unitat: el nom de la fita ja diu què compta, i
             «cigarros» retallat a «ciga» no és informació, és brossa. */
          '<span class="franja-peu">' +
            '<span class="compt-xifra"><span class="n">' + n + '</span></span>' +
          '</span>' +
        '</button>' +
        (ordenant ? '' :
          '<button class="franja-menys" data-resta="' + esc(h.id) + '"' +
            (n > 0 ? '' : ' disabled') + ' aria-label="Treu-ne un de ' + esc(h.nom) + '">' +
            ic('menys') + '</button>') +
        botoDetall(h) +
      '</div>';
    }

    /* Ordenant, el peu de la fita és una barra per moure-la i no s'obre res.
       Barra sencera i no dues cantonades: dos quadrats surant a sobre del nom
       el tapaven, i a més eren dos objectius petits allà on el que fas és
       justament repetir el toc uns quants cops. */
    function botoDetall(h) {
      if (ordenant) {
        return '<div class="mou-barra">' +
          '<button class="mou" data-cap="abans" data-mou="' + esc(h.id) + '"' +
            ' aria-label="Mou «' + esc(h.nom) + '» cap endavant">' + ic('esquerra') + '</button>' +
          '<button class="mou" data-cap="despres" data-mou="' + esc(h.id) + '"' +
            ' aria-label="Mou «' + esc(h.nom) + '» cap endarrere">' + ic('dreta') + '</button>' +
        '</div>';
      }
      return '<button class="franja-detall" data-detall="' + esc(h.id) + '"' +
             ' aria-label="Històric de ' + esc(h.nom) + '">' + ic('llegenda') + '</button>';
    }

    // ------------------------------------------------------ el full de mes


    /* ==================================================================
       LA CORBA DELS COMPTADORS

       Ocupa el lloc que tenia la llegenda, i és un canvi de criteri: la
       llegenda explicava com llegir la graella —una cosa que s'aprèn el primer
       dia i després sobra cada dia— i això diu com va el que estàs mirant de
       deixar.

       Línia i no barres: aquí el que importa és el pendent, si puja o baixa, i
       una línia el diu d'un cop d'ull. És l'únic dibuix de la pantalla: la
       targeta diu la xifra d'avui i prou, i aquí es veu cap on va.

       Tres finestres, i cadascuna respon una pregunta diferent:
         setmana  — com he anat aquests dies
         mes      — quin és el meu nivell normal
         tot      — de debò estic deixant-ho?
       La de «tot» va per mesos: tres anys de dies no caben en un dibuix de
       dos-cents píxels i tampoc es llegirien.
       ================================================================== */

    var finestraCompt = Cau.get('habits.finestraCompt', 'mes');

    /* Els comptadors del full de mes. El dibuix no es fa aquí: el fa
       `CorbaCompt`, que és el mateix que fa servir el visor quan li demanes
       «ensenya'm la gràfica del tabac». Dos dibuixos del mateix acabarien
       dient coses diferents el dia que algú en toqués un. */
    function blocComptadors() {
      var cs = (mes && mes.comptadors) || [];
      if (!cs.length) return '';
      return '<div class="compt-bloc">' + cs.map(function (c) {
        return CorbaCompt.graf(c, finestraCompt);
      }).join('') + '</div>';
    }

    function pintaMes() {
      var col = arrel.querySelector('#col-mes');
      if (!col) return;

      if (!mes) { col.innerHTML = '<div class="esquelet" style="height:260px"></div>'; return; }
      if (!mes.habits.length) { col.innerHTML = ''; return; }

      var caps = mes.calendari.map(function (d) {
        var n = fmt.diaNumero(d);
        return '<th scope="col">' + (n % 5 === 0 || n === 1 ? n : '') + '</th>';
      }).join('');

      /* Amb el dit, una casella de 30 dies fa 13px d'ample: impossible de tocar
         amb precisió i molt per sota dels 44px. Amb ratolí sí que és precisa.
         Per tant: amb ratolí les caselles es poden clicar; amb el dit el full
         de mes és per llegir, i el registre retroactiu va per les fletxes de
         dia o pel calendari de la fitxa, que sí que té caselles grosses. */
      var ratoli = !!(window.matchMedia && matchMedia('(pointer: fine)').matches);

      var files = mes.habits.map(function (h) {
        return '<tr><th scope="row" title="' + esc(h.nom) + '">' + esc(h.nom) + '</th>' +
          h.celles.map(function (c) {
            return '<td class="cella" data-e="' + c.estat + '"' +
              (c.data === mes.avui ? ' data-avui="1"' : '') + '>' +
              (ratoli && c.estat !== 'futur' ?
                '<button data-cella="' + esc(h.id) + '|' + esc(c.data) + '" ' +
                'aria-label="' + esc(h.nom + ', ' + fmt.llarga(c.data)) + '"></button>' : '') +
            '</td>';
          }).join('') + '</tr>';
      }).join('');

      col.innerHTML =
        '<p class="marge" style="margin:0 0 var(--e2)">Full de mes · ' + mes.calendari.length + ' dies · ' +
          esc(fmt.relativa(mes.desde)) + ' → ' + esc(fmt.relativa(mes.fins)) + '</p>' +
        '<div class="full-mes"><div id="reixa-cont" style="position:relative">' +
          '<table class="reixa"><thead><tr><th></th>' + caps + '</tr></thead>' +
          '<tbody>' + files + '</tbody></table>' +
          '<div id="capa-relleu" style="position:absolute;pointer-events:none"></div>' +
        '</div></div>' +

        blocComptadors();

      dibuixaRelleu();
      arrel.querySelectorAll('[data-finestra]').forEach(function (b) {
        b.addEventListener('click', function () {
          finestraCompt = b.dataset.finestra;
          Cau.set('habits.finestraCompt', finestraCompt);
          pintaMes();
        });
      });

      arrel.querySelectorAll('[data-cella]').forEach(function (b) {
        b.addEventListener('click', function () {
          var p = b.dataset.cella.split('|');
          marcaDia(p[0], p[1]);
        });
      });
    }

    /** Superposa les corbes exactament sobre l'àrea de cel·les, no sobre tot el bloc. */
    function dibuixaRelleu() {
      var cont = arrel.querySelector('#reixa-cont');
      var capa = arrel.querySelector('#capa-relleu');
      if (!cont || !capa || !mes || !mes.habits.length) return;

      var celles = cont.querySelectorAll('td.cella');
      if (!celles.length) return;

      var r0 = celles[0].getBoundingClientRect();
      var rN = celles[celles.length - 1].getBoundingClientRect();
      var rc = cont.getBoundingClientRect();
      var x = r0.left - rc.left, y = r0.top - rc.top;
      var w = rN.right - r0.left, h = rN.bottom - r0.top;
      if (w <= 0 || h <= 0) return;

      capa.style.left = x + 'px'; capa.style.top = y + 'px';
      capa.style.width = w + 'px'; capa.style.height = h + 'px';

      var matriu = mes.habits.map(function (hb) {
        return hb.celles.map(function (c) { return c.altitud; });
      });
      capa.innerHTML = Relleu.fullMes(matriu, Math.round(w), Math.round(h));
    }

    // ------------------------------------------------------------- accions

    function lligaCapcalera() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-dia]').forEach(function (b) {
        b.addEventListener('click', function () {
          var nova = fmt.suma(data, Number(b.dataset.dia));
          if (nova > fmt.avui()) return;
          App.ves('habits', { data: nova });
        });
      });
      var ba = arrel.querySelector('[data-avui]');
      if (ba) ba.addEventListener('click', function () { App.ves('habits', { data: fmt.avui() }); });
    }

    function lligaAvui() {
      arrel.querySelectorAll('.franja-fila').forEach(lligaFranja);
      arrel.querySelectorAll('[data-nou]').forEach(function (b) {
        b.addEventListener('click', function () { formulari(null); });
      });
      var bo = arrel.querySelector('[data-ordena]');
      if (bo) bo.addEventListener('click', function () {
        ordenant = !ordenant;
        pintaAvui(dades, dades.data === fmt.avui(), false);
      });
    }

    /**
     * MOURE UNA FITA DE LLOC.
     *
     * Es mou primer a la pantalla i es desa després, com tot el que es toca
     * aquí: si haguessis d'esperar el servidor entre fletxa i fletxa, moure'n
     * una tres llocs serien cinc segons.
     */
    function mou(id, cap) {
      var l = dades.habits;
      var i = -1;
      for (var k = 0; k < l.length; k++) if (l[k].id === id) i = k;
      var j = i + (cap === 'abans' ? -1 : 1);
      if (i < 0 || j < 0 || j >= l.length) return;

      var t = l[i]; l[i] = l[j]; l[j] = t;
      Cau.set('habits.' + data, dades);
      pintaAvui(dades, dades.data === fmt.avui(), false);
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }

      // El focus torna al botó que has premut: si no, cada fletxa et deixa
      // el teclat penjat i has de tornar a buscar la fita.
      var seguent = arrel.querySelector('.franja-fila[data-h="' + id + '"] [data-cap="' + cap + '"]');
      if (seguent) { try { seguent.focus(); } catch (e) {} }

      if (espera.__ordre) clearTimeout(espera.__ordre);
      espera.__ordre = setTimeout(desaOrdre, 700);
    }

    function desaOrdre() {
      delete espera.__ordre;
      var ids = dades.habits.map(function (h) { return h.id; });
      enVol++;
      crida('habits', 'ordena', { ids: ids, data: data })
        .then(function (d) { enVol--; posaAlDia(d); })
        .catch(function (err) {
          enVol--;
          App.brindis(err.message, 'error');
          carrega();
        });
    }

    /* Per franja i no per pàgina: quan se'n repinta una de sola, se li lliguen
       els botons a ella i prou. Passar-hi per sobre a totes hi afegiria un
       segon oient a les que ja en tenien, i llavors un toc en valdria dos. */
    function lligaFranja(fila) {
      var s = fila.querySelector('[data-suma]');
      if (s) s.addEventListener('click', function () { toca(s.dataset.suma, 1); });
      var r = fila.querySelector('[data-resta]');
      if (r) r.addEventListener('click', function () { toca(r.dataset.resta, -1); });
      var d = fila.querySelector('[data-detall]');
      if (d) d.addEventListener('click', function () { obreDetall(d.dataset.detall); });
      fila.querySelectorAll('[data-mou]').forEach(function (b) {
        b.addEventListener('click', function () { mou(b.dataset.mou, b.dataset.cap); });
      });
    }

    /* ------------------------------------------------------------------------
       TOCAR-NE DOS DE SEGUITS NO HA DE FER BALLAR RES

       Abans, cada resposta del servidor repintava la pantalla sencera. Si en
       tocaves un i, mentre allò tornava, en tocaves un altre, la resposta del
       primer arribava amb una foto del dia on el segon encara no hi era: te'l
       esborrava de la vista, i quan tornava el seu es tornava a pintar. D'aquí
       que «es bugueja fort, però acaba quedant bé».

       Ara passen dues coses. Una: el toc només repinta la seva pròpia franja,
       no la pàgina. I dues: la pantalla NO es refà fins que no queda cap toc
       per enviar ni cap resposta per arribar.

       A més, el desat espera sis dècimes. Encendre'n tres de seguits són tres
       tocs i UNA escriptura, no tres peticions creuant-se pel camí.
       ------------------------------------------------------------------------ */

    var espera = {};   // id -> temporitzador del desat que encara no ha sortit
    var enVol = 0;     // peticions enviades i sense resposta

    function habitPerId(id) {
      if (!dades) return null;
      for (var i = 0; i < dades.habits.length; i++) {
        if (dades.habits[i].id === id) return dades.habits[i];
      }
      return null;
    }

    /**
     * On va el comptador amb un toc més.
     * En un hàbit normal, arribat a l'objectiu el següent torna a zero: així
     * el mateix botó serveix per desfer-ho sense haver d'entrar enlloc.
     * Un comptador no dona la volta —no pots «desfumar»— i per això té resta.
     */
    function seguent(h, delta) {
      var v = Number(h.valor) || 0;
      if (delta < 0) return Math.max(0, v - 1);
      if (h.esComptador) return v + 1;
      var nou = v + 1;
      return nou > h.objectiu ? 0 : nou;
    }

    function toca(id, delta) {
      var h = habitPerId(id);
      if (!h) return;

      var nou = seguent(h, delta);
      if (nou === (Number(h.valor) || 0) && h.registrat) return;

      h.valor = nou;
      h.registrat = true;
      h.complert = h.esComptador ? false : nou >= h.objectiu;

      /* LA CORBA D'AVUI PUJA AMB EL TOC. El full del mes que torna de marcar
         no porta les corbes —costen noranta dies de full i el toc ha de ser
         instantani—, o sigui que les que hi ha desades es queden. Si no es
         mogués el punt d'avui, tocaries el botó, el número pujaria i el
         dibuix de sota diria una altra cosa. */
      if (h.esComptador && mes && mes.comptadors) {
        mes.comptadors.forEach(function (c) {
          if (c.id !== h.id || !c.dies || !c.dies.length) return;
          var ultim = c.dies[c.dies.length - 1];
          if (ultim && ultim.data === data) ultim.valor = nou;
        });
        pintaMes();
      }

      Cau.set('habits.' + data, dades);
      repintaFranja(h);
      if (navigator.vibrate) {
        try { navigator.vibrate(h.complert ? 14 : 6); } catch (e) {}
      }

      // La cua és la xarxa de seguretat: si no hi ha connexió, això s'envia sol.
      Cua.afegeix('habits', 'marca', { id: id, data: data, valor: nou }, 'marca:' + id + ':' + data);

      if (espera[id]) clearTimeout(espera[id]);
      espera[id] = setTimeout(function () { desaMarca(id, nou); }, 600);
    }

    function desaMarca(id, valor) {
      delete espera[id];
      var clau = 'marca:' + id + ':' + data;
      enVol++;

      crida('habits', 'marca', { id: id, data: data, valor: valor })
        .then(function (d) {
          enVol--;
          treuDeLaCua(clau);
          posaAlDia(d);
        })
        .catch(function (err) {
          enVol--;
          if (err.api) { treuDeLaCua(clau); App.brindis(err.message, 'error'); carrega(); }
        });
    }

    /** Refer la pantalla només quan ja no queda res en marxa. */
    function posaAlDia(d) {
      if (enVol || Object.keys(espera).length) return;
      if (!arrel.isConnected) return;
      dades = d;
      Cau.set('habits.' + data, d);
      /* Amb un tauler obert no es toca res: el que es veu a la franja ja és
         el bo, i la ratxa es posarà al dia la pròxima vegada que carregui. */
      if (App.interactuant()) return;
      /* El mes ve amb la mateixa resposta de marcar: abans es demanava a part i
         un toc valia dues anades al servidor.

         PERÒ AQUELL MES NO PORTA LES CORBES DELS COMPTADORS, i és a posta:
         calcular-les a cada toc són noranta dies de full per res, i els tocs
         són el que ha de ser instantani. El que no es podia fer és desar-lo
         a sobre del que sí que en tenia: el gràfic del tabac desapareixia en
         marcar qualsevol hàbit i tornava a sortir a la següent càrrega. Ara
         les corbes que ja teníem es queden, i la d'avui es puja aquí mateix
         perquè el dibuix no contradigui el número que acabes de tocar. */
      if (d.mes) {
        if (!d.mes.comptadors && mes && mes.comptadors) {
          d.mes.comptadors = mes.comptadors;
        }
        mes = d.mes;
        Cau.set('habits.mes', mes);
      }
      pinta(d, false);
      pintaMes();
    }

    /** Repintar UNA franja, no la pàgina. */
    function repintaFranja(h) {
      var fila = arrel.querySelector('.franja-fila[data-h="' + h.id + '"]');
      if (!fila || !fila.parentNode) return;
      var caixa = document.createElement('div');
      caixa.innerHTML = franja(h);
      var nova = caixa.firstElementChild;
      fila.parentNode.replaceChild(nova, fila);
      lligaFranja(nova);
    }

    function marcaDia(id, dia) {
      crida('habits', 'marca', { id: id, data: dia, valor: null })
        .then(function () { App.brindis(fmt.relativa(dia) + ' registrat'); carrega(); })
        .catch(function (err) { App.brindis(err.message, 'error'); });
    }

    function treuDeLaCua(clau) {
      Cau.set('cua', Cua.tot().filter(function (i) { return i.clau !== clau; }));
      App.pintaPendents();
    }

    // -------------------------------------------------------------- detall

    function obreDetall(id) {
      var cos = App.modal('Fitxa', '<div class="esquelet" style="height:180px"></div>');

      crida('habits', 'historic', { id: id, dies: 35 }).then(function (d) {
        var e = d.estadistiques, h = d.habit;
        var unitat = e.unitatRatxa === 'setmanes' ? 'setmanes' : 'dies';

        var esCompt = h.tipus === 'comptador';

        var html =
          '<div style="display:flex;align-items:center;gap:var(--e3);margin-bottom:var(--e4)">' +
            Relleu.marcaHabit(h.nom, 'ic-g') +
            '<h2 style="font-size:1.375rem">' + esc(h.nom) + '</h2>' +
          '</div>' +
          (esCompt
            /* Les xifres d'un comptador són unes altres. Un «40% de compliment»
               als cigarros no vol dir absolutament res. */
            ? '<div class="tira" style="margin-bottom:var(--e4)">' +
                xifra(e.avui, 'avui') +
                xifra(e.mitjana7 === null ? '—' : fmt.decimal(e.mitjana7), 'al dia · 7 d') +
                xifra(e.total30, 'en 30 dies') +
                xifra(e.maxim30, 'el pitjor dia') +
              '</div>' +
              (e.canvi7 === null || e.canvi7 === 0 ? ''
                : '<p class="menut" style="margin:calc(var(--e4) * -1) 0 var(--e4)">' +
                  esc(fmt.decimal(Math.abs(e.canvi7)) + ' al dia ' +
                      (e.canvi7 < 0 ? 'menys' : 'més') + ' que la setmana anterior' +
                      (e.mitjana7Previa === null ? '' :
                        ' (abans ' + fmt.decimal(e.mitjana7Previa) + ')')) + '</p>')
            : '<div class="tira" style="margin-bottom:var(--e4)">' +
                xifra(e.pct30 === null ? '—' : e.pct30 + '%', 'compliment 30 d') +
                xifra(e.pct7 === null ? '—' : e.pct7 + '%', 'compliment 7 d') +
                xifra(e.ratxa, 'ratxa · ' + unitat) +
                xifra(e.ratxaMax, 'màxima') +
              '</div>');

        if (h.tipus === 'quantitat' || esCompt) {
          html += '<div class="camp"><span class="marge">Valor exacte per a ' +
              esc(fmt.relativa(data).toLowerCase()) + '</span>' +
            '<div class="passos">' +
              '<button class="pas" data-suma="-1" aria-label="Resta">' + ic('menys') + '</button>' +
              '<input class="entrada" id="valor-exacte" type="number" inputmode="decimal" min="0" ' +
                'style="text-align:center;max-width:110px" value="' + esc(valorDe(d, data)) + '">' +
              '<button class="pas" data-suma="1" aria-label="Suma">' + ic('mes') + '</button>' +
              '<span class="menut">' + esc(h.unitat || '') + '</span>' +
            '</div>' +
            '<button class="btn btn-primari btn-ple" data-desa-valor="1" style="margin-top:var(--e3)">Desa</button>' +
          '</div>';
        }

        if (esCompt) {
          /* Un comptador no té dies «fets» i «no fets»: té dies amb més i dies
             amb menys. Una graella de caselles totes iguals no diria res; una
             barra per dia sí que ensenya cap on va, que és per al que el vols. */
          var sostre = 1;
          d.calendari.forEach(function (c) {
            var v = Number(c.valor) || 0;
            if (v > sostre) sostre = v;
          });
          html += '<p class="marge" style="margin-bottom:var(--e2)">Últims 35 dies</p>' +
            '<div class="barres" role="img" aria-label="' +
              esc('Evolució dels últims 35 dies. Màxim ' + sostre + ' en un dia.') + '">' +
              d.calendari.map(function (c) {
                var v = Number(c.valor) || 0;
                return '<span class="barra"' + (c.data === fmt.avui() ? ' data-avui="1"' : '') +
                       ' title="' + esc(fmt.llarga(c.data) + ': ' + v) + '">' +
                       '<i style="height:' + Math.round((v / sostre) * 100) + '%"></i></span>';
              }).join('') +
            '</div>' +
            '<p class="menut">Una barra per dia. La més alta són ' + sostre +
              (h.unitat ? ' ' + esc(h.unitat) : '') + '.</p>';
        } else {
        html += '<p class="marge" style="margin-bottom:var(--e2)">Últims 35 dies · toca un dia per registrar-lo</p>' +
          '<div class="calendari">' +
          d.calendari.map(function (c) {
            var est = !c.existia ? 'futur' : c.complert ? 'fet' : !c.exigit ? 'notoca'
                    : c.registrat ? 'nofet' : 'pendent';
            return '<button data-e="' + est + '"' + (c.data === fmt.avui() ? ' data-avui="1"' : '') +
                   ' data-dia-cal="' + esc(c.data) + '" aria-label="' + esc(fmt.llarga(c.data)) + '">' +
                   fmt.diaNumero(c.data) + '</button>';
          }).join('') + '</div>';
        }

        html +=

          '<div style="display:flex;gap:var(--e2);margin-top:var(--e4)">' +
            '<button class="btn btn-secundari" style="flex:1" data-edita="1">' + ic('llapis') + 'Edita</button>' +
            '<button class="btn btn-secundari" style="flex:1" data-arxiva="1">' + ic('arxiva') + 'Arxiva</button>' +
          '</div>';

        var cap = cos.querySelector('.modal-cap').outerHTML;
        cos.innerHTML = cap + html;
        cos.querySelector('[data-tanca]').addEventListener('click', App.tancaModal);

        cos.querySelectorAll('[data-dia-cal]').forEach(function (b) {
          b.addEventListener('click', function () {
            var dc = b.dataset.diaCal;
            if (dc > fmt.avui()) return;
            crida('habits', 'marca', { id: id, data: dc, valor: null }).then(function () {
              App.brindis(fmt.relativa(dc) + ' registrat');
              App.tancaModal(); carrega();
            }).catch(function (err) { App.brindis(err.message, 'error'); });
          });
        });

        var camp = cos.querySelector('#valor-exacte');
        if (camp) {
          cos.querySelectorAll('[data-suma]').forEach(function (b) {
            b.addEventListener('click', function () {
              camp.value = Math.max(0, (Number(camp.value) || 0) + Number(b.dataset.suma));
            });
          });
          cos.querySelector('[data-desa-valor]').addEventListener('click', function (ev) {
            ev.currentTarget.dataset.carregant = '1';
            crida('habits', 'marca', { id: id, data: data, valor: Number(camp.value) || 0 })
              .then(function (dd) { App.tancaModal(); posaAlDia(dd); App.brindis('Desat'); })
              .catch(function (err) { App.brindis(err.message, 'error'); });
          });
        }

        cos.querySelector('[data-edita]').addEventListener('click', function () {
          App.tancaModal(); setTimeout(function () { formulari(h); }, 220);
        });
        cos.querySelector('[data-arxiva]').addEventListener('click', function () { confirmaArxiu(h); });

      }).catch(function (err) {
        var cap = cos.querySelector('.modal-cap').outerHTML;
        cos.innerHTML = cap + Comp.error(err, false);
        cos.querySelector('[data-tanca]').addEventListener('click', App.tancaModal);
      });
    }

    function valorDe(d, dia) {
      for (var i = 0; i < d.calendari.length; i++) if (d.calendari[i].data === dia) return d.calendari[i].valor || 0;
      return 0;
    }
    function xifra(v, etiqueta) {
      return '<div><div class="xifra-gran">' + esc(v) + '</div><div class="menut">' + esc(etiqueta) + '</div></div>';
    }

    // ---------------------------------------------------------- formulari

    function formulari(h) {
      var esNou = !h;
      var dies = String((h && h.dies_setmana) || '').split(',');

      var html =
        '<label class="camp"><span class="marge">Nom</span>' +
          '<input class="entrada" id="f-nom" value="' + esc((h && h.nom) || '') + '" ' +
          'placeholder="Córrer, llegir, trucar a la mare…" autocomplete="off"></label>' +
        '<div class="camp"><span class="marge">Com el mesures</span><div class="opcions" id="f-tipus">' +
          opcio('si_no', 'Fet o no fet', (h ? h.tipus : 'si_no') === 'si_no') +
          opcio('quantitat', 'Uns quants cops', (h && h.tipus) === 'quantitat') +
          opcio('comptador', 'Només comptar', (h && h.tipus) === 'comptador') +
        '</div>' +
        '<p class="menut" id="f-explica">' + esc(explicaTipus((h && h.tipus) || 'si_no')) + '</p></div>' +

        '<div id="f-objectiu-camp" class="camp"' + ((h && h.tipus === 'quantitat') ? '' : ' hidden') + '>' +
          '<span class="marge">Quants cops al dia</span>' +
          '<input class="entrada" id="f-objectiu" type="number" min="1" inputmode="numeric" ' +
            'value="' + esc((h && h.objectiu) || 1) + '"></div>' +

        '<div id="f-unitat-camp" class="camp"' +
          ((h && (h.tipus === 'quantitat' || h.tipus === 'comptador')) ? '' : ' hidden') + '>' +
          '<span class="marge">Què compta</span>' +
          '<input class="entrada" id="f-unitat" placeholder="cigarros, km, min, pàg." ' +
            'value="' + esc((h && h.unitat) || '') + '"></div>' +

        '<div id="f-quan"' + ((h && h.tipus === 'comptador') ? ' hidden' : '') + '>' +
          '<div class="camp"><span class="marge">Quan toca</span><div class="opcions" id="f-freq">' +
            opcio('diaria', 'Cada dia', (h ? h.frequencia : 'diaria') === 'diaria') +
            opcio('dies_setmana', 'Dies concrets', (h && h.frequencia) === 'dies_setmana') +
            opcio('x_per_setmana', 'Cops per setmana', (h && h.frequencia) === 'x_per_setmana') +
          '</div></div>' +
          '<div id="f-dies" class="camp"' + ((h && h.frequencia === 'dies_setmana') ? '' : ' hidden') + '>' +
            '<span class="marge">Quins dies</span><div class="opcions" id="f-dies-opcions">' +
            ['dl', 'dt', 'dc', 'dj', 'dv', 'ds', 'dg'].map(function (n, i) {
              return opcio(String(i + 1), n, dies.indexOf(String(i + 1)) !== -1);
            }).join('') + '</div></div>' +
          '<div id="f-setmanal" class="camp"' + ((h && h.frequencia === 'x_per_setmana') ? '' : ' hidden') + '>' +
            '<span class="marge">Quants cops per setmana</span>' +
            '<input class="entrada" id="f-objectiu-setmanal" type="number" min="1" max="7" inputmode="numeric" ' +
              'value="' + esc((h && h.objectiu_setmanal) || 3) + '"></div>' +
        '</div>' +

        '<button class="btn btn-primari btn-ple" data-desa="1">' +
          (esNou ? 'Crea l\'hàbit' : 'Desa els canvis') + '</button>';

      var cos = App.modal(esNou ? 'Nou hàbit' : 'Edita l\'hàbit', html);

      grupExclusiu(cos, '#f-tipus', function (v) {
        cos.querySelector('#f-objectiu-camp').hidden = (v !== 'quantitat');
        cos.querySelector('#f-unitat-camp').hidden = (v !== 'quantitat' && v !== 'comptador');
        cos.querySelector('#f-quan').hidden = (v === 'comptador');
        cos.querySelector('#f-explica').textContent = explicaTipus(v);
      });
      grupExclusiu(cos, '#f-freq', function (v) {
        cos.querySelector('#f-dies').hidden = (v !== 'dies_setmana');
        cos.querySelector('#f-setmanal').hidden = (v !== 'x_per_setmana');
      });
      cos.querySelectorAll('#f-dies-opcions .opcio').forEach(function (b) {
        b.addEventListener('click', function () {
          b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
        });
      });

      cos.querySelector('[data-desa]').addEventListener('click', function (ev) {
        var boto = ev.currentTarget;
        var p = {
          nom: cos.querySelector('#f-nom').value,
          tipus: seleccionat(cos, '#f-tipus'),
          objectiu: cos.querySelector('#f-objectiu').value,
          unitat: cos.querySelector('#f-unitat').value,
          frequencia: seleccionat(cos, '#f-freq'),
          dies_setmana: Array.prototype.slice.call(
            cos.querySelectorAll('#f-dies-opcions .opcio[aria-pressed="true"]'))
            .map(function (b) { return b.dataset.valor; }).join(','),
          objectiu_setmanal: cos.querySelector('#f-objectiu-setmanal').value
        };
        if (!esNou) p.id = h.id;
        boto.dataset.carregant = '1';
        crida('habits', esNou ? 'crea' : 'edita', p)
          .then(function () { App.tancaModal(); App.brindis(esNou ? 'Hàbit creat' : 'Desat');
                              carrega(); })
          .catch(function (err) { boto.dataset.carregant = '0'; App.brindis(err.message, 'error'); });
      });
    }

    function confirmaArxiu(h) {
      App.tancaModal();
      setTimeout(function () {
        var cos = App.modal('Arxivar «' + h.nom + '»?',
          '<p class="menut" style="margin-bottom:var(--e4)">Desapareix de la llista diària. ' +
          '<strong>No s\'esborra res:</strong> tot l\'històric es conserva i el pots recuperar.</p>' +
          '<button class="btn btn-primari btn-ple" data-si="1">Sí, arxiva\'l</button>' +
          '<button class="btn btn-fantasma btn-ple" data-no="1" style="margin-top:var(--e2)">Cancel·la</button>');
        cos.querySelector('[data-no]').addEventListener('click', App.tancaModal);
        cos.querySelector('[data-si]').addEventListener('click', function (ev) {
          ev.currentTarget.dataset.carregant = '1';
          crida('habits', 'arxiva', { id: h.id })
            .then(function () { App.tancaModal(); App.brindis('Arxivat'); carrega(); })
            .catch(function (err) { App.brindis(err.message, 'error'); });
        });
      }, 220);
    }

    /* Dir-ho amb un exemple i no amb una definició: la diferència entre
       «quantitat» i «comptador» és què vols que et digui després, i això no
       s'endevina del nom. */
    function explicaTipus(v) {
      if (v === 'quantitat') return 'Un toc en suma un. En arribar al nombre, queda fet.';
      if (v === 'comptador') return 'Un toc en suma un, sense objectiu ni ratxa. ' +
                                   'Per veure quant en fas i cap on va.';
      return 'Un toc el marca fet. Un altre el desmarca.';
    }

    function opcio(valor, text, actiu) {
      return '<button type="button" class="opcio" data-valor="' + esc(valor) + '" aria-pressed="' +
             (actiu ? 'true' : 'false') + '">' + esc(text) + '</button>';
    }
    function grupExclusiu(cos, sel, alCanviar) {
      cos.querySelectorAll(sel + ' .opcio').forEach(function (b) {
        b.addEventListener('click', function () {
          cos.querySelectorAll(sel + ' .opcio').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          alCanviar(b.dataset.valor);
        });
      });
    }
    function seleccionat(cos, sel) {
      var b = cos.querySelector(sel + ' .opcio[aria-pressed="true"]');
      return b ? b.dataset.valor : null;
    }

    // -------------------------------------------------------------- càrrega

    /* UNA SOLA ANADA PER A LES DUES COSES.
       La fila del dia i el full del mes es veuen alhora i es demanaven per
       separat: dues anades per obrir la pantalla i dues més cada cop que en
       marcaves un. Totes dues llegeixen el mateix full del servidor. */
    function carrega() {
      crida('habits', 'pantalla', { data: data, dies: 30 })
        .then(function (r) {
          if (r.mes) { mes = r.mes; Cau.set('habits.mes', r.mes); }

          var d = r.dia;
          /* Si mentre això arribava has tocat res, el que mana és el que has
             tocat: aquesta foto ja és vella. Es descarta i prou. */
          if (enVol || Object.keys(espera).length) { pintaMes(); return; }
          Cau.set('habits.' + data, d);
          if (App.interactuant()) { dades = d; pintaMes(); return; }
          pinta(d, false);
          pintaMes();
        })
        .catch(function (err) {
          if (dades) { App.brindis('Sense connexió', 'error'); return; }
          arrel.innerHTML = Comp.error(err, true);
          var r = arrel.querySelector('[data-reintenta]');
          if (r) r.addEventListener('click', carrega);
        });
    }

    // Es queda pel nom: tot el que la cridava ara ja te el mes amb carrega.
    function carregaMes() { carrega(); }

    if (!App._relleuLligat) {
      App._relleuLligat = true;
      window.addEventListener('resize', function () {
        clearTimeout(App._relleuTemps);
        App._relleuTemps = setTimeout(function () {
          if (App.actual === 'habits') dibuixaRelleu();
        }, 160);
      });
    }

    /* LA CÒPIA DESADA S'HA DE MIRAR ABANS DE PINTAR-LA.
       Aquesta pantalla desa NOMÉS el dia sota la seva clau —el full del mes va
       a part—, i una precàrrega que hi va desar la resposta sencera la feia
       petar en obrir: «Cannot read properties of undefined». Un dia sense
       hàbits a dins no és un dia, sigui quin sigui el motiu; es llença i
       s'espera el servidor, que és el que passava abans que hi hagués còpia. */
    var cau = Cau.get('habits.' + data, null);
    if (cau && !Array.isArray(cau.habits)) cau = null;
    mes = Cau.get('habits.mes', null);
    if (cau) pinta(cau, true);
    else arrel.innerHTML = '<div class="pagina"><div class="terreny">' +
      '<div class="esquelet franja-fantasma"></div><div class="esquelet franja-fantasma"></div>' +
      '<div class="esquelet franja-fantasma"></div></div></div>';
    carrega();
  }
});
</script>

<script>
/* JEFE — MÒDUL · Nutrició
   Món: full de mapa topogràfic. Ve de FitFat, però parla l'idioma de JEFE.

   LA DECISIÓ QUE MANA: apuntar un aliment ha de ser el camí més curt de la
   pantalla. Si costa, no s'usa, i un comptador que no s'omple no serveix de
   res. Per això el formulari d'afegir és sempre visible dins de cada àpat i
   la llista d'aliments guardats hi és al primer toc: la majoria de dies
   menges el mateix, i tornar a teclejar «pit de pollastre · 165 · 31» és
   exactament la fricció que fa abandonar l'eina.

   El balanç es llegeix com un perfil de terreny: el dèficit puja a la dreta,
   el superàvit baixa a l'esquerra, i la marca de l'objectiu és una fita. */

App.registraVista('nutricio', {
  render: function (arrel, params) {

    var data = params.data || fmt.avui();
    var periode = params.periode || 'dia';
    var apatObert = null;      // quin àpat té el formulari desplegat, si n'hi ha cap
    var dades = null, aliments = [], ajustos = null;

    var APATS = [
      { clau: 'dinar',   nom: 'Dinar'   },
      { clau: 'berenar', nom: 'Berenar' },
      { clau: 'sopar',   nom: 'Sopar'   }
    ];

    var r0 = function (n) { return Math.round(Number(n) || 0); };
    /* Amb coma, que aquí es parla català: «95,8 g» i no «95.8 g». I sense el
       decimal quan és zero, que «140,0 g» no diu res que no digui «140 g». */
    var r1 = function (n) {
      var v = Math.round((Number(n) || 0) * 10) / 10;
      return (v % 1 === 0 ? String(v) : v.toFixed(1)).replace('.', ',');
    };
    var num = function (v) {
      var n = parseFloat(String(v === undefined || v === null ? '' : v).replace(',', '.'));
      return isFinite(n) ? n : 0;
    };

    // ------------------------------------------------------------- capçalera

    var PERIODES = [['dia', 'Dia'], ['setmana', 'Setmana'], ['mes', 'Mes']];

    /* UNA SOLA LÍNIA. El títol diu on ets i, tocant-lo, tries.
       Abans hi havia la fila de la data i una tira de períodes a sota: dues
       franges fixes a dalt per una cosa que canvies un cop a la setmana. Les
       fletxes es queden perquè el dia sí que el canvies constantment. */
    function capcalera(esAvui) {
      var sota = (PERIODES.filter(function (p) { return p[0] === periode; })[0] || ['', 'Dia'])[1];
      return '<header class="capcalera capcalera-nutri">' +
        '<div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa', 'ic-p') + '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-salt="-1" aria-label="Anterior">' +
            ic('esquerra', 'ic-p') + '</button>' +
          '<button class="titol-periode" data-obre-periode="1">' +
            '<b>' + esc(titolPeriode()) + '</b>' +
            '<span>' + esc(sota) +
              (periode === 'dia' && esAvui ? ' · avui' : '') + ' ▾</span>' +
          '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-salt="1" aria-label="Següent"' +
            (esAvui ? ' disabled' : '') + '>' + ic('dreta', 'ic-p') + '</button>' +
          '<button class="btn btn-fantasma btn-icona" data-ajustos="1" aria-label="Objectius">' +
            ic('ajust', 'ic-p') + '</button>' +
        '</div>' +
      '</header>';
    }

    function obrePeriode() {
      var cos = App.modal('Què vols veure', '<div class="tria-periode">' +
        PERIODES.map(function (p) {
          return '<button data-va="' + p[0] + '"' +
                 (p[0] === periode ? ' aria-current="true"' : '') + '>' + p[1] + '</button>';
        }).join('') +
        '<hr><button data-anar-avui="1">Anar a avui</button>' +
      '</div>');

      cos.querySelectorAll('[data-va]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.tancaModal();
          App.ves('nutricio', { data: data, periode: b.dataset.va });
        });
      });
      cos.querySelector('[data-anar-avui]').addEventListener('click', function () {
        App.tancaModal();
        App.ves('nutricio', { data: fmt.avui(), periode: periode });
      });
    }

    function etiquetaPeriode() {
      if (periode === 'dia') return fmt.relativa(data);
      return periode === 'setmana' ? 'Setmana' : 'Mes';
    }

    function titolPeriode() {
      if (periode === 'dia') return fmt.llarga(data);
      if (!dades || !dades.desde) return '…';
      if (periode === 'mes') {
        var d = new Date(Number(data.slice(0, 4)), Number(data.slice(5, 7)) - 1, 1);
        var m = d.toLocaleDateString('ca-ES', { month: 'long', year: 'numeric' });
        return m.charAt(0).toUpperCase() + m.slice(1);
      }
      return fmt.relativa(dades.desde) + ' → ' + fmt.relativa(dades.fins);
    }

    // ------------------------------------------------------------ vista dia

    /* L'ordre és el de FitFat, i és el bo: les xifres del dia a dalt de tot
       perquè és el que mires primer, després els àpats que és on treballes, i
       el tancament al final perquè és l'última cosa que fas del dia. */
    function pintaDia(d, dEnCau) {
      dades = d;
      arrel.innerHTML = capcalera(d.data === fmt.avui()) +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt" id="col-dalt"></section>' +
          '<section class="nutri-apats" id="col-apats"></section>' +
          '<section class="nutri-tanca" id="col-tanca"></section>' +
          (dEnCau ? '<p class="menut">Última còpia desada al telèfon.</p>' : '') +
        '</div>';

      /* `arrel.querySelector` i no `document.getElementById`: si la vista ja
         no és a la pantalla, ha d'escriure a la seva capsa i no a la del que
         hi hagi ara. Vegeu `App.ves` al nucli. */
      arrel.querySelector('#col-dalt').innerHTML = blocDalt(d);
      arrel.querySelector('#col-apats').innerHTML =
        APATS.map(function (m) { return blocApat(d, m); }).join('');
      arrel.querySelector('#col-tanca').innerHTML = blocTanca(d);

      lligaCapcalera();
      lligaBalanc();
      lligaApats();
    }

    /** Les tres xifres del dia, i la barra de proteïna si hi ha objectiu. */
    function blocDalt(d) {
      var t = d.totals;
      var teObjProt = d.objectius.proteina > 0;
      var pct = teObjProt ? Math.min(t.proteina / d.objectius.proteina * 100, 100) : 0;

      return '<div class="tres-xifres">' +
          xifra('Ingerides', r0(t.ingerides), 'kcal') +
          xifra('Proteïna', r1(t.proteina), 'g') +
          xifra('Cremades', d.teCremades ? r0(d.cremades) : '—', d.teCremades ? 'kcal' : '') +
        '</div>' +

        /* L'OBJECTIU DE PROTEÏNA, EN ANELL.
           Era una barra, i l'app ja té l'anell per dir «quant en portes»: una
           barra aquí i un anell a la pàgina del dia són dos idiomes per dir
           exactament el mateix. El que falta va al costat, en text, perquè no
           depengui de saber llegir un cercle. */
        (teObjProt
          ? '<div class="prot-bloc">' +
              '<div class="anell" style="--p:' + pct.toFixed(0) + '"' +
                ' role="img" aria-label="' + r1(t.proteina) + ' de ' + r0(d.objectius.proteina) + ' g de proteïna">' +
                '<b>' + pct.toFixed(0) + '%</b><small>proteïna</small>' +
              '</div>' +
              '<div class="prot-diu">' +
                '<span class="marge">Objectiu</span>' +
                '<span class="num">' + r1(t.proteina) + ' / ' + r0(d.objectius.proteina) + ' g</span>' +
                (t.proteina < d.objectius.proteina
                  ? '<span class="menut">Falten ' + r1(d.objectius.proteina - t.proteina) + ' g</span>'
                  : '<span class="menut">Assolit</span>') +
              '</div>' +
            '</div>'
          : '');
    }

    /** El tancament: què has cremat, i què en surt. */
    function blocTanca(d) {
      return '<p class="marge">Tancament del dia</p>' +

        '<label class="camp-activitat">' +
          '<span class="menut">Calories cremades (total del dia, del rellotge)</span>' +
          '<input id="n-activitat" inputmode="decimal" value="' +
            (d.teActivitat ? esc(String(d.activitat)) : '') + '" placeholder="p. ex. 2400">' +
        '</label>' +

        '<div class="fitxa" data-estat="' + esc(d.verdicte.estat) + '">' +
          '<div class="xifra-gran">' +
            (d.teCremades
              ? (d.net > 0 ? '−' : d.net < 0 ? '+' : '') + r0(Math.abs(d.net)) + '<span class="u">kcal</span>'
              : '—') +
          '</div>' +
          '<p class="verdicte">' + esc(d.verdicte.text) + '</p>' +
          (d.teCremades ? barraBalanc(d) : '') +
        '</div>';
    }

    function xifra(etiqueta, valor, unitat) {
      return '<div class="xifra"><span class="marge">' + esc(etiqueta) + '</span>' +
             '<b class="num">' + esc(String(valor)) +
             (unitat ? '<span class="u">' + esc(unitat) + '</span>' : '') + '</b></div>';
    }

    /** El mateix escalat que FitFat: el centre és l'equilibri. */
    function barraBalanc(d) {
      var obj = d.objectius.deficit;
      var escala = Math.max(800, obj * 1.4, Math.abs(d.net) * 1.15);
      var ample = Math.min(Math.abs(d.net) / escala * 50, 50);
      var deficit = d.net > 0;
      var fita = obj > 0 ? Math.min(obj / escala * 50, 50) : 0;

      return '<div class="balanc">' +
        '<div class="balanc-via">' +
          '<i style="left:' + (deficit ? 50 : 50 - ample) + '%;width:' + ample + '%" data-costat="' +
            (deficit ? 'deficit' : 'superavit') + '"></i>' +
          '<u></u>' +
          (fita > 0 ? '<b style="left:' + (50 + fita) + '%"></b>' : '') +
        '</div>' +
        '<div class="balanc-peu"><span>← superàvit</span>' +
          (fita > 0 ? '<span class="fita-txt">objectiu</span>' : '') +
          '<span>dèficit →</span></div>' +
      '</div>';
    }

    function blocApat(d, m) {
      var apat = null;
      for (var i = 0; i < d.apats.length; i++) if (d.apats[i].clau === m.clau) apat = d.apats[i];
      if (!apat) apat = { items: [], kcal: 0, proteina: 0 };
      var obert = apatObert === m.clau;

      return '<div class="apat" data-apat="' + esc(m.clau) + '">' +
        '<div class="apat-cap">' +
          '<h2>' + esc(m.nom) + '</h2>' +
          '<span class="num menut">' +
            (apat.items.length ? r0(apat.kcal) + ' kcal · ' + r1(apat.proteina) + ' g' : '') +
          '</span>' +
        '</div>' +

        '<div class="apat-items">' +
          (apat.items.length
            ? apat.items.map(function (i) {
                return '<div class="ingesta">' +
                  '<div style="flex:1;min-width:0">' +
                    '<div class="nm">' + esc(i.nom) + '</div>' +
                    '<div class="menut num">' + r0(i.grams) + ' g · ' + r0(i.kcal100) +
                      ' kcal/100 · ' + r1(i.prot100) + ' prot/100</div>' +
                  '</div>' +
                  '<div class="num" style="text-align:right">' +
                    '<div>' + r0(i.kcal) + '</div>' +
                    '<div class="menut">' + r1(i.prot) + ' g</div>' +
                  '</div>' +
                  '<button class="btn btn-fantasma btn-icona" data-treu="' + esc(i.id) +
                    '" aria-label="Treu ' + esc(i.nom) + '">' + ic('tancar', 'ic-p') + '</button>' +
                '</div>';
              }).join('')
            : '') +
        '</div>' +

        /* EL FORMULARI VE PLEGAT, I NOMÉS N'HI HA UN D'OBERT.
           Els tres àpats amb el formulari desplegat feien la pàgina de 2.325
           píxels: per veure el tancament del dia havies de passar per sobre de
           tres formularis buits. Plegats, la pantalla és la llista del que has
           menjat, que és el que véns a mirar. I obrir-ne un tanca l'altre
           perquè, si no, tornes a tenir-los tots desplegats en quatre tocs. */
        '<button class="btn btn-secundari btn-ple apat-obre" data-obre-form="' + esc(m.clau) + '"' +
          ' aria-expanded="' + (obert ? 'true' : 'false') + '">' +
          textObre(obert, m.nom) + '</button>' +

        '<div class="apat-form"' + (obert ? '' : ' hidden') + '>' +
          /* Llista pròpia i no un <select>: el desplegable natiu d'Android
             dibuixa cada opció amb l'estil del sistema i no admet dues mides
             de lletra a la mateixa línia. Amb el nom i les xifres iguals de
             grosses, trobar un aliment costa llegir-ho tot. */
          '<button class="btn btn-secundari tria-aliment" data-guardats>' +
            ic('mes', 'ic-p') + 'Tria un aliment guardat</button>' +
          '<input data-nom placeholder="Aliment" autocomplete="off">' +
          '<input data-grams inputmode="decimal" placeholder="grams" class="num" autocomplete="off">' +
          '<input data-kcal inputmode="decimal" placeholder="kcal/100 g" class="num" autocomplete="off">' +
          '<input data-prot inputmode="decimal" placeholder="prot/100 g" class="num" autocomplete="off">' +
          '<button class="btn btn-primari" data-afegeix>Afegeix</button>' +
          '<button class="btn btn-secundari" data-desa-aliment>Desa l\'aliment</button>' +
        '</div>' +
      '</div>';
    }

    function textObre(obert, nom) {
      return ic(obert ? 'menys' : 'mes', 'ic-p') +
             (obert ? 'Tanca' : 'Afegeix-hi') +
             '<span class="nomes-lectors"> a ' + esc(nom) + '</span>';
    }

    /**
     * Obrir el formulari d'un àpat en tanca qualsevol altre.
     *
     * Es fa tocant el DOM i no repintant la pàgina: repintar-la enmig d'un
     * toc et tanca el teclat i et fa perdre el que estiguessis escrivint a
     * l'altre àpat.
     */
    function obreForm(clau) {
      apatObert = (apatObert === clau) ? null : clau;
      arrel.querySelectorAll('.apat').forEach(function (sec) {
        var obert = sec.dataset.apat === apatObert;
        var f = sec.querySelector('.apat-form');
        var b = sec.querySelector('[data-obre-form]');
        if (f) f.hidden = !obert;
        if (b) {
          b.setAttribute('aria-expanded', obert ? 'true' : 'false');
          b.innerHTML = textObre(obert, sec.querySelector('.apat-cap h2').textContent);
        }
      });
      if (apatObert) enfocaCamp(apatObert);
    }

    function enfocaCamp(clau) {
      var camp = arrel.querySelector('.apat[data-apat="' + clau + '"] [data-nom]');
      if (camp) { try { camp.focus(); } catch (e) {} }
    }

    // -------------------------------------------------------- setmana i mes

    /* LA GRÀFICA DIBUIXA EL BALANÇ, i res més.
       Abans l'alçada eren les calories ingerides i el color el balanç: dues
       variables al mateix dibuix, i cap de les dues es podia llegir. Ara la
       línia del mig és l'equilibri, cap amunt és dèficit i cap avall superàvit.
       Una barra alta vol dir un dia bo, i prou.

       Setmana i mes són gràfiques diferents a posta: amb set dies hi caben el
       nom del dia i la xifra a cada fila, i amb trenta-un no. */
    function pintaPeriode(d) {
      dades = d;

      var nets = d.dies.map(function (x) { return x.net === null ? 0 : Math.abs(x.net); });
      var escala = Math.max(600, Math.max.apply(null, nets));
      var enDeficit = d.dies.filter(function (x) { return x.net !== null && x.net > 0; }).length;
      var enSuperavit = d.dies.filter(function (x) { return x.net !== null && x.net < 0; }).length;
      var teObjProt = d.objectius.proteina > 0;

      arrel.innerHTML = capcalera(true) +
        '<div class="pagina nutri">' +
          '<section class="nutri-dalt">' +
            '<div class="tres-xifres">' +
              xifra('Ingerides / dia', r0(d.mitjanaIngerides), 'kcal') +
              xifra('Proteïna / dia', r1(d.mitjanaProteina), 'g') +
              xifra('Balanç / dia',
                    d.diesAmbBalanc ? signe(d.mitjanaNet) + r0(Math.abs(d.mitjanaNet)) : '—',
                    d.diesAmbBalanc ? 'kcal' : '') +
            '</div>' +
            (teObjProt
              ? '<div class="prot-bloc">' +
                  '<div class="prot-cap"><span class="marge">Proteïna mitjana</span>' +
                    '<span class="num menut">' + r1(d.mitjanaProteina) + ' / ' +
                    r0(d.objectius.proteina) + ' g</span></div>' +
                  '<div class="prot-barra"><i style="width:' +
                    Math.min(d.mitjanaProteina / d.objectius.proteina * 100, 100).toFixed(1) +
                    '%"></i></div>' +
                '</div>'
              : '') +
          '</section>' +

          '<section>' +
            '<p class="marge">Balanç diari</p>' +
            (d.diesApuntats === 0
              ? '<p class="menut">Encara no hi ha res apuntat en aquest període.</p>'
              : (periode === 'setmana' ? graficSetmana(d, escala) : graficMes(d, escala))) +

            '<p class="menut" style="margin-top:var(--e3);border-top:1px solid var(--utm-suau);' +
              'padding-top:var(--e3)">' +
              d.diesApuntats + (d.diesApuntats === 1 ? ' dia apuntat' : ' dies apuntats') +
              ' · ' + enDeficit + ' en dèficit · ' + enSuperavit + ' en superàvit' +
              (d.diesAmbBalanc
                ? '<br>Balanç acumulat: <b class="num">' + signe(d.netAcumulat) +
                  r0(Math.abs(d.netAcumulat)) + ' kcal</b>'
                : '') +
            '</p>' +
          '</section>' +
        '</div>';

      lligaCapcalera();
      arrel.querySelectorAll('[data-dia]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.ves('nutricio', { data: b.dataset.dia, periode: 'dia' });
        });
      });
    }

    /** Menys davant d'un dèficit: el balanç es llegeix com el pes que perds. */
    function signe(n) { return n > 0 ? '−' : n < 0 ? '+' : ''; }

    function nomDiaCurt(iso) {
      var p = String(iso).split('-');
      var dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12);
      return dt.toLocaleDateString('ca-ES', { weekday: 'short', day: 'numeric' });
    }

    /** Set files: nom del dia, barra que surt del centre, i la xifra. */
    function graficSetmana(d, escala) {
      return '<div class="bal-setmana">' +
        d.dies.map(function (x) {
          if (x.net === null) {
            return '<div class="bal-fila" data-buit="1">' +
              '<span class="bal-nom">' + esc(nomDiaCurt(x.data)) + '</span>' +
              '<span class="bal-via"><u></u></span>' +
              '<span class="bal-xifra">' + (x.apuntat ? '·' : '—') + '</span></div>';
          }
          var deficit = x.net > 0;
          var f = Math.min(Math.abs(x.net) / escala * 50, 50);
          return '<button class="bal-fila" data-dia="' + esc(x.data) + '"' +
            ' aria-label="' + esc(fmt.llarga(x.data)) + ': ' +
              (deficit ? 'dèficit ' : 'superàvit ') + r0(Math.abs(x.net)) + ' kcal">' +
            '<span class="bal-nom">' + esc(nomDiaCurt(x.data)) + '</span>' +
            '<span class="bal-via"><u></u>' +
              '<i data-costat="' + (deficit ? 'deficit' : 'superavit') + '"' +
              ' style="left:' + (deficit ? 50 : 50 - f) + '%;width:' + f + '%"></i>' +
            '</span>' +
            '<span class="bal-xifra" data-costat="' + (deficit ? 'deficit' : 'superavit') + '">' +
              signe(x.net) + r0(Math.abs(x.net)) + '</span>' +
          '</button>';
        }).join('') +
      '</div>' +
      '<div class="balanc-peu"><span>← superàvit</span><span>dèficit →</span></div>';
    }

    /** Un mes sencer: columnes que pugen o baixen d'una línia central. */
    function graficMes(d, escala) {
      var n = d.dies.length;
      var barres = d.dies.map(function (x, i) {
        if (x.net === null) return '';
        var deficit = x.net > 0;
        var h = Math.min(Math.abs(x.net) / escala * 48, 48);
        var estil = 'left:' + ((i + 0.12) / n * 100).toFixed(2) + '%;' +
                    'width:' + (0.76 / n * 100).toFixed(2) + '%;' +
                    (deficit ? 'bottom:50%;' : 'top:50%;') + 'height:' + h.toFixed(2) + '%;';
        return '<i data-costat="' + (deficit ? 'deficit' : 'superavit') + '" style="' + estil +
               '" title="' + esc(fmt.llarga(x.data)) + ': ' + signe(x.net) +
               r0(Math.abs(x.net)) + ' kcal"></i>';
      }).join('');

      // Les fites van SOTA la gràfica, no a dins. A dins tapaven les barres.
      var fites = [1, 5, 10, 15, 20, 25, 30].filter(function (v) { return v <= n; });

      return '<div class="bal-mes">' +
          '<div class="bal-mes-caixa"><u></u>' + barres + '</div>' +
          '<div class="bal-mes-eix">' +
            fites.map(function (v) {
              return '<span style="left:' + ((v - 0.5) / n * 100).toFixed(2) + '%">' + v + '</span>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="balanc-peu"><span>▲ dèficit</span><span>superàvit ▼</span></div>';
    }

    // -------------------------------------------------------------- accions

    function lligaCapcalera() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-salt]').forEach(function (b) {
        b.addEventListener('click', function () {
          var n = Number(b.dataset.salt);
          var nova = periode === 'dia' ? fmt.suma(data, n)
                   : periode === 'setmana' ? fmt.suma(data, n * 7)
                   : mouMes(data, n);
          if (nova > fmt.avui() && periode === 'dia') return;
          App.ves('nutricio', { data: nova, periode: periode });
        });
      });

      var bp = arrel.querySelector('[data-obre-periode]');
      if (bp) bp.addEventListener('click', obrePeriode);

      var baj = arrel.querySelector('[data-ajustos]');
      if (baj) baj.addEventListener('click', obreAjustos);
    }

    function mouMes(iso, n) {
      var y = Number(iso.slice(0, 4)), m = Number(iso.slice(5, 7)) - 1 + n;
      var d = new Date(y, m, 1);
      var ultim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      var dia = Math.min(Number(iso.slice(8, 10)), ultim);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + dia).slice(-2);
    }

    /**
     * EL VERDICTE DEL DIA, CALCULAT AQUÍ.
     *
     * TÉ UNA BESSONA al servidor —`verdicte_` a 40_Mod_Nutricio.gs— i han de
     * dir exactament el mateix; hi ha una prova que ho comprova cas per cas.
     *
     * Per què es duplica, havent-hi una regla al servidor: perquè posar les
     * calories cremades i esperar dos segons per saber si estàs en dèficit és
     * esperar un càlcul que ja pots fer. Les dues xifres —el que has menjat i
     * el que has cremat— són totes dues aquí; la resta és una resta.
     */
    function verdicteLocal(teCremades, net, objectiu) {
      if (!teCremades) {
        return { estat: 'sense_dades', text: 'Introdueix les calories cremades per tancar el dia.' };
      }
      if (net > 0 && objectiu > 0 && net >= objectiu) {
        return { estat: 'deficit_assolit', text: 'Dèficit de ' + Math.round(net) + ' kcal — objectiu assolit' };
      }
      if (net > 0) {
        return {
          estat: 'deficit',
          text: objectiu > 0
            ? 'En dèficit de ' + Math.round(net) + ' kcal · falten ' + Math.round(objectiu - net) + ' per l\'objectiu'
            : 'En dèficit de ' + Math.round(net) + ' kcal'
        };
      }
      if (net === 0) {
        return { estat: 'equilibri', text: 'En equilibri: has cremat el mateix que has ingerit.' };
      }
      return {
        estat: 'superavit',
        text: 'En superàvit de ' + Math.round(-net) + ' kcal · avui has menjat més del que has cremat'
      };
    }

    function lligaBalanc() {
      var inp = arrel.querySelector('#n-activitat');
      if (!inp) return;
      var previ = inp.value;
      inp.addEventListener('change', function () {
        if (inp.value === previ) return;
        previ = inp.value;
        var kcal = num(inp.value);

        /* PRIMER ES VEU, DESPRÉS ES DESA. La xifra és teva i el càlcul també:
           no hi ha cap motiu per mirar dos segons una pantalla que ja sap la
           resposta. Si el servidor diu una altra cosa, mana ell i es repinta;
           si falla, es desfà. */
        if (dades && dades.totals) {
          dades.activitat = kcal;
          dades.teActivitat = kcal > 0;
          dades.cremades = kcal;
          dades.teCremades = kcal > 0;
          dades.net = kcal > 0 ? kcal - dades.totals.ingerides : null;
          dades.verdicte = verdicteLocal(dades.teCremades, dades.net,
                                         (dades.objectius || {}).deficit || 0);
          /* ELS DOS BLOCS, no només el de dalt. Les tres xifres són a dalt i el
             verdicte és a baix, amb el camp que acabes d'omplir: repintant
             només un, la xifra de cremades canviava i el «estàs en dèficit»
             es quedava com estava, que és pitjor que no tocar res. */
          var dalt = arrel.querySelector('#col-dalt');
          if (dalt) dalt.innerHTML = blocDalt(dades);
          var tanca = arrel.querySelector('#col-tanca');
          if (tanca) {
            tanca.innerHTML = blocTanca(dades);
            /* El camp s'ha tornat a pintar: torna-hi el que hi havies escrit i
               deixa'l enfocat si hi eres. */
            var nou = arrel.querySelector('#n-activitat');
            if (nou) { nou.value = inp.value; }
            lligaBalanc();
          }
        }

        escriu('nutricio', 'activitat', { data: data, kcal: kcal }, quePinto())
          .then(function (r) { Cau.oblida('nutricio.'); aplica(r); })
          .catch(function (err) {
            App.brindis(err.message, 'error');
            carrega();          // el que hi ha pintat era una promesa; se'n va
          });
      });
    }

    /**
     * La llista d'aliments guardats.
     *
     * El nom mana i les xifres van petites i grises: el que busques és
     * «tonyina», no «185». Amb tot de la mateixa mida, cada aliment és una
     * frase que s'ha de llegir sencera per descartar-la.
     */
    function obreAliments(alTriar) {
      if (!aliments.length) {
        App.brindis('Encara no tens cap aliment guardat', 'error');
        return;
      }

      var cos = App.modal('Aliments guardats',
        '<input class="cerca-aliment" data-cerca placeholder="Cerca…" autocomplete="off">' +
        '<div class="aliments" id="llista-aliments"></div>');

      var llista = cos.querySelector('#llista-aliments');
      var cerca = cos.querySelector('[data-cerca]');

      function pinta(q) {
        var n = String(q || '').trim().toLowerCase();
        var mostrats = aliments.filter(function (a) {
          return !n || String(a.nom).toLowerCase().indexOf(n) !== -1;
        });
        llista.innerHTML = mostrats.length
          ? mostrats.map(function (a) {
              return '<button class="aliment-fila" data-a="' + esc(a.id) + '">' +
                '<span class="aliment-nom">' + esc(a.nom) + '</span>' +
                '<span class="aliment-dades">' + r0(a.kcal100) + ' kcal · ' +
                  r1(a.prot100) + ' g prot · per 100 g</span>' +
              '</button>';
            }).join('')
          : '<p class="menut">Cap aliment amb aquest nom.</p>';

        llista.querySelectorAll('[data-a]').forEach(function (b) {
          b.addEventListener('click', function () {
            var t = null;
            for (var i = 0; i < aliments.length; i++) {
              if (aliments[i].id === b.dataset.a) t = aliments[i];
            }
            App.tancaModal();
            if (t) alTriar(t);
          });
        });
      }

      pinta('');
      cerca.addEventListener('input', function () { pinta(cerca.value); });
    }

    function lligaApats() {
      arrel.querySelectorAll('[data-obre-form]').forEach(function (b) {
        b.addEventListener('click', function () { obreForm(b.dataset.obreForm); });
      });

      arrel.querySelectorAll('.apat').forEach(function (sec) {
        var apat = sec.dataset.apat;
        var sel  = sec.querySelector('[data-guardats]');
        var nom  = sec.querySelector('[data-nom]');
        var gr   = sec.querySelector('[data-grams]');
        var kc   = sec.querySelector('[data-kcal]');
        var pr   = sec.querySelector('[data-prot]');
        var bt   = sec.querySelector('[data-afegeix]');
        var bd   = sec.querySelector('[data-desa-aliment]');

        sel.addEventListener('click', function () { obreAliments(function (a) {
          nom.value = a.nom; kc.value = a.kcal100; pr.value = a.prot100;
          refresca(); gr.focus();
        }); });

        function llest() { return nom.value.trim() && num(gr.value) > 0; }

        // El botó ensenya el resultat abans de prémer-lo. Així no cal afegir
        // per veure si t'has equivocat de coma.
        function refresca() {
          if (llest()) {
            bt.textContent = 'Afegeix · ' + r0(num(gr.value) * num(kc.value) / 100) + ' kcal · ' +
                             r1(num(gr.value) * num(pr.value) / 100) + ' g';
          } else {
            bt.textContent = 'Afegeix';
          }
        }

        [nom, gr, kc, pr].forEach(function (i) {
          i.addEventListener('input', refresca);
          i.addEventListener('keydown', function (e) { if (e.key === 'Enter') afegeix(); });
        });

        function afegeix() {
          if (!llest()) return;
          bt.disabled = true;
          escriu('nutricio', 'afegeix', {
            data: data, apat: apat, nom: nom.value.trim(),
            grams: num(gr.value), kcal100: num(kc.value), prot100: num(pr.value)
          }, quePinto()).then(function (r) {
            nom.value = gr.value = kc.value = pr.value = '';
            bt.disabled = false;
            /* El botó torna a dir «Afegeix». Si no, es queda amb la previsió
               del que acabes d'apuntar i sembla que encara ho hagis de prémer. */
            refresca();
            if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
            Cau.oblida('nutricio.');
            aplica(r, false, true);
            /* El formulari es queda obert i amb el cursor a punt: després d'un
               aliment normalment en ve un altre del mateix àpat. */
            enfocaCamp(apat);
          }).catch(function (err) {
            bt.disabled = false;
            App.brindis(err.message, 'error');
          });
        }

        bt.addEventListener('click', afegeix);

        bd.addEventListener('click', function () {
          if (!nom.value.trim() || num(kc.value) <= 0) {
            App.brindis('Per desar-lo cal el nom i les kcal per 100 g', 'error');
            return;
          }
          bd.disabled = true;
          escriu('nutricio', 'desaAliment', {
            nom: nom.value.trim(), kcal100: num(kc.value), prot100: num(pr.value)
          }, quePinto()).then(function (r) {
            // La llista es munta cada cop que s'obre, o sigui que amb tenir
            // `aliments` al dia ja hi surt: `aplica` ho fa i, amb el tauler
            // obert, s'espera a repintar fins que el tanquis.
            Cau.oblida('nutricio.');
            bd.disabled = false;
            App.brindis('«' + nom.value.trim() + '» desat a la teva llista');
            aplica(r);
          }).catch(function (err) {
            bd.disabled = false;
            App.brindis(err.message, 'error');
          });
        });

        sec.querySelectorAll('[data-treu]').forEach(function (b) {
          b.addEventListener('click', function () {
            b.disabled = true;
            escriu('nutricio', 'treu', { id: b.dataset.treu }, quePinto())
              // Treure'n un és una cosa que vols veure feta: es pinta encara
              // que tinguis el formulari de l'àpat obert.
              .then(function (r) { Cau.oblida('nutricio.'); aplica(r, false, true); })
              .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
          });
        });
      });
    }

    // -------------------------------------------------------------- ajustos

    function obreAjustos() {
      var a = ajustos || {};
      var cos = App.modal('Objectius i cos',
        '<div class="form-ajustos">' +
          camp('objectiuDeficit', 'Dèficit diari objectiu (kcal)', a.objectiuDeficit) +
          camp('objectiuProteina', 'Proteïna diària objectiu (g)', a.objectiuProteina) +
          '<button class="btn btn-primari" data-desa-ajustos>Desa</button>' +
          '<hr>' +
          '<p class="marge">Portar-hi les dades de FitFat</p>' +
          '<p class="menut">Tria el fitxer de «⚙ → Còpia de seguretat → Exporta». ' +
            'Primer et diré què hi trobo i què faria; no s\'escriu res fins que ho confirmis. ' +
            'No esborra ni sobreescriu mai res, i es pot repetir sense duplicar.</p>' +
          '<input type="file" accept="application/json,.json" data-fitxer>' +
          '<div id="aj-import"></div>' +
        '</div>');

      lligaImportacio(cos);

      cos.querySelector('[data-desa-ajustos]').addEventListener('click', function () {
        var p = {};
        cos.querySelectorAll('[data-c]').forEach(function (i) { p[i.dataset.c] = i.value; });
        escriu('nutricio', 'desaAjustos', p, quePinto())
          .then(function (r) {
            App.tancaModal();
            App.brindis('Objectius desats');
            Cau.oblida('nutricio.');
            aplica(r);
          })
          .catch(function (err) { App.brindis(err.message, 'error'); });
      });
    }

    /**
     * Importació en dos temps: primer un assaig que no escriu res i diu què
     * faria, i només després l'escriptura. Amb dades que només existeixen en
     * un telèfon, ensenyar el resultat abans de tocar-les no és una cortesia.
     */
    function lligaImportacio(cos) {
