<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1214" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JEFE</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="mask-icon" href="favicon.svg" color="#4fd6e0">
  
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icona.svg">
  <meta name="apple-mobile-web-app-title" content="JEFE">
  <script>
    /* Sense treballador de servei registrat, Chrome ofereix «afegir drecera».
       Amb ell, ofereix INSTAL·LAR l'aplicació de debò. */
    if ('serviceWorker' in navigator) {
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('JEFE: no s\'ha pogut registrar el treballador de servei', e);
        });
      });
    }
  </script>
  <style>
/* =========================================================================
   JEFE — sistema visual
   Món: full de mapa topogràfic 1:25.000.

   Regla que mana sobre tota la resta: EL COLOR ÉS LA DADA.
   La tinta hipsomètrica d'una fila surt del seu compliment, no de la decoració.
   Compliment alt = terreny alt = ocre i roca. Compliment baix = vall = verd.
   ========================================================================= */

:root {
  color-scheme: light dark;

  /* --- full de mapa --- */
  --paper:      #f4f5f2;   /* el paper del full, neutre fred: no és crema */
  --paper2:     #eaece7;
  --neatline:   #1b2124;   /* marc del full */
  --ink:        #14181a;
  --ink-suau:   #5b6469;
  --corba:      #a8703f;   /* corba de nivell */
  --corba-mestra:#8a5124;  /* cada cinquena, més gruixuda */
  --utm:        #2c6e8f;   /* quadrícula UTM */
  --utm-suau:   #b9d2df;
  --gr:         #c8332b;   /* marca de sender GR: blanc sobre vermell */
  --avis:       #8a5a00;
  --avis-fons:  #fbf0d8;

  /* --- rampa hipsomètrica: de la vall al cim --- */
  --h0: #dfe6da;   /* sense dades */
  --h1: #7fa15c;   /* vall */
  --h2: #a8b558;
  --h3: #d3c063;
  --h4: #dfa94b;
  --h5: #c9803d;
  --h6: #ab5f33;   /* cim */
  --roca: #ece7e0;

  --fet:        var(--h4);   /* una casella picada és terreny alt */
  --fet-vora:   #a8703f;
  /* La tinta hipsomètrica és clara als DOS temes, així que el text que hi va
     a sobre ha de ser fosc sempre. Heretar --ink en mode nit dona clar sobre
     clar: 2,32:1, il·legible. */
  --sobre-fet:  #14181a;
  --sobre-fet2: #4a3316;

  --ombra: 0 1px 0 rgba(27,33,36,.10), 0 6px 18px rgba(27,33,36,.07);

  --r: 2px;                  /* els mapes no tenen cantonades rodones */
  --toc: 48px;
  --nav: 0px;   /* sense barra de seccions: els calc() que la resten es col·lapsen sols */

  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px;
  --e5: 24px; --e6: 32px; --e7: 48px;

  --sortida: cubic-bezier(.16, 1, .3, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="clar"]) { --nit: 1; }
}
:root[data-tema="fosc"] { --nit: 1; }

/* Full de nit: el mateix mapa sota frontal. Les tintes pugen de lluminositat
   perquè conservin el contrast, no s'inverteixen a l'atzar. */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="clar"]) {
    --paper: #0e1214; --paper2: #161c1f; --neatline: #56666d;
    --ink: #eef2f3; --ink-suau: #93a2a8;
    --corba: #7d5836; --corba-mestra: #a8703f;
    --utm: #4e9bc0; --utm-suau: #1e3a47;
    --gr: #e04a41; --avis: #e0a94e; --avis-fons: #2a2113;
    --h0: #1b2225; --h1: #3d5a30; --h2: #5d6f34; --h3: #8d7f3c;
    --h4: #d8913f; --h5: #c0742f; --h6: #a8542a; --roca: #cfd6d8;
    --ombra: 0 1px 0 rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-tema="fosc"] {
  --paper: #0e1214; --paper2: #161c1f; --neatline: #56666d;
  --ink: #eef2f3; --ink-suau: #93a2a8;
  --corba: #7d5836; --corba-mestra: #a8703f;
  --utm: #4e9bc0; --utm-suau: #1e3a47;
  --gr: #e04a41; --avis: #e0a94e; --avis-fons: #2a2113;
  --h0: #1b2225; --h1: #3d5a30; --h2: #5d6f34; --h3: #8d7f3c;
  --h4: #d8913f; --h5: #c0742f; --h6: #a8542a; --roca: #cfd6d8;
  --ombra: 0 1px 0 rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
}

/* ------------------------------------------------------------------ base */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 0 0 calc(var(--nav) + env(safe-area-inset-bottom, 0px));
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--utm); outline-offset: 2px; }

/* ------------------------------------------------------------- tipografia
   Els fulls de mapa tenen una veu tipogràfica pròpia: toponímia espaiada,
   cotes petites i tabulars, retolació del marge en versaletes.
   Font del sistema per obligació: una font web afegiria latència a
   l'arrencada, que és el risc número u d'aquest projecte. */

h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: 1.5rem; line-height: 1.1; }
h2 { font-size: 1.0625rem; }

.toponim {
  font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  font-size: .8125rem; color: var(--ink-suau);
}
.marge {                       /* retolació del marge del full */
  font-size: .6875rem; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--utm);
}
.cota {                        /* cota d'una corba de nivell */
  font-size: .8125rem; font-weight: 700; font-style: italic;
  color: var(--corba-mestra); font-variant-numeric: tabular-nums;
}
.menut { font-size: .8125rem; color: var(--ink-suau); line-height: 1.4; }
.xifra { font-weight: 700; font-variant-numeric: tabular-nums; }

/* ----------------------------------------------------------- full i marge */

.pagina { padding: var(--e4); max-width: 1280px; margin: 0 auto; }

/* El marc doble del full de mapa. No és decoració: separa el mapa del marge. */
.capcalera {
  position: sticky; top: 0; z-index: 20;
  background: var(--paper);
  border-bottom: 3px double var(--neatline);
  padding: max(var(--e3), env(safe-area-inset-top, 0px)) var(--e4) var(--e3);
}
.capcalera-fila { display: flex; align-items: center; gap: var(--e3);
                  max-width: 1280px; margin: 0 auto; }

/* Escala gràfica: barres alternades negre i blanc, com al peu d'un mapa. */
.escala { display: flex; height: 6px; border: 1px solid var(--neatline); width: 96px; }
.escala i { flex: 1; }
.escala i:nth-child(odd) { background: var(--neatline); }

/* ------------------------------------------------------------------ icones */

.ic { width: 24px; height: 24px; display: block; flex: none; fill: none;
      stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic-p { width: 18px; height: 18px; }
.ic-g { width: 32px; height: 32px; }
.ic-simbol { width: 28px; height: 28px; }        /* simbologia del mapa */

/* ------------------------------------------------------------------ botons */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e2);
  min-height: var(--toc); padding: 0 var(--e4);
  border: 1.5px solid var(--neatline); border-radius: var(--r);
  background: var(--paper2); color: var(--ink);
  font-size: .9375rem; font-weight: 600; letter-spacing: .01em;
  transition: transform .12s var(--sortida), background-color .12s linear;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primari  { background: var(--gr); border-color: var(--gr); color: #fff; }
.btn-secundari{ background: transparent; }
.btn-fantasma { background: transparent; border-color: transparent; color: var(--ink-suau); }
.btn-ple      { width: 100%; }
.btn-icona    { min-width: var(--toc); padding: 0; }

.btn[data-carregant="1"] { color: transparent; position: relative; pointer-events: none; }
.btn[data-carregant="1"]::after {
  content: ""; position: absolute; width: 18px; height: 18px;
  border: 2px solid var(--ink); border-top-color: transparent; border-radius: 50%;
  animation: gira .7s linear infinite;
}
.btn-primari[data-carregant="1"]::after { border-color: #fff; border-top-color: transparent; }
@keyframes gira { to { transform: rotate(360deg); } }

/* =========================================================================
   LA FILA DE TERRENY — la unitat de la pantalla d'avui
   Un hàbit és una franja de terreny. Marcar-lo és guanyar altitud:
   la franja s'omple amb la seva tinta i les corbes s'hi tanquen.
   ========================================================================= */

.terreny { display: flex; flex-direction: column; gap: 2px;
           border: 1.5px solid var(--neatline); background: var(--neatline); }

.franja-fila { display: flex; gap: 2px; background: var(--neatline); }

.franja {
  position: relative; overflow: hidden; flex: 1; min-width: 0;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--e3);
  min-height: 76px; padding: var(--e3) var(--e4);
  border: 0; background: var(--paper); color: var(--ink); text-align: left;
  transition: background-color .3s var(--sortida);
}

/* Les corbes de nivell de la franja: SVG generat, no imatge. */
.franja .corbes { position: absolute; inset: 0; width: 100%; height: 100%;
                  pointer-events: none; opacity: .55; }
.franja > *:not(.corbes) { position: relative; z-index: 1; }

.franja[data-estat="fet"]    { background: var(--fet); color: var(--sobre-fet); }
.franja[data-estat="fet"] .corbes { opacity: .9; }
.franja[data-estat="nofet"]  { background: var(--paper2); }
.franja[data-estat="notoca"] { background: var(--paper2); min-height: 58px; }
.franja[data-estat="notoca"] .franja-nom { color: var(--ink-suau); font-weight: 500; }
.franja[data-pendent="1"]::after {
  content: ""; position: absolute; inset: 0; border: 2px dashed var(--utm);
  pointer-events: none;
}

.franja-nom { font-size: 1.0625rem; font-weight: 600; line-height: 1.2; display: block; }
.franja-sota { display: block; margin-top: 3px; font-size: .8125rem; color: var(--ink-suau); }
.franja[data-estat="fet"] .franja-sota { color: var(--sobre-fet2); }

/* Cota: la ratxa retolada com l'altitud d'una corba mestra. */
.franja-cota { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
.franja-cota .n { font-size: 1.5rem; font-weight: 700; font-style: italic; }
.franja-cota .u { font-size: .625rem; letter-spacing: .1em; text-transform: uppercase;
                  color: var(--ink-suau); margin-top: 2px; }
.franja[data-estat="fet"] .franja-cota .u { color: var(--sobre-fet2); }

/* El punxó: el control picat. Únic moment animat de tota l'app. */
.punxo { width: 30px; height: 30px; }
.punxo circle, .punxo path { stroke: currentColor; fill: none; stroke-width: 2; }
.franja[data-estat="fet"] .punxo { animation: pica .38s var(--sortida); }
@keyframes pica {
  0%   { transform: scale(.4) rotate(-18deg); opacity: 0; }
  60%  { transform: scale(1.12) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.franja-detall {
  flex: none; width: var(--toc);
  display: flex; align-items: center; justify-content: center;
  border: 0; background: var(--paper2); color: var(--ink-suau);
}
.franja-detall:active { background: var(--utm-suau); }

/* =========================================================================
   EL FULL DE MES — la vista d'escriptori, i la de mòbil en horitzontal
   Dies en columnes, hàbits en files, corbes de nivell calculades del
   compliment travessant la graella. Això és el mapa de debò.
   ========================================================================= */

.full-mes { position: relative; border: 1.5px solid var(--neatline); background: var(--paper);
            padding: var(--e4) var(--e4) var(--e3); overflow-x: auto; }
.full-mes .relleu { position: absolute; inset: 0; pointer-events: none; }

.reixa { position: relative; z-index: 1; border-collapse: collapse; width: 100%; min-width: 620px; }
.reixa th, .reixa td { padding: 0; border: .5px solid var(--utm-suau); }
.reixa thead th {
  font-size: .625rem; font-weight: 700; letter-spacing: .06em; color: var(--utm);
  padding-bottom: var(--e2); border: 0; text-align: center; width: 3.2%;
}
.reixa tbody th {
  text-align: left; font-size: .8125rem; font-weight: 600; white-space: nowrap;
  padding: 0 var(--e3) 0 0; border: 0; max-width: 190px; overflow: hidden;
  text-overflow: ellipsis;
}
.cella { height: 26px; }
.cella button { width: 100%; height: 100%; border: 0; background: transparent; padding: 0; display: block; }
.cella[data-e="fet"]    { background: var(--fet); }
.cella[data-e="nofet"]  { background: var(--paper2); }
.cella[data-e="notoca"] { background: transparent; }
.cella[data-e="futur"]  { background: repeating-linear-gradient(45deg,
                            transparent 0 3px, var(--utm-suau) 3px 4px); }
.cella[data-avui="1"]   { outline: 2px solid var(--gr); outline-offset: -2px; }

/* Calendari compacte del detall d'un hàbit */
.calendari { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.calendari button {
  aspect-ratio: 1; min-height: 40px; padding: 0;
  border: .5px solid var(--utm-suau); background: var(--paper2);
  font-size: .6875rem; font-weight: 700; color: var(--ink-suau);
  font-variant-numeric: tabular-nums;
}
.calendari button[data-e="fet"]    { background: var(--fet); color: var(--sobre-fet); border-color: var(--fet-vora); }
.calendari button[data-e="notoca"] { background: transparent; border-color: transparent; }
.calendari button[data-e="futur"]  { background: repeating-linear-gradient(45deg,
                                       transparent 0 3px, var(--utm-suau) 3px 4px);
                                     pointer-events: none; }
.calendari button[data-avui="1"]   { outline: 2px solid var(--gr); outline-offset: -2px; }

/* Llegenda del full: la caixa que explica la simbologia. Obligatòria en un mapa. */
.llegenda { border: 1.5px solid var(--neatline); padding: var(--e3) var(--e4);
            background: var(--paper); }
.llegenda ul { list-style: none; margin: var(--e2) 0 0; padding: 0;
               display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--e2); }
.llegenda li { display: flex; align-items: center; gap: var(--e2); font-size: .8125rem; }
.mostra { width: 22px; height: 14px; border: .5px solid var(--neatline); flex: none; }

/* Rampa hipsomètrica de la llegenda */
.rampa { display: flex; height: 12px; border: .5px solid var(--neatline); }
.rampa i { flex: 1; }

.dues-columnes { display: grid; gap: var(--e4); }

/* ---------------------------------------------------------------- entrades */

.camp { display: block; margin-bottom: var(--e4); }
.camp > span { display: block; margin-bottom: var(--e2); }
.entrada, select.entrada, textarea.entrada {
  width: 100%; min-height: var(--toc); padding: var(--e3);
  border: 1.5px solid var(--neatline); border-radius: var(--r);
  background: var(--paper); color: var(--ink);
  -webkit-appearance: none; appearance: none;
}
.entrada::placeholder { color: var(--ink-suau); opacity: 1; }
.entrada:focus { border-color: var(--utm); outline: none; }

.opcions { display: flex; flex-wrap: wrap; gap: var(--e2); }
.opcio {
  min-height: var(--toc); min-width: var(--toc); padding: 0 var(--e3);
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--neatline); border-radius: var(--r);
  background: var(--paper); font-weight: 600;
}
.opcio[aria-pressed="true"] { background: var(--fet); border-color: var(--fet-vora); color: var(--sobre-fet); }

.passos { display: flex; gap: var(--e1); align-items: center; }
.pas { width: var(--toc); height: var(--toc); display: inline-flex;
       align-items: center; justify-content: center;
       border: 1.5px solid var(--neatline); border-radius: var(--r); background: var(--paper); }

/* ------------------------------------------------------------- commutador */

.commutador { display: flex; align-items: center; justify-content: space-between;
              gap: var(--e3); min-height: var(--toc); }
.commutador input { position: absolute; opacity: 0; pointer-events: none; }
.commutador .pista { width: 52px; height: 30px; flex: none; background: var(--paper2);
                     border: 1.5px solid var(--neatline); position: relative;
                     transition: background-color .18s linear; }
.commutador .pista::after { content: ""; position: absolute; top: 2px; left: 2px;
                            width: 22px; height: 22px; background: var(--neatline);
                            transition: transform .22s var(--sortida); }
.commutador input:checked + .pista { background: var(--fet); }
.commutador input:checked + .pista::after { transform: translateX(22px); }

/* -------------------------------------------------------------- navegació */

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; background: var(--paper);
  border-top: 3px double var(--neatline);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav a { flex: 1; min-height: var(--nav); display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 3px;
         text-decoration: none; color: var(--ink-suau);
         font-size: .6875rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.nav a[aria-current="page"] { color: var(--gr); }
.nav a[aria-current="page"] .ic { stroke-width: 2.1; }

/* ------------------------------------------------------------------ estats */

.estat { padding: var(--e7) var(--e4); text-align: center; }
.estat .ic { margin: 0 auto var(--e3); color: var(--ink-suau); }
.estat p { margin: 0 auto var(--e4); max-width: 38ch; color: var(--ink-suau); }

.avis { display: flex; gap: var(--e3); align-items: flex-start;
        padding: var(--e3) var(--e4); background: var(--avis-fons);
        border: 1.5px solid var(--avis); font-size: .875rem; line-height: 1.45; }
.avis .ic { color: var(--avis); }
.avis strong { display: block; }

.esquelet { background: var(--paper2); animation: pulsa 1.4s ease-in-out infinite;
            border-bottom: 2px solid var(--neatline); }
.esquelet.franja-fantasma { height: 76px; }
@keyframes pulsa { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

.brindis {
  position: fixed; left: var(--e4); right: var(--e4);
  bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px) + var(--e3));
  z-index: 60; max-width: 480px; margin: 0 auto;
  display: flex; align-items: center; gap: var(--e3);
  padding: var(--e3) var(--e4); border: 1.5px solid var(--neatline);
  background: var(--neatline); color: var(--paper);
  box-shadow: var(--ombra); font-size: .875rem; font-weight: 600;
  transform: translateY(140%); opacity: 0; visibility: hidden;
  transition: transform .3s var(--sortida), opacity .2s linear, visibility 0s linear .3s;
}
.brindis[data-visible="1"] { transform: translateY(0); opacity: 1; visibility: visible;
  transition: transform .3s var(--sortida), opacity .2s linear, visibility 0s; }
.brindis[data-to="error"] { background: var(--gr); border-color: var(--gr); color: #fff; }
@media (min-width: 900px) { .brindis { bottom: var(--e4); } }

.sense-xarxa { display: flex; align-items: center; justify-content: center; gap: var(--e2);
               padding: var(--e2); background: var(--avis-fons);
               border-bottom: 1px solid var(--avis);
               font-size: .8125rem; font-weight: 600; }
.sense-xarxa .ic { color: var(--avis); }

/* -------------------------------------------------------------------- modal */

.fosc { position: fixed; inset: 0; z-index: 50; background: rgba(14,18,20,.6);
        display: flex; align-items: flex-end; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity .2s linear; }
.fosc[data-obert="1"] { opacity: 1; pointer-events: auto; }
.modal { width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto;
         background: var(--paper); border: 1.5px solid var(--neatline); border-bottom: 0;
         padding: var(--e4) var(--e4) calc(var(--e5) + env(safe-area-inset-bottom, 0px));
         transform: translateY(100%); transition: transform .32s var(--sortida); }
.fosc[data-obert="1"] .modal { transform: translateY(0); }
.modal-cap { display: flex; align-items: center; gap: var(--e3);
             margin-bottom: var(--e4); padding-bottom: var(--e3);
             border-bottom: 3px double var(--neatline); }
.modal-cap h2 { flex: 1; }
@media (min-width: 900px) {
  .fosc { align-items: center; }

<script>
/* =========================================================================
   JEFE — marc de la interfície
   - Pinta a l'instant des de la memòria cau; el servidor arriba després.
   - Escriptura optimista amb cua: sense cobertura, el toc no es perd.
   - localStorage és NOMÉS memòria cau. La veritat viu al full de càlcul.
   ========================================================================= */

var Jefe = (function () {

  // ------------------------------------------------------------------ base

  function esc(t) {
    return String(t === null || t === undefined ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function ic(nom, classe) {
    return '<svg class="ic ' + (classe || '') + '" aria-hidden="true"><use href="#ic-' + nom + '"/></svg>';
  }

  var DIES = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
  var DIES_C = ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'];
  var MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny',
               'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];

  var fmt = {
    aData: function (t) { var p = String(t).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); },
    avui: function () {
      var d = new Date();
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    },
    suma: function (t, n) {
      var d = fmt.aData(t); d.setDate(d.getDate() + n);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    },
    llarga: function (t) {
      var d = fmt.aData(t), m = MESOS[d.getMonth()];
      var prep = /^[aeiou]/.test(m) ? "d'" : 'de ';
      return DIES[d.getDay()] + ', ' + d.getDate() + ' ' + prep + m;
    },
    relativa: function (t) {
      var avui = fmt.avui();
      if (t === avui) return 'Avui';
      if (t === fmt.suma(avui, -1)) return 'Ahir';
      if (t === fmt.suma(avui, 1)) return 'Demà';
      var d = fmt.aData(t);
      return DIES_C[d.getDay()] + ' ' + d.getDate() + ' ' + MESOS[d.getMonth()].slice(0, 3) + '.';
    },
    diaNumero: function (t) { return fmt.aData(t).getDate(); }
  };

  // ------------------------------------------------------------ memòria cau

  var Cau = {
    get: function (clau, perDefecte) {
      try {
        var v = localStorage.getItem('jefe.' + clau);
        return v === null ? perDefecte : JSON.parse(v);
      } catch (e) { return perDefecte; }
    },
    set: function (clau, valor) {
      try { localStorage.setItem('jefe.' + clau, JSON.stringify(valor)); } catch (e) {}
    },
    treu: function (clau) { try { localStorage.removeItem('jefe.' + clau); } catch (e) {} }
  };

  // ------------------------------------------------------- crides al servidor

  /* -------------------------------------------------------------------------
     DOS TRANSPORTS, LA MATEIXA CRIDA

     Dins d'Apps Script s'usa google.script.run, que ja ve autenticat.
     Servida des de fora (GitHub Pages), s'usa fetch contra el desplegament,
     amb la clau d'accés. Els mòduls no saben ni els importa quin dels dos és.

     `text/plain` no és un error: amb JSON el navegador enviaria una petició
     de comprovació prèvia que Apps Script no sap respondre. El cos segueix
     sent JSON; només canvia l'etiqueta.
     ------------------------------------------------------------------------- */

  function dinsAppsScript() {
    return !!(window.google && google.script && google.script.run);
  }

  var Servidor = {
    config: function () { return Cau.get('servidor', null); },
    desa: function (url, clau) { Cau.set('servidor', { url: url, clau: clau }); },
    esborra: function () { Cau.treu('servidor'); }
  };

  function cridaLocal_(modul, accio, params) {
    return new Promise(function (resolta, falla) {
      google.script.run
        .withSuccessHandler(function (r) {
          App.enLinia(true);
          if (r && r.ok) return resolta(r.dades);
          var err = new Error((r && r.error) || 'El servidor ha respost sense dades.');
          err.api = true; falla(err);
        })
        .withFailureHandler(function (err) {
          App.enLinia(false);
          var e = new Error(err && err.message ? err.message : 'No hi ha connexió amb el servidor.');
          e.xarxa = true; falla(e);
        })
        .api(modul, accio, params || {});
    });
  }

  function cridaRemota_(modul, accio, params) {
    var cfg = Servidor.config();
    if (!cfg || !cfg.url || !cfg.clau) {
      var e = new Error('Encara no has connectat JEFE amb el teu servidor.');
      e.senseServidor = true;
      return Promise.reject(e);
    }
    return fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ clau: cfg.clau, modul: modul, accio: accio, params: params || {} })
    })
    .then(function (r) {
      if (!r.ok) { var e = new Error('El servidor ha respost ' + r.status + '.'); e.xarxa = true; throw e; }
      return r.json();
    })
    .then(function (r) {
      App.enLinia(true);
      if (r && r.ok) return r.dades;
      var err = new Error((r && r.error) || 'El servidor ha respost sense dades.');
      err.api = true;
      if (/clau d'accés/i.test(err.message)) err.clauDolenta = true;
      throw err;
    })
    .catch(function (err) {
      if (!err.api && !err.senseServidor) { App.enLinia(false); err.xarxa = true; }
      throw err;
    });
  }

  function crida(modul, accio, params) {
    return dinsAppsScript() ? cridaLocal_(modul, accio, params)
                            : cridaRemota_(modul, accio, params);
  }

  // ------------------------------------------------- cua d'escriptures pendents

  var Cua = {
    tot: function () { return Cau.get('cua', []); },

    afegeix: function (modul, accio, params, clau) {
      var cua = Cua.tot();
      // Una sola entrada per clau: tocar cinc cops el mateix hàbit desa un cop.
      if (clau) cua = cua.filter(function (i) { return i.clau !== clau; });
      cua.push({ modul: modul, accio: accio, params: params, clau: clau || null, ts: Date.now() });
      Cau.set('cua', cua);
      App.pintaPendents();
    },

    /** Envia la cua en sèrie. Si una falla per xarxa, s'atura i la conserva. */
    envia: function () {
      var cua = Cua.tot();
      if (!cua.length) return Promise.resolve(0);

      var enviades = 0;
      return cua.reduce(function (cadena, item) {
        return cadena.then(function () {
          return crida(item.modul, item.accio, item.params).then(function () {
            enviades++;
            var resta = Cua.tot().filter(function (i) { return i.ts !== item.ts; });
            Cau.set('cua', resta);
            App.pintaPendents();
          });
        });
      }, Promise.resolve()).then(function () { return enviades; })
        .catch(function (err) {
          if (err.api) {
            // El servidor l'ha rebutjada: reintentar-la eternament no la salvarà.
            Cau.set('cua', []);
            App.pintaPendents();
            App.brindis('No s\'ha pogut desar: ' + err.message, 'error');
          }
          return enviades;
        });
    }
  };

  // -------------------------------------------------------------- components

  var Comp = {
    carregant: function (files) {
      var n = files || 4, h = '<div class="marques" aria-busy="true" aria-label="Carregant">';
      for (var i = 0; i < n; i++) h += '<div class="esquelet marca-fantasma"></div>';
      return h + '</div>';
    },

    buit: function (titol, text, botoHtml) {
      return '<div class="estat">' + ic('habits', 'ic-g') +
             '<h2>' + esc(titol) + '</h2>' +
             '<p>' + esc(text) + '</p>' + (botoHtml || '') + '</div>';
    },

    error: function (err, reintenta) {
      var esXarxa = err && err.xarxa;
      return '<div class="estat">' + ic(esXarxa ? 'sense-xarxa' : 'avis', 'ic-g') +
             '<h2>' + (esXarxa ? 'Sense connexió' : 'Alguna cosa ha fallat') + '</h2>' +
             '<p>' + esc(err && err.message ? err.message : String(err)) + '</p>' +
             (reintenta ? '<button class="btn btn-secundari" data-reintenta="1">Torna-ho a provar</button>' : '') +
             '</div>';
    },

    avis: function (titol, text) {
      return '<div class="avis">' + ic('avis') +
             '<div><strong>' + esc(titol) + '</strong>' + esc(text) + '</div></div>';
    },

    targeta: function (contingut) { return '<div class="targeta">' + contingut + '</div>'; }
  };

  // --------------------------------------------------------------- aplicació

  var App = {
    vistes: {},
    actual: null,
    moduls: [],
    enLiniaEstat: true,

    registraVista: function (id, def) { App.vistes[id] = def; },

    arrenca: function (estatInicial) {
      App.moduls = (estatInicial && estatInicial.moduls) || Cau.get('moduls', []);
      App.pintaNav();
      App.aplicaTema(Cau.get('tema', 'auto'));

      // Servida des de fora i encara sense servidor: primer connectar.
      if (!dinsAppsScript() && !Servidor.config()) {
        App.ves('conversa');
        setTimeout(function () { App.connecta(); }, 300);
        return;
      }

      // La conversa és la pantalla d'arrencada: és l'assistent, no el formulari.
      var darrera = Cau.get('vista', 'conversa');
      App.ves(App.vistes[darrera] ? darrera : (App.vistes.conversa ? 'conversa' : 'inici'));

      Cua.envia();
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) Cua.envia();
      });
      window.addEventListener('online', function () { App.enLinia(true); Cua.envia(); });
      window.addEventListener('offline', function () { App.enLinia(false); });

      // Refresca la llista de mòduls en segon pla: un mòdul nou apareix sol.
      crida('nucli', 'inici', {}).then(function (d) {
        Cau.set('moduls', d.moduls);
        if (JSON.stringify(d.moduls) !== JSON.stringify(App.moduls)) {
          App.moduls = d.moduls; App.pintaNav();
        }
      }).catch(function () { /* sense connexió: seguim amb la cau */ });
    },

    ves: function (id, params) {
      var def = App.vistes[id];
      if (!def) { id = 'inici'; def = App.vistes.inici; }
      App.actual = id;
      Cau.set('vista', id);

      document.querySelectorAll('.nav a').forEach(function (a) {
        if (a.dataset.vista === id) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });

      var arrel = document.getElementById('vista');
      arrel.innerHTML = '';
      window.scrollTo(0, 0);
      try { def.render(arrel, params || {}); }
      catch (err) { arrel.innerHTML = Comp.error(err, false); }
    },

    refresca: function () { App.ves(App.actual); },

    pintaNav: function () {
      var nav = document.getElementById('nav');
      if (!nav) return;                    // sense barra de seccions: no és cap error
      var items = [{ id: 'inici', nom: 'Inici', icona: 'inici' }].concat(
        App.moduls.filter(function (m) { return m.teVista; })
      );
      nav.innerHTML = items.map(function (m) {
        return '<a href="#" data-vista="' + esc(m.id) + '">' +
               ic(m.icona || 'modul') + '<span>' + esc(m.nom) + '</span></a>';
      }).join('');
      nav.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function (ev) { ev.preventDefault(); App.ves(a.dataset.vista); });
      });
    },

    // ------------------------------------------------------------ indicadors

    enLinia: function (si) {
      if (App.enLiniaEstat === si) return;
      App.enLiniaEstat = si;
      document.getElementById('sense-xarxa').hidden = si;
    },

    pintaPendents: function () {
      var n = Cua.tot().length;
      var el = document.getElementById('pendents');
      el.hidden = n === 0;
      el.textContent = n === 1 ? '1 canvi pendent de desar' : n + ' canvis pendents de desar';
    },

    brindis: function (text, tipus) {
      var el = document.getElementById('brindis');
      el.innerHTML = ic(tipus === 'error' ? 'avis' : 'fet') + '<span>' + esc(text) + '</span>';
      el.dataset.to = tipus || 'ok';
      el.dataset.visible = '1';
      clearTimeout(App._brindis);
      App._brindis = setTimeout(function () { el.dataset.visible = '0'; }, tipus === 'error' ? 5000 : 2600);
    },

    // ---------------------------------------------------------------- modal

    modal: function (titol, html, alTancar) {
      var fosc = document.getElementById('fosc');
      fosc.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(titol) + '">' +
          '<div class="modal-cap"><h2>' + esc(titol) + '</h2>' +
          '<button class="btn btn-fantasma btn-icona" data-tanca="1" aria-label="Tanca">' + ic('tancar') + '</button></div>' +
          html +
        '</div>';
      fosc.dataset.obert = '1';
      App._alTancar = alTancar || null;

      fosc.querySelector('[data-tanca]').addEventListener('click', App.tancaModal);
      fosc.addEventListener('click', function (ev) { if (ev.target === fosc) App.tancaModal(); });

      var primer = fosc.querySelector('input, select, textarea, button:not([data-tanca])');
      if (primer && primer.type !== 'button') setTimeout(function () { primer.focus(); }, 320);
      return fosc.querySelector('.modal');
    },

    tancaModal: function () {
      var fosc = document.getElementById('fosc');
      fosc.dataset.obert = '0';
      setTimeout(function () { if (fosc.dataset.obert !== '1') fosc.innerHTML = ''; }, 340);
      if (App._alTancar) { var f = App._alTancar; App._alTancar = null; f(); }
    },

    // ----------------------------------------------------------------- tema

    /**
     * Pantalla de connexió. Només surt quan la interfície se serveix des de
     * fora d'Apps Script i encara no sap a quin servidor ha de parlar.
     * La clau es desa al navegador i no viatja enlloc més que al teu propi
     * desplegament.
     */
    connecta: function (motiu) {
      var cfg = Servidor.config() || {};
      var cos = App.modal('Connecta JEFE',
        (motiu ? '<div class="avis" style="margin-bottom:var(--e4)">' + esc(motiu) + '</div>' : '') +
        '<label class="camp"><span>URL del desplegament</span>' +
          '<input class="entrada" id="c-url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" ' +
          'value="' + esc(cfg.url || '') + '"></label>' +
        '<label class="camp"><span>Clau d\'accés</span>' +
          '<input class="entrada" id="c-clau" type="password" autocomplete="off" ' +
          'placeholder="la que t\'ha donat generaClauAcces()" value="' + esc(cfg.clau || '') + '"></label>' +
        '<p class="menut" style="margin:0 0 var(--e4)">La clau es desa només en aquest ' +
          'navegador. No surt d\'aquí excepte cap al teu propi servidor.</p>' +
        '<button class="btn btn-primari btn-ple" data-connecta="1">Connecta</button>');

      cos.querySelector('[data-connecta]').addEventListener('click', function (ev) {
        var url = cos.querySelector('#c-url').value.trim();
        var clau = cos.querySelector('#c-clau').value.trim();
        if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
          App.brindis('L\'URL ha d\'acabar en /exec', 'error'); return;
        }
        if (clau.length < 20) { App.brindis('La clau sembla massa curta', 'error'); return; }

        ev.currentTarget.dataset.carregant = '1';
        Servidor.desa(url, clau);
        crida('nucli', 'ping', {})
          .then(function () { App.tancaModal(); App.brindis('Connectat'); App.refresca(); })
          .catch(function (err) {
            ev.currentTarget.dataset.carregant = '0';
            Servidor.esborra();
            App.brindis(err.clauDolenta ? 'La clau no és correcta' : err.message, 'error');
          });
      });
    },

    aplicaTema: function (tema) {
      Cau.set('tema', tema);
      if (tema === 'auto') document.documentElement.removeAttribute('data-tema');
      else document.documentElement.setAttribute('data-tema', tema);
    },

    temaActual: function () { return Cau.get('tema', 'auto'); }
  };

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && document.getElementById('fosc').dataset.obert === '1') App.tancaModal();
  });

  return { App: App, Comp: Comp, Cau: Cau, Cua: Cua, crida: crida,
           esc: esc, ic: ic, fmt: fmt, Servidor: Servidor, dinsAppsScript: dinsAppsScript };
})();

var App = Jefe.App, Comp = Jefe.Comp, Cau = Jefe.Cau, Cua = Jefe.Cua;
var crida = Jefe.crida, esc = Jefe.esc, ic = Jefe.ic, fmt = Jefe.fmt;
var Servidor = Jefe.Servidor, dinsAppsScript = Jefe.dinsAppsScript;
</script>

<script>
/* =========================================================================
   JEFE — relleu
   Genera les corbes de nivell del mapa a partir de les teves dades.

   No és una textura ni una imatge de fons: és un camp escalar construït
   amb el teu compliment i recorregut amb «marching squares», el mateix
   algorisme amb què es dibuixen les corbes d'un full topogràfic real.
   Com més compliment, més amunt; les corbes es tanquen al voltant dels
   períodes bons i s'obren a les valls.
   ========================================================================= */

var Relleu = (function () {

  /* ---- taula de marching squares -------------------------------------- */
  var CASOS = {
    1:[3,2], 2:[2,1], 3:[3,1], 4:[0,1], 5:[0,3,2,1], 6:[0,2], 7:[0,3],
    8:[0,3], 9:[0,2], 10:[0,1,2,3], 11:[0,1], 12:[3,1], 13:[2,1], 14:[3,2]
  };

  /**
   * Isolínies d'un camp escalar.
   * camp: Float64Array de files*cols · retorna segments en coordenades de graella
   */
  function isolinies(camp, files, cols, nivell) {
    var segs = [];
    for (var r = 0; r < files - 1; r++) {
      for (var c = 0; c < cols - 1; c++) {
        var a = camp[r * cols + c],       b = camp[r * cols + c + 1],
            d = camp[(r + 1) * cols + c + 1], e = camp[(r + 1) * cols + c];
        var idx = (a > nivell ? 8 : 0) | (b > nivell ? 4 : 0) |
                  (d > nivell ? 2 : 0) | (e > nivell ? 1 : 0);
        if (idx === 0 || idx === 15) continue;

        function t(v1, v2) { var dd = v2 - v1; return dd === 0 ? .5 : (nivell - v1) / dd; }
        var punts = [
          { x: c + t(a, b), y: r },          // 0 dalt
          { x: c + 1, y: r + t(b, d) },      // 1 dreta
          { x: c + t(e, d), y: r + 1 },      // 2 baix
          { x: c, y: r + t(a, e) }           // 3 esquerra
        ];
        var cas = CASOS[idx];
        for (var i = 0; i < cas.length; i += 2) segs.push([punts[cas[i]], punts[cas[i + 1]]]);
      }
    }
    return segs;
  }

  /** Encadena els segments solts en polilínies contínues. */
  function encadena(segs) {
    var clau = function (p) { return p.x.toFixed(3) + ',' + p.y.toFixed(3); };
    var mapa = {}, usats = new Array(segs.length);
    segs.forEach(function (s, i) {
      [clau(s[0]), clau(s[1])].forEach(function (k) {
        (mapa[k] = mapa[k] || []).push(i);
      });
    });

    var linies = [];
    for (var i = 0; i < segs.length; i++) {
      if (usats[i]) continue;
      usats[i] = true;
      var linia = [segs[i][0], segs[i][1]];
      // creix pels dos extrems
      for (var dir = 0; dir < 2; dir++) {
        var guarda = 0;
        while (guarda++ < 4000) {
          var extrem = dir === 0 ? linia[linia.length - 1] : linia[0];
          var veins = mapa[clau(extrem)] || [];
          var seg = -1;
          for (var v = 0; v < veins.length; v++) if (!usats[veins[v]]) { seg = veins[v]; break; }
          if (seg === -1) break;
          usats[seg] = true;
          var s = segs[seg];
          var seguent = (clau(s[0]) === clau(extrem)) ? s[1] : s[0];
          if (dir === 0) linia.push(seguent); else linia.unshift(seguent);
        }
      }
      if (linia.length > 2) linies.push(linia);
    }
    return linies;
  }

  /** Camp suau a partir d'una matriu gruixuda (files x cols de 0..1). */
  function camp(matriu, files, cols, sub) {
    sub = sub || 4;
    var F = (files - 1) * sub + 1, C = (cols - 1) * sub + 1;
    var out = new Float64Array(F * C);

    for (var r = 0; r < F; r++) {
      for (var c = 0; c < C; c++) {
        var fr = r / sub, fc = c / sub;
        var r0 = Math.floor(fr), c0 = Math.floor(fc);
        var r1 = Math.min(files - 1, r0 + 1), c1 = Math.min(cols - 1, c0 + 1);
        var tr = fr - r0, tc = fc - c0;
        var v = matriu[r0][c0] * (1 - tr) * (1 - tc) + matriu[r0][c1] * (1 - tr) * tc +
                matriu[r1][c0] * tr * (1 - tc) + matriu[r1][c1] * tr * tc;
        out[r * C + c] = v;
      }
    }
    // dues passades de suavitzat: sense això les corbes surten angulars
    for (var p = 0; p < 2; p++) {
      var copia = out.slice();
      for (var y = 1; y < F - 1; y++) for (var x = 1; x < C - 1; x++) {
        out[y * C + x] = (copia[y * C + x] * 4 + copia[(y - 1) * C + x] + copia[(y + 1) * C + x] +
                          copia[y * C + x - 1] + copia[y * C + x + 1]) / 8;
      }
    }
    return { dades: out, files: F, cols: C };
  }

  /**
   * SVG del relleu del full de mes.
   * matriu[fila][columna] amb valors 0..1 (1 = fet, .5 = no exigit, 0 = no fet)
   */
  function fullMes(matriu, amplada, alcada) {
    if (!matriu.length || !matriu[0].length) return '';
    var files = matriu.length, cols = matriu[0].length;
    if (files < 2 || cols < 2) return '';

    var c = camp(matriu, files, cols, 4);
    var ex = amplada / (c.cols - 1), ey = alcada / (c.files - 1);
    var nivells = [.2, .35, .5, .65, .8];
    var camins = [];

    nivells.forEach(function (n, i) {
      var linies = encadena(isolinies(c.dades, c.files, c.cols, n));
      var mestra = (i === 2);                 // la corba mestra, més gruixuda
      linies.forEach(function (l) {
        var d = 'M' + l.map(function (p) {
          return (p.x * ex).toFixed(1) + ' ' + (p.y * ey).toFixed(1);
        }).join('L');
        camins.push('<path d="' + d + '" fill="none" stroke="' +
          (mestra ? 'var(--corba-mestra)' : 'var(--corba)') + '" stroke-width="' +
          (mestra ? 1.6 : .9) + '" stroke-linecap="round" stroke-linejoin="round" opacity="' +
          (mestra ? .85 : .5) + '"/>');
      });
    });

    return '<svg class="relleu" viewBox="0 0 ' + amplada + ' ' + alcada +
           '" preserveAspectRatio="none" aria-hidden="true">' + camins.join('') + '</svg>';
  }

  /**
   * Corbes d'una franja de la pantalla d'avui.
   * El nombre de corbes surt del compliment: més compliment, més amunt.
   */
  function franja(pct, llavor) {
    var p = (pct === null || pct === undefined) ? 0 : Math.max(0, Math.min(100, pct));
    var n = 1 + Math.round((p / 100) * 5);          // d'1 a 6 corbes
    var camins = [];
    for (var i = 0; i < n; i++) {
      var y = 84 - (i * (72 / n)) - 6;
      var a = 5 + ((llavor + i * 7) % 6);           // amplitud estable per hàbit
      var f = 1 + ((llavor + i * 3) % 3);
      var d = 'M0 ' + y.toFixed(1);
      for (var x = 0; x <= 400; x += 20) {
        d += ' Q' + (x + 10) + ' ' + (y + (((x / 20 + i) % 2) ? -a : a) * f * .5).toFixed(1) +
             ' ' + (x + 20) + ' ' + y.toFixed(1);
      }
      var mestra = (i % 5 === 0);
      camins.push('<path d="' + d + '" fill="none" stroke="' +
        (mestra ? 'var(--corba-mestra)' : 'var(--corba)') + '" stroke-width="' +
        (mestra ? 1.5 : .9) + '"/>');
    }
    return '<svg class="corbes" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true">' +
           camins.join('') + '</svg>';
  }

  /** Símbol de mapa estable per a un hàbit, a partir del seu identificador. */
  var SIMBOLS = ['cim', 'font', 'refugi', 'fita', 'creu', 'cova', 'arbre', 'pont', 'gual', 'mina'];
  function simbol(id) {
    var h = 0;
    for (var i = 0; i < String(id).length; i++) h = (h * 31 + String(id).charCodeAt(i)) >>> 0;
    return SIMBOLS[h % SIMBOLS.length];
  }
  function llavor(id) {
    var h = 0;
    for (var i = 0; i < String(id).length; i++) h = (h * 17 + String(id).charCodeAt(i)) >>> 0;
    return h % 97;
  }

  /** Tinta hipsomètrica per a un percentatge de compliment. */
  function tinta(pct) {
    if (pct === null || pct === undefined) return 'var(--h0)';
    var b = ['--h1', '--h1', '--h2', '--h3', '--h4', '--h5', '--h6'];
    return 'var(' + b[Math.min(6, Math.floor(pct / 15))] + ')';
  }

  return { fullMes: fullMes, franja: franja, simbol: simbol, llavor: llavor, tinta: tinta };
})();
</script>

<script>
/* =========================================================================
   JEFE — el nucli
   L'esfera de partícules que és la cara de l'assistent.

   Quatre estats, i cadascun es veu diferent de lluny:
     repos      → gira lent, centre tranquil
     escoltant  → l'anell exterior s'obre i batega amb la teva veu
     pensant    → les partícules s'acceleren i el centre s'encén
     parlant    → l'ona de veu envolta el nucli

   Es dibuixa en canvas perquè són centenars de partícules per fotograma.
   Es pausa sol quan la pestanya no es veu: no cremarà bateria al mòbil.
   ========================================================================= */

var Nucli = (function () {

  var CIAN = '#4fd6e0', BLAU = '#2b7fd4', BLANC = '#dff6f9';

  function crea(contenidor) {
    var canvas = document.createElement('canvas');
    canvas.setAttribute('aria-hidden', 'true');
    canvas.style.cssText = 'display:block;width:100%;height:100%';
    contenidor.appendChild(canvas);

    var ctx = canvas.getContext('2d');
    var w = 0, h = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
    var particules = [], anells = [], t = 0, corrent = null;
    var estat = 'repos', energia = 0, energiaObjectiu = 0, nivellVeu = 0;
    var reduit = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    function mida() {
      var r = contenidor.getBoundingClientRect();
      w = Math.max(80, r.width); h = Math.max(80, r.height);
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function sembra() {
      particules = [];
      var n = Math.round(Math.min(320, Math.max(90, w * 0.7)));
      for (var i = 0; i < n; i++) {
        particules.push({
          a: Math.random() * Math.PI * 2,
          r: Math.pow(Math.random(), 0.65),          // més densitat al centre
          v: (0.0004 + Math.random() * 0.0022) * (Math.random() < 0.25 ? -1 : 1),
          mida: 0.5 + Math.random() * 1.5,
          fase: Math.random() * Math.PI * 2
        });
      }
      // Anells fragmentats, com les marques d'un radar
      anells = [
        { r: 0.94, gruix: 1.4, segments: 3, buit: 0.42, v: 0.00022, color: CIAN, alfa: 0.85 },
        { r: 0.86, gruix: 0.8, segments: 9, buit: 0.62, v: -0.00042, color: BLAU, alfa: 0.65 },
        { r: 0.70, gruix: 0.7, segments: 2, buit: 0.30, v: 0.00034, color: CIAN, alfa: 0.4 },
        { r: 0.55, gruix: 0.6, segments: 24, buit: 0.5, v: -0.0007, color: BLAU, alfa: 0.35 }
      ];
    }

    function arc(cx, cy, radi, d0, d1, color, gruix, alfa) {
      ctx.beginPath();
      ctx.arc(cx, cy, radi, d0, d1);
      ctx.strokeStyle = color; ctx.lineWidth = gruix;
      ctx.globalAlpha = alfa; ctx.stroke(); ctx.globalAlpha = 1;
    }

    function dibuixa() {
      ctx.clearRect(0, 0, w, h);
      var cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 2;

      energia += (energiaObjectiu - energia) * 0.06;
      var e = energia;

      // --- anells ---
      for (var i = 0; i < anells.length; i++) {
        var an = anells[i];
        var gir = t * an.v * (1 + e * 2.2);
        var pas = (Math.PI * 2) / an.segments;
        for (var s = 0; s < an.segments; s++) {
          var d0 = gir + s * pas;
          arc(cx, cy, R * an.r, d0, d0 + pas * (1 - an.buit), an.color,
              an.gruix * (1 + e * 0.5), an.alfa * (0.55 + e * 0.45));
        }
      }

      // --- marques radials, com les d'un radar ---
      var marques = 48;
      for (var m = 0; m < marques; m++) {
        var ang = (m / marques) * Math.PI * 2 + t * 0.00008;
        var llarg = (m % 6 === 0) ? 0.075 : 0.035;
        var r0 = R * 0.965, r1 = R * (0.965 + llarg * 0.4);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
        ctx.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
        ctx.strokeStyle = (m % 6 === 0) ? CIAN : BLAU;
        ctx.globalAlpha = (m % 6 === 0) ? 0.7 : 0.3;
        ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;
      }

      // --- núvol de partícules ---
      for (var p = 0; p < particules.length; p++) {
        var q = particules[p];
        q.a += q.v * (1 + e * 3.4);
        var respira = Math.sin(t * 0.0011 + q.fase) * (0.018 + e * 0.05);
        var rr = (q.r + respira) * R * 0.62;
        var x = cx + Math.cos(q.a) * rr, y = cy + Math.sin(q.a) * rr;
        var prox = 1 - q.r;
        ctx.beginPath();
        ctx.arc(x, y, q.mida * (0.7 + prox * 0.9 + e * 0.5), 0, Math.PI * 2);
        ctx.fillStyle = prox > 0.55 ? BLANC : CIAN;
        ctx.globalAlpha = (0.18 + prox * 0.6) * (0.55 + e * 0.45);
        ctx.fill(); ctx.globalAlpha = 1;
      }

      // --- el centre: el punt de llum ---
      var rc = R * (0.20 + e * 0.05 + Math.sin(t * 0.002) * 0.012);
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rc);
      g.addColorStop(0, 'rgba(240,253,255,' + (0.85 + e * 0.15) + ')');
      g.addColorStop(0.18, 'rgba(120,235,250,' + (0.7 + e * 0.3) + ')');
      g.addColorStop(0.55, 'rgba(43,127,212,' + (0.28 + e * 0.22) + ')');
      g.addColorStop(1, 'rgba(43,127,212,0)');
      ctx.beginPath(); ctx.arc(cx, cy, rc, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();

      // --- ona de veu: només quan escolta o parla ---
      if (nivellVeu > 0.01) {
        var punts = 96, base = R * 0.99;
        ctx.beginPath();
        for (var k = 0; k <= punts; k++) {
          var ak = (k / punts) * Math.PI * 2;
          var amp = Math.sin(ak * 7 + t * 0.006) * Math.sin(ak * 3 - t * 0.004);
          var rk = base + amp * nivellVeu * R * 0.07;
          var xk = cx + Math.cos(ak) * rk, yk = cy + Math.sin(ak) * rk;
          k ? ctx.lineTo(xk, yk) : ctx.moveTo(xk, yk);
        }
        ctx.closePath();
        ctx.strokeStyle = BLANC; ctx.lineWidth = 1.2;
        ctx.globalAlpha = 0.55 * nivellVeu; ctx.stroke(); ctx.globalAlpha = 1;
      }
    }

    function bucle(ara) {
      t = ara;
      if (nivellVeu > 0) nivellVeu *= 0.94;
      dibuixa();
      corrent = requestAnimationFrame(bucle);
    }

    function arrenca() {
      if (corrent || reduit) { if (reduit) dibuixa(); return; }
      corrent = requestAnimationFrame(bucle);
    }
    function atura() {
      if (corrent) { cancelAnimationFrame(corrent); corrent = null; }
    }

    var api = {
      /** 'repos' | 'escoltant' | 'pensant' | 'parlant' */
      estat: function (nou) {
        estat = nou;
        energiaObjectiu = nou === 'pensant' ? 1
                        : nou === 'parlant' ? 0.7
                        : nou === 'escoltant' ? 0.45 : 0.06;
        if (nou === 'escoltant' || nou === 'parlant') api.pols(0.8);
        return api;
      },
      /** Un cop d'energia: la veu, un missatge que arriba. */
      pols: function (n) { nivellVeu = Math.max(nivellVeu, Math.min(1, n || 0.6)); return api; },
      redimensiona: function () { mida(); sembra(); if (reduit) dibuixa(); },
      atura: atura,
      arrenca: arrenca,
      element: canvas
    };

    mida(); sembra(); arrenca();

    document.addEventListener('visibilitychange', function () {
      document.hidden ? atura() : arrenca();
    });

    return api;
  }

  return { crea: crea };
})();
</script>

<script>
/* JEFE — NUCLI · Pantalla d'inici
   És el full índex del mapa: quins fulls hi ha i què hi ha pendent a cadascun.
   Cada mòdul hi aporta una línia amb `resumInici()`. Un mòdul nou hi surt sol. */

App.registraVista('inici', {
  render: function (arrel) {

    function pinta(targetes, dEnCau) {
      var avui = fmt.avui();

      var html =
        '<header class="capcalera"><div class="capcalera-fila">' +
          '<div style="flex:1;min-width:0">' +
            '<p class="marge">' + esc(fmt.relativa(avui)) + '</p>' +
            '<h1>' + esc(fmt.llarga(avui)) + '</h1>' +
          '</div>' +
          '<div style="text-align:right">' +
            '<div class="escala" style="margin-left:auto"><i></i><i></i><i></i><i></i></div>' +
            '<p class="marge" style="margin:4px 0 0">JEFE</p>' +
          '</div>' +
          '<button class="btn btn-fantasma btn-icona" data-tema="1" aria-label="Clar o fosc">' +
            ic('ajust') + '</button>' +
        '</div></header>' +
        '<div class="pagina">';

      if (!targetes || !targetes.length) {
        html += '<div class="estat">' + ic('mapa', 'ic-g') +
          '<h2>Full en blanc</h2>' +
          '<p>Encara no hi ha res registrat. Comença pels hàbits: amb un de sol ' +
          'ja té sentit obrir això cada dia.</p>' +
          '<button class="btn btn-primari" data-ves="habits">' + ic('habits') + 'Comença</button></div>';
      } else {
        html += '<p class="marge" style="margin:0 0 var(--e2)">Situació</p><div class="terreny">';
        targetes.forEach(function (t) {
          var estat = t.error ? 'nofet' : (t.urgent ? 'pendent' : 'fet');
          html +=
            '<div class="franja-fila"><button class="franja" data-ves="' +
              esc(t.accio || t.modul) + '" data-estat="' + estat + '">' +
              Relleu.franja(t.urgent ? 25 : 90, Relleu.llavor(t.modul)) +
              '<svg class="ic ic-simbol" aria-hidden="true"><use href="#ic-' +
                esc(t.modul === 'habits' ? 'habits' : 'modul') + '"/></svg>' +
              '<span>' +
                '<span class="franja-nom">' + esc(t.etiqueta) + '</span>' +
                (t.error ? '<span class="franja-sota">No s\'ha pogut llegir</span>' : '') +
              '</span>' +
              '<span class="franja-cota"><span class="n">' + esc(t.valor) + '</span></span>' +
            '</button></div>';
        });
        html += '</div>';
      }

      if (dEnCau) html += '<p class="menut" style="margin-top:var(--e4)">Última còpia desada al telèfon.</p>';
      html += '</div>';
      arrel.innerHTML = html;

      arrel.querySelectorAll('[data-ves]').forEach(function (b) {
        b.addEventListener('click', function () { App.ves(b.dataset.ves); });
      });
      var bt = arrel.querySelector('[data-tema]');
      if (bt) bt.addEventListener('click', function () {
        var ordre = ['auto', 'clar', 'fosc'];
        var seg = ordre[(ordre.indexOf(App.temaActual()) + 1) % 3];
        App.aplicaTema(seg);
        App.brindis('Full ' + (seg === 'auto' ? 'automàtic' : seg === 'clar' ? 'de dia' : 'de nit'));
      });
    }

    var cau = Cau.get('inici', null);
    if (cau) pinta(cau.targetes, true);
    else arrel.innerHTML = '<div class="pagina"><div class="terreny">' +
      '<div class="esquelet franja-fantasma"></div><div class="esquelet franja-fantasma"></div>' +
      '</div></div>';

    crida('nucli', 'inici', {}).then(function (d) {
      Cau.set('inici', d); Cau.set('moduls', d.moduls); pinta(d.targetes, false);
    }).catch(function (err) {
      if (cau) { App.brindis('Sense connexió: dades del telèfon', 'error'); return; }
      arrel.innerHTML = Comp.error(err, true);
      var r = arrel.querySelector('[data-reintenta]');
      if (r) r.addEventListener('click', function () { App.ves('inici'); });
    });
  }
});
</script>

<style>
/* =========================================================================
   JEFE — sala de comandament
   Fons gairebé negre, quadrícula fina, nucli de partícules al centre,
   marc de cantonades i telemetria als marges.

   Diferència deliberada amb la referència: allà la telemetria és decorativa
   i il·legible. Aquí són dades teves de veritat —què ha consultat, quantes

@media (min-width: 900px) { .hud { top: 0; bottom: 0; padding-top: 0; } }

.hud::before {

.cantonada { position: absolute; width: 26px; height: 26px; pointer-events: none; z-index: 3; }

.cantonada.bg { bottom: 10px; left: 10px; border-bottom: 2px solid var(--cian); border-left: 2px solid var(--cian); }

/* ---------------------------------------------------------------- capçalera */

.hud-cap {

.llum { width: 7px; height: 7px; border-radius: 50%; background: var(--apagat); flex: none; }
.hud[data-estat="repos"]     .llum { background: var(--cian); box-shadow: 0 0 8px var(--cian); }
.hud[data-estat="pensant"]   .llum { background: var(--cian); box-shadow: 0 0 14px var(--cian); animation: bat .8s infinite; }

.hud[data-estat="apagat"]    .llum { background: var(--calent); }
@keyframes bat { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ------------------------------------------------------------------- cos */

.hud-cos { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; min-height: 0; }

.escenari { position: relative; flex: none; height: 34vh; min-height: 180px; max-height: 300px; }

.telemetria {

}

/* ------------------------------------------------------------- transcripció */

.transcripcio {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: var(--e3) var(--e5) var(--e4);
  display: flex; flex-direction: column; gap: var(--e4);

  mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
}
.torn { max-width: 70ch; }
.torn .qui { font-family: var(--mono); font-size: .5625rem; letter-spacing: .22em;

.traca { margin-top: var(--e2); font-family: var(--mono); font-size: .625rem;

.proposta { margin-top: var(--e3); border: 1px solid var(--calent);
            background: rgba(232,163,60,.08); padding: var(--e3) var(--e4); }
.proposta p { margin: 0 0 var(--e3); font-size: .9375rem; }
.proposta .accions { display: flex; gap: var(--e2); }
.proposta button { min-height: 44px; padding: 0 var(--e4); font: inherit; font-size: .875rem;
                   font-weight: 600; border: 1px solid var(--linia); background: transparent; color: var(--clar); }
.proposta button[data-si] { background: var(--calent); border-color: var(--calent); color: #171104; }

.avis-apagat { margin: var(--e4) var(--e5); padding: var(--e4); border: 1px solid var(--calent);
               background: rgba(232,163,60,.07); font-size: .875rem; line-height: 1.55; }
.avis-apagat strong { display: block; margin-bottom: var(--e2); color: var(--calent);
                      font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; font-size: .75rem; }
.hud code { font-family: var(--mono); background: var(--fosc); border: 1px solid var(--linia);
            padding: 1px 5px; color: var(--cian); }

/* ------------------------------------------------------------------ entrada */

.hud-entrada { position: relative; z-index: 2; flex: none;
               border-top: 1px solid var(--linia); background: rgba(7,16,25,.85);
               padding: var(--e3) var(--e5) calc(var(--e3) + env(safe-area-inset-bottom, 0px)); }
/* Barra del que està sentint. Sense això no pots saber si el micròfon
   t'ha sentit, t'ha entès una altra cosa, o directament ha petat. */
.oida { display: flex; align-items: center; gap: var(--e2); margin-bottom: var(--e3);
        padding: var(--e2) var(--e3); border: 1px solid var(--alerta);
        background: rgba(239,95,82,.08); font-family: var(--mono); font-size: .6875rem; }
.oida-text { flex: 1; min-width: 0; color: var(--clar); overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
.oida[data-error="1"] { border-color: var(--calent); background: rgba(232,163,60,.1); }
.oida[data-error="1"] .oida-text { color: var(--calent); white-space: normal; }
.oida-clau { flex: none; min-height: 32px; padding: 0 var(--e2); border: 1px solid var(--linia);
             background: transparent; color: var(--apagat); font: inherit; font-size: .625rem; }
.oida-clau[aria-pressed="true"] { color: var(--cian); border-color: var(--cian); }

.ona { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
.ona i { width: 3px; background: var(--alerta); animation: ona .9s ease-in-out infinite; }
.ona i:nth-child(1) { height: 40%; animation-delay: 0s; }
.ona i:nth-child(2) { height: 90%; animation-delay: .15s; }
.ona i:nth-child(3) { height: 60%; animation-delay: .3s; }
.ona i:nth-child(4) { height: 100%; animation-delay: .45s; }
@keyframes ona { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

.pistes { display: flex; gap: var(--e2); overflow-x: auto; padding-bottom: var(--e3); scrollbar-width: none; }

.fila { display: flex; align-items: flex-end; gap: var(--e2); }

.fila textarea:focus { outline: none; border-color: var(--cian); box-shadow: 0 0 0 1px var(--cian); }

.bt { flex: none; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--linia); background: transparent; color: var(--clar); }
.bt[data-primari] { border-color: var(--cian); color: var(--cian); }
.bt:disabled { opacity: .3; }
.bt[data-actiu="1"] { border-color: var(--alerta); color: var(--alerta);
                      animation: pulsa2 1.1s ease-in-out infinite; }
@keyframes pulsa2 { 0%,100% { box-shadow: 0 0 0 0 rgba(239,95,82,.45); }
                    50% { box-shadow: 0 0 0 9px rgba(239,95,82,0); } }
.bt-p { width: 44px; height: 44px; border-color: transparent; }
.bt-p[aria-pressed="true"] { color: var(--cian); }

@media (min-width: 900px) {
  .hud-cos { flex-direction: row; }
