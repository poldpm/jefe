   en un rectangle de 48 px d'alt i amplada sencera. Es veia als taulers de
   tasques («Prioritària») i del calendari («Tot el dia»): un bloc fosc surant
   sobre l'etiqueta.
   I el `textarea` no hi era: les notes es pintaven sense estil, petites i
   desalineades, al costat de camps que sí que en tenien. */
.form-ajustos input:not([type="checkbox"]),
.form-ajustos select,
.form-ajustos textarea {
  width: 100%; min-height: var(--toc);
  margin-top: var(--e1); padding: var(--e2) var(--e3);
  font: inherit; background: var(--paper);
  color: var(--ink); border: 1px solid var(--neatline);
  border-radius: var(--r); -webkit-appearance: none; appearance: none;
}
.form-ajustos input:not([type="checkbox"]) { padding: 0 var(--e3); }
.form-ajustos textarea { line-height: 1.5; resize: vertical; }
/* El ring de teclat, a part: apagar-lo deixava qui va amb tabulador sense
   saber on es, i el canvi de color d'una vora d'un pixel no compta. */
.form-ajustos input:focus-visible, .form-ajustos select:focus-visible,
.form-ajustos textarea:focus-visible { outline: 3px solid var(--utm); outline-offset: 1px; }
.form-ajustos input:focus, .form-ajustos select:focus, .form-ajustos textarea:focus {
  border-color: var(--utm);
}
.form-ajustos hr { border: 0; border-top: 3px double var(--neatline); margin: var(--e4) 0; }

/* Els botons d'un tauler van un sota l'altre i a amplada sencera. Un «Desa» i
   un «Treu-la» de costat, a més d'estrets, posen a la mateixa alçada i amb la
   mateixa pinta la cosa que vols fer i la que no vols fer mai sense pensar. */
.form-ajustos > button { width: 100%; }

/* -------------------------------------------------------------------- modal */

.fosc { position: fixed; inset: 0; z-index: 50; background: rgba(14,18,20,.6);
        display: flex; align-items: flex-end; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity .2s linear; }
.fosc[data-obert="1"] { opacity: 1; pointer-events: auto; }
.modal { width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto;
         background: var(--paper); border: 1.5px solid var(--neatline); border-bottom: 0;
         padding: var(--e4) var(--e4) calc(var(--e5) + env(safe-area-inset-bottom, 0px));
         transform: translateY(100%); transition: transform .32s var(--sortida); }
.fosc[data-obert="1"] .modal { transform: translateY(0); }
.modal-cap { display: flex; align-items: center; gap: var(--e3);
             margin-bottom: var(--e4); padding-bottom: var(--e3);
             border-bottom: 3px double var(--neatline); }
.modal-cap h2 { flex: 1; }
@media (min-width: 900px) {
  .fosc { align-items: center; }
  .modal { border-bottom: 1.5px solid var(--neatline); max-height: 84vh; }
}

.selector-data { display: flex; align-items: center; gap: var(--e2); }
.selector-data .data { flex: 1; text-align: center; }

.tira { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: var(--e3); }
.tira .xifra-gran { font-size: 1.75rem; line-height: 1; font-weight: 700;
                    font-style: italic; color: var(--corba-mestra); }

/* =========================================================================
   DISPOSICIÓ AMPLA — ha d'anar AL FINAL del full
   Si aquest bloc va abans de les regles base, la cascada les barreja: el
   `position` es perd però el `top` sobreviu, i la navegació es converteix en
   una capa fixa de pantalla sencera que tapa el contingut. Va passar.
   ========================================================================= */

@media (min-width: 900px) {
  /* El cos passa a columna per poder posar la navegació a dalt sense
     moure-la del final del document (que és on ha de ser per al teclat). */
  body { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: var(--e6); }
  #sense-xarxa, #pendents { order: -2; }
  .nav { order: -1; }
  main#vista { order: 0; flex: 1; display: flex; flex-direction: column; }
  /* La capsa de la vista ha de créixer com creixia la vista quan pintava
     directament a `#vista`. Vegeu `App.ves`: ara cada render té la seva. */
  .vista-capsa { flex: 1; min-height: 0; }

  .pagina { padding: var(--e5) var(--e5) var(--e7); }
  .dues-columnes { grid-template-columns: minmax(320px, 380px) 1fr; align-items: start; }

  /* A l'escriptori hi cap tot alhora: xifres i tancament a l'esquerra, els
     àpats a la dreta. Al mòbil manen l'ordre i l'espai; aquí, la vista de
     conjunt.

     `grid-template-rows: auto 1fr` és el que enganxa el tancament just sota

      return Promise.reject(e);
    }
    return fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ clau: cfg.clau, modul: modul, accio: accio, params: params || {} })
    })
    .then(function (r) {
      if (!r.ok) { var e = new Error('El servidor ha respost ' + r.status + '.'); e.xarxa = true; throw e; }
      return r.json();
    })
    .then(function (r) {
      App.enLinia(true);
      if (r && r.ok) return r.dades;
      var err = new Error((r && r.error) || 'El servidor ha respost sense dades.');
      err.api = true;
      if (/clau d'accés/i.test(err.message)) err.clauDolenta = true;
      throw err;
    })
    .catch(function (err) {
      if (!err.api && !err.senseServidor) { App.enLinia(false); err.xarxa = true; }
      throw err;
    });
  }

  function crida(modul, accio, params) {
    return dinsAppsScript() ? cridaLocal_(modul, accio, params)
                            : cridaRemota_(modul, accio, params);
  }

  /**
   * ESCRIURE I TORNAR AMB LA PANTALLA JA REFETA, EN UN SOL VIATGE.
   *
   * `crida(...).then(carrega)` són dues anades al servidor, i a Apps Script
   * cada anada costa un segon i mig facis el que facis. Amb això se'n fa una:
   * el servidor desa i, abans de contestar, torna a muntar la pantalla.
   *
   * Es resol AMB LA PANTALLA, no amb el que ha tornat l'escriptura. Si el que
   * et cal és això altre, fes servir `crida` de tota la vida.
   */
  function escriu(modul, accio, params, paramsPantalla) {
    var p = {};
    for (var k in (params || {})) p[k] = params[k];
    p._pantalla = paramsPantalla || {};

    return crida(modul, accio, p).then(function (r) {
      return (r && r._pantalla !== undefined) ? r._pantalla : r;
    });
  }

  // ------------------------------------------------- cua d'escriptures pendents

  var Cua = {
    tot: function () { return Cau.get('cua', []); },

    afegeix: function (modul, accio, params, clau) {
      var cua = Cua.tot();
      // Una sola entrada per clau: tocar cinc cops el mateix hàbit desa un cop.
      if (clau) cua = cua.filter(function (i) { return i.clau !== clau; });
      cua.push({ modul: modul, accio: accio, params: params, clau: clau || null, ts: Date.now() });
      Cau.set('cua', cua);
      App.pintaPendents();
    },

    /** Envia la cua en sèrie. Si una falla per xarxa, s'atura i la conserva. */
    envia: function () {
      var cua = Cua.tot();
      if (!cua.length) return Promise.resolve(0);

      var enviades = 0;
      return cua.reduce(function (cadena, item) {
        return cadena.then(function () {
          return crida(item.modul, item.accio, item.params).then(function () {
            enviades++;
            var resta = Cua.tot().filter(function (i) { return i.ts !== item.ts; });
            Cau.set('cua', resta);
            App.pintaPendents();
          });
        });
      }, Promise.resolve()).then(function () { return enviades; })
        .catch(function (err) {
          if (err.api) {
            // El servidor l'ha rebutjada: reintentar-la eternament no la salvarà.
            Cau.set('cua', []);
            App.pintaPendents();
            App.brindis('No s\'ha pogut desar: ' + err.message, 'error');
          }
          return enviades;
        });
    }
  };

  // -------------------------------------------------------------- components

  var Comp = {
    carregant: function (files) {
      var n = files || 4, h = '<div class="marques" aria-busy="true" aria-label="Carregant">';
      for (var i = 0; i < n; i++) h += '<div class="esquelet marca-fantasma"></div>';
      return h + '</div>';
    },

    buit: function (titol, text, botoHtml) {
      return '<div class="estat">' + ic('habits', 'ic-g') +
             '<h2>' + esc(titol) + '</h2>' +
             '<p>' + esc(text) + '</p>' + (botoHtml || '') + '</div>';
    },

    error: function (err, reintenta) {
      var esXarxa = err && err.xarxa;
      return '<div class="estat">' + ic(esXarxa ? 'sense-xarxa' : 'avis', 'ic-g') +
             '<h2>' + (esXarxa ? 'Sense connexió' : 'Alguna cosa ha fallat') + '</h2>' +
             '<p>' + esc(err && err.message ? err.message : String(err)) + '</p>' +
             (reintenta ? '<button class="btn btn-secundari" data-reintenta="1">Torna-ho a provar</button>' : '') +
             '</div>';
    },

    avis: function (titol, text) {
      return '<div class="avis">' + ic('avis') +
             '<div><strong>' + esc(titol) + '</strong>' + esc(text) + '</div></div>';
    },

    targeta: function (contingut) { return '<div class="targeta">' + contingut + '</div>'; }
  };

  // --------------------------------------------------------------- aplicació

  var App = {
    vistes: {},
    actual: null,
    moduls: [],
    enLiniaEstat: true,

    registraVista: function (id, def) { App.vistes[id] = def; },

    arrenca: function (estatInicial) {
      App.moduls = (estatInicial && estatInicial.moduls) || Cau.get('moduls', []);
      App.pintaNav();
      /* Fosc sempre, no «segons el que digui el sistema». Amb «auto», el
         mateix JEFE sortia blanc al mòbil i fosc al PC segons com tingués
         cadascun la configuració, i això no és una app: són dues. La sala de
         comandament ja és fosca; la resta l'ha d'acompanyar.

         Canviar el valor per defecte no n'hi ha prou: als aparells on ja s'ha
         obert l'app hi ha un «auto» desat, i el que hi ha desat mana. Per això
         es migra aquí. Queda el canvi manual a clar per si algun dia el sol de
         cara ho demana, però no tornarà a decidir-ho el sistema. */
      var tema = Cau.get('tema', 'fosc');
      if (tema === 'auto') { tema = 'fosc'; Cau.set('tema', tema); }
      App.aplicaTema(tema);

      /* ELS VIGILANTS ES REGISTREN SEMPRE, i abans de res.
         Abans, si encara no hi havia clau d'accés, aquesta funció sortia aquí
         mateix per demanar-la. Amb la sortida se n'anava tot el que ve
         després: el botó d'enrere del mòbil, la cua del que s'ha d'enviar
         quan torni la cobertura, i el detectar que has recuperat la xarxa.
         I un cop posaves la clau ja no es tornava a arrencar, o sigui que
         l'app es quedava coixa la resta de la sessió sense dir-ho.

         Registrar-los no costa res ni depèn de tenir servidor. El que depèn
         del servidor és què s'ensenya, i això va més avall. */
      window.addEventListener('popstate', function (ev) {
        var id = (ev.state && ev.state.vista) || 'conversa';
        App.ves(App.vistes[id] ? id : 'conversa', null, true);
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) Cua.envia();
      });
      window.addEventListener('online', function () { App.enLinia(true); Cua.envia(); });
      window.addEventListener('offline', function () { App.enLinia(false); });

      // Servida des de fora i encara sense servidor: primer connectar.
      if (!dinsAppsScript() && !Servidor.config()) {
        App.ves('conversa');
        setTimeout(function () { App.connecta(); }, 300);
        return;
      }

      // La conversa és la pantalla d'arrencada: és l'assistent, no el formulari.
      // I SEMPRE, encara que ahir sortissis d'una altra vista. Recordar l'última
      // vista convertia qualsevol pantalla sense sortida en una trampa que ni
      // reinstal·lant l'app es desfeia, perquè la cau sobreviu a la instal·lació.
      //
      // L'única excepció és una destinació demanada explícitament a l'adreça,
      // que és com arriben les notificacions: tocar «falten les cremades» ha
      // de dur a Nutrició i no a la conversa. Es consumeix i prou: no es desa.
      var demanada = String(location.hash || '').replace(/^#/, '');
      if (demanada && App.vistes[demanada]) {
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
        App.ves(demanada);
      } else {
        App.ves(App.vistes.conversa ? 'conversa' : 'inici');
      }

      Cua.envia();

      // Refresca la llista de mòduls en segon pla: un mòdul nou apareix sol.
      crida('nucli', 'inici', {}).then(function (d) {
        Cau.set('moduls', d.moduls);
        if (JSON.stringify(d.moduls) !== JSON.stringify(App.moduls)) {
          App.moduls = d.moduls; App.pintaNav();
        }
      }).catch(function () { /* sense connexió: seguim amb la cau */ });
    },

    ves: function (id, params, sensePila) {
      var def = App.vistes[id];
      if (!def) { id = 'inici'; def = App.vistes.inici; }

      // El botó d'enrere del mòbil ha de funcionar: és el primer que prems quan
      // vols sortir d'algun lloc. Només apilem els canvis de vista, no els de
      // dins d'una vista (canviar de dia no és navegar).
      if (!sensePila && App.actual && App.actual !== id) {
        try { history.pushState({ vista: id }, ''); } catch (e) { /* no és cap error */ }
      }

      App.actual = id;

      document.querySelectorAll('.nav a').forEach(function (a) {
        if (a.dataset.vista === id) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });

      /* CADA VISTA PINTA A LA SEVA PRÒPIA CAPSA, I NO AL CONTENIDOR.
         -----------------------------------------------------------------
         Abans totes rebien el mateix `#vista`. Una petició al servidor triga
         un segon i mig, i si en aquell segon i mig canviaves de pantalla, la
         resposta de la que havies deixat arribava i s'escrivia al mateix
         `#vista` —que ara era d'una altra vista— i te la tornava a plantar
         al davant. Des de fora: obres un apartat, en surts, i al cap d'uns
         segons se't torna a obrir sol.

         Amb una capsa per render, la vista vella escriu a un tros de DOM que
         ja no penja d'enlloc: no es veu, i a més `arrel.isConnected` passa a
         ser fals, que és el que les vistes ja miren per no fer feina de
         franc. Val per a totes, i per a les que es facin d'ara endavant. */
      var contenidor = document.getElementById('vista');
      contenidor.innerHTML = '';
      var arrel = document.createElement('div');
      arrel.className = 'vista-capsa';
      contenidor.appendChild(arrel);

      window.scrollTo(0, 0);
      try { def.render(arrel, params || {}); }
      catch (err) { arrel.innerHTML = Comp.error(err, false); }
    },

    refresca: function () { App.ves(App.actual); },

    /**
     * ESTÀS TOCANT ALGUNA COSA ARA MATEIX?
     *
     * Les vistes es pinten dues vegades: primer amb el que hi havia desat i
     * després amb el que arriba del servidor. Aquesta segona vegada refà
     * l'HTML, i si en aquell moment tenies un desplegable obert o estaves
     * escrivint, allò desapareix: el menú es tanca sol i el que havies teclejat
     * es perd. Abans de repintar, es pregunta.
     */
    interactuant: function () {
      var a = document.activeElement;
      if (!a) return false;
      if (document.getElementById('fosc').dataset.obert === '1') return true;
      var t = a.tagName;
      return t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || a.isContentEditable;
    },

    pintaNav: function () {
      var nav = document.getElementById('nav');
      if (!nav) return;                    // sense barra de seccions: no és cap error
      var items = [{ id: 'inici', nom: 'Inici', icona: 'inici' }].concat(
        App.moduls.filter(function (m) { return m.teVista; })
      );
      nav.innerHTML = items.map(function (m) {
        return '<a href="#" data-vista="' + esc(m.id) + '">' +
               ic(m.icona || 'modul') + '<span>' + esc(m.nom) + '</span></a>';
      }).join('');
      nav.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function (ev) { ev.preventDefault(); App.ves(a.dataset.vista); });
      });
    },

    // ------------------------------------------------------------ indicadors

    enLinia: function (si) {
      if (App.enLiniaEstat === si) return;
      App.enLiniaEstat = si;
      document.getElementById('sense-xarxa').hidden = si;
    },

    pintaPendents: function () {
      var n = Cua.tot().length;
      var el = document.getElementById('pendents');
      el.hidden = n === 0;
      el.textContent = n === 1 ? '1 canvi pendent de desar' : n + ' canvis pendents de desar';
    },

    brindis: function (text, tipus) {
      var el = document.getElementById('brindis');
      el.innerHTML = ic(tipus === 'error' ? 'avis' : 'fet') + '<span>' + esc(text) + '</span>';
      el.dataset.to = tipus || 'ok';
      el.dataset.visible = '1';
      clearTimeout(App._brindis);
      App._brindis = setTimeout(function () { el.dataset.visible = '0'; }, tipus === 'error' ? 5000 : 2600);
    },

    // ---------------------------------------------------------------- modal

    modal: function (titol, html, alTancar) {
      var fosc = document.getElementById('fosc');
      // Qui l'ha obert: en tancar-lo, el focus hi ha de tornar.
      App._quiObria = document.activeElement;
      fosc.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(titol) + '">' +
          '<div class="modal-cap"><h2>' + esc(titol) + '</h2>' +
          '<button class="btn btn-fantasma btn-icona" data-tanca="1" aria-label="Tanca">' + ic('tancar') + '</button></div>' +
          html +
        '</div>';
      fosc.dataset.obert = '1';
      App._alTancar = alTancar || null;

      fosc.querySelector('[data-tanca]').addEventListener('click', App.tancaModal);
      fosc.addEventListener('click', function (ev) { if (ev.target === fosc) App.tancaModal(); });

      var primer = fosc.querySelector('input, select, textarea, button:not([data-tanca])');
      if (primer && primer.type !== 'button') setTimeout(function () { primer.focus(); }, 320);
      return fosc.querySelector('.modal');
    },

    tancaModal: function () {
      var fosc = document.getElementById('fosc');
      fosc.dataset.obert = '0';

      /* EL FOCUS HA DE SORTIR D'AQUÍ ABANS QUE EL TAULER, i tornar a qui
         l'obria. Sense això passaven dues coses, i totes dues es veien:
         llegit en veu alta, quedaves dins d'un diàleg que ja no hi és; i
         `interactuant()` seguia dient que sí durant tot el temps que el camp
         encara existís, o sigui que qualsevol pantalla que esperés a
         repintar-se «quan paris de tocar coses» no es repintava mai —el
         calendari, canviant quins mires, no s'assabentava del canvi—. */
      var dins = document.activeElement;
      if (dins && fosc.contains(dins)) { try { dins.blur(); } catch (e) {} }
      var obria = App._quiObria;
      App._quiObria = null;
      if (obria && obria.isConnected && typeof obria.focus === 'function') {
        try { obria.focus({ preventScroll: true }); } catch (e) {}
      }

      setTimeout(function () { if (fosc.dataset.obert !== '1') fosc.innerHTML = ''; }, 340);
      if (App._alTancar) { var f = App._alTancar; App._alTancar = null; f(); }
    },

    // ----------------------------------------------------------------- tema

    /**
     * Pantalla de connexió. Només surt quan la interfície se serveix des de
     * fora d'Apps Script i encara no sap a quin servidor ha de parlar.
     * La clau es desa al navegador i no viatja enlloc més que al teu propi
     * desplegament.
     */
    connecta: function (motiu) {
      var cfg = Servidor.config() || {};
      var cos = App.modal('Connecta JEFE',
        (motiu ? '<div class="avis" style="margin-bottom:var(--e4)">' + esc(motiu) + '</div>' : '') +
        '<label class="camp"><span>URL del desplegament</span>' +
          '<input class="entrada" id="c-url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" ' +
          'value="' + esc(cfg.url || '') + '"></label>' +
        '<label class="camp"><span>Clau d\'accés</span>' +
          '<input class="entrada" id="c-clau" type="password" autocomplete="off" ' +
          'placeholder="la que t\'ha donat generaClauAcces()" value="' + esc(cfg.clau || '') + '"></label>' +
        '<p class="menut" style="margin:0 0 var(--e4)">La clau es desa només en aquest ' +
          'navegador. No surt d\'aquí excepte cap al teu propi servidor.</p>' +
        '<button class="btn btn-primari btn-ple" data-connecta="1">Connecta</button>');

      cos.querySelector('[data-connecta]').addEventListener('click', function (ev) {
        var url = cos.querySelector('#c-url').value.trim();
        var clau = cos.querySelector('#c-clau').value.trim();
        if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
          App.brindis('L\'URL ha d\'acabar en /exec', 'error'); return;
        }
        if (clau.length < 20) { App.brindis('La clau sembla massa curta', 'error'); return; }

        ev.currentTarget.dataset.carregant = '1';
        Servidor.desa(url, clau);
        crida('nucli', 'ping', {})
          .then(function () { App.tancaModal(); App.brindis('Connectat'); App.refresca(); })
          .catch(function (err) {
            ev.currentTarget.dataset.carregant = '0';
            Servidor.esborra();
            App.brindis(err.clauDolenta ? 'La clau no és correcta' : err.message, 'error');
          });
      });
    },

    aplicaTema: function (tema) {
      Cau.set('tema', tema);
      if (tema === 'auto') document.documentElement.removeAttribute('data-tema');
      else document.documentElement.setAttribute('data-tema', tema);
    },

    temaActual: function () { return Cau.get('tema', 'fosc'); }
  };

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && document.getElementById('fosc').dataset.obert === '1') App.tancaModal();
  });

  return { App: App, Comp: Comp, Cau: Cau, Cua: Cua, crida: crida, escriu: escriu,
           esc: esc, ic: ic, fmt: fmt, Servidor: Servidor, dinsAppsScript: dinsAppsScript };
})();

var App = Jefe.App, Comp = Jefe.Comp, Cau = Jefe.Cau, Cua = Jefe.Cua;
var crida = Jefe.crida, escriu = Jefe.escriu;
var esc = Jefe.esc, ic = Jefe.ic, fmt = Jefe.fmt;
var Servidor = Jefe.Servidor, dinsAppsScript = Jefe.dinsAppsScript;
</script>

<script>
/* =========================================================================
   JEFE — relleu
   Genera les corbes de nivell del mapa a partir de les teves dades.

   No és una textura ni una imatge de fons: és un camp escalar construït
   amb el teu compliment i recorregut amb «marching squares», el mateix
   algorisme amb què es dibuixen les corbes d'un full topogràfic real.
   Com més compliment, més amunt; les corbes es tanquen al voltant dels
   períodes bons i s'obren a les valls.
   ========================================================================= */

var Relleu = (function () {

  /* ---- taula de marching squares -------------------------------------- */
  var CASOS = {
    1:[3,2], 2:[2,1], 3:[3,1], 4:[0,1], 5:[0,3,2,1], 6:[0,2], 7:[0,3],
    8:[0,3], 9:[0,2], 10:[0,1,2,3], 11:[0,1], 12:[3,1], 13:[2,1], 14:[3,2]
  };

  /**
   * Isolínies d'un camp escalar.
   * camp: Float64Array de files*cols · retorna segments en coordenades de graella
   */
  function isolinies(camp, files, cols, nivell) {
    var segs = [];
    for (var r = 0; r < files - 1; r++) {
      for (var c = 0; c < cols - 1; c++) {
        var a = camp[r * cols + c],       b = camp[r * cols + c + 1],
            d = camp[(r + 1) * cols + c + 1], e = camp[(r + 1) * cols + c];
        var idx = (a > nivell ? 8 : 0) | (b > nivell ? 4 : 0) |
                  (d > nivell ? 2 : 0) | (e > nivell ? 1 : 0);
        if (idx === 0 || idx === 15) continue;

        function t(v1, v2) { var dd = v2 - v1; return dd === 0 ? .5 : (nivell - v1) / dd; }
        var punts = [
          { x: c + t(a, b), y: r },          // 0 dalt
          { x: c + 1, y: r + t(b, d) },      // 1 dreta
          { x: c + t(e, d), y: r + 1 },      // 2 baix
          { x: c, y: r + t(a, e) }           // 3 esquerra
        ];
        var cas = CASOS[idx];
        for (var i = 0; i < cas.length; i += 2) segs.push([punts[cas[i]], punts[cas[i + 1]]]);
      }
    }
    return segs;
  }

  /** Encadena els segments solts en polilínies contínues. */
  function encadena(segs) {
    var clau = function (p) { return p.x.toFixed(3) + ',' + p.y.toFixed(3); };
    var mapa = {}, usats = new Array(segs.length);
    segs.forEach(function (s, i) {
      [clau(s[0]), clau(s[1])].forEach(function (k) {
        (mapa[k] = mapa[k] || []).push(i);
      });
    });

    var linies = [];
    for (var i = 0; i < segs.length; i++) {
      if (usats[i]) continue;
      usats[i] = true;
      var linia = [segs[i][0], segs[i][1]];
      // creix pels dos extrems
      for (var dir = 0; dir < 2; dir++) {
        var guarda = 0;
        while (guarda++ < 4000) {
          var extrem = dir === 0 ? linia[linia.length - 1] : linia[0];
          var veins = mapa[clau(extrem)] || [];
          var seg = -1;
          for (var v = 0; v < veins.length; v++) if (!usats[veins[v]]) { seg = veins[v]; break; }
          if (seg === -1) break;
          usats[seg] = true;
          var s = segs[seg];
          var seguent = (clau(s[0]) === clau(extrem)) ? s[1] : s[0];
          if (dir === 0) linia.push(seguent); else linia.unshift(seguent);
        }
      }
      if (linia.length > 2) linies.push(linia);
    }
    return linies;
  }

  /**
   * Converteix una polilínia en una corba suau.
   *
   * Marching squares retorna trams rectes entre les vores de cada cel·la, i
   * això deixa cantonades punxegudes que una corba de nivell real no té.
   * Aquí es fan dues coses:
   *
   *   1. ALLEUGERIR: es queda un punt de cada `salt`. Els punts massa junts
   *      són els que porten el ziga-zaga de la graella; treure'ls elimina la
   *      causa en comptes de dissimular-la.
   *   2. SPLINE de Catmull-Rom passada a Bézier cúbica. La corba passa per
   *      tots els punts que queden i entra i surt de cadascun amb la mateixa
   *      direcció, que és el que la fa contínua a la vista.
   *
   * Es respecta si la línia és tancada: en una corba de nivell tancada, el
   * punt d'unió no s'ha de notar.
   */
  function camiSuau(punts, ex, ey, salt) {
    salt = salt || 2;

    var tancada = punts.length > 3 &&
      Math.abs(punts[0].x - punts[punts.length - 1].x) < 1e-6 &&
      Math.abs(punts[0].y - punts[punts.length - 1].y) < 1e-6;

    // 1. Alleugerir, conservant sempre l'últim punt
    var p = [];
    for (var i = 0; i < punts.length; i += salt) p.push(punts[i]);
    if (p[p.length - 1] !== punts[punts.length - 1]) p.push(punts[punts.length - 1]);
    if (tancada && p.length > 2) p.pop();               // el tancament el fa la Z
    if (p.length < 3) return null;

    var X = function (n) { return (n.x * ex).toFixed(2); };
    var Y = function (n) { return (n.y * ey).toFixed(2); };
    var v = function (i) {                              // índex amb voltes si és tancada
      var n = p.length;
      return tancada ? p[((i % n) + n) % n] : p[Math.max(0, Math.min(n - 1, i))];
    };

    // 2. Catmull-Rom → Bézier. 1/6 és la tensió estàndard; una mica menys
    //    evita que la corba es passi de llarg als revolts tancats.
    var T = 0.16;
    var d = 'M' + X(p[0]) + ' ' + Y(p[0]);
    var fins = tancada ? p.length : p.length - 1;

    for (var j = 0; j < fins; j++) {
      var p0 = v(j - 1), p1 = v(j), p2 = v(j + 1), p3 = v(j + 2);
      var c1 = { x: p1.x + (p2.x - p0.x) * T, y: p1.y + (p2.y - p0.y) * T };
      var c2 = { x: p2.x - (p3.x - p1.x) * T, y: p2.y - (p3.y - p1.y) * T };
      d += 'C' + X(c1) + ' ' + Y(c1) + ',' + X(c2) + ' ' + Y(c2) + ',' + X(p2) + ' ' + Y(p2);
    }

    return d + (tancada ? 'Z' : '');
  }

  /** Camp suau a partir d'una matriu gruixuda (files x cols de 0..1). */
  function camp(matriu, files, cols, sub) {
    sub = sub || 4;
    var F = (files - 1) * sub + 1, C = (cols - 1) * sub + 1;
    var out = new Float64Array(F * C);

    for (var r = 0; r < F; r++) {
      for (var c = 0; c < C; c++) {
        var fr = r / sub, fc = c / sub;
        var r0 = Math.floor(fr), c0 = Math.floor(fc);
        var r1 = Math.min(files - 1, r0 + 1), c1 = Math.min(cols - 1, c0 + 1);
        var tr = fr - r0, tc = fc - c0;
        var v = matriu[r0][c0] * (1 - tr) * (1 - tc) + matriu[r0][c1] * (1 - tr) * tc +
                matriu[r1][c0] * tr * (1 - tc) + matriu[r1][c1] * tr * tc;
        out[r * C + c] = v;
      }
    }
    // dues passades de suavitzat: sense això les corbes surten angulars
    for (var p = 0; p < 2; p++) {
      var copia = out.slice();
      for (var y = 1; y < F - 1; y++) for (var x = 1; x < C - 1; x++) {
        out[y * C + x] = (copia[y * C + x] * 4 + copia[(y - 1) * C + x] + copia[(y + 1) * C + x] +
                          copia[y * C + x - 1] + copia[y * C + x + 1]) / 8;
      }
    }
    return { dades: out, files: F, cols: C };
  }

  /**
   * SVG del relleu del full de mes.
   * matriu[fila][columna] amb valors 0..1 (1 = fet, .5 = no exigit, 0 = no fet)
   */
  function fullMes(matriu, amplada, alcada) {
    if (!matriu.length || !matriu[0].length) return '';
    var files = matriu.length, cols = matriu[0].length;
    if (files < 2 || cols < 2) return '';

    var c = camp(matriu, files, cols, 4);
    var ex = amplada / (c.cols - 1), ey = alcada / (c.files - 1);
    var nivells = [.2, .35, .5, .65, .8];
    var camins = [];

    nivells.forEach(function (n, i) {
      var linies = encadena(isolinies(c.dades, c.files, c.cols, n));
      var mestra = (i === 2);                 // la corba mestra, més gruixuda
      linies.forEach(function (l) {
        var d = camiSuau(l, ex, ey, 2);
        if (!d) return;
        camins.push('<path d="' + d + '" fill="none" stroke="' +
          (mestra ? 'var(--corba-mestra)' : 'var(--corba)') + '" stroke-width="' +
          (mestra ? 1.6 : .9) + '" stroke-linecap="round" stroke-linejoin="round" opacity="' +
          (mestra ? .85 : .5) + '"/>');
      });
    });

    return '<svg class="relleu" viewBox="0 0 ' + amplada + ' ' + alcada +
           '" preserveAspectRatio="none" aria-hidden="true">' + camins.join('') + '</svg>';
  }

  /**
   * Corbes d'una franja de la pantalla d'avui.
   * El nombre de corbes surt del compliment: més compliment, més amunt.
   */
  function franja(pct, llavor) {
    var p = (pct === null || pct === undefined) ? 0 : Math.max(0, Math.min(100, pct));
    var n = 1 + Math.round((p / 100) * 5);          // d'1 a 6 corbes
    var camins = [];
    for (var i = 0; i < n; i++) {
      var y = 84 - (i * (72 / n)) - 6;
      var a = 5 + ((llavor + i * 7) % 6);           // amplitud estable per hàbit
      var f = 1 + ((llavor + i * 3) % 3);
      var d = 'M0 ' + y.toFixed(1);
      for (var x = 0; x <= 400; x += 20) {
        d += ' Q' + (x + 10) + ' ' + (y + (((x / 20 + i) % 2) ? -a : a) * f * .5).toFixed(1) +
             ' ' + (x + 20) + ' ' + y.toFixed(1);
      }
      var mestra = (i % 5 === 0);
      camins.push('<path d="' + d + '" fill="none" stroke="' +
        (mestra ? 'var(--corba-mestra)' : 'var(--corba)') + '" stroke-width="' +
        (mestra ? 1.5 : .9) + '"/>');
    }
    return '<svg class="corbes" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true">' +
           camins.join('') + '</svg>';
  }

  /**
   * Corbes de nivell de fons per a la sala de comandament.
   *
   * No és un patró dibuixat: és un terreny fals generat amb soroll i recorregut
   * amb el mateix marching squares que el full de mes. Per això les corbes es
   * tanquen, s'encaixen i tenen cims i valls, en comptes de semblar ratlles.
   *
   * La llavor és fixa: el terreny sempre és el mateix. Si canviés a cada
   * repintada, el fons ballaria cada cop que toques res.
   */
  function fons(amplada, alcada, opcions) {
    opcions = opcions || {};
    var color = opcions.color || 'rgba(43,127,212,.16)';
    var gruix = opcions.gruix || 1;
    var nivells = opcions.nivells || 14;
    var llavor = opcions.llavor === undefined ? 1974 : opcions.llavor;

    // Soroll determinista: dues octaves per tenir formes grans i detall
    function soroll(x, y, s) {
      var n = Math.sin(x * 127.1 + y * 311.7 + s) * 43758.5453;
      return n - Math.floor(n);
    }

    var F = 15, C = 15;
    var matriu = [];
    for (var r = 0; r < F; r++) {
      var fila = [];
      for (var c = 0; c < C; c++) {
        var a = soroll(r, c, llavor);
        var b = soroll(Math.floor(r / 3), Math.floor(c / 3), llavor + 7);
        fila.push(a * 0.38 + b * 0.62);          // el detall no ha de tapar el relleu gran
      }
      matriu.push(fila);
    }

    var cmp = camp(matriu, F, C, 5);
    var ex = amplada / (cmp.cols - 1), ey = alcada / (cmp.files - 1);
    var camins = [];

    for (var i = 1; i < nivells; i++) {
      var n = i / nivells;
      var linies = encadena(isolinies(cmp.dades, cmp.files, cmp.cols, n));
      for (var l = 0; l < linies.length; l++) {
        if (linies[l].length < 6) continue;       // trossets solts: soroll visual
        var d = camiSuau(linies[l], ex, ey, 3);
        if (d) camins.push('<path d="' + d + '"/>');
      }
    }

    return '<svg viewBox="0 0 ' + amplada + ' ' + alcada + '" preserveAspectRatio="xMidYMid slice" ' +
           'aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">' +
           '<g fill="none" stroke="' + color + '" stroke-width="' + gruix + '" ' +
           'stroke-linejoin="round" stroke-linecap="round">' + camins.join('') + '</g></svg>';
  }

  /** Símbol de mapa estable per a un hàbit, a partir del seu identificador. */
  var SIMBOLS = ['cim', 'font', 'refugi', 'fita', 'creu', 'cova', 'arbre', 'pont', 'gual', 'mina'];
  function simbol(id) {
    var h = 0;
    for (var i = 0; i < String(id).length; i++) h = (h * 31 + String(id).charCodeAt(i)) >>> 0;
    return SIMBOLS[h % SIMBOLS.length];
  }
  function llavor(id) {
    var h = 0;
    for (var i = 0; i < String(id).length; i++) h = (h * 17 + String(id).charCodeAt(i)) >>> 0;
    return h % 97;
  }

  /** Tinta hipsomètrica per a un percentatge de compliment. */
  function tinta(pct) {
    if (pct === null || pct === undefined) return 'var(--h0)';
    var b = ['--h1', '--h1', '--h2', '--h3', '--h4', '--h5', '--h6'];
    return 'var(' + b[Math.min(6, Math.floor(pct / 15))] + ')';
  }

  return { fullMes: fullMes, franja: franja, fons: fons,
           simbol: simbol, llavor: llavor, tinta: tinta };
})();
</script>

<script>
/* =========================================================================
   JEFE — el nucli
   L'esfera de partícules que és la cara de l'assistent.

   Quatre estats, i cadascun es veu diferent de lluny:
     repos      → gira lent, centre tranquil
     escoltant  → l'anell exterior s'obre i batega amb la teva veu
     pensant    → les partícules s'acceleren i el centre s'encén
     parlant    → l'ona de veu envolta el nucli

   Es dibuixa en canvas perquè són centenars de partícules per fotograma.
   Es pausa sol quan la pestanya no es veu: no cremarà bateria al mòbil.
   ========================================================================= */

var Nucli = (function () {

  var CIAN = '#4fd6e0', BLAU = '#2b7fd4', BLANC = '#dff6f9';

  function crea(contenidor) {
    var canvas = document.createElement('canvas');
    canvas.setAttribute('aria-hidden', 'true');
    canvas.style.cssText = 'display:block;width:100%;height:100%';
    contenidor.appendChild(canvas);

    var ctx = canvas.getContext('2d');
    var w = 0, h = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
    var particules = [], anells = [], t = 0, corrent = null;
    var estat = 'repos', energia = 0, energiaObjectiu = 0, nivellVeu = 0;
    var reduit = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    function mida() {
      var r = contenidor.getBoundingClientRect();
      w = Math.max(80, r.width); h = Math.max(80, r.height);
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function sembra() {
      particules = [];
      var n = Math.round(Math.min(320, Math.max(90, w * 0.7)));
      for (var i = 0; i < n; i++) {
        particules.push({
          a: Math.random() * Math.PI * 2,
          r: Math.pow(Math.random(), 0.65),          // més densitat al centre
          v: (0.0004 + Math.random() * 0.0022) * (Math.random() < 0.25 ? -1 : 1),
          mida: 0.5 + Math.random() * 1.5,
          fase: Math.random() * Math.PI * 2
        });
      }
      // Anells fragmentats, com les marques d'un radar
      anells = [
        { r: 0.94, gruix: 1.4, segments: 3, buit: 0.42, v: 0.00022, color: CIAN, alfa: 0.85 },
        { r: 0.86, gruix: 0.8, segments: 9, buit: 0.62, v: -0.00042, color: BLAU, alfa: 0.65 },
        { r: 0.70, gruix: 0.7, segments: 2, buit: 0.30, v: 0.00034, color: CIAN, alfa: 0.4 },
        { r: 0.55, gruix: 0.6, segments: 24, buit: 0.5, v: -0.0007, color: BLAU, alfa: 0.35 }
      ];
    }

    function arc(cx, cy, radi, d0, d1, color, gruix, alfa) {
      ctx.beginPath();
      ctx.arc(cx, cy, radi, d0, d1);
      ctx.strokeStyle = color; ctx.lineWidth = gruix;
      ctx.globalAlpha = alfa; ctx.stroke(); ctx.globalAlpha = 1;
    }

    function dibuixa() {
      ctx.clearRect(0, 0, w, h);
      var cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 2;

      energia += (energiaObjectiu - energia) * 0.06;
      var e = energia;

      // --- anells ---
      for (var i = 0; i < anells.length; i++) {
        var an = anells[i];
        var gir = t * an.v * (1 + e * 2.2);
        var pas = (Math.PI * 2) / an.segments;
        for (var s = 0; s < an.segments; s++) {
          var d0 = gir + s * pas;
          arc(cx, cy, R * an.r, d0, d0 + pas * (1 - an.buit), an.color,
              an.gruix * (1 + e * 0.5), an.alfa * (0.55 + e * 0.45));
        }
      }

      // --- marques radials, com les d'un radar ---
      var marques = 48;
      for (var m = 0; m < marques; m++) {
        var ang = (m / marques) * Math.PI * 2 + t * 0.00008;
        var llarg = (m % 6 === 0) ? 0.075 : 0.035;
        var r0 = R * 0.965, r1 = R * (0.965 + llarg * 0.4);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
        ctx.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
        ctx.strokeStyle = (m % 6 === 0) ? CIAN : BLAU;
        ctx.globalAlpha = (m % 6 === 0) ? 0.7 : 0.3;
        ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;
      }

      // --- núvol de partícules ---
      for (var p = 0; p < particules.length; p++) {
        var q = particules[p];
        q.a += q.v * (1 + e * 3.4);
        var respira = Math.sin(t * 0.0011 + q.fase) * (0.018 + e * 0.05);
        var rr = (q.r + respira) * R * 0.62;
        var x = cx + Math.cos(q.a) * rr, y = cy + Math.sin(q.a) * rr;
        var prox = 1 - q.r;
        ctx.beginPath();
        ctx.arc(x, y, q.mida * (0.7 + prox * 0.9 + e * 0.5), 0, Math.PI * 2);
        ctx.fillStyle = prox > 0.55 ? BLANC : CIAN;
        ctx.globalAlpha = (0.18 + prox * 0.6) * (0.55 + e * 0.45);
        ctx.fill(); ctx.globalAlpha = 1;
      }

      // --- el centre: el punt de llum ---
      var rc = R * (0.20 + e * 0.05 + Math.sin(t * 0.002) * 0.012);
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rc);
      g.addColorStop(0, 'rgba(240,253,255,' + (0.85 + e * 0.15) + ')');
      g.addColorStop(0.18, 'rgba(120,235,250,' + (0.7 + e * 0.3) + ')');
      g.addColorStop(0.55, 'rgba(43,127,212,' + (0.28 + e * 0.22) + ')');
      g.addColorStop(1, 'rgba(43,127,212,0)');
      ctx.beginPath(); ctx.arc(cx, cy, rc, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();

      // --- ona de veu: només quan escolta o parla ---
      if (nivellVeu > 0.01) {
        var punts = 96, base = R * 0.99;
        ctx.beginPath();
        for (var k = 0; k <= punts; k++) {
          var ak = (k / punts) * Math.PI * 2;
          var amp = Math.sin(ak * 7 + t * 0.006) * Math.sin(ak * 3 - t * 0.004);
          var rk = base + amp * nivellVeu * R * 0.07;
          var xk = cx + Math.cos(ak) * rk, yk = cy + Math.sin(ak) * rk;
          k ? ctx.lineTo(xk, yk) : ctx.moveTo(xk, yk);
        }
        ctx.closePath();
        ctx.strokeStyle = BLANC; ctx.lineWidth = 1.2;
        ctx.globalAlpha = 0.55 * nivellVeu; ctx.stroke(); ctx.globalAlpha = 1;
      }
    }

    function bucle(ara) {
      t = ara;
      if (nivellVeu > 0) nivellVeu *= 0.94;
      dibuixa();
      corrent = requestAnimationFrame(bucle);
    }

    function arrenca() {
      if (corrent || reduit) { if (reduit) dibuixa(); return; }
      corrent = requestAnimationFrame(bucle);
    }
    function atura() {
      if (corrent) { cancelAnimationFrame(corrent); corrent = null; }
    }

    var api = {
      /** 'repos' | 'escoltant' | 'pensant' | 'parlant' */
      estat: function (nou) {
        estat = nou;
        energiaObjectiu = nou === 'pensant' ? 1
                        : nou === 'parlant' ? 0.7
                        : nou === 'escoltant' ? 0.45 : 0.06;
        if (nou === 'escoltant' || nou === 'parlant') api.pols(0.8);
        return api;
      },
      /** Un cop d'energia: la veu, un missatge que arriba. */
      pols: function (n) { nivellVeu = Math.max(nivellVeu, Math.min(1, n || 0.6)); return api; },
      redimensiona: function () { mida(); sembra(); if (reduit) dibuixa(); },
      atura: atura,
      arrenca: arrenca,
      element: canvas
    };

    mida(); sembra(); arrenca();

    document.addEventListener('visibilitychange', function () {
      document.hidden ? atura() : arrenca();
    });

    return api;
  }

  return { crea: crea };
})();
</script>

<script>
/* =========================================================================
   JEFE — notificacions al mòbil (client)

   Demana permís, obté la fitxa del dispositiu i la registra al servidor.
   A partir d'aquí JEFE et pot escriure encara que l'app estigui tancada.

   Es carrega SOLA i mai bloqueja: si Firebase no està configurat, si el
   navegador no en té, o si no hi ha xarxa, l'app funciona igual i el botó
   diu per què no.
   ========================================================================= */

var Notificacions = (function () {

  var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var config = null, missatgeria = null, carregant = null;

  function potSerHi() {
    return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  }

  function permis() {
    return potSerHi() ? Notification.permission : 'unsupported';
  }

  /** Carrega el SDK i la configuració. Un sol cop, encara que es cridi deu vegades. */
  function prepara() {
    if (carregant) return carregant;

    carregant = fetch('firebase.config.json', { cache: 'no-cache' })
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        if (!cfg.apiKey || cfg.apiKey.indexOf('POSA-HI') === 0) {
          throw new Error('Firebase encara no està configurat. Vegeu docs/03-notificacions.md');
        }
        config = cfg;
        return Promise.all([guio(SDK + 'firebase-app-compat.js'),
                            guio(SDK + 'firebase-messaging-compat.js')]);
      })
      .then(function () {
        firebase.initializeApp({
          apiKey: config.apiKey,
          projectId: config.projectId,
          messagingSenderId: config.messagingSenderId,
          appId: config.appId
        });
        missatgeria = firebase.messaging();

        // Missatge rebut amb l'app OBERTA: no el pinta el sistema, el pintem
        // nosaltres perquè no passi desapercebut enmig de la conversa.
        missatgeria.onMessage(function (m) {
          var d = (m && m.data) || {};
          App.brindis((d.titol ? d.titol + ': ' : '') + (d.cos || 'Notificació'));
        });
        return true;
      });

    return carregant;
  }

  function guio(url) {
    return new Promise(function (ok, ko) {
      var s = document.createElement('script');
      s.src = url; s.async = true;
      s.onload = ok;
      s.onerror = function () { ko(new Error('No s\'ha pogut carregar ' + url)); };
      document.head.appendChild(s);
    });
  }

  /**
   * Demana permís i registra el dispositiu.
   * El permís s'ha de demanar SEMPRE des d'un toc: si no, Chrome el denega
   * sense preguntar i et quedes sense poder-ho tornar a intentar.
   */
  function activa() {
    if (!potSerHi()) {
      return Promise.reject(new Error('Aquest navegador no pot rebre notificacions.'));
    }

    return Notification.requestPermission()
      .then(function (p) {
        if (p !== 'granted') {
          throw new Error(p === 'denied'
            ? 'Has denegat les notificacions. Per tornar-hi: cadenat de la barra d\'adreces → Notificacions → Permet.'
            : 'No has respost a la petició de permís.');
        }
        return prepara();
      })
      .then(function () {
        // Treballador propi per a les notificacions, amb abast separat del
        // de l'app: un abast només pot tenir un treballador.
        return navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './fcm/' });
      })
      .then(function (reg) {
        return navigator.serviceWorker.ready.then(function () { return reg; });
      })
      .then(function (reg) {
        return missatgeria.getToken({ vapidKey: config.vapidKey, serviceWorkerRegistration: reg });
      })
      .then(function (fitxa) {
        if (!fitxa) throw new Error('Firebase no ha donat cap fitxa per a aquest dispositiu.');
        return crida('nucli', 'registraDispositiu', { fitxa: fitxa, nom: nomDispositiu() });
      })
      .then(function () {
        Cau.set('notificacions', true);
        return true;
      });
  }

  function nomDispositiu() {
    var ua = navigator.userAgent;
    var sistema = /Android/i.test(ua) ? 'Android'
                : /iPhone|iPad/i.test(ua) ? 'iPhone'
                : /Windows/i.test(ua) ? 'Windows'
                : /Mac/i.test(ua) ? 'Mac' : 'Desconegut';
    var instalada = matchMedia('(display-mode: standalone)').matches;
    return sistema + (instalada ? ' · app instal·lada' : ' · navegador');
  }

  /** Estat per a la pantalla, sense demanar res ni carregar res. */
  function estat() {
    return {
      potSerHi: potSerHi(),
      permis: permis(),
      activades: permis() === 'granted' && Cau.get('notificacions', false)
    };
  }

  /**
   * Cada cop que obres l'app, si ja tens el permís donat:
   *
   *   1. Torna a registrar el treballador de servei. És l'única manera que
   *      una versió nova hi entri: el registre només es fa en prémer el botó,
   *      i pel seu compte Chrome només ho mira un cop al dia. Sense això pots
   *      estar-te hores provant la versió d'abans sense cap senyal.
   *
   *   2. TORNA A APUNTAR LA FITXA DEL DISPOSITIU AL FULL. I això és el que
   *      falla si no hi és: la fitxa d'FCM no és per sempre. Es renova sola
   *      —quan netegis les dades del lloc, quan reinstal·lis l'app, o quan a
   *      Firebase li sembla—, i el dia que es renova, la que hi ha desada al
   *      full deixa de servir. Des de fora no es veu res: els avisos
   *      senzillament deixen d'arribar, i no te n'assabentes fins que en
   *      trobes a faltar un. Tornar-la a apuntar cada cop que obres l'app fa
   *      que això es curi sol.
   *
   *      Al full és un «desa» per fitxa, o sigui que no s'hi acumula res: si
   *      és la mateixa, només se'n refresca la data.
   */
  function actualitza() {
    if (!potSerHi() || Notification.permission !== 'granted') return;

    navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './fcm/' })
      .then(function (reg) {
        reg.update();
        return prepara().then(function () { return reg; });
      })
      .then(function (reg) {
        return missatgeria.getToken({ vapidKey: config.vapidKey, serviceWorkerRegistration: reg });
      })
      .then(function (fitxa) {
        if (!fitxa) return;
        // Si és la mateixa que ja vam apuntar, no cal molestar el servidor.
        if (Cau.get('fitxa', '') === fitxa) return;
        return crida('nucli', 'registraDispositiu', { fitxa: fitxa, nom: nomDispositiu() })
          .then(function () { Cau.set('fitxa', fitxa); Cau.set('notificacions', true); });
      })
      .catch(function () { /* sense xarxa o sense clau: ja hi tornarem demà */ });
  }

  /* Passats uns segons de l'arrencada, no durant.
     Ara això baixa el SDK de Firebase per poder demanar la fitxa, i el que
     mana en obrir l'app és que la primera pantalla surti de seguida. Cinc
     segons més tard no els nota ningú, i la fitxa es refresca igual. */
  setTimeout(actualitza, 5000);

  return { potSerHi: potSerHi, permis: permis, estat: estat, activa: activa,
           actualitza: actualitza };
})();
</script>

<script>
/* JEFE — NUCLI · Pantalla d'inici
   És el full índex del mapa: quins fulls hi ha i què hi ha pendent a cadascun.
   Cada mòdul hi aporta una línia amb `resumInici()`. Un mòdul nou hi surt sol. */

App.registraVista('inici', {
  render: function (arrel) {

    function pinta(targetes, dEnCau) {
      var avui = fmt.avui();

      var html =
        '<header class="capcalera"><div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa') + '</button>' +
          /* LA DATA OBRE LA PÀGINA DEL DIA.
             Aquella pantalla només s'obria demanant-l'hi a JEFE, i això vol
             dir que passava per la capa d'IA: el dia que el proveïdor diu que
             prou —i va dir-ho—, una pantalla que només ensenya les teves
             dades es quedava inabastable. Una porta que depèn d'un servei de
             fora no és una porta.

             No és un botó nou a la fila de sota, que era el que no volíem:
             és la data, que ja hi era, i tocar-la per veure el dia és el que
             sembla que hagi de passar. */
          '<button class="dia-porta" data-ves="dia" aria-label="Obre la pàgina del dia">' +
            '<p class="marge">' + esc(fmt.relativa(avui)) + '</p>' +
            '<h1>' + esc(fmt.llarga(avui)) + '</h1>' +
          '</button>' +
          '<div style="text-align:right">' +
            '<div class="escala" style="margin-left:auto"><i></i><i></i><i></i><i></i></div>' +
            '<p class="marge" style="margin:4px 0 0">JEFE</p>' +
          '</div>' +
          '<button class="btn btn-fantasma btn-icona" data-tema="1" aria-label="Clar o fosc">' +
            ic('ajust') + '</button>' +
        '</div></header>' +
        '<div class="pagina">';

      if (!targetes || !targetes.length) {
        html += '<div class="estat">' + ic('mapa', 'ic-g') +
          '<h2>Consola en repòs</h2>' +
          '<p>Encara no hi ha res registrat. Comença pels hàbits: amb un de sol ' +
          'ja té sentit obrir això cada dia.</p>' +
          '<button class="btn btn-primari" data-ves="habits">' + ic('habits') + 'Comença</button></div>';
      } else {
        html += '<p class="marge" style="margin:0 0 var(--e2)">Situació</p><div class="terreny">';
        targetes.forEach(function (t) {
          var estat = t.error ? 'nofet' : (t.urgent ? 'pendent' : 'fet');
          html +=
            '<div class="franja-fila"><button class="franja" data-ves="' +
              esc(t.accio || t.modul) + '" data-estat="' + estat + '">' +
              Relleu.franja(t.urgent ? 25 : 90, Relleu.llavor(t.modul)) +
              '<svg class="ic ic-simbol" aria-hidden="true"><use href="#ic-' +
                esc(t.modul === 'habits' ? 'habits' : 'modul') + '"/></svg>' +
              '<span>' +
                '<span class="franja-nom">' + esc(t.etiqueta) + '</span>' +
                (t.error ? '<span class="franja-sota">No s\'ha pogut llegir</span>' : '') +
              '</span>' +
              '<span class="franja-cota"><span class="n">' + esc(t.valor) + '</span></span>' +
            '</button></div>';
        });
        html += '</div>';
      }

      if (dEnCau) html += '<p class="menut" style="margin-top:var(--e4)">Última còpia desada al telèfon.</p>';
      html += '</div>';
      arrel.innerHTML = html;

      arrel.querySelectorAll('[data-ves]').forEach(function (b) {
        b.addEventListener('click', function () { App.ves(b.dataset.ves); });
      });
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });
      var bt = arrel.querySelector('[data-tema]');
      if (bt) bt.addEventListener('click', function () {
        var ordre = ['fosc', 'clar'];
        var seg = ordre[(ordre.indexOf(App.temaActual()) + 1) % 2];
        App.aplicaTema(seg);
        App.brindis('Full ' + (seg === 'clar' ? 'de dia' : 'de nit'));
      });
    }

    var cau = Cau.get('inici', null);
    if (cau) pinta(cau.targetes, true);
    else arrel.innerHTML = '<div class="pagina"><div class="terreny">' +
      '<div class="esquelet franja-fantasma"></div><div class="esquelet franja-fantasma"></div>' +
      '</div></div>';

    crida('nucli', 'inici', {}).then(function (d) {
      Cau.set('inici', d); Cau.set('moduls', d.moduls); pinta(d.targetes, false);
    }).catch(function (err) {
      if (cau) { App.brindis('Sense connexió: dades del telèfon', 'error'); return; }
      arrel.innerHTML = Comp.error(err, true);
      var r = arrel.querySelector('[data-reintenta]');
      if (r) r.addEventListener('click', function () { App.ves('inici'); });
    });
  }
});
</script>

<style>
/* =========================================================================
   JEFE — sala de comandament
   Fons gairebé negre, quadrícula fina, nucli de partícules al centre,
   marc de cantonades i telemetria als marges.

   Diferència deliberada amb la referència: allà la telemetria és decorativa
   i il·legible. Aquí són dades teves de veritat —què ha consultat, quantes
   files, quants tokens, l'hora— i es poden llegir.
   ========================================================================= */

.hud {
  --neg:    #04070b;
  --fosc:   #071019;
  --linia:  #12293a;
  --cian:   #4fd6e0;
  --blau:   #2b7fd4;
  --clar:   #dff6f9;
  --apagat: #6f93a6;
  --calent: #e8a33c;
  --alerta: #ef5f52;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  position: fixed; left: 0; right: 0; top: 0;
  bottom: env(safe-area-inset-bottom, 0px);
  display: flex; flex-direction: column;
  /* Fosc al centre i clar cap a les vores: el nucli es retalla contra el buit
     en comptes de competir-hi, i el terreny apareix on hi ha lloc per mirar-lo.
     A l'inrevés —clar al mig— el nucli i el fons il·luminat es barallaven. */
  background:
    radial-gradient(ellipse 78% 58% at 50% 44%, var(--neg) 22%, transparent 76%),
    #0b2137;
  color: var(--clar);
  padding-top: env(safe-area-inset-top, 0px);
  overflow: hidden;
}
@media (min-width: 900px) { .hud { top: 0; bottom: 0; padding-top: 0; } }

/* Corbes de nivell de fons.
   Abans hi havia una quadrícula de línies rectes. Mateix color, mateix gruix
   i mateix esvaïment: només canvia que ara el terreny és de debò, calculat
   amb el mateix marching squares que el full de mes. */
/* La màscara va a l'inrevés que abans: el terreny s'esvaeix al centre, on hi
   ha el nucli, i es veu cap a fora. Les corbes deixen de passar per darrere
   les partícules, que és on molestaven i on no es podien llegir. */
.reticula {
  position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  mask-image: radial-gradient(ellipse 72% 56% at 50% 44%, transparent 26%, #000 68%);
  -webkit-mask-image: radial-gradient(ellipse 72% 56% at 50% 44%, transparent 26%, #000 68%);
}

/* ---------------------------------------------------------------- capçalera */

.hud-cap {
  position: relative; z-index: 2; flex: none;
  display: flex; align-items: center; gap: var(--e2);
  padding: var(--e2) var(--guia);
  font-family: var(--mono); font-size: .625rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--apagat);
}
@media (max-width: 359px) {
  .hud-cap #etiqueta-estat { max-width: 10ch; overflow: hidden; text-overflow: ellipsis;
                             white-space: nowrap; }
}
.hud-cap .creix { flex: 1; }
.llum { width: 7px; height: 7px; border-radius: 50%; background: var(--apagat); flex: none; }
.hud[data-estat="repos"]     .llum { background: var(--cian); box-shadow: 0 0 8px var(--cian); }
.hud[data-estat="pensant"]   .llum { background: var(--cian); box-shadow: 0 0 14px var(--cian); animation: bat .8s infinite; }
.hud[data-estat="escoltant"] .llum { background: var(--alerta); box-shadow: 0 0 12px var(--alerta); animation: bat .9s infinite; }
.hud[data-estat="apagat"]    .llum { background: var(--calent); }
@keyframes bat { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* Marc de cantonades. Apagades mentre no fa res, enceses quan t'escolta:
   així el marc no és decoració, és l'estat de l'aparell.

   El color va per variable i no per regla d'estat. Amb regles, un estat sense
   la seva —«apagat», per exemple— es quedava amb el color del text i les L
   sortien blanques i brillants: més cridaneres quan res funciona que quan tot
   va bé. Amb una variable, cap estat pot quedar-se sense color. */
/* UNA SOLA GUIA PER A TOT.
   Les L viuen als 8 px i fan 22, o sigui que arriben als 30. Tot el que és
   contingut comença als 38 i cap element no en trepitja cap altre. Abans cada
   cosa tenia el seu marge i el resultat era que la telemetria queia just
   damunt de la cantonada. */
.hud { --marc: rgba(79,214,224,.38); --guia: 38px; }
.hud[data-estat="escoltant"], .hud[data-estat="parlant"] { --marc: var(--cian); }
.hud[data-estat="apagat"] { --marc: rgba(232,163,60,.5); }

.cantonada { position: absolute; width: 22px; height: 22px; pointer-events: none; z-index: 3;
             transition: border-color .35s ease; }
.cantonada.dg { top: 8px; left: 8px;
                border-top: 2px solid var(--marc); border-left: 2px solid var(--marc); }
.cantonada.dd { top: 8px; right: 8px;
                border-top: 2px solid var(--marc); border-right: 2px solid var(--marc); }
.cantonada.bg { bottom: 8px; left: 8px;
                border-bottom: 2px solid var(--marc); border-left: 2px solid var(--marc); }
.cantonada.bd { bottom: 8px; right: 8px;
                border-bottom: 2px solid var(--marc); border-right: 2px solid var(--marc); }

/* LA VORA QUE RESPIRA.
   Mentre t'escolta, tota la pantalla batega amb el color del nucli. És l'únic
   moviment de la pantalla, i és el que et diu de lluny —sense mirar cap
   etiqueta, amb el telèfon damunt la taula— que el micròfon està obert. Un
   estat que no es veu des de l'altra punta de l'habitació no serveix de res. */
.vora {
  position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
  box-shadow: inset 0 0 30px 1px rgba(79,214,224,.55),
              inset 0 0 96px 20px rgba(79,214,224,.20);
  transition: opacity .45s ease;
}
.hud[data-estat="escoltant"] .vora { animation: respira 2.3s ease-in-out infinite; }
.hud[data-estat="parlant"] .vora { opacity: .55; }
@keyframes respira { 0%, 100% { opacity: .18; } 50% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .hud[data-estat="escoltant"] .vora { animation: none; opacity: .8; }
}

/* Telemetria de cantonada: dades teves de veritat —què ha consultat, quantes
   files, quants tokens—, no farciment decoratiu. Petita i al marge, però
   llegible: al 9 px ja és prou discreta sense haver de rebaixar-ne el
   contrast fins a fer-la endevinable. */
.telemetria {
  position: absolute; top: 64px; z-index: 1; pointer-events: none;
  font-family: var(--mono); font-size: .5625rem; line-height: 1.75;
  color: var(--apagat); letter-spacing: .04em; max-width: 34%;
}
.telemetria.esq { left: var(--guia); }
.telemetria.dre { right: var(--guia); text-align: right; }
.telemetria b { color: var(--cian); font-weight: 400; }
.telemetria .val { color: var(--clar); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------- cos

   El nucli al mig i res més. La conversa no viu aquí: apareix quan hi ha
   alguna cosa a dir i se'n va quan ja s'ha dit. Una transcripció permanent
   converteix una sala de comandament en una finestra de xat, i el que ha de
   manar aquí és l'ordre, no l'historial. */

.jefe-centre {
  position: relative; z-index: 2; flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--e3); padding: var(--e4) var(--e4) 0; text-align: center;
}

/* Sense nom a sota: el nucli ja diu qui és. La marca només repetia una
   paraula que ja saps, i li prenia lloc al que de debò mires. */
.nucli-caixa { flex: none; width: min(82vw, 46vh); aspect-ratio: 1; }

/* ------------------------------------------------------------- transcripció */

/* Només l'última resposta, i només mentre serveix de res. */
.transcripcio {
  width: 100%; max-width: 62ch; margin: 0 auto; min-height: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch; text-align: left;
}
.transcripcio:empty { display: none; }
.torn { max-width: 70ch; }
.torn .qui { font-family: var(--mono); font-size: .5625rem; letter-spacing: .22em;
             text-transform: uppercase; color: var(--apagat); margin-bottom: 5px; display: block; }
.torn .diu { font-size: 1rem; line-height: 1.55; white-space: pre-wrap; }
.torn[data-rol="usuari"] { align-self: flex-end; text-align: right; }
.torn[data-rol="usuari"] .qui { color: var(--blau); }
.torn[data-rol="usuari"] .diu { display: inline-block; text-align: left; color: var(--apagat); }
.torn[data-rol="assistent"] .qui { color: var(--cian); }

.traca { margin-top: var(--e2); font-family: var(--mono); font-size: .625rem;
         color: var(--apagat); display: flex; flex-wrap: wrap; gap: var(--e2); }
.traca span { border: 1px solid var(--linia); padding: 2px 7px; }
.traca b { color: var(--cian); font-weight: 400; }

.proposta { margin-top: var(--e3); border: 1px solid var(--calent);
            background: rgba(232,163,60,.08); padding: var(--e3) var(--e4); }
.proposta p { margin: 0 0 var(--e3); font-size: .9375rem; }
.proposta .accions { display: flex; gap: var(--e2); }
.proposta button { min-height: 44px; padding: 0 var(--e4); font: inherit; font-size: .875rem;
                   font-weight: 600; border: 1px solid var(--linia); background: transparent; color: var(--clar); }
.proposta button[data-si] { background: var(--calent); border-color: var(--calent); color: #171104; }

.avis-apagat { margin: var(--e4) var(--e5); padding: var(--e4); border: 1px solid var(--calent);
               background: rgba(232,163,60,.07); font-size: .875rem; line-height: 1.55; }
.avis-apagat strong { display: block; margin-bottom: var(--e2); color: var(--calent);
                      font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; font-size: .75rem; }
.hud code { font-family: var(--mono); background: var(--fosc); border: 1px solid var(--linia);
            padding: 1px 5px; color: var(--cian); }

/* ------------------------------------------------------------------ entrada */

.hud-entrada { position: relative; z-index: 2; flex: none;
               padding: var(--e3) var(--e4) 0; }
/* Barra del que està sentint. Sense això no pots saber si el micròfon
   t'ha sentit, t'ha entès una altra cosa, o directament ha petat. */
.oida { display: flex; align-items: center; gap: var(--e2); width: 100%; max-width: 62ch;
        margin: 0 auto; text-align: left;
        padding: var(--e2) var(--e3); border: 1px solid var(--alerta);
        background: rgba(239,95,82,.08); font-family: var(--mono); font-size: .6875rem; }
.oida-text { flex: 1; min-width: 0; color: var(--clar); overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
.oida[data-error="1"] { border-color: var(--calent); background: rgba(232,163,60,.1); }
.oida[data-error="1"] .oida-text { color: var(--calent); white-space: normal; }
.oida-clau { flex: none; min-height: 32px; padding: 0 var(--e2); border: 1px solid var(--linia);
             background: transparent; color: var(--apagat); font: inherit; font-size: .625rem; }
.oida-clau[aria-pressed="true"] { color: var(--cian); border-color: var(--cian); }

.ona { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
.ona i { width: 3px; background: var(--alerta); animation: ona .9s ease-in-out infinite; }
.ona i:nth-child(1) { height: 40%; animation-delay: 0s; }
.ona i:nth-child(2) { height: 90%; animation-delay: .15s; }
.ona i:nth-child(3) { height: 60%; animation-delay: .3s; }
.ona i:nth-child(4) { height: 100%; animation-delay: .45s; }
@keyframes ona { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

/* --------------------------------------------------------------- les ordres

   Dues maneres de manar, i totes dues a l'abast del polze. La veu és la
   principal; el llapis hi és perquè hi ha llocs —una reunió, una classe— on
   parlar-li en veu alta no és una opció, i sense escriptura l'assistent
   deixaria de servir just quan més el necessites. */

.jefe-ordre { position: relative; z-index: 2; flex: none;
              padding: var(--e4) var(--e4) var(--e3); }
.jefe-botons { display: flex; align-items: center; justify-content: center; gap: var(--e5); }

.ordre-bt {
  width: 76px; height: 76px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--linia); background: rgba(7,16,25,.7); color: var(--clar);
  transition: border-color .18s ease, color .18s ease, transform .18s var(--sortida);
}
.ordre-bt .ic { width: 30px; height: 30px; }
.ordre-bt:active { transform: scale(.94); }
#b-micro { border-color: var(--cian); color: var(--cian); }
#b-micro[data-actiu="1"] { border-color: var(--alerta); color: var(--alerta);
                           animation: pulsa2 1.4s ease-in-out infinite; }
@keyframes pulsa2 { 0%,100% { box-shadow: 0 0 0 0 rgba(239,95,82,.4); }
                    50% { box-shadow: 0 0 0 14px rgba(239,95,82,0); } }

.jefe-escriu { display: flex; align-items: flex-end; gap: var(--e2);
               max-width: 62ch; margin: 0 auto; }
.jefe-escriu textarea { flex: 1; min-width: 0; min-height: 52px; max-height: 150px; resize: none;
                        background: transparent; border: 1px solid var(--linia); color: var(--clar);
                        padding: var(--e3); font: inherit; line-height: 1.4; }
.jefe-escriu textarea:focus { outline: none; border-color: var(--cian); box-shadow: 0 0 0 1px var(--cian); }
.jefe-escriu textarea::placeholder { color: var(--apagat); }

.bt { flex: none; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--linia); background: transparent; color: var(--clar); }
.bt[data-primari] { border-color: var(--cian); color: var(--cian); }
.bt:disabled { opacity: .3; }
.bt-p { width: 44px; height: 44px; border-color: transparent; }
.bt-p[aria-pressed="true"] { color: var(--cian); }

/* ------------------------------------------------------------- els apartats */

/* Un sol boto, centrat sota les dues ordres grans. No es una tercera rodona:
   les rodones son per parlar-li i escriure-li, i aixo no li parla, nomes obre
   un calaix. Per aixo pren la forma dels botons quadrats de la barra —mateix
   fil, mateixa lletra de maquina— i no competeix amb el microfon. */
.jefe-moduls { position: relative; z-index: 2; flex: none;
               display: flex; justify-content: center;
               padding: var(--e2) var(--guia) calc(var(--e2) + env(safe-area-inset-bottom, 0px)); }

.porta-apartats {
  display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px;
  border: 1px solid var(--linia); background: rgba(7,16,25,.7); color: var(--cian);
  transition: border-color .16s var(--entra), transform .12s var(--entra);
}
.porta-apartats .ic { width: 20px; height: 20px; }
.porta-apartats:active { border-color: var(--cian); transform: scale(.94); }
@media (hover: hover) and (pointer: fine) {
  .porta-apartats:hover { border-color: var(--cian); }
}
/* El tauler: dues columnes al mobil, quatre a l escriptori. Cada apartat es
   un panell amb les seves claus de cantonada, com a la resta de l app. */
.reixa-apartats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--e2); }
.apartat {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--e2);
  min-height: 88px; padding: var(--e3);
  color: var(--ink); text-align: left;
  transition: background-color .16s var(--entra), transform .12s var(--entra);
}
.apartat-ample { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 60px; }
.apartat .ic { width: 22px; height: 22px; color: var(--utm); }
.apartat span { font-size: .875rem; font-weight: 600; line-height: 1.2; }
.apartat:active { background: var(--utm-suau); transform: scale(.98); }
@media (hover: hover) and (pointer: fine) {
  .apartat:hover { background: var(--utm-suau); }
}
@media (min-width: 560px) { .reixa-apartats { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .reixa-apartats { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 900px) {
  .hud { --guia: 56px; }
  .nucli-caixa { width: min(42vw, 62vh); }
  .jefe-centre { gap: var(--e4); }
  .ordre-bt { width: 84px; height: 84px; }
}
</style>

<script>
/* JEFE — MÒDUL · Conversa (sala de comandament) */

App.registraVista('conversa', {
  render: function (arrel) {

    var idConversa = Cau.get('conversa.id', null);
    var missatges = Cau.get('conversa.missatges', []) || [];
    var ocupat = false, veuActiva = Cau.get('conversa.veu', false);
    var tokensSessio = 0, ultimesEines = [], estatIA = null, nucli = null, reconeixedor = null;

    var potEscoltar = !!(window.SpeechRecognition || window.webkitSpeechRecognition ||
                         (navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
    var potParlar = !!window.speechSynthesis;

    arrel.innerHTML =
      '<div class="hud" id="hud" data-estat="repos">' +
        '<div class="reticula" id="reticula"></div>' +
        '<div class="vora"></div>' +
        '<i class="cantonada dg"></i><i class="cantonada dd"></i>' +
        '<i class="cantonada bg"></i><i class="cantonada bd"></i>' +

        '<div class="hud-cap">' +
          '<span class="llum"></span>' +
          '<span id="etiqueta-estat">iniciant</span>' +
          '<span class="creix"></span>' +
          (potParlar ? '<button class="bt bt-p" id="b-veu" aria-pressed="false" aria-label="Llegir en veu alta">' +
            ic('veu', 'ic-p') + '</button>' : '') +
          '<button class="bt bt-p" id="b-nova" aria-label="Comença de nou">' + ic('mes', 'ic-p') + '</button>' +
          '<button class="bt bt-p" id="b-vistes" aria-label="Ajustos de JEFE">' + ic('ajust', 'ic-p') + '</button>' +
        '</div>' +

        '<div class="telemetria esq" id="tel-esq"></div>' +
        '<div class="telemetria dre" id="tel-dre"></div>' +

        '<div class="jefe-centre">' +
          '<div class="nucli-caixa" id="nucli-caixa"></div>' +
          '<div class="transcripcio" id="transcripcio"></div>' +
        '</div>' +

        '<div class="hud-entrada">' +
          '<div class="oida" id="oida" hidden>' +
            '<span class="ona"><i></i><i></i><i></i><i></i></span>' +
            '<span class="oida-text" id="oida-text">escoltant…</span>' +
            '<button class="oida-clau" id="b-clau" aria-pressed="false">paraula clau: OFF</button>' +
            /* Què ha sentit de debò. No és un caprici de programador: quan la
               transcripció falla, això és l'única manera de saber si el que
               arriba dolent és el que sent Chrome o el que en fem nosaltres. */
            '<button class="oida-clau" id="b-oida-log">què he sentit</button>' +
          '</div>' +
        '</div>' +

        '<div class="jefe-ordre">' +
          '<div class="jefe-botons" id="botons">' +
            (potEscoltar ? '<button class="ordre-bt" id="b-micro" aria-label="Parla-li">' +
              ic('micro') + '</button>' : '') +
            '<button class="ordre-bt" id="b-llapis" aria-label="Escriu-li">' + ic('llapis') + '</button>' +
          '</div>' +
          '<div class="jefe-escriu" id="escriu" hidden>' +
            '<textarea id="camp" rows="1" placeholder="Escriu-li…" autocomplete="off"></textarea>' +
            '<button class="bt" data-primari id="b-envia" aria-label="Envia">' + ic('envia') + '</button>' +
          '</div>' +
        '</div>' +

        /* UN SOL BOTO PER A TOTS ELS APARTATS.
           La fila de sota tenia una rodona per modul, i cada modul nou n'hi
           afegia una: amb vuit ja competien entre elles i cap no es llegia.
           Aquesta pantalla es per parlar-li; els apartats son on vas quan no
           vols parlar, i aixo es una decisio, no vuit. */
        '<div class="jefe-moduls">' +
          /* Sense text: la icona sola. El nom viu a l'`aria-label`, que és
             el que llegeix qui no la veu —treure la paraula de la pantalla
             no vol dir treure-la de l'app. */
          '<button class="porta-apartats" id="b-apartats" aria-label="Apartats">' +
            ic('modul') +
          '</button>' +
        '</div>' +
      '</div>';

    var hud = arrel.querySelector('#hud');
    var tr = arrel.querySelector('#transcripcio');
    var camp = arrel.querySelector('#camp');

    nucli = Nucli.crea(arrel.querySelector('#nucli-caixa'));

    /* El terreny del fons es genera un sol cop: el SVG escala sol amb el
       contenidor, i la llavor és fixa perquè no balli a cada repintada. */
    arrel.querySelector('#reticula').innerHTML =
      // Més marcades que abans: ara viuen al marge il·luminat, no darrere del
      // nucli, i allà una línia al 16% no s'arriba a veure.
      Relleu.fons(1000, 1000, { color: 'rgba(79,214,224,.30)', gruix: 1, nivells: 14 });

    function posaEstat(e, etiqueta) {
      hud.dataset.estat = e;
      arrel.querySelector('#etiqueta-estat').textContent = etiqueta;
      nucli.estat(e === 'apagat' ? 'repos' : e);
      pintaTelemetria();
    }

    // --------------------------------------------------------- telemetria real

    function pintaTelemetria() {
      var esq = [];
      esq.push('<b>SESSIÓ</b>');
      esq.push('torns <span class="val">' + missatges.length + '</span>');
      esq.push('tokens <span class="val">' + tokensSessio + '</span>');
      if (ultimesEines.length) {
        esq.push('');
        esq.push('<b>ÚLTIMA CONSULTA</b>');
        ultimesEines.slice(0, 4).forEach(function (e) {
          esq.push(e.eina + ' <span class="val">' + (e.files === null ? '—' : e.files) + '</span>');
        });
      }
      var dre = ['<b>SISTEMA</b>'];
      /* La marca de la construcció. Apps Script no deixa preguntar amb quina
         versió s'està servint una pàgina, i sense això no hi ha manera de
         saber si el que tens obert és el que s'acaba de desplegar o el d'abans
         amb la memòria del navegador pel mig. */
      if (window.MARCA_JEFE) {
        dre.push('versió <span class="val">' + esc(window.MARCA_JEFE) + '</span>');
      }
      dre.push('estat <span class="val">' + hud.dataset.estat + '</span>');
      if (estatIA && estatIA.model) dre.push('model <span class="val">' + esc(estatIA.model) + '</span>');

      /* QUANTES PETICIONS PORTES. Google no diu quantes te'n queden —no hi ha
         manera de preguntar-ho—, o sigui que aquí hi ha el que hem gastat
         nosaltres i quan ens van dir que prou. Cap percentatge: caldria un
         límit escrit a mà i un tant per cent contra un denominador suposat
         sembla una dada sense ser-ho. */
      var c = estatIA && estatIA.consum;
      if (c) {
        dre.push('peticions avui <span class="val">' + c.avui + '</span>');
        if (c.faSegons !== null) {
          dre.push('últim límit <span class="val">' +
                   (c.faSegons < 90 ? 'fa ' + c.faSegons + 's'
                                    : 'fa ' + Math.round(c.faSegons / 60) + ' min') + '</span>');
        }
      }

      dre.push('veu <span class="val">' + (veuActiva ? 'ON' : 'OFF') + '</span>');
      dre.push('escolta <span class="val">' + (continua ? 'CONTÍNUA' : 'OFF') + '</span>');
      dre.push('micro <span class="val">' + (potEscoltar ? 'OK' : 'NO') + '</span>');

      telemetriaActual = { esquerra: esq.join('<br>'), dreta: dre.join('<br>') };

      var e = arrel.querySelector('#tel-esq'), d = arrel.querySelector('#tel-dre');
      if (e) e.innerHTML = telemetriaActual.esquerra;
      if (d) d.innerHTML = telemetriaActual.dreta;
    }
    var telemetriaActual = { esquerra: '', dreta: '' };

    // ------------------------------------------------------------------ pintura

    /* LA RESPOSTA NOMÉS MENTRE ÉS D'ARA.
       En obrir l'app no s'ensenya res: una resposta d'ahir penjada sota el
       nucli no és informació, és brutícia. Apareix quan acaba de contestar i
       marxa al toc següent o quan tornes a preguntar.

       L'excepció són les propostes: una escriptura pendent de confirmar no pot
       desaparèixer sola, perquè llavors no la confirmaries mai. */
    var respostaFresca = false;

    function pinta() {
      var ultim = null;
      if (respostaFresca) {
        for (var i = missatges.length - 1; i >= 0; i--) {
          if (missatges[i].rol === 'assistent') { ultim = missatges[i]; break; }
        }
      }
      tr.innerHTML = ultim ? torn(ultim) : '';
      lligaPropostes();
      tr.scrollTop = 0;
      pintaTelemetria();
    }

    function amagaResposta() {
      /* Una proposta PENDENT no pot desaparèixer sola: llavors no la
         confirmaries mai. Però una que ja has confirmat o descartat sí que
         pot: abans es mirava només si el missatge en portava, i n'hi hagués
         hagut o no, la resposta es quedava a la pantalla per sempre. */
      var m = missatges[missatges.length - 1];
      var pendents = (m && m.propostes || []).filter(function (p) { return !p.resolta; });
      if (pendents.length) return;
      respostaFresca = false;
      tr.innerHTML = '';
    }

    tr.addEventListener('click', function (ev) {
      if (ev.target.closest('.proposta') || ev.target.closest('button')) return;
      amagaResposta();
    });

    function torn(m) {
      var h = '<div class="torn" data-rol="' + esc(m.rol) + '">' +
        '<span class="qui">' + (m.rol === 'usuari' ? 'TU' : 'JEFE') + '</span>' +
        '<div class="diu">' + esc(m.text) + '</div>';
      if ((m.eines && m.eines.length) || m.temps) {
        h += '<div class="traca">' +
          (m.eines || []).map(function (e) {
            return '<span><b>' + esc(e.eina) + '</b> · ' +
                   (e.files === null || e.files === undefined ? 'ok' : e.files + ' files') + '</span>';
          }).join('') +
          (m.temps ? '<span title="on se n\'ha anat el temps"><b>' +
             (m.temps.total / 1000).toFixed(1) + 's</b> · ia ' + (m.temps.ia / 1000).toFixed(1) +
             ' · dades ' + ((m.temps.context + m.temps.eines) / 1000).toFixed(1) +
             (m.temps.veu ? ' · veu ' + (m.temps.veu / 1000).toFixed(1) : '') +
             ' · ' + m.temps.voltes + (m.temps.voltes === 1 ? ' volta' : ' voltes') +
