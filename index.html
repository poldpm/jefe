                  (e.color ? ' style="--seu:' + esc(e.color) + '"' : '') + '>' +
                  (e.totElDia || !e.hora ? '' : '<b>' + esc(e.hora) + '</b> ') +
                  esc(e.titol || '') + '</span>';
              }).join('') +
              (c.quants > 3 ? '<span class="cal-mes-n">+' + (c.quants - 3) + '</span>' : '') +
            '</span>' +
          '</button>';
        }).join('') +
      '</div>';
    }

    function diuCasella(c) {
      var d = fmt.llarga(c.data);
      if (!c.quants) return d + ', res';
      return d + ', ' + c.quants + (c.quants === 1 ? ' cita' : ' cites');
    }

    function blocDia(d) {
      var l = d.esdeveniments || [];
      return '<div class="dia-cap-cal">' +
          '<p class="marge">' + esc(fmt.relativa(d.diaTriat)) + ' · ' +
            esc(fmt.llarga(d.diaTriat)) + '</p>' +
        '</div>' +
        (d.provisional
          ? '<p class="menut">Buscant les cites d\'aquest mes…</p>'
          : l.length
            ? '<div class="cites">' + l.map(cita).join('') + '</div>'
            : '<p class="menut">Res apuntat aquest dia. ' +
              '<button class="enllac" data-nou="1">Apunta-hi alguna cosa</button></p>');
    }

    function cita(e) {
      return '<button class="cita" data-obre="' + esc(e.id) + '"' +
        (e.passat ? ' data-passat="1"' : '') + '>' +
        '<span class="cita-quan">' +
          (e.totElDia ? '<span class="tot">tot el dia</span>'
                      : '<b>' + esc(e.hora) + '</b>' +
                        (e.horaFi ? '<span>' + esc(e.horaFi) + '</span>' : '')) +
        '</span>' +
        '<span class="cita-cos">' +
          '<span class="cita-titol">' + esc(e.titol) + '</span>' +
          (e.lloc ? '<span class="menut">' + esc(e.lloc) + '</span>' : '') +
          (cals.length > 1 ? '<span class="menut">' + esc(e.calendariNom) + '</span>' : '') +
        '</span>' +
        (e.color ? '<span class="cita-color" style="background:' + esc(e.color) + '"></span>' : '') +
      '</button>';
    }

    // ---------------------------------------------------------------- accions

    function lliga() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-salt]').forEach(function (b) {
        b.addEventListener('click', function () {
          /* Des de `mes`, no des de `dades.mes`: si encara s'està carregant,
             el que es veu és el mes d'abans i clicar dues vegades seguides
             es menjava el segon clic. */
          vesAlMes(mouMes(mes || dades.mes, Number(b.dataset.salt)));
        });
      });
      var ba = arrel.querySelector('[data-avui]');
      if (ba) ba.addEventListener('click', function () {
        vesAlMes(dades.avui.slice(0, 7));
      });

      /* Triar dia NO va al servidor: el mes ja porta tot el que hi ha, i
         demanar-ho un altre cop per ensenyar el que ja tens seria un segon i
         mig d'espera per res. */
      arrel.querySelectorAll('[data-dia]').forEach(function (b) {
        b.addEventListener('click', function () {
          dia = b.dataset.dia;
          dades.diaTriat = dia;
          dades.esdeveniments = deLDia(dia);
          arrel.querySelectorAll('[data-dia]').forEach(function (o) {
            o.removeAttribute('aria-current');
          });
          b.setAttribute('aria-current', 'date');
          arrel.querySelector('#c-dia').innerHTML = blocDia(dades);
          lligaDia();
        });
      });

      lligaDia();

      arrel.querySelectorAll('[data-nou]').forEach(function (b) {
        b.addEventListener('click', function () { obreFitxa(null); });
      });
      var bj = arrel.querySelector('[data-ajustos]');
      if (bj) bj.addEventListener('click', obreCalendaris);
    }

    /**
     * Canviar de mes.
     *
     * Si és un dels que ja tenim, es pinta a l'instant i prou. Només es
     * torna a demanar quan surts del tram, i llavors en tornen cinc més
     * al voltant del nou.
     */
    function pintaDelTram(quin) {
      if (!mesosTinguts[quin]) return false;
      dades = mesosTinguts[quin];
      dades.diaTriat = (quin === dades.avui.slice(0, 7)) ? dades.avui : quin + '-01';
      dades.esdeveniments = deLDia(dades.diaTriat);
      previPintat = JSON.stringify(dades);
      pinta(dades, false);
      return true;
    }

    /* Un mes que encara no tenim: la graella es dibuixa a l'instant, buida, i
       les cites hi cauen quan arriben. Quedar-se mirant el mes d'abans fins
       que contesta el servidor fa pensar que el botó no ha anat, i llavors el
       cliques un altre cop. */
    function mesProvisional(quin) {
      var avui = (dades && dades.avui) || fmt.avui();
      var primer = new Date(Number(quin.slice(0, 4)), Number(quin.slice(5, 7)) - 1, 1);
      var ini = new Date(primer);
      ini.setDate(1 - ((primer.getDay() + 6) % 7));      // el dilluns d'abans

      var caselles = [];
      for (var i = 0; i < 42; i++) {
        var x = new Date(ini);
        x.setDate(ini.getDate() + i);
        var iso = x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) +
                  '-' + ('0' + x.getDate()).slice(-2);
        caselles.push({ data: iso, dia: x.getDate(), delMes: iso.slice(0, 7) === quin,
                        esAvui: iso === avui, quants: 0, mostra: [] });
      }
      // L'última fila sobra si el mes s'ha acabat abans d'arribar-hi.
      while (caselles.length > 28 &&
             !caselles.slice(-7).some(function (c) { return c.delMes; })) {
        caselles = caselles.slice(0, -7);
      }

      return { mes: quin, avui: avui, caselles: caselles, quants: 0, tots: [],
               diaTriat: quin === avui.slice(0, 7) ? avui : quin + '-01',
               esdeveniments: [], provisional: true };
    }

    function vesAlMes(nou) {
      mes = nou;
      dia = null;
      if (pintaDelTram(nou)) return;
      previPintat = null;                 // el provisional no ha de bloquejar el bo
      pinta(mesProvisional(nou), false);
      carrega();
    }

    function lligaDia() {
      arrel.querySelectorAll('[data-obre]').forEach(function (b) {
        b.addEventListener('click', function () {
          var e = null;
          (dades.esdeveniments || []).forEach(function (x) { if (x.id === b.dataset.obre) e = x; });
          if (e) obreFitxa(e);
        });
      });
      arrel.querySelectorAll('#c-dia [data-nou]').forEach(function (b) {
        b.addEventListener('click', function () { obreFitxa(null); });
      });
    }

    /** Els del dia, del que ja tenim del mes. */
    function deLDia(d) {
      var out = [];
      (dades.tots || []).forEach(function (e) {
        if (d >= e.data && d <= e.dataFi) out.push(e);
      });
      return out;
    }

    // ----------------------------------------------------------------- fitxa

    /**
     * A QUIN CALENDARI VA.
     *
     * En crear, es tria. Es recorda l'últim que has fet servir, perquè si
     * apuntes tres coses de l'escola seguides no has de triar-ho tres cops.
     *
     * En editar, NO es pot canviar: moure un esdeveniment d'un calendari a un
     * altre no és editar-lo, és esborrar-lo aquí i crear-lo allà, i això amb
     * els convidats a sobre no és el mateix esdeveniment. S'ensenya on és i
     * prou; per moure'l, des de Google Calendar.
     */
    function blocOnVa(nou, e) {
      if (!nou) {
        var seu = cals.filter(function (c) { return c.id === e.calendari; })[0];
        if (!seu || cals.length < 2) return '';
        return '<p class="menut">És al calendari <b>' + esc(seu.nom) + '</b>. ' +
               'Per canviar-lo de calendari, des de Google Calendar.</p>';
      }

      var on = cals.filter(function (c) { return c.mostra; });
      if (on.length < 2) return '';

      /* La clau NO comença per «calendari.»: quan es refresca la pantalla es
         crida `Cau.oblida('calendari.')`, que s'emportaria també això. */
      var ultim = Cau.get('ultimCalendari', '');
      var triat = on.filter(function (c) { return c.id === ultim; })[0]
               || on.filter(function (c) { return c.principal; })[0] || on[0];

      return '<label><span class="marge">A quin calendari</span>' +
        '<select data-c="calendari">' +
          on.map(function (c) {
            return '<option value="' + esc(c.id) + '"' +
                   (c.id === triat.id ? ' selected' : '') + '>' +
                   esc(c.nom) + (c.meu ? '' : ' · compartit') + '</option>';
          }).join('') +
        '</select></label>';
    }

    function obreFitxa(e) {
      var nou = !e;
      var quan = nou ? (dades.diaTriat || dades.avui) : e.data;

      var cos = App.modal(nou ? 'Apunta al calendari' : 'Aquesta cita',
        '<div class="form-ajustos">' +
          '<label><span class="marge">Què és</span>' +
            '<input data-c="titol" value="' + esc(nou ? '' : e.titol) + '" ' +
            'placeholder="Reunió, visita, sortida…" autocomplete="off"></label>' +
          '<label><span class="marge">Dia</span>' +
            '<input data-c="data" type="date" value="' + esc(quan) + '" autocomplete="off"></label>' +
          '<label class="cat-exclou"><input type="checkbox" data-c="totdia"' +
            ((nou || e.totElDia) && (nou ? false : e.totElDia) ? ' checked' : '') +
            '><span>Tot el dia</span></label>' +
          '<div class="cal-hores">' +
            '<label><span class="marge">Hora</span>' +
              '<input data-c="hora" type="time" value="' + esc(nou ? '09:00' : (e.hora || '09:00')) + '" autocomplete="off"></label>' +
            '<label><span class="marge">Minuts que dura</span>' +
              '<input data-c="durada" type="number" min="5" step="5" value="' +
              esc(nou ? 60 : (e.minuts || 60)) + '" autocomplete="off"></label>' +
          '</div>' +
          '<label><span class="marge">On</span>' +
            '<input data-c="lloc" value="' + esc(nou ? '' : (e.lloc || '')) + '" autocomplete="off"></label>' +
          '<label><span class="marge">Nota</span>' +
            '<textarea data-c="nota" rows="2">' + esc(nou ? '' : (e.nota || '')) + '</textarea></label>' +
          blocOnVa(nou, e) +
          '<button class="btn btn-primari" data-desa>' + (nou ? 'Apunta-ho' : 'Desa') + '</button>' +
          (nou ? '' :
            '<button class="btn btn-secundari" data-treu style="margin-top:var(--e2)">' +
              'Treu-la del calendari</button>') +
        '</div>');

      var camps = {};
      cos.querySelectorAll('[data-c]').forEach(function (i) { camps[i.dataset.c] = i; });

      function refrescaHores() {
        cos.querySelector('.cal-hores').hidden = camps.totdia.checked;
      }
      camps.totdia.addEventListener('change', refrescaHores);
      refrescaHores();

      cos.querySelector('[data-desa]').addEventListener('click', function () {
        var b = this;
        if (!camps.titol.value.trim()) { App.brindis('Digues què és', 'error'); return; }
        b.disabled = true;

        var p = {
          titol: camps.titol.value.trim(),
          data: camps.data.value,
          hora: camps.totdia.checked ? '' : camps.hora.value,
          durada: Number(camps.durada.value) || 60,
          lloc: camps.lloc.value,
          nota: camps.nota.value
        };
        if (!nou) {
          p.id = e.id; p.calendari = e.calendari;
        } else if (camps.calendari) {
          p.calendari = camps.calendari.value;
          // El pròxim ja vindrà triat: normalment n'apuntes uns quants seguits.
          Cau.set('ultimCalendari', p.calendari);
        }

        escriu('calendari', nou ? 'crea' : 'edita', p, quePinto())
          .then(function (r) {
            App.tancaModal();
            App.brindis(nou ? 'Apuntat' : 'Desat');
            Cau.oblida('calendari.'); mesosTinguts = {};
            aplica(r, false, true);
          })
          .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });

      var bt = cos.querySelector('[data-treu]');
      if (bt) bt.addEventListener('click', function () { confirmaTreure(e); });
    }

    /* Treure una cita del calendari és l'única cosa de tot JEFE que esborra
       de debò: Google Calendar no té «arxivat». Per això es pregunta, i es
       diu clar que no es podrà desfer. */
    function confirmaTreure(e) {
      App.tancaModal();
      setTimeout(function () {
        var cos = App.modal('Treure «' + e.titol + '»?',
          '<div class="form-ajustos">' +
            '<p>Del ' + esc(fmt.llarga(e.data)) +
              (e.totElDia ? '' : ', a les ' + esc(e.hora)) + '.</p>' +
            '<p class="menut"><strong>Això s\'esborra del calendari de Google i no es pot ' +
              'desfer.</strong> No és com treure una tasca, que es queda arxivada al full.</p>' +
            '<button class="btn btn-primari" data-si>Sí, treu-la</button>' +
            '<button class="btn btn-secundari" data-no style="margin-top:var(--e2)">Deixa-ho estar</button>' +
          '</div>');
        cos.querySelector('[data-no]').addEventListener('click', App.tancaModal);
        cos.querySelector('[data-si]').addEventListener('click', function () {
          var b = this;
          b.disabled = true;
          escriu('calendari', 'treu', { id: e.id, calendari: e.calendari }, quePinto())
            .then(function (r) {
              App.tancaModal(); App.brindis('Treta');
              Cau.oblida('calendari.'); mesosTinguts = {};
              aplica(r, false, true);
            })
            .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
        });
      }, 220);
    }

    // ------------------------------------------------------ quins calendaris

    function obreCalendaris() {
      caCanviar = false;
      var cos = App.modal('Quins calendaris vols veure',
        '<div class="form-ajustos">' +
          '<div id="cal-llista">' + llistaCals() + '</div>' +
          '<button class="btn btn-secundari" data-meus>Encén tots els meus</button>' +
          '<button class="btn btn-secundari" data-sinc style="margin-top:var(--e2)">' +
            'Torna a buscar els meus calendaris</button>' +
          '<p class="menut">«Els meus» són els que has fet tu. Els que et comparteixen ' +
            '—festius, calendaris d\'equips— venen apagats: n\'hi pot haver deu i no els ' +
            'vols tots a sobre.</p>' +
          '<p class="menut">Els esdeveniments no es copien enlloc: es llegeixen del teu ' +
            'Google Calendar cada cop. El que canviïs aquí només decideix què mires.</p>' +
        '</div>',
        function () {
          // En tancar, i només si has tocat res.
          if (!caCanviar) return;
          Cau.oblida('calendari.'); mesosTinguts = {};
          carrega();
        });

      lligaCals(cos);

      cos.querySelector('[data-meus]').addEventListener('click', function () {
        var b = this;
        b.disabled = true; b.dataset.carregant = '1';
        crida('calendari', 'elsMeus', {})
          .then(function (r) {
            App.brindis(r.encesos.length
              ? r.encesos.length + (r.encesos.length === 1 ? ' encès' : ' encesos')
              : 'Ja els tenies tots encesos');
            return crida('calendari', 'calendaris', {});
          })
          .then(function (l) {
            cals = l;
            cos.querySelector('#cal-llista').innerHTML = llistaCals();
            lligaCals(cos);
            b.disabled = false; b.dataset.carregant = '0';
            caCanviar = true;
          })
          .catch(function (err) {
            b.disabled = false; b.dataset.carregant = '0';
            App.brindis(err.message, 'error');
          });
      });

      cos.querySelector('[data-sinc]').addEventListener('click', function () {
        var b = this;
        b.disabled = true; b.dataset.carregant = '1';
        crida('calendari', 'sincronitza', {})
          .then(function (r) {
            App.brindis(r.total + ' calendaris trobats');
            return crida('calendari', 'calendaris', {});
          })
          .then(function (l) {
            cals = l;
            cos.querySelector('#cal-llista').innerHTML = llistaCals();
            lligaCals(cos);
            b.disabled = false; b.dataset.carregant = '0';
          })
          .catch(function (err) {
            b.disabled = false; b.dataset.carregant = '0';
            App.brindis(err.message, 'error');
          });
      });
    }

    function llistaCals() {
      if (!cals.length) {
        return '<p class="menut">Encara no s\'han llegit. Prem el botó de sota.</p>';
      }
      return cals.map(function (c) {
        return '<label class="cat-exclou">' +
          '<input type="checkbox" data-cal="' + esc(c.id) + '"' + (c.mostra ? ' checked' : '') + '>' +
          '<span>' + esc(c.nom) + (c.principal ? ' · el teu' : '') + '</span>' +
        '</label>';
      }).join('');
    }

    function lligaCals(cos) {
      cos.querySelectorAll('[data-cal]').forEach(function (i) {
        i.addEventListener('change', function () {
          i.disabled = true;
          crida('calendari', 'mostra', { id: i.dataset.cal, mostra: i.checked })
            .then(function () {
              i.disabled = false;
              cals.forEach(function (c) { if (c.id === i.dataset.cal) c.mostra = i.checked; });
              caCanviar = true;
            })
            .catch(function (err) {
              i.disabled = false; i.checked = !i.checked;
              App.brindis(err.message, 'error');
            });
        });
      });
    }

    // ---------------------------------------------------------------- càrrega

    function quePinto() { return { mes: mes, data: dia }; }
    /* LA MATEIXA CLAU PER DESAR I PER LLEGIR.
       Desava a «calendari.2026-08» —el mes que li tornava el servidor— i, en
       obrir, llegia «calendari.ara», perquè encara no sabia quin mes miraves.
       No coincidien mai: la còpia del telèfon hi era i no la feia servir ningú,
       i per això obrir el calendari sempre esperava el servidor. El mes en curs
       el sap el navegador, o sigui que la clau és sempre un mes de debò. */
    function claCau(quin) { return 'calendari.' + (quin || mes || fmt.avui().slice(0, 7)); }

    function aplica(r, dEnCau, forca) {
      cals = r.calendaris || cals;
      var d = r.dades;
      /* Els mesos que porta s'afegeixen als que ja tenim: passejant endavant
         i enrere se'n va acumulant el tram, i tornar sobre els passos no ha
         de tornar a preguntar res. */
      if (r.mesos) Object.keys(r.mesos).forEach(function (k) { mesosTinguts[k] = r.mesos[k]; });

      Cau.set(claCau(d.mes), r);

      /* SI MENTRE ESPERÀVEM JA HA CANVIAT DE MES, aquesta resposta és vella.
         Pintar-la li mouria la pantalla sota els peus i el deixaria en un mes
         que ja no mirava. Del que porta ens hem quedat els mesos, que si de
         cas ja serveixen per pintar el que sí que vol. */
      if (mes && d.mes && d.mes !== mes) { pintaDelTram(mes); return; }

      var nou = JSON.stringify(d);
      if (nou === previPintat) return;

      if (!forca && previPintat !== null && App.interactuant()) {
        var primer = !ajornat;
        ajornat = r;
        if (primer) setTimeout(quanPari, 400);
        return;
      }
      previPintat = nou;
      mes = d.mes;
      dia = d.diaTriat;
      pinta(d, !!dEnCau);
    }

    function quanPari() {
      if (!arrel.isConnected) { ajornat = null; return; }
      if (App.interactuant()) { setTimeout(quanPari, 400); return; }
      var r = ajornat;
      ajornat = null;
      if (r) aplica(r);
    }

    /**
     * QUIN DIA ÉS NO HO HA DE DIR EL SERVIDOR.
     *
     * La còpia desada al telèfon porta el dia que era quan es va desar. Si
     * s'obre l'endemà i es pinta tal com està, veus el dia 2 marcat com a avui
     * fins que Apps Script contesta —tres segons—, i llavors salta. Semblava
     * lentitud i no ho era: la data la sap el navegador des del primer
     * mil·lisegon i no hi ha cap motiu per esperar-la.
     *
     * Les cites desades sí que serveixen: són del mes, no del dia. El que es
     * refà és quin dia és avui, quin surt marcat i què hi ha en aquell dia.
     * Torna `null` si la còpia és d'un altre mes, i llavors val més la graella
     * buida del mes bo que un mes sencer equivocat.
     */
    function posaAlDia_(desat, avuiAra) {
      var d = desat && desat.dades;
      if (!d || !d.avui) return null;
      if (d.avui === avuiAra) return desat;
      if (!mes && d.mes !== avuiAra.slice(0, 7)) return null;   // la còpia és d'un altre mes

      /* Quin dia era quan es va desar, guardat ABANS de tocar res: `arregla`
         escriu el dia nou a `d.avui`, i com que `d` i `desat.dades` són el
         mateix objecte, després ja no hi ha manera de saber quin era el vell.
         Sense això, el dia triat es quedava al 2 i el marcat també. */
      var avuiVell = d.avui;

      var arregla = function (m) {
        if (!m || !m.caselles) return;
        m.avui = avuiAra;
        m.caselles.forEach(function (c) { c.esAvui = c.data === avuiAra; });
      };
      arregla(d);
      if (desat.mesos) { for (var k in desat.mesos) arregla(desat.mesos[k]); }

      /* El dia triat: si era «avui», passa a ser el d'avui de debò. Si n'havies
         triat un altre a mà, es respecta —no te'l canviarà l'app per tu. */
      if (d.diaTriat === avuiVell || !d.diaTriat) {
        d.diaTriat = d.mes === avuiAra.slice(0, 7) ? avuiAra : d.mes + '-01';
      }
      return desat;
    }

    function carrega() {
      var avuiAra = fmt.avui();
      var desat = posaAlDia_(Cau.get(claCau(), null), avuiAra);

      if (desat && desat.dades) {
        cals = desat.calendaris || cals;
        if (desat.mesos) mesosTinguts = desat.mesos;
        try {
          dades = desat.dades;
          dades.esdeveniments = deLDia(dades.diaTriat);
          previPintat = JSON.stringify(dades);
          pinta(dades, true);
        }
        catch (e) { previPintat = null; }
      } else {
        /* Sense res desat que valgui: la graella del mes, dibuixada aquí
           mateix. Els números dels dies i quin és avui no els ha de portar
           ningú de fora. Les cites hi cauen quan arriben. */
        try { pinta(mesProvisional(mes || avuiAra.slice(0, 7)), false); } catch (e) {}
      }

      /* Clicar tres cops seguits la fletxa no ha de fer tres peticions del
         mateix mes. Si ja n'hi ha una de demanada per aquest mes, s'espera. */
      if (enCami === (mes || 'ara')) return;
      enCami = mes || 'ara';

      crida('calendari', 'pantalla', quePinto())
        .then(function (r) { enCami = null; aplica(r); })
        .catch(function (err) {
          enCami = null;
          if (desat) App.brindis(err.message, 'error');
          else arrel.innerHTML = Comp.error(err, true);
        });
    }

    carrega();
  }
});
</script>

<script>
/* JEFE — LA PÀGINA DEL DIA
   Món: full de mapa topogràfic. Aquí, el full de ruta del dia.

   NO ÉS UN MÒDUL I NO TÉ BOTÓ. Només s'obre si li ho demanes a JEFE
   —«ensenya'm la pàgina del dia»—, i és a posta: un botó més a la fila de
   sota voldria dir una decisió més cada cop que obres l'app. Això no és un
   lloc on vagis a treballar; és la resposta a una pregunta que fas de tant
   en tant, i que quan la fas la vols sencera i d'una ullada.

   NO HI HA RES A TOCAR. Tot són coses per llegir. Si en vols fer alguna,
   el títol de cada bloc et porta al seu apartat, que és on hi ha les eines
   per fer-la. Repetir-les aquí seria mantenir dues vegades el mateix. */

App.registraVista('dia', {
  render: function (arrel, params) {

    var data = params.data || fmt.avui();
    var previPintat = null;

    function pinta(d, dEnCau) {
      var buit = !d.blocs.length;

      /* QUANT PORTES DEL DIA. No ve del servidor: surt del que ja hi ha a la
         pantalla —les coses marcades com a fetes sobre el total—, que és
         exactament el que estàs mirant. Inventar-se una altra xifra al
         servidor seria tenir dues veritats del mateix. */
      var totes = 0, fetes = 0;
      d.blocs.forEach(function (b) {
        b.coses.forEach(function (c) { totes++; if (c.fet) fetes++; });
      });
      var pct = totes ? Math.round((fetes / totes) * 100) : 0;

      arrel.innerHTML =
        '<header class="capcalera capcalera-nutri">' +
          '<div class="capcalera-fila">' +
            '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
              ic('conversa', 'ic-p') + '</button>' +
            '<span class="titol-periode" style="cursor:default">' +
              '<b>' + esc(fmt.relativa(d.data)) + '</b>' +
              '<span>' + esc(fmt.llarga(d.data)) + '</span>' +
            '</span>' +
          '</div>' +
        '</header>' +

        '<div class="pagina dia-pagina">' +
          (buit
            ? '<div class="estat">' + ic('mapa', 'ic-g') +
              '<h2>El dia és net</h2>' +
              '<p>Res al calendari, res que venci, res pendent. Passa poc.</p></div>'
            : nucli(d, pct, totes, fetes) +
              '<div class="dia-graella">' + d.blocs.map(bloc).join('') + '</div>') +
          /* LA PORTA A LA SETMANA VA AL PEU, no a la capçalera.
             La pregunta «i la resta de la setmana?» surt DESPRÉS d'haver
             llegit el dia, no abans; posar-la a dalt seria oferir-li una
             sortida just quan acaba d'entrar. */
          '<button class="dia-cap-setmana" data-ves="setmana">' +
            '<span>Com tinc la setmana</span>' + ic('dreta', 'ic-p') +
          '</button>' +
          (dEnCau ? '<p class="menut">Última còpia desada al telèfon.</p>' : '') +
        '</div>';

      lliga();
    }

    /* El nucli: un anell amb el que portes fet i el dia al costat. És el
       primer que veus i l'única xifra que resumeix tota la pantalla. */
    function nucli(d, pct, totes, fetes) {
      return '<div class="dia-nucli">' +
        '<div class="anell" data-gran="1" style="--p:' + pct + '"' +
          ' role="img" aria-label="' + fetes + ' de ' + totes + ' coses fetes">' +
          '<b>' + pct + '%</b><small>el dia</small>' +
        '</div>' +
        '<div class="quan">' +
          '<div class="d">' + esc(fmt.relativa(d.data)) + '</div>' +
          '<div class="s">' + esc(fmt.llarga(d.data)) + '</div>' +
          '<div class="c">' + fetes + ' de ' + totes +
            (totes === 1 ? ' cosa' : ' coses') + '</div>' +
        '</div>' +
      '</div>';
    }

    function bloc(b) {
      /* Els hàbits s'ensenyen com una tira i no com una llista: la pregunta
         que et fas és «quants me'n falten», i això es respon d'una ullada
         mirant quantes barres estan baixes. Els noms els tens a l'apartat. */
      var esHabits = b.modul === 'habits';

      return '<section class="dia-bloc-r viu"' + (b.urgent ? ' data-urgent="1"' : '') + '>' +
        '<button class="dia-titol-r" data-ves="' + esc(b.accio) + '">' +
          '<span>' + esc(b.titol) + '</span>' +
          '<span class="menut" style="margin-left:auto">' + b.coses.length + '</span>' +
          ic('dreta', 'ic-p') +
        '</button>' +
        (esHabits ? tira(b) :
        '<div class="dia-coses">' +
          b.coses.map(function (c) {
            return '<div class="dia-cosa"' + (c.fet ? ' data-fet="1"' : '') +
                   (c.urgent ? ' data-urgent="1"' : '') + '>' +
              '<span class="dia-marca">' + esc(marca(c)) + '</span>' +
              '<span class="dia-text">' + esc(c.text) + '</span>' +
              (c.menut ? '<span class="menut">' + esc(c.menut) + '</span>' : '') +
            '</div>';
          }).join('') +
        '</div>') +
      '</section>';
    }

    /* La marca de l'esquerra. Una hora si en té, i si no un signe que diu
       de quina mena és la cosa. Sempre la mateixa amplada perquè la columna
       quadri i l'ull hi pugui baixar sense tornar enrere. */
    function marca(c) {
      var m = String(c.menut || '');
      var hora = m.match(/^(\d{1,2}:\d{2})/);
      if (hora) return hora[1];
      if (c.fet) return '✓';
      if (c.urgent) return '!';
      return '·';
    }

    function tira(b) {
      return '<div class="dia-tira" role="img" aria-label="' +
        esc(b.coses.length + ' hàbits per marcar') + '">' +
        b.coses.map(function (c) {
          /* «1 de 2» dona la meitat; sense xifres, la barra queda al mínim
             perquè es vegi que l'hàbit existeix i encara no s'ha tocat. */
          var n = String(c.menut || '').match(/(\d+)\s*de\s*(\d+)/);
          var pct = n ? Math.round((Number(n[1]) / Number(n[2])) * 100) : 0;
          return '<i' + (pct ? ' style="--h:' + Math.max(pct, 8) + '%"' : ' data-buit="1"') +
                 ' title="' + esc(c.text) + '"></i>';
        }).join('') +
      '</div>';
    }

    function lliga() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-ves]').forEach(function (b) {
        b.addEventListener('click', function () { App.ves(b.dataset.ves); });
      });
    }

    function carrega() {
      var desat = Cau.get('dia.' + data, null);
      if (desat) {
        try { previPintat = JSON.stringify(desat); pinta(desat, true); }
        catch (e) { previPintat = null; }
      }

      crida('conversa', 'elDia', { data: data })
        .then(function (r) {
          Cau.set('dia.' + data, r);
          var nou = JSON.stringify(r);
          if (nou === previPintat) return;
          previPintat = nou;
          pinta(r, false);
        })
        .catch(function (err) {
          if (desat) App.brindis(err.message, 'error');
          else arrel.innerHTML = Comp.error(err, true);
        });
    }

    /* OBRIR AQUESTA PÀGINA NO VA A MIRAR EL BANC, I ÉS A POSTA.
       El banc només deixa que s'hi miri unes quantes vegades al dia sense que
       en Pol hi sigui al davant, i ell entra aquí moltes vegades un mateix
       matí: si cada entrada en gastés una, a mig matí ja no en quedaria cap i
       els avisos de la tarda no arribarien. S'hi mira tres cops al dia i
       prou; el que es veu aquí porta escrit de quan és. */

    arrel.innerHTML = Comp.carregant(3);
    carrega();
  }
});
</script>

<script>
/* =========================================================================
   JEFE — EL VISOR GENÈRIC

   EL PROBLEMA QUE RESOL, i és de fons:

     Registrar un visor per cada cosa que es pot ensenyar vol dir que algú
     —jo— ha de fer la llista de què vols veure. I la llista sempre serà
     curta i sempre hi faltarà justament el que li demanis aquell dia.

     Aquí s'inverteix. No hi ha una llista de coses ensenyables: hi ha
     QUATRE FORMES de dibuixar, i qualsevol eina que sàpiga tornar les seves
     dades en una d'elles ja es pot ensenyar. Afegir-ne una de nova no és
     tocar aquest fitxer: és que una eina que ja existeix retorni `_visor`.

   LES FORMES, i per què només aquestes:

     llista   coses una sota l'altra. Els esdeveniments d'un dia, les
              tasques d'una llista, les relacions trobades.
     linia    una sèrie en el temps. El pes, les calories, els cigarros.
     barres   quantitats comparables. La despesa per categories.
     taula    files i columnes, quan les xifres s'han de comparar en dues
              direccions alhora.

     Amb aquestes quatre s'ensenya tot el que aquesta app té avui. Una
     cinquena seria una forma que no sabria llegir ningú: el que fa que un
     dibuix s'entengui de cop és haver-ne vist un d'igual abans.

   QUI DECIDEIX QUÈ S'ENSENYA: en Pol, dient-ho. Les eines porten un
   `ensenya` que el model posa quan ell ha demanat VEURE una cosa; si només
   pregunta, contesten amb paraules i no s'obre res.

   FORMA DEL QUE ARRIBA:

     { titol, mena, unitat, dades: [...], peu: ['...'], buit: '...' }

       llista → [{ text, menut, marca, urgent, fet }]
       linia  → [{ x: 'AAAA-MM-DD' o etiqueta, v: número }]
       barres → [{ etiqueta, v }]
       taula  → { caps: [...], files: [[...]] }
   ========================================================================= */

var Visor = (function () {

  function num(n, dec) {
    var v = Number(n) || 0;
    var s = (dec === undefined ? String(Math.round(v * 10) / 10) : v.toFixed(dec));
    return s.replace('.', ',');
  }

  /* Una data com la diries. Si el que arriba no és una data, es deixa tal
     com ve: l'etiqueta d'una barra pot ser «Menjar» i no s'ha de tocar. */
  function etiqueta(x) {
    var m = String(x || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return String(x || '');
    return Number(m[3]) + ' ' + ['gen', 'feb', 'març', 'abr', 'maig', 'juny',
      'jul', 'ag', 'set', 'oct', 'nov', 'des'][Number(m[2]) - 1];
  }

  // ------------------------------------------------------------- les formes

  /* Coses una sota l'altra. La marca de l'esquerra sempre a la mateixa
     amplada perquè l'ull hi pugui baixar sense tornar enrere: és el mateix
     criteri que a la pàgina del dia. */
  function llista(dades) {
    return '<ul class="vis-llista">' + dades.map(function (x) {
      return '<li' + (x.urgent ? ' data-urgent="1"' : '') +
             (x.fet ? ' data-fet="1"' : '') + '>' +
        '<span class="vis-marca">' + esc(x.marca || '·') + '</span>' +
        '<span class="vis-cos">' +
          '<span class="vis-text">' + esc(x.text || '') + '</span>' +
          (x.menut ? '<span class="menut">' + esc(x.menut) + '</span>' : '') +
        '</span>' +
      '</li>';
    }).join('') + '</ul>';
  }

  /* La línia es deixa dibuixada DESPRÉS, amb l'amplada real: amb un viewBox
     fix i `preserveAspectRatio="none"` els punts surten el·líptics, i un
     cercle estirat es veu de seguida. Aquí només queda el forat amb les
     dades a dins. És el mateix que fa la pantalla de Seguiment. */
  function linia(dades, p) {
    if (dades.length < 2) {
      return '<p class="menut">Amb un sol punt encara no hi ha línia.</p>';
    }
    var etiquetes = dades.map(function (d) {
      return etiqueta(d.x) + ' ' + num(d.v) + (p.unitat ? ' ' + p.unitat : '');
    });
    return '<svg class="vis-linia" role="img" data-linia=\'' +
             esc(JSON.stringify(dades.map(function (d) { return Number(d.v) || 0; }))) +
             '\' aria-label="' + esc(etiquetes.join(', ')) + '"></svg>' +
      '<div class="vis-eix"><span>' + esc(etiqueta(dades[0].x)) + '</span>' +
        '<span>' + esc(etiqueta(dades[dades.length - 1].x)) + '</span></div>';
  }

  function dibuixaLinia(dins) {
    (dins || document).querySelectorAll('[data-linia]').forEach(function (svg) {
      var v;
      try { v = JSON.parse(svg.getAttribute('data-linia')); } catch (e) { return; }
      var A = Math.round(svg.clientWidth), H = Math.round(svg.clientHeight);
      if (!A || !H || v.length < 2) return;

      var m = 8;
      var min = Math.min.apply(null, v), max = Math.max.apply(null, v);
      /* EL ZERO NO SEMPRE ÉS A BAIX, i aquí és a posta el contrari que als
         comptadors: una sèrie de pesos entre 78 i 80 dibuixada des de zero
         és una ratlla plana que no diu res. El que es mira aquí és el
         moviment, i per això l'escala s'ajusta al que hi ha, amb un marge
         perquè la línia no toqui les vores. */
      var marge = (max - min) || 1;
      min -= marge * 0.15; max += marge * 0.15;

      var pas = (A - m * 2) / (v.length - 1);
      var xy = v.map(function (valor, i) {
        return {
          x: Math.round((m + i * pas) * 10) / 10,
          y: Math.round((m + (1 - (valor - min) / (max - min)) * (H - m * 2)) * 10) / 10
        };
      });
      var ultim = xy[xy.length - 1];

      svg.setAttribute('viewBox', '0 0 ' + A + ' ' + H);
      svg.innerHTML =
        '<polyline class="vis-traç" points="' +
          xy.map(function (q) { return q.x + ',' + q.y; }).join(' ') + '"/>' +
        (v.length <= 40 ? xy.map(function (q) {
          return '<circle class="vis-punt" cx="' + q.x + '" cy="' + q.y + '" r="2.2"/>';
        }).join('') : '') +
        '<circle class="vis-punt vis-ara" cx="' + ultim.x + '" cy="' + ultim.y + '" r="3.6"/>';
    });
  }

  /* Barres horitzontals i no verticals: les etiquetes són paraules
     —«Supermercat», «Benzina»— i en vertical no hi caben sense girar-les,
     i un text girat no es llegeix, es desxifra. */
  function barres(dades, p) {
    var sostre = 0;
    dades.forEach(function (d) { var v = Math.abs(Number(d.v) || 0); if (v > sostre) sostre = v; });
    if (!sostre) sostre = 1;

    return '<div class="vis-barres">' + dades.map(function (d) {
      var v = Math.abs(Number(d.v) || 0);
      return '<div class="vis-barra">' +
        '<span class="vis-barra-nom">' + esc(d.etiqueta || '') + '</span>' +
        '<span class="vis-barra-riu"><i style="width:' +
          Math.max(1, Math.round((v / sostre) * 100)) + '%"></i></span>' +
        '<span class="vis-barra-val">' + esc(num(d.v) + (p.unitat ? ' ' + p.unitat : '')) +
        '</span>' +
      '</div>';
    }).join('') + '</div>';
  }

  function taula(dades) {
    var caps = dades.caps || [], files = dades.files || [];
    return '<div class="vis-taula-fora"><table class="vis-taula">' +
      (caps.length ? '<thead><tr>' + caps.map(function (c) {
        return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead>' : '') +
      '<tbody>' + files.map(function (f) {
        return '<tr>' + f.map(function (c) {
          return '<td>' + esc(c === null || c === undefined ? '—' : c) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  function peu(p) {
    var l = (p.peu || []).filter(Boolean);
    if (!l.length) return '';
    return '<div class="visor-peu">' + l.map(function (x) {
      return '<span>' + esc(x) + '</span>'; }).join('') + '</div>';
  }

  return {
    render: function (arrel, p) {
      p = p || {};
      var dades = p.dades;
      var buit = !dades || (dades.length === 0) ||
                 (p.mena === 'taula' && !(dades.files || []).length);

      if (buit) {
        arrel.innerHTML = '<p class="menut">' +
          esc(p.buit || 'Aquí no hi ha res per ensenyar.') + '</p>';
        return;
      }

      var formes = { llista: llista, linia: linia, barres: barres, taula: taula };
      var forma = formes[p.mena] || llista;
      arrel.innerHTML = forma(dades, p) + peu(p);

      if (p.mena === 'linia') {
        /* De seguida i un cop més al cap d'un moment: la disposició ja és
           feta, però el plafó encara s'està obrint i l'amplada no és la
           definitiva fins que ha acabat. Res de `requestAnimationFrame`:
           si la pestanya no compon fotogrames, no s'executa mai. */
        dibuixaLinia(arrel);
        setTimeout(function () { if (arrel.isConnected) dibuixaLinia(arrel); }, 80);
      }
    }
  };
})();

App.registraVisor('nucli.dades', {
  titol: function (p) { return (p && p.titol) || 'JEFE'; },
  render: function (arrel, p) { Visor.render(arrel, p); }
});
</script>

<script>
/* JEFE — MÒDUL · Focus

   QUÈ ENSENYA I EN QUIN ORDRE:

     1. EL RELLOTGE, gros i al mig. Mentre corre, no hi ha res més a tocar
        que aturar-lo: una pantalla de concentrar-se plena de botons és una
        broma.
     2. LES DURADES, i la de deu primer. Vegeu `40_Mod_Focus.gs`: el que
        costa és començar, i vint-i-cinc minuts són una decisió.
     3. EN QUÈ, si vols lligar-hi una tasca. Opcional sempre: un bloc sense
        tasca és un bloc igualment.
     4. EL QUE PORTES AVUI, al peu i sense objectiu. Un objectiu de minuts
        convertiria això en una altra cosa que es pot fallar.

   EL RELLOTGE NO COMPTA SEGONS: MIRA L'HORA.
   Un `setInterval` que suma un segon cada vegada es queda enrere quan
   bloqueges el telèfon —el navegador l'atura o l'alenteix— i llavors tens
   un temporitzador que menteix. Aquí es desa QUAN va començar i, a cada
   repintada, es resta de l'hora d'ara. Tanca l'app, torna-la a obrir i el
   bloc segueix on toca. */

App.registraVista('focus', {
  render: function (arrel, params) {

    var d = null;
    var estat = null;          // { inici, minuts, tasca, tasca_llista, tasca_text }
    var tic = null;
    var triant = false;        // el tauler de tasques, obert
    var durada = Cau.get('focus.durada', 10);

    /* El bloc en marxa viu al telèfon, no al servidor: només s'apunta quan
       s'acaba. Així tancar l'app no perd res i obrir-la no costa una anada. */
    function llegeixEstat() {
      var e = Cau.get('focus.encurs', null);
      if (!e || !e.inici || !e.minuts) return null;
      /* Un bloc de fa hores no és un bloc: si el telèfon ha estat apagat tot
         el matí, el que hi havia ja no corre. Es descarta passat el doble
         del que havia de durar. */
      if (queden(e) < -(e.minuts * 60)) { Cau.treu('focus.encurs'); return null; }
      return e;
    }

    function queden(e) {
      var passats = Math.floor((Date.now() - new Date(e.inici).getTime()) / 1000);
      return (e.minuts * 60) - passats;
    }

    function rellotge(seg) {
      var s = Math.max(0, seg);
      var m = Math.floor(s / 60);
      return m + ':' + ('0' + (s % 60)).slice(-2);
    }

    function horesMin(m) {
      if (!m) return '0 min';
      if (m < 60) return m + ' min';
      var h = Math.floor(m / 60), r = m % 60;
      return h + ' h' + (r ? ' ' + r : '');
    }

    // ---------------------------------------------------------------- pintar

    function capcalera() {
      return '<header class="capcalera"><div class="capcalera-fila">' +
        '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
          ic('conversa', 'ic-p') + '</button>' +
        '<div style="flex:1;min-width:0">' +
          '<h1 style="font-size:1.0625rem;margin:0">Focus</h1>' +
          '<p class="marge" style="margin:2px 0 0">' +
            (d ? esc(horesMin(d.minutsAvui) + ' avui') : '') + '</p>' +
        '</div>' +
      '</div></header>';
    }

    function pinta() {
      arrel.innerHTML = capcalera() +
        '<div class="pagina foc-pagina">' +
          (estat ? corrent() : parat()) +
          (triant ? tauler() : '') +
          (d && d.blocs.length ? historic() : '') +
        '</div>';
      lliga();
    }

    /* MENTRE CORRE: el rellotge i una sola sortida. La tasca a sota, perquè
       quan aixequis el cap sàpigues què estaves fent. */
    function corrent() {
      var seg = queden(estat);
      var pct = Math.max(0, Math.min(100,
        Math.round((1 - seg / (estat.minuts * 60)) * 100)));
      var acabat = seg <= 0;

      return '<section class="foc-centre">' +
        '<div class="foc-anell" style="--p:' + pct + '"' +
          (acabat ? ' data-acabat="1"' : '') +
          ' role="timer" aria-live="off" aria-label="' +
          esc(acabat ? 'Bloc acabat' : rellotge(seg) + ' per acabar') + '">' +
          '<b>' + esc(acabat ? 'Fet' : rellotge(seg)) + '</b>' +
          '<small>' + esc(acabat ? horesMin(estat.minuts) : 'de ' + horesMin(estat.minuts)) +
          '</small>' +
        '</div>' +
        (estat.tasca_text
          ? '<p class="foc-que">' + esc(estat.tasca_text) + '</p>'
          : '<p class="foc-que foc-sense">Sense tasca</p>') +
        '<div class="foc-accions">' +
          (acabat
            ? '<button class="btn btn-primari" data-tanca-bloc="1">Apunta-ho i plega</button>' +
              '<button class="btn btn-secundari" data-mes="1">Deu minuts més</button>'
            : '<button class="btn btn-secundari" data-atura="1">Ho deixo aquí</button>') +
        '</div>' +
      '</section>';
    }

    /* PARAT: triar durada, triar en què, i començar. Tres coses i cap més. */
    function parat() {
      var tria = params.tasca_text || null;
      return '<section class="foc-centre">' +
        '<div class="foc-tries">' + (d ? d.durades : [10, 25, 50]).map(function (m) {
          return '<button class="foc-durada" data-durada="' + m + '"' +
                 (durada === m ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' +
                 m + '<span>min</span></button>';
        }).join('') + '</div>' +

        '<button class="foc-en-que" data-tria="1">' +
          (tria ? esc(tria) : 'En què? (opcional)') +
          ic('dreta', 'ic-p') +
        '</button>' +

        '<button class="btn btn-primari foc-comenca" data-comenca="1">Comença</button>' +
        '<p class="menut foc-nota">Deu minuts primer. Si en acabar segueixes, ja en són ' +
          'vint-i-cinc; i si no, has fet deu que no hauries fet.</p>' +
      '</section>';
    }

    function tauler() {
      var l = (d && d.tasques) || [];
      return '<section class="secc"><div class="caixes"><section class="caixa">' +
        '<h3 class="caixa-cap"><span>En què hi treballes</span>' +
          '<button class="foc-cap-x" data-tria="0" aria-label="Tanca">' + ic('tancar', 'ic-p') +
          '</button></h3>' +
        (l.length
          ? '<ul class="caixa-coses">' +
              '<li><button class="foc-tasca" data-sense="1">Sense tasca</button></li>' +
              l.map(function (t) {
                return '<li><button class="foc-tasca" data-t="' + esc(t.id) + '"' +
                  ' data-llista="' + esc(t.llista) + '" data-text="' + esc(t.text) + '"' +
                  (t.vencuda ? ' data-urgent="1"' : '') + '>' +
                  '<span>' + esc(t.text) + '</span>' +
                  (t.pas ? '<span class="foc-pas">' + esc(t.pas) + '</span>' : '') +
                '</button></li>';
              }).join('') +
            '</ul>'
          : '<p class="menut" style="padding:var(--e2) var(--e3)">Aquí no hi ha tasques. ' +
            'El bloc pot anar sol igualment.</p>') +
      '</section></div></section>';
    }

    /* El que portes avui. Sense objectiu i sense ratxa: només què has fet. */
    function historic() {
      return '<section class="secc">' +
        '<p class="marge">Avui</p>' +
        '<div class="caixes"><section class="caixa"><ul class="caixa-coses">' +
          d.blocs.map(function (b) {
            return '<li class="foc-fila">' +
              '<span class="foc-hora">' + esc(b.hora) + '</span>' +
              '<span class="foc-cos">' + esc(b.tasca || 'Sense tasca') + '</span>' +
              '<span class="menut">' + b.minuts + ' min' +
                (b.complet ? '' : ' · a mitges') + '</span>' +
            '</li>';
          }).join('') +
        '</ul></section></div>' +
      '</section>';
    }

    // ---------------------------------------------------------------- moure

    function arrenca(tasca) {
      estat = {
        inici: new Date().toISOString(),
        minuts: durada,
        tasca: (tasca && tasca.id) || '',
        tasca_llista: (tasca && tasca.llista) || '',
        tasca_text: (tasca && tasca.text) || ''
      };
      Cau.set('focus.encurs', estat);
      triant = false;
      pinta();
      compta();
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    }

    /* Es repinta cada segon MENTRE ES MIRA, i el número surt de l'hora, no
       d'un comptador. Quan la pantalla no es veu, el navegador ho alenteix i
       tant se val: en tornar-hi, el número és el bo igualment. */
    function compta() {
      clearTimeout(tic);
      if (!estat) return;
      var seg = queden(estat);
      if (seg <= 0 && !estat.avisat) {
        estat.avisat = true;
        Cau.set('focus.encurs', estat);
        avisa();
      }
      pinta();
      tic = setTimeout(compta, 1000);
    }

    /* QUAN S'ACABA. No hi ha cap servidor que pugui avisar-te d'això —el
       rellotge corre aquí—, o sigui que s'avisa amb el que el navegador
       sap fer: vibrar i, si li has donat permís, una notificació seva. */
    function avisa() {
      if (navigator.vibrate) {
        try { navigator.vibrate([180, 90, 180]); } catch (e) {}
      }
      try {
        if (window.Notification && Notification.permission === 'granted' &&
            navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(function (reg) {
            reg.showNotification('Bloc acabat', {
              body: estat && estat.tasca_text
                ? estat.tasca_text + ' · ' + horesMin(estat.minuts)
                : horesMin(estat.minuts) + ' de feina seguida',
              tag: 'focus', icon: './icona.svg'
            });
          });
        }
      } catch (e) { /* sense permís, ja hi ha la vibració i la pantalla */ }
    }

    function tanca(complet) {
      if (!estat) return;
      var passats = Math.max(1, Math.round(
        (Date.now() - new Date(estat.inici).getTime()) / 60000));
      var minuts = complet ? estat.minuts : Math.min(passats, estat.minuts);

      var enviar = {
        inici: estat.inici, minuts: minuts, previst: estat.minuts,
        complet: !!complet, tasca: estat.tasca,
        tasca_llista: estat.tasca_llista, tasca_text: estat.tasca_text
      };
      Cau.treu('focus.encurs');
      estat = null;
      clearTimeout(tic);
      pinta();

      escriu('focus', 'apunta', enviar, {})
        .then(function (r) { d = r; App.brindis(horesMin(minuts) + ' apuntats'); pinta(); })
        .catch(function (err) { App.brindis(err.message, 'error'); });
    }

    // ---------------------------------------------------------------- lligar

    function lliga() {
      var t = arrel.querySelector('[data-torna]');
      if (t) t.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-durada]').forEach(function (b) {
        b.addEventListener('click', function () {
          durada = Number(b.dataset.durada);
          Cau.set('focus.durada', durada);
          pinta();
        });
      });

      arrel.querySelectorAll('[data-tria]').forEach(function (b) {
        b.addEventListener('click', function () {
          triant = b.dataset.tria === '1';
          pinta();
        });
      });

      arrel.querySelectorAll('[data-t]').forEach(function (b) {
        b.addEventListener('click', function () {
          params.tasca = b.dataset.t;
          params.tasca_llista = b.dataset.llista;
          params.tasca_text = b.dataset.text;
          triant = false;
          pinta();
        });
      });
      var sense = arrel.querySelector('[data-sense]');
      if (sense) sense.addEventListener('click', function () {
        params.tasca = params.tasca_llista = params.tasca_text = '';
        triant = false;
        pinta();
      });

      var c = arrel.querySelector('[data-comenca]');
      if (c) c.addEventListener('click', function () {
        arrenca(params.tasca_text
          ? { id: params.tasca, llista: params.tasca_llista, text: params.tasca_text }
          : null);
      });

      var a = arrel.querySelector('[data-atura]');
      if (a) a.addEventListener('click', function () { tanca(false); });

      var f = arrel.querySelector('[data-tanca-bloc]');
      if (f) f.addEventListener('click', function () { tanca(true); });

      var m = arrel.querySelector('[data-mes]');
      if (m) m.addEventListener('click', function () {
        /* Deu minuts més NO és un bloc nou: és el mateix, allargat. El que
           s'apunta al final és el temps de debò. */
        estat.minuts += 10;
        estat.avisat = false;
        Cau.set('focus.encurs', estat);
        compta();
      });
    }

    // --------------------------------------------------------------- càrrega

    function carrega() {
      var cau = Cau.get('focus', null);
      if (cau) { d = cau; pinta(); }
      else arrel.innerHTML = Comp.carregant(2);

      crida('focus', 'pantalla', {}).then(function (r) {
        d = r; Cau.set('focus', r);
        App.mantenintLaVista(pinta);
      }).catch(function (err) {
        if (d) return;
        arrel.innerHTML = Comp.error(err, true);
        var b = arrel.querySelector('[data-reintenta]');
        if (b) b.addEventListener('click', function () { App.ves('focus'); });
      });
    }

    /* Si la conversa ha demanat una durada, mana ella. */
    if (params.minuts) durada = Number(params.minuts);

    estat = llegeixEstat();

    /* «PARA EL BLOC», DIT DE VEU.
       El rellotge corre AQUÍ i el servidor no en sap res: no hi ha cap fila
       fins que el bloc s'acaba. Per això aturar-lo no pot ser una eina que
       escrigui —no hi ha res a escriure encara—: la conversa obre aquesta
       pantalla dient què vol i qui ho fa és qui té el rellotge.

       Els minuts que s'apunten són els que han passat de debò, com si
       haguessis premut el botó: parar abans d'hora no apunta el bloc sencer. */
    var aturant = !!(params.atura && estat);
    if (aturant) {
      /* `tanca` ja apunta el bloc I torna la pantalla refeta. Cridar `carrega`
         a més seria un segon viatge amb una foto ANTERIOR a l'apunt, i el que
         arribés l'últim mandaria: de vegades hi sortiria el bloc i de vegades
         no. */
      tanca(false);
      App.brindis('Bloc aturat');
    } else {
      if (params.atura) App.brindis('Ara mateix no hi ha cap bloc en marxa');
      carrega();
    }
    if (estat && !aturant) compta();

    /* En sortir de la pantalla, el rellotge de repintar s'atura. El bloc no:
       viu al telèfon i segueix corrent encara que miris una altra cosa. */
    var vigila = setInterval(function () {
      if (arrel.isConnected) return;
      clearTimeout(tic);
      clearInterval(vigila);
    }, 2000);
  }
});
</script>

<script>
/* JEFE — LA SETMANA

   QUÈ RESPON, I PER QUÈ NO ÉS LA PÀGINA DEL DIA SET VEGADES.
   La pàgina del dia respon «què he de tenir en compte ara». Repetir-la set
   cops no dona cap resposta nova: dona set llistes. Aquí la pregunta és una
   altra —QUAN HO FARÉ— i només es contesta veient alhora dues coses que fins
   ara no s'havien vist mai juntes: on són les hores que ja tens ocupades, i
   què és el que t'espera sense dia.

   PER AIXÒ LA PILA ÉS MITJA PANTALLA. El que arrossegues no té data justament
   perquè encara no has decidit quan, i decidir-ho és tota la feina d'aquesta
   pantalla. Cada cosa de la pila es pot deixar en un dia amb dos tocs.

   NO ÉS UN MÒDUL I NO TÉ BOTÓ, com la pàgina del dia. S'hi arriba demanant-la
   —«prepara'm la setmana»— o pel senyal de diumenge a la tarda, que és quan
   això serveix. Un botó més a la fila de sota seria una decisió més cada cop
   que obres l'app, per una pantalla on entres un cop la setmana. */

App.registraVista('setmana', {
  render: function (arrel, params) {

    var desde = params.desde || null;
    var d = null;
    var obert = null;                 // quina fila de la pila té els dies oberts

    var DIES = ['dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte', 'diumenge'];
    var DIES_C = ['dl', 'dt', 'dc', 'dj', 'dv', 'ds', 'dg'];

    /* Les hores dites com les diries tu: «5 h», «1 h 30». Els minuts sols no
       existeixen en una setmana —ningú diu que dijous té 310 minuts— i el
       decimal («5,2 h») és una xifra de full de càlcul. */
    function hores(min) {
      if (!min) return '';
      var h = Math.floor(min / 60), m = min % 60;
      if (!h) return m + ' min';
      return h + ' h' + (m >= 10 ? ' ' + m : '');
    }

    function capcalera() {
      var quan = d
        ? (d.esAquesta ? 'Aquesta setmana' : fmt.relativa(d.desde) + ' → ' + fmt.relativa(d.fins))
        : '';
      return '<header class="capcalera"><div class="capcalera-fila">' +
        '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
          ic('conversa', 'ic-p') + '</button>' +
        '<button class="btn btn-fantasma btn-icona" data-mou="-7" aria-label="La setmana abans">' +
          ic('esquerra', 'ic-p') + '</button>' +
        '<span class="titol-periode" style="cursor:default">' +
          '<b>' + esc(quan) + '</b>' +
          '<span>' + (d ? esc(fmt.llarga(d.desde).replace(/^\w+, /, '') + ' — ' +
                             fmt.llarga(d.fins).replace(/^\w+, /, '')) : '') + '</span>' +
        '</span>' +
        '<button class="btn btn-fantasma btn-icona" data-mou="7" aria-label="La setmana següent">' +
          ic('dreta', 'ic-p') + '</button>' +
      '</div></header>';
    }

    /* Un dia. La capçalera porta el nom, el número i les hores ocupades; sota,
       les coses. La barra compara amb el dia més ple DE LA SETMANA i no amb
       cap ideal: el que vols saber és quin dia va carregat comparat amb els
       altres sis, no si vuit hores són moltes. */
    function dia(x, i) {
      var pct = d.minutsPle ? Math.round((x.minuts / d.minutsPle) * 100) : 0;
      return '<section class="caixa set-dia"' +
          (x.esAvui ? ' data-avui="1"' : '') + (x.esPassat ? ' data-passat="1"' : '') + '>' +
        /* La capçalera del dia obre la pàgina d'aquell dia. Aquí es veu la
           forma de la setmana; quan un dia et crida l'atenció, el que vols
           després és aquell dia sencer, i ja existeix una pantalla que el diu. */
        '<h3 class="caixa-cap"><button class="set-cap" data-dia="' + esc(x.data) + '"' +
          ' aria-label="Obre ' + DIES[i] + ' ' + fmt.diaNumero(x.data) + '">' +
          '<span>' + DIES_C[i] + ' ' + fmt.diaNumero(x.data) + '</span>' +
          (x.minuts ? '<em class="set-hores">' + esc(hores(x.minuts)) + '</em>' : '') +
        '</button></h3>' +
        (d.minutsPle
          ? '<div class="set-carrega" role="img" aria-label="' +
              (x.minuts ? esc(hores(x.minuts)) + ' ocupades' : 'sense res al calendari') + '">' +
              '<i style="width:' + pct + '%"></i></div>'
          : '') +
        (x.coses.length
          ? '<ul class="caixa-coses">' + x.coses.map(cosa).join('') + '</ul>'
          : '<p class="set-buit">' + (x.esPassat ? '—' : 'Lliure') + '</p>') +
      '</section>';
    }

    function cosa(c) {
      return '<li class="set-cosa"' + (c.fet ? ' data-fet="1"' : '') +
             (c.urgent ? ' data-urgent="1"' : '') + '>' +
        '<span class="set-hora">' + esc(c.hora || '·') + '</span>' +
        '<span class="set-text">' + esc(c.text) + '</span>' +
      '</li>';
    }

    /* LA PILA. Cada cosa porta d'on surt —tasca teva, cosa de l'escola— i, si
       es pot moure, el botó de posar-hi dia. Les que no es poden moure hi són
       igualment: pesen la setmana encara que avui no les puguis repartir. */
    function pila() {
      if (!d.pila.length) {
        return '<section class="secc"><div class="estat">' + ic('tasques', 'ic-g') +
          '<h2>No arrossegues res</h2>' +
          '<p>Tot el que tens apuntat té dia. Passa poc.</p></div></section>';
      }
      return '<section class="secc">' +
        '<div class="caixes"><section class="caixa">' +
          '<h3 class="caixa-cap"><span>El que espera</span>' +
            '<em class="set-hores">' + d.pila.length + '</em></h3>' +
          '<ul class="caixa-coses">' + d.pila.map(function (c, i) {
            var pot = !!c.mou;
            return '<li class="pila-fila"' + (c.urgent ? ' data-urgent="1"' : '') + '>' +
              '<div class="pila-cap">' +
                '<span class="pila-text">' + esc(c.text) + '</span>' +
                (c.menut ? '<span class="menut">' + esc(c.menut) + '</span>' : '') +
                (pot
                  ? '<button class="pila-quan" data-obre="' + i + '"' +
                      ' aria-expanded="' + (obert === i ? 'true' : 'false') + '"' +
                      ' aria-label="Posa dia a: ' + esc(c.text) + '">' +
                      ic('calendari', 'ic-p') + '</button>'
                  : '') +
              '</div>' +
              (pot && obert === i ? tria(i) : '') +
            '</li>';
          }).join('') + '</ul>' +
        '</section></div>' +
      '</section>';
    }

    /* Els set dies, per triar-ne un. Set caselles i no un calendari: la
       decisió és «quin dia d'aquesta setmana», i un calendari sencer seria
       demanar-te que triïs entre tres-cents seixanta-cinc quan en vols set. */
    function tria(i) {
      return '<div class="pila-tria">' + d.dies.map(function (x, j) {
        return '<button data-posa="' + i + '" data-data="' + esc(x.data) + '"' +
          (x.esPassat ? ' disabled' : '') +
          ' aria-label="' + DIES[j] + ' ' + fmt.diaNumero(x.data) + '">' +
          DIES_C[j] + '<b>' + fmt.diaNumero(x.data) + '</b></button>';
      }).join('') + '</div>';
    }

    function pinta() {
      arrel.innerHTML = capcalera() +
        '<div class="pagina">' +
          '<section><div class="set-dies">' +
            d.dies.map(dia).join('') +
          '</div></section>' +
          pila() +
        '</div>';
      lliga();
    }

    function lliga() {
      var t = arrel.querySelector('[data-torna]');
      if (t) t.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-mou]').forEach(function (b) {
        b.addEventListener('click', function () {
          desde = fmt.suma(d.desde, Number(b.dataset.mou));
          obert = null;
          carrega();
        });
      });

      arrel.querySelectorAll('[data-dia]').forEach(function (b) {
        b.addEventListener('click', function () { App.ves('dia', { data: b.dataset.dia }); });
      });

      arrel.querySelectorAll('[data-obre]').forEach(function (b) {
        b.addEventListener('click', function () {
          var i = Number(b.dataset.obre);
          obert = (obert === i) ? null : i;
          App.mantenintLaVista(pinta);
        });
      });

      arrel.querySelectorAll('[data-posa]').forEach(function (b) {
        b.addEventListener('click', function () { posa(Number(b.dataset.posa), b.dataset.data); });
      });
    }

    /* POSAR DIA. El client no espera el servidor per ensenyar-ho: la cosa surt
       de la pila i entra al dia abans que Google contesti, perquè el que
       acabes de decidir ja el saps tu. Si falla, torna on era i t'ho diu —una
       cosa que desapareix i reapareix sola és pitjor que un error. */
    function posa(i, data) {
      var c = d.pila[i];
      if (!c || !c.mou) return;

      var abans = { pila: d.pila.slice(), dies: d.dies.map(function (x) {
        return { data: x.data, diaSetmana: x.diaSetmana, esAvui: x.esAvui,
                 esPassat: x.esPassat, minuts: x.minuts, coses: x.coses.slice() };
      }) };

      d.pila.splice(i, 1);
      for (var j = 0; j < d.dies.length; j++) {
        if (d.dies[j].data !== data) continue;
        var mogut = {};
        for (var k in c) if (Object.prototype.hasOwnProperty.call(c, k)) mogut[k] = c[k];
        mogut.menut = c.menut && /vencia/.test(c.menut) ? 'ho has posat aquí' : c.menut;
        mogut.urgent = false;
        d.dies[j].coses.push(mogut);
        break;
      }
      obert = null;
      App.mantenintLaVista(pinta);

      var p = {};
      for (var q in c.mou.params) if (Object.prototype.hasOwnProperty.call(c.mou.params, q)) {
        p[q] = c.mou.params[q];
      }
      p[c.mou.camp] = data;

      /* `crida` i no `escriu`: `escriu` demana de passada la pantalla del
         mòdul que ha canviat, i aquí la pantalla del mòdul no la mira ningú.
         Serien tres-centes tasques de Google llegides per res. */
      crida(c.modul, c.mou.accio, p)
        .then(function () {
          /* El que acaba de canviar ja no és el que hi ha desat al telèfon:
             ni aquesta setmana, ni les tasques, ni la pàgina del dia. */
          Cau.oblida('setmana');
          Cau.oblida('tasques');
          Cau.oblida('dia.');
          App.brindis(fmt.relativa(data));
        })
        .catch(function (err) {
          d.pila = abans.pila; d.dies = abans.dies;
          App.mantenintLaVista(pinta);
          App.brindis(err.message, 'error');
        });
    }

    function carrega() {
      var clau = 'setmana.' + (desde || 'ara');
      var cau = Cau.get(clau, null);
      if (cau) { d = cau; pinta(); }
      else arrel.innerHTML = Comp.carregant(3);

      crida('conversa', 'laSetmana', desde ? { desde: desde } : {})
        .then(function (r) {
          d = r;
          Cau.set(clau, r);
          if (desde) Cau.set('setmana.' + r.desde, r);
          App.mantenintLaVista(pinta);
        })
        .catch(function (err) {
          if (d) { App.brindis(err.message, 'error'); return; }
          arrel.innerHTML = Comp.error(err, true);
          var b = arrel.querySelector('[data-reintenta]');
          if (b) b.addEventListener('click', function () { App.ves('setmana'); });
        });
    }

    carrega();
  }
});
</script>

<script>
/* JEFE — MÒDUL · Relacions

   QUÈ ENSENYA: què va junt amb què, de tot el que apuntes.

   L'ORDRE MANA, I ÉS L'ARGUMENT DE LA PANTALLA:

     1. EL QUE S'HA VIST. Cada cosa amb la seva frase, les setmanes que hi ha
        al darrere i la força. Cap diu «perquè».
     2. EL QUE NO ES POT DIR ENCARA, amb les setmanes que li falten.
     3. QUÈ S'HA MIRAT I QUÈ S'HA DESCARTAT.

   Els punts 2 i 3 no són lletra petita: són la meitat del valor. Una app que
   només ensenyés les relacions que ha trobat seria indistingible d'una que
   se les inventa. Ensenyar quantes parelles s'han provat, quantes no han
   passat el filtre i què està esperant dades és el que fa que et puguis
   creure les tres que sí que hi surten.

   NO HI HA GRÀFICS. Cada relació es podria dibuixar amb un núvol de punts, i
   seria bonic i no diria res més que la frase: amb dotze punts, l'ull hi veu
   la forma que vulgui. El número que mana ja hi és —les setmanes— i el
   dibuix només serviria per fer-ho semblar més científic del que és. */

App.registraVista('relacions', {
  render: function (arrel) {

    var d = null;
    var calculant = false;

    function capcalera() {
      return '<header class="capcalera"><div class="capcalera-fila">' +
        '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
          ic('conversa', 'ic-p') + '</button>' +
        '<div style="flex:1;min-width:0">' +
          '<h1 style="font-size:1.0625rem;margin:0">Relacions</h1>' +
          '<p class="marge" style="margin:2px 0 0">' +
            (d && d.calculat
              ? d.provades + (d.provades === 1 ? ' parella mirada' : ' parelles mirades')
              : '') +
          '</p>' +
        '</div>' +
      '</div></header>';
    }

    /* La força, dita amb paraules i no amb el número. «rho 0,72» no vol dir
       res a ningú i «forta» sí; el número hi és igualment al peu, per a qui
       el vulgui mirar. */
    /* «5 de febrer», sense el dia de la setmana: aquí no importa si era
       dijous, importa per on comença el que s'ha mirat. */
    function sensDia(data) {
      return String(fmt.llarga(data)).replace(/^[^,]+,\s*/, '');
    }

    function forca(r) {
      var a = Math.abs(r);
      return a >= 0.8 ? 'molt forta' : a >= 0.65 ? 'forta' : 'clara';
    }

    function trobades() {
      if (!d.trobades.length) {
        return '<section class="secc"><div class="estat">' + ic('relacions', 'ic-g') +
          '<h2>Encara res de prou clar</h2>' +
          '<p>S\'han mirat ' + d.provades + ' parelles i cap ha passat el filtre. ' +
          'Amb més setmanes apuntades, això canvia.</p></div></section>';
      }
      return '<section class="secc">' +
        '<p class="marge">El que va junt</p>' +
        '<div class="caixes"><section class="caixa"><ul class="caixa-coses">' +
          d.trobades.map(function (t) {
            return '<li class="rel-fila">' +
              '<p class="rel-frase">' + esc(t.frase) + '</p>' +
              '<p class="rel-peu">' +
                '<span>' + t.n + ' setmanes</span>' +
                '<span>relació ' + forca(t.rho) + '</span>' +
                /* Dos decimals i no un: `fmt.decimal` arrodoneix a un i
                   convertia un −0,74 en un −0,7. Aquí el número és per a qui
                   el vulgui mirar de debò, i arrodonir-lo el fa inútil. */
                '<span class="rel-rho">rho ' +
                  esc((t.rho < 0 ? '−' : '') + Math.abs(t.rho).toFixed(2).replace('.', ',')) +
                '</span>' +
              '</p>' +
            '</li>';
          }).join('') +
        '</ul></section></div>' +
        /* L'avís va SOTA la llista i no a sobre. A sobre seria una excusa
           anticipada; a sota és el que has de tenir al cap quan acabes de
           llegir-les i abans de fer-ne res. */
        '<p class="menut" style="margin-top:var(--e3)">Dues coses que van juntes no diuen ' +
          'quina mou l\'altra, ni si les mou una tercera. Això ho saps tu.</p>' +
      '</section>';
    }

    function esperant() {
      if (!d.curtes.length) return '';
      return '<section class="secc">' +
        '<p class="marge">Esperant setmanes</p>' +
        '<div class="caixes"><section class="caixa"><ul class="caixa-coses">' +
          d.curtes.map(function (c) {
            return '<li class="rel-fila rel-curta">' +
              '<p class="rel-frase">' + esc(c.a) + ' i ' + esc(c.b) + '</p>' +
              '<p class="rel-peu"><span>' + c.setmanes + ' de ' + d.minim +
                ' setmanes amb totes dues dades</span></p>' +
            '</li>';
          }).join('') +
        '</ul></section></div>' +
      '</section>';
    }

    function peu() {
      return '<section class="secc">' +
        '<div class="caixes"><section class="caixa">' +
          '<h3 class="caixa-cap"><span>Com es mira</span></h3>' +
          '<ul class="caixa-coses">' +
            ['Es comparen ' + d.series + ' sèries per setmanes, no per dies.',
             'Cal un mínim de ' + d.minim + ' setmanes amb totes dues dades.',
             'Es compara l\'ordre de les setmanes, no els valors: una setmana ' +
               'rara no s\'endú la conclusió.',
             'De les ' + d.provades + ' parelles provades es controla que, del que ' +
               'es digui, com a molt una de cada deu sigui casualitat.',
             'Coses de la mateixa família no es creuen: que el pes i la cintura ' +
               'vagin junts no és cap descobriment.'
            ].map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
          '</ul>' +
        '</section></div>' +
        /* Les dates, dites com les diries. «Mirat del 2026-02-05 al
           2026-08-04» és com ho guarda el full, no com es llegeix. */
        '<p class="menut" style="margin-top:var(--e2)">' +
          esc('Mirat del ' + sensDia(d.desde) + ' al ' + sensDia(d.fins) + '.') +
          ' Es refà sol un cop la setmana.' +
        '</p>' +
        '<button class="btn btn-fantasma" data-recalcula style="margin-top:var(--e3)"' +
          (calculant ? ' disabled' : '') + '>' +
          (calculant ? 'Mirant-ho…' : 'Torna-ho a mirar ara') + '</button>' +
        (calculant ? '<p class="menut">Triga: està llegint mig any de tot.</p>' : '') +
      '</section>';
    }

    function pinta() {
      arrel.innerHTML = capcalera() +
        '<div class="pagina">' +
          (d.calculat
            ? trobades() + esperant() + peu()
            : '<section class="secc"><div class="estat">' + ic('relacions', 'ic-g') +
                '<h2>Encara no ho he mirat mai</h2>' +
                '<p>Es fa sol un cop la setmana, en segon pla. Si no vols esperar, ' +
                'demana-ho ara.</p>' +
                '<button class="btn btn-primari" data-recalcula' +
                  (calculant ? ' disabled' : '') + '>' +
                  (calculant ? 'Mirant-ho…' : 'Mira-ho ara') + '</button>' +
              '</div></section>') +
        '</div>';
      lliga();
    }

    function lliga() {
      var t = arrel.querySelector('[data-torna]');
      if (t) t.addEventListener('click', function () { App.ves('conversa'); });

      arrel.querySelectorAll('[data-recalcula]').forEach(function (b) {
        b.addEventListener('click', function () {
          calculant = true;
          App.mantenintLaVista(pinta);
          crida('relacions', 'recalcula', {})
            .then(function (r) {
              calculant = false;
              d = r; Cau.set('relacions', r);
              App.mantenintLaVista(pinta);
            })
            .catch(function (err) {
              calculant = false;
              App.mantenintLaVista(pinta);
              App.brindis(err.message, 'error');
            });
        });
      });
    }

    function carrega() {
      var cau = Cau.get('relacions', null);
      if (cau) { d = cau; pinta(); }
      else arrel.innerHTML = Comp.carregant(3);

      crida('relacions', 'pantalla', {}).then(function (r) {
        d = r; Cau.set('relacions', r);
        App.mantenintLaVista(pinta);
      }).catch(function (err) {
        if (d) return;
        arrel.innerHTML = Comp.error(err, true);
        var b = arrel.querySelector('[data-reintenta]');
        if (b) b.addEventListener('click', function () { App.ves('relacions'); });
      });
    }

    carrega();
  }
});
</script>

<script>
/* JEFE — MÒDUL · La memòria

   QUÈ ÉS AQUESTA PANTALLA: tot el que JEFE sap de tu perquè li has dit tu.
   No hi ha res deduït ni endevinat, i per això es pot llegir sencera i
   entendre-la sense explicacions.

   L'ORDRE MANA: primer el camp per afegir-ne un, perquè el 90% de les vegades
   que entres aquí és per afegir o per treure una cosa concreta, no per llegir.
   Després els records per menes, i al final els oblidats, plegats: no s'esborra
   res mai i el que has tret ha de ser recuperable sense demanar-ho a ningú.

   Les caixes són les mateixes que a Escola i a Tasques. Tres pantalles que
   ensenyen llistes agrupades no poden veure's de tres maneres. */

App.registraVista('memoria', {
  render: function (arrel) {

    var d = null;
    var veureOblidats = false;
    var filtre = '';

    var NOM = {
      persona: 'Persones',
      preferencia: 'Com m\'agraden les coses',
      decisio: 'Decisions',
      rutina: 'Rutines',
      fet: 'Altres'
    };

    function capcalera() {
      return '<header class="capcalera"><div class="capcalera-fila">' +
        '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
          ic('conversa', 'ic-p') + '</button>' +
        '<div style="flex:1;min-width:0">' +
          '<h1 style="font-size:1.0625rem;margin:0">Memòria</h1>' +
          '<p class="marge" style="margin:2px 0 0">' +
            (d ? d.quants + (d.quants === 1 ? ' cosa que sé de tu' : ' coses que sé de tu') : '') +
          '</p>' +
        '</div>' +
      '</div></header>';
    }

    function pinta() {
      arrel.innerHTML = capcalera() +
        '<div class="pagina">' +

          '<section>' +
            '<label class="camp-captura">' +
              '<span class="marge">Què vols que recordi</span>' +
              '<div class="captura-fila">' +
                '<input id="m-nou" placeholder="La Marta és la tutora de 2nB" autocomplete="off">' +
                '<button class="btn btn-primari" data-desa>' + ic('mes') + '</button>' +
              '</div>' +
            '</label>' +
            '<p class="menut" style="margin-top:var(--e2)">També pots dir-li-ho parlant: ' +
              '«recorda que els dimarts tinc claustre».</p>' +
          '</section>' +

          (d.quants > 6
            ? '<section class="secc">' +
                '<label class="camp-captura">' +
                  '<div class="captura-fila">' +
                    '<input id="m-cerca" placeholder="Buscar" autocomplete="off" value="' +
                      esc(filtre) + '">' +
                  '</div>' +
                '</label>' +
              '</section>'
            : '') +

          '<section class="secc">' +
            (d.blocs.length
              ? '<div class="caixes">' + d.blocs.map(function (b) {
                  return '<section class="caixa">' +
                    '<h3 class="caixa-cap"><span>' + esc(NOM[b.mena] || b.mena) + '</span></h3>' +
                    '<ul class="caixa-coses">' + b.records.map(function (r) {
                      return '<li class="mem-fila">' +
                        '<span>' + esc(r.fet) + '</span>' +
                        '<button class="mem-fora" data-oblida="' + esc(r.id) + '"' +
                          ' aria-label="Oblida: ' + esc(r.fet) + '">' + ic('tancar', 'ic-p') + '</button>' +
                      '</li>';
                    }).join('') + '</ul>' +
                  '</section>';
                }).join('') + '</div>'
              : '<p class="menut">' + (filtre
                  ? 'Res que digui això.'
                  : 'Encara no sé res de tu. El primer que li diguis ja no caldrà repetir-l\'hi.') +
                '</p>') +
          '</section>' +

          (d.oblidats.length
            ? '<section class="secc">' +
                '<button class="desplega" data-oblidats="1" aria-expanded="' +
                  (veureOblidats ? 'true' : 'false') + '">' +
                  ic('dreta', 'ic-p') + '<span>' +
                  (veureOblidats ? 'Amaga' : 'Veure') +
                  (d.oblidats.length === 1 ? ' el que has tret'
                                           : ' els ' + d.oblidats.length + ' que has tret') +
                  '</span></button>' +
                (veureOblidats
                  ? '<div class="caixes"><section class="caixa"><ul class="caixa-coses">' +
                      d.oblidats.map(function (r) {
                        return '<li class="mem-fila mem-vell">' +
                          '<span>' + esc(r.fet) + '</span>' +
                          '<button class="mem-torna" data-recupera="' + esc(r.id) + '">Torna-hi</button>' +
                        '</li>';
                      }).join('') +
                    '</ul></section></div>'
                  : '') +
              '</section>'
            : '') +
        '</div>';

      lliga();
    }

    function lliga() {
      var t = arrel.querySelector('[data-torna]');
      if (t) t.addEventListener('click', function () { App.ves('conversa'); });

      var camp = arrel.querySelector('#m-nou');
      var desa = function () {
        var text = camp.value.trim();
        if (!text) return;
        camp.value = '';
        escriu('memoria', 'recorda', { fet: text }, {})
          .then(function (r) { d = r; App.brindis('Recordat'); App.mantenintLaVista(pinta); })
          .catch(function (err) { camp.value = text; App.brindis(err.message, 'error'); });
      };
      arrel.querySelector('[data-desa]').addEventListener('click', desa);
      camp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); desa(); }
      });

      /* La cerca és local: tot el que hi ha ja és al navegador i anar-ho a
         preguntar seria esperar dos segons per filtrar trenta línies. */
      var cerca = arrel.querySelector('#m-cerca');
      if (cerca) {
        cerca.addEventListener('input', function () {
          filtre = cerca.value;
          crida('memoria', 'pantalla', { conte: filtre }).then(function (r) {
            d = r;
            App.mantenintLaVista(function () {
              pinta();
              var c = arrel.querySelector('#m-cerca');
              if (c) { c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
            });
          });
        });
      }

      var ov = arrel.querySelector('[data-oblidats]');
      if (ov) ov.addEventListener('click', function () {
        veureOblidats = !veureOblidats;
        App.mantenintLaVista(pinta);
      });

      arrel.querySelectorAll('[data-oblida]').forEach(function (b) {
        b.addEventListener('click', function () {
          var fila = b.closest('.mem-fila');
          fila.dataset.fora = '1';
          escriu('memoria', 'oblida', { id: b.dataset.oblida }, { conte: filtre })
            .then(function (r) { d = r; App.mantenintLaVista(pinta); })
            .catch(function (err) { fila.removeAttribute('data-fora'); App.brindis(err.message, 'error'); });
        });
      });

      arrel.querySelectorAll('[data-recupera]').forEach(function (b) {
        b.addEventListener('click', function () {
          escriu('memoria', 'recupera', { id: b.dataset.recupera }, { conte: filtre })
            .then(function (r) { d = r; App.brindis('Hi torna a ser'); App.mantenintLaVista(pinta); })
            .catch(function (err) { App.brindis(err.message, 'error'); });
        });
      });
    }

    function carrega() {
      var cau = Cau.get('memoria', null);
      if (cau) { d = cau; pinta(); }
      else arrel.innerHTML = Comp.carregant(3);

      crida('memoria', 'pantalla', {}).then(function (r) {
        d = r; Cau.set('memoria', r);
        App.mantenintLaVista(pinta);
      }).catch(function (err) {
        if (d) return;
        arrel.innerHTML = Comp.error(err, true);
        var b = arrel.querySelector('[data-reintenta]');
        if (b) b.addEventListener('click', function () { App.ves('memoria'); });
      });
    }

    carrega();
  }
});
</script>

  (function () {
    // Cal la forma que NO escapa: l'altra convertiria les cometes en entitats
    // HTML i trencaria el JSON. Compte: no s'ha d'escriure mai sintaxi de
    // plantilla dins d'un comentari, perquè Apps Script també la interpreta.
    var estat = null;
    App.arrenca(estat);
    App.pintaPendents();
  })();
</script>
