                   padding: 0 var(--e2); font: inherit; background: var(--paper);
                   color: var(--ink); border: 1px solid var(--neatline); border-radius: var(--r); }

/* Despesa o ingrés: la primera decisió, i la que canvia les categories. */
.tipus-tria { display: flex; border: 1px solid var(--neatline); margin-bottom: var(--e4); }
.tipus-tria button { flex: 1; min-height: 44px; background: none; border: 0;
                     border-right: 1px solid var(--neatline); font: inherit;
                     color: var(--ink-suau); cursor: pointer; }
.tipus-tria button:last-child { border-right: 0; }
.tipus-tria button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }

/* L'import mana: és l'únic camp que sempre has d'omplir. */
.camp-import { font-size: 1.75rem !important; font-weight: 700; text-align: center; }

.sugg { display: flex; flex-wrap: wrap; gap: var(--e2); margin: 0 0 var(--e3); }
.sugg:empty { display: none; }
.sugg button { min-height: 40px; padding: 0 var(--e3); background: none; font: inherit;
               font-size: .8125rem; border: 1px solid var(--neatline); color: var(--ink-suau);
               border-radius: var(--r); cursor: pointer; }
.sugg button:active { color: var(--ink); border-color: var(--ink); }

.form-ajustos label { display: block; margin-bottom: var(--e3); }
/* La casella amb la seva etiqueta al costat. `.form-ajustos label` és més
   específic que `.cat-exclou` i li posava `display:block`, i llavors el buit
   entre la casella i el text desapareixia: quedaven enganxats. */
.form-ajustos label.cat-exclou { display: flex; align-items: center; gap: var(--e2); }

/* `:not([type="checkbox"])` I `textarea`, i totes dues coses són arreglos.
   ---------------------------------------------------------------------
   Sense el `:not`, aquesta regla —que va més avall al full i per tant guanya
   a igualtat de pes— convertia qualsevol casella de verificació d'un tauler
   en un rectangle de 48 px d'alt i amplada sencera. Es veia als taulers de
   tasques («Prioritària») i del calendari («Tot el dia»): un bloc fosc surant
   sobre l'etiqueta.
   I el `textarea` no hi era: les notes es pintaven sense estil, petites i
   desalineades, al costat de camps que sí que en tenien. */
.form-ajustos input:not([type="checkbox"]),
.form-ajustos select,
.form-ajustos textarea {
  width: 100%; min-height: var(--toc);
  margin-top: var(--e1); padding: var(--e2) var(--e3);
  font: inherit; background: var(--paper);
  color: var(--ink); border: 1px solid var(--neatline);
  border-radius: var(--r); -webkit-appearance: none; appearance: none;
}
.form-ajustos input:not([type="checkbox"]) { padding: 0 var(--e3); }
.form-ajustos textarea { line-height: 1.5; resize: vertical; }
/* El ring de teclat, a part: apagar-lo deixava qui va amb tabulador sense
   saber on es, i el canvi de color d'una vora d'un pixel no compta. */
.form-ajustos input:focus-visible, .form-ajustos select:focus-visible,
.form-ajustos textarea:focus-visible { outline: 3px solid var(--utm); outline-offset: 1px; }
.form-ajustos input:focus, .form-ajustos select:focus, .form-ajustos textarea:focus {
  border-color: var(--utm);
}
.form-ajustos hr { border: 0; border-top: 3px double var(--neatline); margin: var(--e4) 0; }

/* Els botons d'un tauler van un sota l'altre i a amplada sencera. Un «Desa» i
   un «Treu-la» de costat, a més d'estrets, posen a la mateixa alçada i amb la
   mateixa pinta la cosa que vols fer i la que no vols fer mai sense pensar. */
.form-ajustos > button { width: 100%; }

/* -------------------------------------------------------------------- modal */

.fosc { position: fixed; inset: 0; z-index: 50; background: rgba(14,18,20,.6);
        display: flex; align-items: flex-end; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity .2s linear; }
.fosc[data-obert="1"] { opacity: 1; pointer-events: auto; }
.modal { width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto;
         background: var(--paper); border: 1.5px solid var(--neatline); border-bottom: 0;
         padding: var(--e4) var(--e4) calc(var(--e5) + env(safe-area-inset-bottom, 0px));
         transform: translateY(100%); transition: transform .32s var(--sortida); }
.fosc[data-obert="1"] .modal { transform: translateY(0); }
.modal-cap { display: flex; align-items: center; gap: var(--e3);
             margin-bottom: var(--e4); padding-bottom: var(--e3);
             border-bottom: 3px double var(--neatline); }
.modal-cap h2 { flex: 1; }
@media (min-width: 900px) {
  .fosc { align-items: center; }
  .modal { border-bottom: 1.5px solid var(--neatline); max-height: 84vh; }
}

/* ==========================================================================
   EL VISOR

   Quan li demanes una cosa que es POT ENSENYAR —«ensenya'm la gràfica del
   tabac»—, contestar-la amb text seria descriure-la en comptes de donar-la.
   S'obre un plafó a sobre i allà hi ha la cosa.

   No és un modal nou: és el de sempre, vestit de consola. Reaprofita el que
   ja estava fet i provat —el focus que hi entra i torna, el fons que tanca,
   la tecla d'escapada— i només canvia com es veu. Un segon sistema de
   finestres seria un segon lloc on arreglar els mateixos errors.
   ========================================================================== */

.modal[data-visor="1"] {
  max-width: 420px;
  background: linear-gradient(180deg, #0b1c28, #071019);
  border: 1px solid #1d4459; border-bottom: 1px solid #1d4459;
  color: #dff6f9;
  padding: var(--e3) var(--e3) calc(var(--e4) + env(safe-area-inset-bottom, 0px));
  /* Entra creixent i pujant. Res no apareix mai del no-res: una cosa que
     surt de mida zero no s'assembla a res que passi al món. */
  transform: translateY(14px) scale(.96);
  transition: transform .3s var(--sortida), opacity .22s var(--sortida);
  opacity: 0;
}
.fosc[data-obert="1"] .modal[data-visor="1"] { transform: none; opacity: 1; }

.modal[data-visor="1"] .modal-cap {
  border-bottom: 1px solid #12293a; margin-bottom: var(--e3); padding-bottom: var(--e2);
}
.modal[data-visor="1"] .modal-cap h2 {
  font-family: var(--mono); font-size: .6875rem; letter-spacing: .16em;
  text-transform: uppercase; font-weight: 400; color: #dff6f9;
}
.modal[data-visor="1"] .btn-fantasma { color: #6f93a6; }

/* Les claus de la consola, i s'encenen DESPRÉS del plafó: primer arriba, i
   llavors es reconeix com a part d'aquesta màquina. */
.visor-clau { position: absolute; width: 12px; height: 12px; border: 0 solid var(--cian, #4fd6e0);
              opacity: 0; transition: opacity .3s var(--sortida) .16s; }
.fosc[data-obert="1"] .visor-clau { opacity: 1; }
.visor-clau.d1 { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
.visor-clau.d2 { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
.visor-clau.d3 { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
.visor-clau.d4 { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

/* ---------------------------------------------------------- les quatre formes
   Vegeu `ui_visor.html`: llista, línia, barres i taula. Amb aquestes quatre
   s'ensenya tot el que aquesta app té, i per això no n'hi ha cap més. */

.vis-llista { margin: 0; padding: 0; list-style: none; }
.vis-llista li { display: flex; gap: var(--e2); align-items: baseline;
                 padding: 5px 0; line-height: 1.45; }
.vis-llista li + li { border-top: 1px solid rgba(18, 41, 58, .8); }
/* Sempre la mateixa amplada: l'ull ha de poder baixar sense tornar enrere. */
.vis-marca { flex: none; width: 3.1em; font-family: var(--mono); font-size: .6875rem;
             color: #7fa3b3; }
.vis-cos { flex: 1; min-width: 0; }
.vis-text { display: block; font-size: .9375rem; overflow-wrap: anywhere; }
.vis-llista .menut { display: block; margin-top: 1px; }
.vis-llista li[data-fet="1"] .vis-text { color: #7fa3b3; }
.vis-llista li[data-urgent="1"] .vis-marca { color: var(--alerta, #ef5f52); }

.vis-linia { display: block; width: 100%; height: 112px; }
.vis-traç { fill: none; stroke: var(--cian, #4fd6e0); stroke-width: 2;
            stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.vis-punt { fill: #0b1c28; stroke: var(--cian, #4fd6e0); stroke-width: 1.4; }
.vis-ara { fill: var(--cian, #4fd6e0); stroke: none; }
.vis-eix { display: flex; justify-content: space-between; margin-top: 4px;
           font-family: var(--mono); font-size: .625rem; color: #7fa3b3; }

/* Barres horitzontals: les etiquetes són paraules, i en vertical caldria
   girar-les. Un text girat no es llegeix, es desxifra. */
.vis-barres { display: flex; flex-direction: column; gap: 7px; }
.vis-barra { display: grid; grid-template-columns: 8.5em 1fr auto; gap: var(--e2);
             align-items: center; }
.vis-barra-nom { font-size: .8125rem; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
.vis-barra-riu { height: 8px; background: rgba(18, 41, 58, .9); display: block; }
.vis-barra-riu i { display: block; height: 100%; background: var(--cian, #4fd6e0); }
.vis-barra-val { font-family: var(--mono); font-size: .6875rem; color: #b6ccd3;
                 font-variant-numeric: tabular-nums; }

.vis-taula-fora { overflow-x: auto; }
.vis-taula { width: 100%; border-collapse: collapse; font-size: .8125rem; }
.vis-taula th { text-align: left; font-family: var(--mono); font-size: .625rem;
                letter-spacing: .1em; text-transform: uppercase; color: #7fa3b3;
                font-weight: 400; padding: 0 var(--e2) 5px 0; }
.vis-taula td { padding: 5px var(--e2) 5px 0; border-top: 1px solid rgba(18, 41, 58, .8);
                font-variant-numeric: tabular-nums; }

/* El peu d'un plafó: d'on surt el que veus i què n'ha canviat. Dues xifres i
   prou —una a cada punta— perquè el dibuix no quedi flotant sense context. */
.visor-peu {
  display: flex; justify-content: space-between; gap: var(--e2); margin-top: var(--e2);
  font-family: var(--mono); font-size: .6875rem; letter-spacing: .04em; color: #8fb0bd;
}

@media (prefers-reduced-motion: reduce) {
  .modal[data-visor="1"] { transition: none; }
  .visor-clau { transition: none; }
}

.selector-data { display: flex; align-items: center; gap: var(--e2); }
.selector-data .data { flex: 1; text-align: center; }

.tira { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: var(--e3); }
.tira .xifra-gran { font-size: 1.75rem; line-height: 1; font-weight: 700;
                    font-style: italic; color: var(--corba-mestra); }

/* =========================================================================
   DISPOSICIÓ AMPLA — ha d'anar AL FINAL del full
   Si aquest bloc va abans de les regles base, la cascada les barreja: el
   `position` es perd però el `top` sobreviu, i la navegació es converteix en
   una capa fixa de pantalla sencera que tapa el contingut. Va passar.
   ========================================================================= */

@media (min-width: 900px) {
  /* El cos passa a columna per poder posar la navegació a dalt sense
     moure-la del final del document (que és on ha de ser per al teclat). */
  body { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: var(--e6); }
  #sense-xarxa, #pendents { order: -2; }
  .nav { order: -1; }
  main#vista { order: 0; flex: 1; display: flex; flex-direction: column; }
  /* La capsa de la vista ha de créixer com creixia la vista quan pintava
     directament a `#vista`. Vegeu `App.ves`: ara cada render té la seva. */
  .vista-capsa { flex: 1; min-height: 0; }

  .pagina { padding: var(--e5) var(--e5) var(--e7); }
  .dues-columnes { grid-template-columns: minmax(320px, 380px) 1fr; align-items: start; }

  /* A l'escriptori hi cap tot alhora: xifres i tancament a l'esquerra, els
     àpats a la dreta. Al mòbil manen l'ordre i l'espai; aquí, la vista de
     conjunt.

     `grid-template-rows: auto 1fr` és el que enganxa el tancament just sota
     les xifres. Amb files automàtiques, la columna dels àpats —que és molt
     més alta— repartia l'alçada entre les dues files i el tancament quedava
     surant al mig de l'esquerra, lluny de tot. */
  .nutri { display: grid; grid-template-columns: minmax(280px, 340px) 1fr;
           grid-template-areas: "dalt apats" "tanca apats";
           grid-template-rows: auto 1fr;
           align-items: start; column-gap: var(--e6); row-gap: var(--e5);
           max-width: 1100px; margin: 0 auto; }
  .nutri-dalt  { grid-area: dalt; }
  .nutri-apats { grid-area: apats; }
  .nutri-tanca { grid-area: tanca; }

  /* La capçalera segueix la mateixa amplada que el contingut. Estirada a tota
     la pantalla, la data quedava al centre de 1.900 px i els botons a dos
     pams de distància, sense relació amb res del que hi ha a sota. */
  .capcalera-nutri { padding: var(--e3) var(--e5) 0; }
  .capcalera-nutri .capcalera-fila,
  .capcalera-nutri .segments { max-width: 1100px; margin: 0 auto; }
  .capcalera-nutri .segments { margin-top: var(--e3); }

  /* -----------------------------------------------------------------------
     EL CALENDARI A L'ESCRIPTORI

     Aquí la peça grossa és la graella, no el panell: al revés que a
     nutrició. Amb les classes d'allà, el mes quedava encaixat en 340 px al
     racó d'una pantalla de 1.900 i la resta era negre.

     I les caselles deixen de ser un quadradet amb punts: hi caben els títols,
     i llavors el mes es LLEGEIX d'un cop en comptes d'obligar-te a anar
     tocant dies per saber què hi ha.
     ----------------------------------------------------------------------- */
  .cal-pagina {
    display: grid; grid-template-columns: 1fr minmax(300px, 380px);
    align-items: start; gap: var(--e6);
    max-width: 1500px; margin: 0 auto;
  }

  .mes-graella { grid-auto-rows: minmax(112px, auto); }
  .mes-dia { align-items: stretch; gap: 4px; padding: var(--e2); }
  .mes-dia .n { font-size: 1rem; text-align: left; }
  .mes-dia .punts { display: none; }

  .cal-titols { display: flex; flex-direction: column; gap: 2px;
                overflow: hidden; text-align: left; }
  .cal-cita {
    font-size: .75rem; line-height: 1.25; padding: 1px 4px;
    border-left: 3px solid var(--seu, var(--corba-mestra));
    background: var(--paper2); color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-cita b { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* EL DE TOT EL DIA ES DISTINGEIX PER LA BARRA, NO PER OMPLIR-SE.
     Omplert amb el color del calendari donava 3,8 amb el text a sobre, i no
     es pot arreglar triant millor: aquests colors els posa Google i poden ser
     qualsevol cosa, o sigui que no hi ha cap color de lletra que hi vagi bé
     sempre. Amb la barra gruixuda el text sempre va sobre un fons conegut, i
     de fet la pista més forta ja hi era: els que tenen hora la porten davant
     i aquests no. */
  .cal-cita[data-tot="1"] { border-left-width: 7px; font-weight: 600; }
  .cal-mes-n { font-size: .6875rem; color: var(--ink-suau); padding-left: 4px; }

  .mes-dia[aria-current="date"] .cal-cita { background: var(--paper); }
  .mes-dia[data-fora="1"] .cal-titols { opacity: .45; }

  .dia-cap-cal { margin: 0 0 var(--e2); }

  /* La capçalera segueix l'amplada del contingut, com a la resta. */
  .capcalera-nutri:has(+ .pagina .cal-pagina) .capcalera-fila { max-width: 1500px; }

  /* El formulari en una sola tira: a l'escriptori hi ha amplada de sobres i
     no cal fer-lo baixar set files. */
  .apat-form { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .apat-form select, .apat-form [data-nom] { grid-column: 1 / -1; }
  .apat-form [data-afegeix] { grid-column: 1 / 3; }
  .apat-form [data-desa-aliment] { grid-column: 3 / -1; }

  .nav {
    position: sticky; top: 0; bottom: auto;
    flex-direction: row; justify-content: center; gap: var(--e6);
    border-top: 0; border-bottom: 3px double var(--neatline);
    padding-bottom: 0;
  }
  .nav a { flex: none; flex-direction: row; gap: var(--e2); min-height: 52px; font-size: .8125rem; }

  h1 { font-size: 1.875rem; }
  .franja { min-height: 84px; }
  .cella { height: 30px; }
}

@media (min-width: 1200px) {
  .reixa tbody th { max-width: 260px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* ==========================================================================
   SEGUIMENT FÍSIC

   La pantalla té una jerarquia molt clara i el CSS l'ha de respectar: primer
   el veredicte, després per què, després la forma al llarg del temps. Tot el
   que hi ha aquí surt dels tokens que ja hi ha; no hi entra cap color nou.
   ========================================================================== */

/* LA CRIDA DE LA SETMANA PENDENT. És el motiu pel qual existeix el mòdul, o
   sigui que quan hi és mana per sobre de tot i es veu que es pot tocar. */
.seg-reclama {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  width: 100%; margin-bottom: var(--e3); padding: var(--e3);
  border: 1px solid var(--avis); background: color-mix(in srgb, var(--avis) 14%, var(--paper2));
  color: var(--ink); text-align: left;
  border-left: 3px solid var(--avis);
  transition: background-color .16s var(--entra), transform .12s var(--entra);
}
.seg-reclama b { font-size: .9375rem; }
.seg-reclama span { font-size: .8125rem; color: var(--ink-suau); }
.seg-reclama:active { transform: scale(.99); }

/* EL VEREDICTE. El fil s'encén segons com ha anat, però el color no hi va mai
   sol: el titular ja ho diu amb paraules. */
.seg-veredicte[data-mena="be"]   { border-color: var(--utm); }
.seg-veredicte[data-mena="avis"] { border-color: var(--avis); }
.seg-veredicte h2 { font-size: 1.25rem; }

.seg-xifres { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--e2);
              border-top: 1px solid var(--neatline); padding-top: var(--e3); }
.seg-xifres > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.seg-xifres b { font-family: var(--mono); font-size: 1.375rem; font-weight: 600;
                line-height: 1; font-variant-numeric: tabular-nums; }
.seg-xifres b i { font-style: normal; font-size: .6875rem; color: var(--ink-suau);
                  margin-left: 3px; font-weight: 400; }
.seg-delta { font-family: var(--mono); font-size: .6875rem; color: var(--ink-suau);
             font-variant-numeric: tabular-nums; }

/* ELS AVISOS. Cadascun amb la seva icona, perquè el nivell no depengui només
   del color: qui no distingeixi el cian de l'ambre ha de poder llegir-ho. */
.seg-avisos { display: flex; flex-direction: column; gap: var(--e2); margin: var(--e3) 0; }
.seg-avis { display: flex; gap: var(--e2); align-items: flex-start; margin: 0;
            padding: var(--e3); border: 1px solid var(--neatline);
            background: var(--paper2); font-size: .875rem; line-height: 1.45; }
.seg-avis .ic { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.seg-avis[data-n="avis"] { border-left: 3px solid var(--avis); }
.seg-avis[data-n="avis"] .ic { color: var(--avis); }
.seg-avis[data-n="be"]   { border-left: 3px solid var(--utm); }
.seg-avis[data-n="be"] .ic { color: var(--utm); }
.seg-avis[data-n="info"] .ic { color: var(--ink-suau); }

.seg-diu { margin: var(--e3) 0; padding: var(--e3); border: 1px solid var(--utm-suau);
           border-left: 3px solid var(--utm); background: var(--paper2);
           font-size: .9375rem; line-height: 1.5; white-space: pre-wrap; }

/* LES GRÀFIQUES. Una línia i prou: el que has de veure és la forma. */
.seg-grafiques { display: grid; gap: var(--e3); margin-top: var(--e4); }
@media (min-width: 700px) { .seg-grafiques { grid-template-columns: 1fr 1fr; } }
.seg-graf { display: block; width: 100%; height: 96px; margin-top: var(--e2); overflow: visible; }
.seg-linia { fill: none; stroke: var(--utm); stroke-width: 1.5;
             vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.seg-punt  { fill: var(--paper2); stroke: var(--utm); stroke-width: 1.5;
             vector-effect: non-scaling-stroke; }
.seg-ara   { fill: var(--utm); }
.seg-eix { display: flex; justify-content: space-between; margin-top: var(--e1);
           font-family: var(--mono); font-size: .625rem; color: var(--ink-suau);
           text-transform: uppercase; letter-spacing: .06em; }

/* LES FOTOS, PER ANGLE. Una foto sola no diu res; la de fa un mes al costat,
   sí. Per això la tira és horitzontal i el que s'alinea és el mateix angle. */
.seg-angle { margin-bottom: var(--e3); }
.seg-tira { display: flex; gap: var(--e2); overflow-x: auto; padding-bottom: var(--e1);
            scroll-snap-type: x mandatory; }
.seg-tira figure { margin: 0; flex: none; width: 118px; scroll-snap-align: start; }
.seg-tira img { display: block; width: 118px; height: 158px; object-fit: cover;
                border: 1px solid var(--neatline); background: var(--paper2); }
.seg-tira figcaption { margin-top: 3px; font-family: var(--mono); font-size: .625rem;
                       color: var(--ink-suau); text-transform: uppercase; letter-spacing: .06em; }
/* EL BOTO DE TREURE UNA FOTO. A la cantonada i petit de veure, pero de 32
   pixels de debo: prou per encertar-lo amb el dit i prou per no encertar-lo
   sense voler mentre passes la tira. Sobre fosc sempre, que a sota hi ha una
   fotografia i no es pot saber de quin color sera. */
.seg-tira figure { position: relative; }
.seg-treu {
  position: absolute; top: 3px; right: 3px;
  width: 32px; height: 32px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: 0;
  background: rgba(5, 8, 11, .74); color: #fff;
  transition: background-color .16s var(--entra), transform .12s var(--entra);
}
.seg-treu .ic { width: 15px; height: 15px; }
.seg-treu:active { background: var(--gr); transform: scale(.92); }
@media (hover: hover) and (pointer: fine) {
  .seg-treu:hover { background: var(--gr); }
}

.seg-puja { display: flex; gap: var(--e2); flex-wrap: wrap; margin: var(--e2) 0; }
.seg-puja .btn { flex: 1; min-width: 96px; cursor: pointer; }

/* L historic: una fila per control i prou. La graella de la pantalla d inici
   hi posava tres per fila al mobil i "Hi ha coses a corregir" queia en tres
   ratlles dins d una capsa de cent píxels. */
.seg-controls { display: flex; flex-direction: column; gap: var(--e2); }
.seg-fila { min-height: 0; flex-direction: row; align-items: center;
            justify-content: space-between; gap: var(--e3); }
.seg-fila[aria-current="true"] { background: var(--utm-suau); }
.seg-check { display: flex; align-items: center; gap: var(--e2); margin-top: var(--e2);
             font-size: .8125rem; color: var(--ink-suau); }
.seg-check input { width: 18px; height: 18px; flex: none; accent-color: var(--utm); }

/* La tria de tres opcions: energia, son, gana, dieta. Botons de debò, prou
   grossos per al dit, i l'estat el diu l'atribut i no només el color. */
.tria-fila { display: flex; gap: var(--e2); }
.tria-bt { flex: 1; min-height: 44px; padding: 0 var(--e2);
           border: 1px solid var(--neatline); background: transparent; color: var(--ink-suau);
           font-size: .8125rem;
           transition: border-color .16s var(--entra), color .16s var(--entra); }
.tria-bt[aria-pressed="true"] { border-color: var(--utm); color: var(--utm);
                                background: var(--utm-suau); }
.camp-fila { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--e2); }


/* ==========================================================================
   CAIXES PER LLISTA — compartides per Tasques i Escola

   Les dues pantalles ensenyen el mateix: llistes del Google Tasks. Abans eren
   una tirallonga amb el nom de la llista entre claudàtors al davant de cada
   línia, i el que ordena la feina quedava reduït a un caràcter enmig del text.
   La caixa hi torna a posar l'ordre que la llista ja tenia i el nom es diu un
   sol cop.

   Són compartides a posta: dues pantalles que ensenyen la mateixa cosa no
   s'han de veure diferents, i qui es fes la seva còpia acabaria amb dos
   dissenys que divergeixen a la primera correcció.
   ========================================================================== */

.caixes { display: grid; gap: var(--e3); grid-template-columns: 1fr; }
.caixa { border: 1px solid var(--neatline); background: var(--paper2); }
/* LA CAPÇALERA HA DE SEMBLAR UNA CAPÇALERA.
   Era del mateix color que el cos i una mica més petita que les files: el nom
   de la llista es llegia com una tasca més i la caixa semblava un munt de
   coses sense títol.
   Qui ho arregla és LA LLETRA, no el fons. En fosc, la superfície tenyida i la
   del cos només es diferencien 1,21:1 —mesurat—: per molt que hi posis un
   fons, allà no hi ha cap graó que es vegi. Lletra de màquina, versaleta i
   espaiada és com aquesta app diu «això és una etiqueta i no contingut» a
   totes les altres pantalles, i aquí fa exactament la mateixa feina. El fons
   tenyit s'hi queda per acompanyar, no per sostenir-ho.
   I centrada: amb `baseline`, el «+» de 44 px estirava la barra cap avall i
   deixava el títol enganxat a dalt. */
.caixa-cap {
  display: flex; align-items: center; gap: var(--e2);
  margin: 0; padding: var(--e2) var(--e3);
  background: var(--utm-suau);
  border-bottom: 1px solid var(--neatline);
  font-family: var(--mono); font-size: .75rem; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  line-height: 1.3; color: var(--ink);
}
.caixa-cap > span { flex: 1; min-width: 0; }
/* Dins la caixa no hi ha ratlles quan les files són text: la caixa ja diu on
   comença i on acaba, i una ratlla per línia torna a fer el soroll que hem
   tret. Les tasques sí que en porten, perquè cada fila s'hi pot tocar. */
.caixa-coses { margin: 0; padding: var(--e2) 0; list-style: none; }
.caixa-coses li { padding: var(--e1) var(--e3); font-size: .875rem; line-height: 1.45; }
.caixa-cos { padding: 0 var(--e3); }

/* EL «+» DE LA CAPÇALERA. Va al costat del nom de la llista perquè el que
   apuntes ha d'anar a AQUELLA llista i no a un lloc que hagis de triar després.
   Els marges negatius fan dues coses: que un botó de 44 px no faci créixer la
   capçalera —el que ha de fer 44 és on poses el dit, no la barra— i que el
   signe quedi a la dreta del tot, alineat amb la vora de la caixa, en comptes
   de flotar-hi a dins. */
.caixa-mes {
  flex: none; align-self: center;
  width: 44px; height: 44px; margin: -8px -12px -8px 0; padding: 0 12px 0 0;
  display: flex; align-items: center; justify-content: flex-end;
  border: 0; background: transparent; color: var(--ink-suau);
  transition: color .16s var(--entra);
}
.caixa-mes .ic { width: 15px; height: 15px; }
.caixa-mes:active { color: var(--utm); }
@media (hover: hover) and (pointer: fine) {
  .caixa-mes:hover { color: var(--utm); }
}

/* El camp d'apuntar, dins la caixa: hi escrius i prems Enter. Es queda obert
   després d'apuntar-ne una, que és com s'apunten tres coses seguides. */
.caixa-nova { padding: 0 var(--e3) var(--e2); }
.caixa-nova input {
  width: 100%; min-height: 40px; padding: 0 var(--e2);
  font: inherit; font-size: .875rem;
  background: var(--paper); color: var(--ink);
  border: 1px solid var(--utm); border-radius: var(--r);
}
.caixa-nova[data-esperant="1"] input { opacity: .6; }

/* Acabada d'apuntar i encara no ha tornat del compte de l'escola. */
.caixa-coses li[data-esperant="1"] { position: relative; opacity: .55; overflow: hidden; }
.caixa-coses li[data-esperant="1"]::after {
  content: ''; position: absolute; left: 0; bottom: 0; height: 2px; width: 40%;
  background: var(--ink-suau); animation: esperant-va 1.1s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .caixa-coses li[data-esperant="1"]::after { animation: none; width: 100%; opacity: .4; }
}

/* Dues columnes tan bon punt hi caben: amb sis llistes, una sola columna
   t'obliga a baixar per veure què tens. */
@media (min-width: 560px) {
  .caixes { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); align-items: start; }
}

/* El camp d'apuntar no creix fins als mil pixels: és una ratlla de text, i una
   ratlla de text que va de banda a banda no es llegeix millor, només fa que el
   cursor quedi lluny d'on mires. */
@media (min-width: 900px) {
  .tsq-capt { max-width: 640px; }
}


/* ==========================================================================
   LA SETMANA

   Set caixes iguals i, sota, la pila. Les caixes són les mateixes d'Escola,
   Tasques i Memòria: quatre pantalles que ensenyen llistes agrupades no poden
   veure's de quatre maneres.

   EL QUE AQUESTA PANTALLA HI AFEGEIX és una sola cosa: una barra sota el nom
   de cada dia amb les hores que ja tens ocupades, comparades amb el dia més
   ple de la setmana. Sense ella, set llistes de text no diuen quin dia va
   carregat —les has de comptar—, i comptar és exactament el que has vingut a
   no fer.
   ========================================================================== */

/* SET COLUMNES QUAN HI CABEN, i quan no, les que hi càpiguen. La setmana es
   llegeix d'esquerra a dreta si la pantalla dona; al mòbil es llegeix avall,
   que és com es llegeix tot al mòbil. */
.set-dies {
  display: grid; gap: var(--e2);
  grid-template-columns: 1fr;
}
@media (min-width: 560px)  { .set-dies { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 860px)  { .set-dies { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1180px) { .set-dies { grid-template-columns: repeat(7, 1fr); } }

.set-dia { display: flex; flex-direction: column; }
/* El dia d'avui, amb el fil. És la mateixa marca que el «ara» d'Escola: si a
   una pantalla el present es diu amb una ratlla, a l'altra també. */
.set-dia[data-avui="1"] { border-color: var(--utm); }
.set-dia[data-avui="1"] .caixa-cap { color: var(--utm); }

/* UN DIA QUE JA HA PASSAT ES QUEDA ENRERE, PERÒ NO S'ESBORRA: encara vols
   veure que dilluns vas tenir sis hores quan mires on posar el que
   arrossegues.
   El vaig fer amb `opacity: .5` i el vaig treure: mesurat, el text del dia
   passat queia de 4,77:1 a 2,2:1 i deixava de ser llegible. La mateixa
   errada que ja vam corregir a les barres del comptador. Qui diu «això ja ha
   passat» és la capçalera —perd el tint i es queda plana— i la barra, que es
   dibuixa en gris en comptes del color viu. El text no s'hi juga res. */
.set-dia[data-passat="1"] .caixa-cap { background: transparent; }
.set-dia[data-passat="1"] .set-carrega i { background: var(--ink-suau); }

/* Les hores del dia van amb la lletra plena, no amb la fluixa. Sobre el fons
   tenyit de la capçalera, `--ink-suau` es queda a 3,95:1 —mesurat— i això
   són onze píxels: per sota del mínim. I a més no és cap etiqueta, és el
   número que has vingut a mirar. */
.set-hores {
  flex: none; font-style: normal; font-family: var(--mono);
  font-size: .6875rem; letter-spacing: .04em; color: var(--ink);
}

/* La capçalera del dia és un botó, però no ha de semblar-ne un altre: hereta
   la lletra de `.caixa-cap` i ocupa exactament el seu lloc. El que canvia en
   tocar-la és el color, com a tot arreu. */
.set-cap {
  /* 44 px, com tota la resta. Amb el padding de `.caixa-cap` es quedava a 32
     i el dit no es fa més petit perquè el botó sigui secundari. */
  flex: 1; min-width: 0; min-height: 44px;
  display: flex; align-items: center; gap: var(--e2);
  margin: calc(var(--e2) * -1) calc(var(--e3) * -1);
  padding: var(--e2) var(--e3);
  border: 0; background: transparent; color: inherit;
  font: inherit; letter-spacing: inherit; text-transform: inherit; text-align: left;
  transition: color .16s var(--entra);
}
.set-cap > span { flex: 1; min-width: 0; }
.set-cap:active { color: var(--utm); }
@media (hover: hover) and (pointer: fine) { .set-cap:hover { color: var(--utm); } }

/* La porta a la setmana, al peu de la pàgina del dia. */
.dia-cap-setmana {
  display: flex; align-items: center; justify-content: center; gap: var(--e2);
  width: 100%; min-height: 44px; margin-top: var(--e4); padding: var(--e2) var(--e3);
  border: 1px solid var(--neatline); background: transparent; color: var(--ink-suau);
  font-family: var(--mono); font-size: .75rem; letter-spacing: .08em;
  text-transform: uppercase;
  transition: color .16s var(--entra), border-color .16s var(--entra);
}
.dia-cap-setmana:active { color: var(--utm); border-color: var(--utm); }
@media (hover: hover) and (pointer: fine) {
  .dia-cap-setmana:hover { color: var(--utm); border-color: var(--utm); }
}

.set-carrega { height: 3px; background: var(--neatline); }
.set-carrega i { display: block; height: 100%; background: var(--utm); }

.set-cosa { display: flex; gap: var(--e2); align-items: baseline; }
/* L'hora sempre a la mateixa amplada perquè la columna quadri i l'ull hi
   pugui baixar sense tornar enrere. Sense hora, un punt: la cosa és d'aquell
   dia però no d'una hora, i deixar el buit faria semblar que falta una dada. */
.set-hora {
  flex: none; width: 2.6em; font-family: var(--mono);
  font-size: .6875rem; color: var(--ink-suau);
}
.set-text { flex: 1; min-width: 0; }
.set-cosa[data-fet="1"] .set-text { color: var(--ink-suau); }
.set-cosa[data-urgent="1"] .set-hora { color: var(--gr); }

.set-buit {
  margin: 0; padding: var(--e2) var(--e3);
  font-family: var(--mono); font-size: .6875rem; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-suau);
}

/* --------------------------------------------------------------- la pila */

.pila-fila { padding: var(--e2) var(--e3); }
.pila-cap { display: flex; align-items: center; gap: var(--e2); }
.pila-text { flex: 1; min-width: 0; font-size: .875rem; line-height: 1.45; }
.pila-fila .menut { flex: none; }
.pila-fila[data-urgent="1"] .menut { color: var(--gr); }

.pila-quan {
  flex: none; width: 44px; height: 44px; margin: -10px -10px -10px 0; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 0; background: transparent; color: var(--ink-suau);
  transition: color .16s var(--entra);
}
.pila-quan[aria-expanded="true"] { color: var(--utm); }
@media (hover: hover) and (pointer: fine) { .pila-quan:hover { color: var(--utm); } }

/* Set caselles i no un calendari: la decisió és «quin dia d'aquesta setmana»,
   i un calendari sencer seria demanar-li que triï entre tres-cents seixanta-
   cinc dies quan en vol set. */
.pila-tria { display: flex; gap: 2px; margin-top: var(--e2); }
.pila-tria button {
  flex: 1; min-height: 44px; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px;
  border: 1px solid var(--neatline); background: transparent; color: var(--ink-suau);
  font-family: var(--mono); font-size: .625rem; letter-spacing: .06em;
  text-transform: uppercase;
  transition: color .16s var(--entra), border-color .16s var(--entra);
}
.pila-tria button b { font-size: .8125rem; color: var(--ink); }
.pila-tria button:disabled { opacity: .35; }
.pila-tria button:not(:disabled):active { color: var(--utm); border-color: var(--utm); }
@media (hover: hover) and (pointer: fine) {
  .pila-tria button:not(:disabled):hover { color: var(--utm); border-color: var(--utm); }
}


/* ==========================================================================
   LA MARCA DE VERSIÓ

   A la cantonada, petita i sense demanar res. No és decoració: és la
   resposta a «el que estic veient, és el que acabes de pujar?», que aquesta
   nit va costar hores de respondre.

   `pointer-events: none` perquè no s'interposi mai entre el dit i el que hi
   hagi a sota. I al 9 px encara es llegeix si t'hi fixes, que és tot el que
   ha de fer: no la mires mai fins al dia que la necessites.
   ========================================================================== */

/* SENSE OPACITAT. Amb `opacity: .55` quedava a 2,25:1 —mesurat— i una marca
   que no es llegeix no serveix de res, que és justament la feina que té.
   Discreta vol dir petita i al marge, no esborrada. És el quart cop aquesta
   nit que apago un text per fer-lo discret i l'he de tornar a encendre. */
.marca-versio {
  position: fixed; right: 8px; z-index: 4; pointer-events: none;
  bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  font-family: var(--mono); font-size: .5625rem; letter-spacing: .06em;
  color: var(--ink-suau);
}
/* A la conversa estava pujada 84 px per no topar amb el micròfon, i el que
   passava és que quedava a l'alçada dels botons i semblava que en formés
   part. A baix de tot no hi topa amb res: el micròfon i el llapis van
   centrats i el botó d'apartats també, o sigui que la cantonada dreta de
   l'última franja és l'únic tros de pantalla que no fa res. Que és
   exactament on ha de viure una cosa que no mires mai.
   El color sí que canvia: sobre el fons del HUD, el gris de la resta de
   pantalles es queda curt. */
body[data-vista="conversa"] .marca-versio { color: #6f93a6; }


/* ==========================================================================
   FOCUS

   Una pantalla per concentrar-se no pot ser una pantalla plena. Mentre el
   bloc corre només hi ha el rellotge, en què estàs, i una sola sortida.
   ========================================================================== */

.foc-pagina { max-width: 620px; }
.foc-centre { display: flex; flex-direction: column; align-items: center;
              gap: var(--e4); padding: var(--e4) 0 var(--e3); }

/* L'anell és el mateix llenguatge que la resta de l'app: el que té objectiu
   s'ensenya com un anell que s'omple. Aquí el que s'omple és l'estona. */
.foc-anell {
  --p: 0;
  width: min(74vw, 260px); aspect-ratio: 1; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: conic-gradient(var(--utm) calc(var(--p) * 1%), var(--neatline) 0);
  position: relative;
}
.foc-anell::before {
  content: ''; position: absolute; inset: 9px; border-radius: 50%;
  background: var(--paper);
}
.foc-anell b, .foc-anell small { position: relative; z-index: 1; }
.foc-anell b {
  font-size: clamp(2.4rem, 13vw, 3.6rem); font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.foc-anell small {
  margin-top: 6px; font-family: var(--mono); font-size: .6875rem;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-suau);
}
/* En acabar, l'anell sencer. Sense parpelleig: ja t'ha vibrat el telèfon, i
   una pantalla que batega mentre decideixes què fas és soroll. */
.foc-anell[data-acabat="1"] { background: var(--utm); }

.foc-que { margin: 0; font-size: 1rem; text-align: center; max-width: 30ch; }
.foc-sense { color: var(--ink-suau); }

.foc-accions { display: flex; flex-direction: column; gap: var(--e2);
               width: 100%; max-width: 320px; }
.foc-accions .btn { width: 100%; }

/* Les durades. La primera és la de deu i surt triada: vegeu 40_Mod_Focus.gs. */
.foc-tries { display: flex; gap: var(--e2); }
.foc-durada {
  min-width: 76px; min-height: 76px; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  border: 1px solid var(--neatline); background: transparent; color: var(--ink-suau);
  font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums;
  transition: color .16s var(--entra), border-color .16s var(--entra);
}
.foc-durada span { font-family: var(--mono); font-size: .5625rem; letter-spacing: .1em;
                   text-transform: uppercase; font-weight: 400; }
.foc-durada[aria-pressed="true"] { color: var(--utm); border-color: var(--utm); }
@media (hover: hover) and (pointer: fine) { .foc-durada:hover { color: var(--utm); } }

.foc-en-que {
  display: flex; align-items: center; gap: var(--e2); width: 100%; max-width: 340px;
  min-height: 48px; padding: 0 var(--e3);
  border: 1px solid var(--neatline); background: transparent;
  color: var(--ink); font: inherit; font-size: .9375rem; text-align: left;
}
.foc-en-que .ic { margin-left: auto; flex: none; color: var(--ink-suau); }
.foc-comenca { width: 100%; max-width: 340px; }
.foc-nota { max-width: 34ch; text-align: center; margin: 0; }

.foc-tasca {
  display: block; width: 100%; text-align: left; padding: var(--e2) var(--e3);
  border: 0; background: transparent; color: var(--ink); font: inherit;
  font-size: .875rem; line-height: 1.4; min-height: 44px;
}
.foc-tasca[data-urgent="1"] > span:first-child { color: var(--avis); }
.foc-tasca .foc-pas { display: block; margin-top: 2px; font-size: .8125rem; color: var(--utm); }
@media (hover: hover) and (pointer: fine) { .foc-tasca:hover { background: var(--utm-suau); } }
.foc-cap-x { flex: none; width: 32px; height: 32px; margin: -4px -8px -4px 0; padding: 0;
             display: flex; align-items: center; justify-content: center;
             border: 0; background: transparent; color: var(--ink-suau); }

.foc-fila { display: flex; gap: var(--e2); align-items: baseline;
            padding: var(--e1) var(--e3); }
.foc-hora { flex: none; width: 3.2em; font-family: var(--mono); font-size: .6875rem;
            color: var(--ink-suau); }
.foc-cos { flex: 1; min-width: 0; font-size: .875rem; }

@media (prefers-reduced-motion: reduce) { .foc-durada { transition: none; } }


/* ==========================================================================
   LES RELACIONS

   Files de dues línies: la frase i, sota, d'on surt. La segona línia no és
   lletra petita decorativa —és el que et permet decidir si t'ho creus, i per
   això porta sempre les setmanes primer i el número tècnic al final.
   ========================================================================== */

.rel-fila { padding: var(--e2) var(--e3); }
.rel-frase { margin: 0; font-size: .9375rem; line-height: 1.45; }
.rel-peu {
  display: flex; flex-wrap: wrap; gap: var(--e2); margin: 4px 0 0;
  font-family: var(--mono); font-size: .6875rem; letter-spacing: .04em;
  color: var(--ink-suau);
}
.rel-peu > span + span::before { content: '·'; margin-right: var(--e2); }
.rel-rho { opacity: 1; }
/* Les que encara no es poden dir es queden amb la lletra fluixa a la frase,
   no amb opacitat a la fila: el que ha de recular és el pes del text, i
   `--ink-suau` sobre el panell dona 4,77:1 —mesurat—, que es llegeix. */
.rel-curta .rel-frase { color: var(--ink-suau); font-size: .875rem; }


/* ==========================================================================
   LA MEMÒRIA

   Files de text amb una creu. Res més: el que hi ha aquí es llegeix i, de tant
   en tant, se'n treu una. La creu no crida —treure un record no és una acció
   destructiva, la fila es queda al full— però es veu, perquè el valor d'això
   és poder dir-li coses sabent que les pots desdir.
   ========================================================================== */

.mem-fila { display: flex; align-items: flex-start; gap: var(--e2); padding: var(--e1) var(--e3); }
.mem-fila > span { flex: 1; min-width: 0; font-size: .875rem; line-height: 1.45; }
.mem-fila[data-fora="1"] { opacity: .35; }

.mem-fora {
  flex: none; width: 32px; height: 32px; margin: -4px -8px -4px 0; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 0; background: transparent; color: var(--ink-suau);
  transition: color .16s var(--entra);
}
.mem-fora .ic { width: 12px; height: 12px; }
.mem-fora:active { color: var(--gr); }
@media (hover: hover) and (pointer: fine) { .mem-fora:hover { color: var(--gr); } }

.mem-vell > span { color: var(--ink-suau); text-decoration: line-through; }
.mem-torna {
  flex: none; min-height: 32px; padding: 0 var(--e2);
  border: 1px solid var(--neatline); background: transparent; color: var(--ink-suau);
  font-family: var(--mono); font-size: .625rem; letter-spacing: .08em; text-transform: uppercase;
}
.mem-torna:active { color: var(--utm); border-color: var(--utm); }


/* ==========================================================================
   ESCOLA — la safata de l'automatització

   Substitueix una finestra de Telegram, però NO és un xat: el que hi arriba
   són avisos d'un automatisme, no conversa. Per això no hi ha bafarades ni
   alineació a dreta i esquerra: és una safata, i el que ha de cantar és què
   queda per llegir.
   ========================================================================== */

.esc-safata { display: flex; flex-direction: column; gap: var(--e2); }

.esc-msg {
  border: 1px solid var(--neatline); background: var(--paper2);
  padding: var(--e3);
}
.esc-msg header { display: flex; align-items: baseline; gap: var(--e2);
                  margin-bottom: var(--e1); }
.esc-mena { font-family: var(--mono); font-size: .6875rem; letter-spacing: .1em;
            text-transform: uppercase; color: var(--ink-suau); }
.esc-quan { margin-left: auto; font-family: var(--mono); font-size: .6875rem;
            color: var(--ink-suau); font-variant-numeric: tabular-nums; }
.esc-msg h3 { font-size: .9375rem; margin: 0 0 var(--e1); line-height: 1.3; }
/* La mesura, aturada: a l'escriptori aquest paràgraf feia tota l'amplada de la
   pàgina i una línia de cent-trenta caràcters no es llegeix, es recorre. */
.esc-msg p { margin: 0; max-width: 68ch; font-size: .875rem; line-height: 1.5;
             color: var(--ink-suau);
             white-space: pre-wrap; overflow-wrap: anywhere; }

/* EL QUE NO HAS LLEGIT. El fil viu a l'esquerra i la superfície encesa, la
   mateixa marca que fan servir els hàbits fets: dins d'aquesta app, «això et
   reclama» es diu sempre igual. I no ho diu només el color —hi ha el botó
   «Vist», que als llegits no hi és—. */
/* Sense pestanya de 3 px a l'esquerra: amb la vora encesa i la superfície
   tenyida, aquell tros de vora gruixuda només afegia pes a una fitxa que ja
   pesava més que la columna d'hores —que és el que has vingut a mirar—. */
.esc-nou { border-color: var(--utm);
           background: color-mix(in srgb, var(--utm) 8%, var(--paper2)); }
.esc-nou h3 { color: var(--ink); }
.esc-nou .esc-mena { color: var(--utm); }
/* Sobre la superfície tenyida, `--ink-suau` es queda a 4,1:1. El cos d'un avís
   que encara no has llegit és justament el que has de poder llegir. */
.esc-nou p { color: var(--ink); }

.esc-vist {
  margin-top: var(--e3); min-height: 36px; padding: 0 var(--e3);
  border: 1px solid var(--utm-suau); background: transparent; color: var(--utm);
  font-family: var(--mono); font-size: .75rem; letter-spacing: .1em;
  text-transform: uppercase;

}
.esc-vist:active { background: var(--utm-suau); border-color: var(--utm); }

/* L'HISTORIAL, PLEGAT. El que ja has despatxat no s'esborra mai, però tampoc
   t'ha d'ocupar la pantalla: al cap de dues setmanes era una llista
   inacabable de coses que ja havies llegit a la notificació. */
/* SORTIR DE LA SAFATA. La targeta no desapareix de cop: s'esvaeix i es plega,
   i així veus QUINA has despatxat. De cop, amb la llista movent-se avall, no
   saps si has tocat la que volies. Amb moviment reduït, fora directament. */
.esc-msg { transition: opacity .18s var(--entra), height .18s var(--entra),
                       margin .18s var(--entra), padding .18s var(--entra); }
.esc-despatxat { opacity: 0; height: 0 !important; margin: 0; padding-top: 0;
                 padding-bottom: 0; overflow: hidden; pointer-events: none; }

/* HA DE SEMBLAR UN BOTÓ. Era text pelat alineat a l'esquerra: allà hi ha
   quinze dies d'avisos al darrere i ningú no els obria perquè res no deia que
   allò es pogués tocar. Vora, i un galó que gira quan s'obre. */
.desplega {
  display: flex; align-items: center; gap: var(--e2);
  width: 100%; min-height: 44px; margin-top: var(--e3); padding: 0 var(--e3);
  border: 1px solid var(--neatline); background: transparent; color: var(--ink-suau);
  font-family: var(--mono); font-size: .6875rem; letter-spacing: .08em;
  text-transform: uppercase; text-align: left;
  transition: color .16s var(--entra), border-color .16s var(--entra);
}
.desplega .ic { width: 12px; height: 12px; flex: none;
                       transition: transform .16s var(--entra); }
.desplega[aria-expanded="true"] .ic { transform: rotate(90deg); }
.desplega:active { color: var(--utm); border-color: var(--utm); }
@media (hover: hover) and (pointer: fine) {

}
.desplega + .esc-safata { margin-top: var(--e2); }

   al final de la pàgina: el que has demanat ha de sortir on estàs mirant. */


/* ==========================================================================
   ESCOLA — el que l'automatització ha trobat

   No és una safata de missatges: és el dia que l'automatisme ha extret. Per
   això mana la columna d'hores i no la llista de fitxes, i per això una
   substitució no es pinta com un canvi de fitxer al Drive.
   ========================================================================== */

/* LA COLUMNA D'HORES. El fil vertical és el dia; cada cosa hi penja pel seu
   punt. Les hores lliures hi són escrites: un forat entre dues cites no és un
   buit del disseny, és una hora que tens. */
/* El fil i els punts van amb `--ink-suau`, no amb `--neatline`: una vora de
   caixa pot ser fluixa perquè la caixa ja es veu, però aquí el fil ÉS el dia i
   amb `--neatline` sobre el fons quedava a 1,4:1 —o sigui, no s'hi veia—.
   L'opacitat el deixa a prop de 3,5:1, que és el mínim d'una cosa que has de
   distingir sense llegir-la. */
.esc-columna { position: relative; padding-left: 58px; }
.esc-columna::before {
  content: ""; position: absolute; left: 50px; top: 6px; bottom: 6px;
  width: 1px; background: var(--ink-suau); opacity: .8;
}
.esc-h {
  position: relative; margin-bottom: 2px; padding: var(--e3);
  border: 1px solid var(--neatline); background: var(--paper2);
}
.esc-h b { display: block; font-size: 1rem; font-weight: 600; line-height: 1.3; }
.esc-hora {
  position: absolute; left: -58px; top: 13px; width: 44px; text-align: right;
  font-family: var(--mono); font-size: .75rem; font-style: normal;
  color: var(--ink-suau); font-variant-numeric: tabular-nums;
}
.esc-h::after {
  content: ""; position: absolute; left: -9px; top: 17px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--paper); border: 1px solid var(--ink-suau);
}

/* LES HORES LLIURES. Sense opacitat: a .55 quedaven a 2,2:1 i eren just la
   informació que hi hem posat expressament —«aquesta estona és teva»—. I amb
   l'hora a la canal, com totes les altres: si se'n surt, la columna d'hores
   deixa de ser una columna i passa a ser una llista amb sagnats desiguals. */
.esc-lliure {
  position: relative; padding: var(--e2) var(--e3); margin-bottom: 2px;
  font-size: .8125rem; color: var(--ink-suau);
}
.esc-lliure .esc-hora { top: var(--e2); }

/* ARA. La pantalla promet «l'hora que ve» i fins ara no deia per on anaves. */
.esc-ara {
  position: relative; display: flex; align-items: center; gap: var(--e2);
  padding: var(--e1) 0 var(--e1) var(--e3); margin: var(--e1) 0 3px;
  border-top: 1px solid var(--utm);
  font-family: var(--mono); font-size: .6875rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--utm);
}
.esc-ara .esc-hora { top: 3px; color: var(--utm); letter-spacing: 0; }

/* UNA SUBSTITUCIÓ NO ÉS UN AVÍS MÉS. Si te'n perds una, una classe es queda
   sense mestre: és l'única cosa d'aquesta pantalla que va en vermell, i el
   color no hi va sol —hi ha l'etiqueta escrita al damunt—. */
/* La vora SENCERA i el punt del fil, no una pestanya a l esquerra. Amb el fil
   vertical al costat, un tros de vora gruixuda mes es llegia com un accessori;
   la caixa vermella entre dues de fosques ja canta prou.
   (El detector marca la pestanya lateral com el tell d IA mes reconeixible, i
   aqui no calia per res.) */

.esc-subs::after { background: var(--gr); border-color: var(--gr); }
.esc-et {
  display: block; margin-bottom: 2px;

  text-transform: uppercase; color: var(--gr);
}

   tasques —vegeu «CAIXES PER LLISTA» més avall—: les dues pantalles ensenyen
   llistes del Google Tasks i no tenia cap sentit que es veiessin diferents.
   Aquí, a més, res no es marca ni es completa: qui mana és el Google Tasks, i
   una casella que no es pot clicar seria una mentida sobre el que la pantalla
   sap fer. Per això les files són text i prou. */

/* Les línies soltes de les respostes (agenda, correus…) segueixen sent línies:
   allà no hi ha llistes que capsar. */
.esc-p {
  display: flex; align-items: baseline; gap: var(--e3);

}
.esc-p:last-child { border-bottom: 0; }
.esc-p i {

  color: var(--ink-suau); font-family: var(--mono); font-size: .75rem;
}
.esc-p .esc-hora-p {
  width: 44px; text-align: left; color: var(--utm);
  font-variant-numeric: tabular-nums;
}

/* ELS ACCESSOS. El primer ample: és el que obre més sovint. */
.esc-acc { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e2); }
.esc-acc a {
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
  min-height: 56px; padding: var(--e2) var(--e3);
  border: 1px solid var(--neatline); background: var(--paper2);
  color: var(--ink); text-decoration: none;
  transition: border-color .16s var(--entra), background-color .16s var(--entra);

.esc-acc a:first-child { grid-column: 1 / -1; }
.esc-acc b { font-size: .8125rem; }
.esc-acc span {
  font-family: var(--mono); font-size: .6875rem; letter-spacing: .08em;

}
.esc-acc a:active { border-color: var(--utm); background: var(--utm-suau); }
@media (hover: hover) and (pointer: fine) {
  .esc-acc a:hover { border-color: var(--utm); }
}

/* LA CAMPANETA. Va al títol perquè, sense una marca que ho digui, una fitxa és
   una fitxa: en Pol no va reconèixer que allò eren els avisos que li havien
   arribat, i tenia raó a no reconèixer-ho. */
.esc-titol-avisos { display: flex; align-items: center; gap: var(--e2); }
.esc-titol-avisos .ic { width: 14px; height: 14px; color: var(--utm); }

   últimes i més petites que qualsevol altra cosa de la pantalla. */
.esc-consultes { padding-top: var(--e3); border-top: 1px solid var(--neatline); }
.esc-cmd { display: flex; gap: var(--e2); flex-wrap: wrap; }
.esc-cmd button {
  flex: 1; min-width: 76px; min-height: 44px; padding: 0 var(--e2);

.esc-cmd button:active { border-color: var(--utm); color: var(--utm); }
.esc-cmd button:disabled { opacity: .45; }
@media (hover: hover) and (pointer: fine) {
  .esc-cmd button:hover:not(:disabled) { border-color: var(--utm); color: var(--utm); }
}

   s'hi acumulaven: tres preguntes eren tres parets de text seguides. */
.esc-resp .esc-p:last-child { border-bottom: 0; }

@media (min-width: 700px) {
  .esc-acc { grid-template-columns: repeat(3, 1fr); }
  .esc-acc a:first-child { grid-column: auto; }
}

   feta ampla, amb el dia i els pendents un sota l'altre —de manera que en una
   pantalla de mil nou-cents no veies les dues coses alhora— i les línies de

@media (min-width: 900px) {

window.MARCA_JEFE = "2026-08-07 22:55 · en curs";

<script>
/* =========================================================================
   JEFE — marc de la interfície
   - Pinta a l'instant des de la memòria cau; el servidor arriba després.
   - Escriptura optimista amb cua: sense cobertura, el toc no es perd.
   - localStorage és NOMÉS memòria cau. La veritat viu al full de càlcul.
   ========================================================================= */

var Jefe = (function () {

  // ------------------------------------------------------------------ base

  function esc(t) {
    return String(t === null || t === undefined ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function ic(nom, classe) {
    return '<svg class="ic ' + (classe || '') + '" aria-hidden="true"><use href="#ic-' + nom + '"/></svg>';
  }

  var DIES = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
  var DIES_C = ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'];
  var MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny',
               'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];

  var fmt = {
    aData: function (t) { var p = String(t).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); },
    avui: function () {
      var d = new Date();
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    },
    suma: function (t, n) {
      var d = fmt.aData(t); d.setDate(d.getDate() + n);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    },
    llarga: function (t) {
      var d = fmt.aData(t), m = MESOS[d.getMonth()];
      var prep = /^[aeiou]/.test(m) ? "d'" : 'de ';
      return DIES[d.getDay()] + ', ' + d.getDate() + ' ' + prep + m;
    },
    relativa: function (t) {
      var avui = fmt.avui();
      if (t === avui) return 'Avui';
      if (t === fmt.suma(avui, -1)) return 'Ahir';
      if (t === fmt.suma(avui, 1)) return 'Demà';
      var d = fmt.aData(t);
      return DIES_C[d.getDay()] + ' ' + d.getDate() + ' ' + MESOS[d.getMonth()].slice(0, 3) + '.';
    },
    diaNumero: function (t) { return fmt.aData(t).getDate(); },

    /* Amb coma i sense decimals inútils: «5,3» i «4», no «5.3» i «4.0». */
    decimal: function (n) {
      var v = Math.round((Number(n) || 0) * 10) / 10;
      return (v % 1 === 0 ? String(v) : v.toFixed(1)).replace('.', ',');
    }
  };

  // ------------------------------------------------------------ memòria cau

  var Cau = {
    get: function (clau, perDefecte) {
      try {
        var v = localStorage.getItem('jefe.' + clau);
        return v === null ? perDefecte : JSON.parse(v);
      } catch (e) { return perDefecte; }
    },
    set: function (clau, valor) {
      try { localStorage.setItem('jefe.' + clau, JSON.stringify(valor)); } catch (e) {}
    },
    treu: function (clau) { try { localStorage.removeItem('jefe.' + clau); } catch (e) {} },

    /* Tota una família de cop: després d'escriure una dada, TOTES les pantalles
       que la mostraven han quedat velles, no només la que miraves. Sense això,
       apuntar una despesa i canviar de mes t'ensenyaria el mes d'abans sense
       el que acabes d'apuntar. */
    oblida: function (prefix) {
      try {
        var fora = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('jefe.' + prefix) === 0) fora.push(k);
        }
        fora.forEach(function (k) { localStorage.removeItem(k); });
      } catch (e) {}
    }

  // ------------------------------------------------------- crides al servidor

  /* -------------------------------------------------------------------------
     DOS TRANSPORTS, LA MATEIXA CRIDA

     Dins d'Apps Script s'usa google.script.run, que ja ve autenticat.
     Servida des de fora (GitHub Pages), s'usa fetch contra el desplegament,
     amb la clau d'accés. Els mòduls no saben ni els importa quin dels dos és.

     `text/plain` no és un error: amb JSON el navegador enviaria una petició
     de comprovació prèvia que Apps Script no sap respondre. El cos segueix
     sent JSON; només canvia l'etiqueta.
     ------------------------------------------------------------------------- */

  function dinsAppsScript() {
    return !!(window.google && google.script && google.script.run);
  }

  var Servidor = {
    config: function () { return Cau.get('servidor', null); },
    desa: function (url, clau) { Cau.set('servidor', { url: url, clau: clau }); },
    esborra: function () { Cau.treu('servidor'); }
  };

  function cridaLocal_(modul, accio, params) {
    return new Promise(function (resolta, falla) {
      google.script.run
        .withSuccessHandler(function (r) {
          App.enLinia(true);
          if (r && r.ok) return resolta(r.dades);
          var err = new Error((r && r.error) || 'El servidor ha respost sense dades.');
          err.api = true; falla(err);
        })
        .withFailureHandler(function (err) {
          App.enLinia(false);
          var e = new Error(err && err.message ? err.message : 'No hi ha connexió amb el servidor.');
          e.xarxa = true; falla(e);
        })
        .api(modul, accio, params || {});
    });
  }

  function cridaRemota_(modul, accio, params) {
    var cfg = Servidor.config();
    if (!cfg || !cfg.url || !cfg.clau) {
      var e = new Error('Encara no has connectat JEFE amb el teu servidor.');
      e.senseServidor = true;
      return Promise.reject(e);
    }
    return fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ clau: cfg.clau, modul: modul, accio: accio, params: params || {} })
    })
    .then(function (r) {
      if (!r.ok) { var e = new Error('El servidor ha respost ' + r.status + '.'); e.xarxa = true; throw e; }
      return r.json();
    })
    .then(function (r) {
      App.enLinia(true);
      if (r && r.ok) return r.dades;
      var err = new Error((r && r.error) || 'El servidor ha respost sense dades.');
      err.api = true;
      if (/clau d'accés/i.test(err.message)) err.clauDolenta = true;
      throw err;
    })
    .catch(function (err) {
      if (!err.api && !err.senseServidor) { App.enLinia(false); err.xarxa = true; }
      throw err;
    });

    return dinsAppsScript() ? cridaLocal_(modul, accio, params)

  /**

   *
   * `crida(...).then(carrega)` són dues anades al servidor, i a Apps Script
   * cada anada costa un segon i mig facis el que facis. Amb això se'n fa una:
   * el servidor desa i, abans de contestar, torna a muntar la pantalla.
   *
   * Es resol AMB LA PANTALLA, no amb el que ha tornat l'escriptura. Si el que
   * et cal és això altre, fes servir `crida` de tota la vida.
   */
  function escriu(modul, accio, params, paramsPantalla) {
    var p = {};
    for (var k in (params || {})) p[k] = params[k];

  /* ==========================================================================
     TOTES LES PANTALLES EN UNA ANADA, i abans que les demanis

     El problema no era que les pantalles es muntessin lentes —mesurat el 4
     d'agost del 2026: cap passa de mig segon al servidor—. Era que cada
     apartat feia el seu propi viatge, i cada viatge a Apps Script val DOS

     segons d'espera pura.

     Això en fa un de sol, en segon pla, just després d'arrencar, i desa cada
     pantalla amb la clau que la seva vista mirarà. Quan hi entres, ja hi és.

     LA TAULA DE CLAUS ÉS AQUÍ i no al servidor a posta: quina clau fa servir
     una vista és cosa de la vista, i el nucli no ha de saber-ne res. Si un dia
     una vista canvia de clau, es canvia aquí i prou; i si algú se n'oblida, el
     pitjor que passa és que aquella pantalla torni a fer el seu viatge com
     abans —no que ensenyi res que no toca.
     ========================================================================== */
  var Precarrega = {
    fet: 0,

    clauDe: function (modul, avui) {
      switch (modul) {
        case 'habits':    return 'habits.' + avui;
        case 'calendari': return 'calendari.' + avui.slice(0, 7);
        case 'tasques':   return 'tasques.llista';
        case 'escola':    return 'escola';
        case 'seguiment': return 'seguiment';
        case 'diari':     return 'diari.' + avui;
        case 'nutricio':  return 'nutricio.dia.' + avui;
        case 'finances':  return 'finances.mes.ara';
        default:          return null;      // el que no sabem, no es desa
      }
    },

    /**
     * QUÈ ES DESA, no només on.
     *
     * Gairebé totes les vistes es desen la resposta sencera, però els hàbits
     * no: la seva resposta porta dues coses —el dia i el full del mes— i cada
     * una va a la seva clau. Desar-hi el paquet sencer feia que la vista es
     * pensés que allò era el dia, i petava en obrir amb «Cannot read properties
     * of undefined». Va passar la primera nit que va existir això.
     *
     * Per això aquí es diu com es desa cada mòdul i no només sota quina clau:
     * si una vista parteix la seva resposta, s'ha de partir igual.
     */
    desa: function (modul, dades, avui) {
      if (modul === 'habits') {
        if (dades.dia) Cau.set('habits.' + avui, dades.dia);
        if (dades.mes) Cau.set('habits.mes', dades.mes);
        return;
      }
      var clau = this.clauDe(modul, avui);
      if (clau) Cau.set(clau, dades);
    },

    omple: function () {
      /* Un cop per obertura i prou. Tornar-hi cada vegada que canvies
         d'apartat seria fer feina per no guanyar res: el que hi ha desat es
         posa al dia sol quan entres. */
      if (this.fet) return;
      this.fet = Date.now();

      var jo = this;
      /* Mig segon de marge perquè la pantalla que hagis obert tingui la
         connexió per a ella sola: el paquet és per a les que ENCARA no mires. */
      setTimeout(function () {
        crida('nucli', 'paquet', {}).then(function (r) {
          if (!r || !r.pantalles) return;
          var avui = r.avui || fmt.avui();
          Object.keys(r.pantalles).forEach(function (id) {
            var dades = r.pantalles[id];
            if (!dades) return;
            if (id === '_dia') { Cau.set('dia.' + avui, dades); return; }
            jo.desa(id, dades, avui);
          });
        }).catch(function () {
          /* Si falla, no passa res de res: cada pantalla sap demanar la seva. */
        });
      }, 500);
    }
  };

  var Cua = {
    tot: function () { return Cau.get('cua', []); },

    afegeix: function (modul, accio, params, clau) {
      var cua = Cua.tot();
      // Una sola entrada per clau: tocar cinc cops el mateix hàbit desa un cop.
      if (clau) cua = cua.filter(function (i) { return i.clau !== clau; });
      cua.push({ modul: modul, accio: accio, params: params, clau: clau || null, ts: Date.now() });
      Cau.set('cua', cua);
      App.pintaPendents();
    },

    /** Envia la cua en sèrie. Si una falla per xarxa, s'atura i la conserva. */
    envia: function () {
      var cua = Cua.tot();
      if (!cua.length) return Promise.resolve(0);

      var enviades = 0;
      return cua.reduce(function (cadena, item) {
        return cadena.then(function () {
          return crida(item.modul, item.accio, item.params).then(function () {
            enviades++;
            var resta = Cua.tot().filter(function (i) { return i.ts !== item.ts; });
            Cau.set('cua', resta);
            App.pintaPendents();
          });
        });
      }, Promise.resolve()).then(function () { return enviades; })
        .catch(function (err) {
          if (err.api) {
            // El servidor l'ha rebutjada: reintentar-la eternament no la salvarà.
            Cau.set('cua', []);
            App.pintaPendents();
            App.brindis('No s\'ha pogut desar: ' + err.message, 'error');
          }
          return enviades;
        });
    }
  };

  // -------------------------------------------------------------- components

  var Comp = {
    carregant: function (files) {
      var n = files || 4, h = '<div class="marques" aria-busy="true" aria-label="Carregant">';
      for (var i = 0; i < n; i++) h += '<div class="esquelet marca-fantasma"></div>';
      return h + '</div>';
    },

    buit: function (titol, text, botoHtml) {
      return '<div class="estat">' + ic('habits', 'ic-g') +
             '<h2>' + esc(titol) + '</h2>' +
             '<p>' + esc(text) + '</p>' + (botoHtml || '') + '</div>';
    },

    error: function (err, reintenta) {
      var esXarxa = err && err.xarxa;
      return '<div class="estat">' + ic(esXarxa ? 'sense-xarxa' : 'avis', 'ic-g') +
             '<h2>' + (esXarxa ? 'Sense connexió' : 'Alguna cosa ha fallat') + '</h2>' +
             '<p>' + esc(err && err.message ? err.message : String(err)) + '</p>' +
             (reintenta ? '<button class="btn btn-secundari" data-reintenta="1">Torna-ho a provar</button>' : '') +
             '</div>';
    },

    avis: function (titol, text) {
      return '<div class="avis">' + ic('avis') +
             '<div><strong>' + esc(titol) + '</strong>' + esc(text) + '</div></div>';
    },

    targeta: function (contingut) { return '<div class="targeta">' + contingut + '</div>'; }
  };

  // --------------------------------------------------------------- aplicació

  var App = {
    vistes: {},
    actual: null,
    moduls: [],
    enLiniaEstat: true,

    registraVista: function (id, def) { App.vistes[id] = def; },

    arrenca: function (estatInicial) {
      App.moduls = (estatInicial && estatInicial.moduls) || Cau.get('moduls', []);
      App.pintaNav();
      /* Fosc sempre, no «segons el que digui el sistema». Amb «auto», el
         mateix JEFE sortia blanc al mòbil i fosc al PC segons com tingués
         cadascun la configuració, i això no és una app: són dues. La sala de
         comandament ja és fosca; la resta l'ha d'acompanyar.

         I ara ja no es tria: el botó de passar a full de dia s'ha tret. El que
         hi hagi desat als aparells d'abans —«auto», «clar»— es migra aquí i
         no torna a preguntar-se. */
      App.aplicaTema();

      /* LA MARCA DE VERSIÓ. La construcció hi deixa la data i, si el codi
         estava net, el commit. El «· en curs» —que vol dir que es va
         construir amb canvis sense desar— no li diu res a ningú que no sigui
         jo, i es treu: el que ha de llegir ell és quan es va penjar això que
         està mirant. */
      (function () {
        var on = document.getElementById('marca-versio');
        if (!on || !window.MARCA_JEFE) return;
        on.textContent = String(window.MARCA_JEFE).replace(/\s*·\s*en curs\s*$/, '');
      })();

      /* ELS VIGILANTS ES REGISTREN SEMPRE, i abans de res.
         Abans, si encara no hi havia clau d'accés, aquesta funció sortia aquí
         mateix per demanar-la. Amb la sortida se n'anava tot el que ve
         després: el botó d'enrere del mòbil, la cua del que s'ha d'enviar
         quan torni la cobertura, i el detectar que has recuperat la xarxa.
         I un cop posaves la clau ja no es tornava a arrencar, o sigui que
         l'app es quedava coixa la resta de la sessió sense dir-ho.

         Registrar-los no costa res ni depèn de tenir servidor. El que depèn
         del servidor és què s'ensenya, i això va més avall. */
      window.addEventListener('popstate', function (ev) {
        var id = (ev.state && ev.state.vista) || 'conversa';
        App.ves(App.vistes[id] ? id : 'conversa', null, true);
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) Cua.envia();
      });
      window.addEventListener('online', function () { App.enLinia(true); Cua.envia(); });
      window.addEventListener('offline', function () { App.enLinia(false); });

      // Servida des de fora i encara sense servidor: primer connectar.
      if (!dinsAppsScript() && !Servidor.config()) {
        App.ves('conversa');
        setTimeout(function () { App.connecta(); }, 300);
        return;
      }

      // La conversa és la pantalla d'arrencada: és l'assistent, no el formulari.
      // I SEMPRE, encara que ahir sortissis d'una altra vista. Recordar l'última
      // vista convertia qualsevol pantalla sense sortida en una trampa que ni
      // reinstal·lant l'app es desfeia, perquè la cau sobreviu a la instal·lació.
      //
      // L'única excepció és una destinació demanada explícitament a l'adreça,
      // que és com arriben les notificacions: tocar «falten les cremades» ha
      // de dur a Nutrició i no a la conversa. Es consumeix i prou: no es desa.
      /* EL HASH POT PORTAR UNA DATA: «#dia:2026-08-05».
         Sense això, el resum de les onze i mitja —que parla de demà— t'obria
         la pàgina d'avui, que és justament el dia del qual no et parlava. */
      var d = App.deLAdreca(String(location.hash || ''));
      if (d.vista && App.vistes[d.vista]) {
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
        App.ves(d.vista, d.params);
      } else {
        App.ves(App.vistes.conversa ? 'conversa' : 'inici');
      }

      /* TOCAR UNA NOTIFICACIÓ AMB L'APP JA OBERTA.
         Aquest és el cas més habitual i era el que pitjor anava: el
         treballador de servei li feia el focus a la finestra i s'acabava
         aquí, o sigui que la notificació et deixava exactament on ja eres.
         Ara el treballador diu on has d'anar i s'hi va sense recarregar res:
         és instantani i no perds el que tinguessis obert.

         El `hashchange` és la xarxa de seguretat per si el missatge no
         arriba: el treballador també canvia l'adreça. */
      if (navigator.serviceWorker) {
        navigator.serviceWorker.addEventListener('message', function (ev) {
          var m = ev && ev.data;
          if (!m || m.jefe !== 'ves') return;
          var y = App.deLAdreca('#' + String(m.vista || ''));
          if (y.vista && App.vistes[y.vista]) App.ves(y.vista, y.params);
        });
      }
      window.addEventListener('hashchange', function () {
        var x = App.deLAdreca(String(location.hash || ''));
        if (!x.vista || !App.vistes[x.vista]) return;
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
        App.ves(x.vista, x.params);
      });

      Cua.envia();

      // Refresca la llista de mòduls en segon pla: un mòdul nou apareix sol.
      crida('nucli', 'inici', {}).then(function (d) {
        Cau.set('moduls', d.moduls);
        if (JSON.stringify(d.moduls) !== JSON.stringify(App.moduls)) {
          App.moduls = d.moduls; App.pintaNav();
        }
      }).catch(function () { /* sense connexió: seguim amb la cau */ });

      Precarrega.omple();
    },

    /**
     * QUÈ DEMANA UNA ADREÇA. «#dia» o «#dia:2026-08-05».
     *
     * Els dos punts i no una interrogació a posta: el hash no és una consulta
     * i posar-hi «?» faria pensar que ho és. Una data i prou, que és l'únic
     * que cal —si algun dia en calen dos, ja es veurà, però no s'inventa ara.
     */
    deLAdreca: function (hash) {
      var t = String(hash || '').replace(/^#/, '').trim();
      if (!t) return { vista: '', params: {} };
      var i = t.indexOf(':');
      if (i === -1) return { vista: t, params: {} };
      var vista = t.slice(0, i);
      var valor = t.slice(i + 1);
      return {
        vista: vista,
        params: /^\d{4}-\d{2}-\d{2}$/.test(valor) ? { data: valor } : {}
      };
    },

    /* Portar-se totes les pantalles d'una anada. Surt aquí perquè hi ha dos
       moments que ho volen: en arrencar, i just quan acabes de connectar el
       servidor —aquell dia l'arrencada ja havia passat de llarg. */
    precarrega: function () { Precarrega.omple(); },

    ves: function (id, params, sensePila) {
      var def = App.vistes[id];
      if (!def) { id = 'inici'; def = App.vistes.inici; }

      // El botó d'enrere del mòbil ha de funcionar: és el primer que prems quan
      // vols sortir d'algun lloc. Només apilem els canvis de vista, no els de
      // dins d'una vista (canviar de dia no és navegar).
      if (!sensePila && App.actual && App.actual !== id) {
        try { history.pushState({ vista: id }, ''); } catch (e) { /* no és cap error */ }
      }

      App.actual = id;
      /* Quina pantalla s'està veient, al `body`. De moment només ho fa servir
         la marca de versió per apartar-se del micròfon a la conversa, però
         qualsevol cosa que hagi de dependre de la pantalla ja té on mirar. */
      document.body.dataset.vista = id;

      document.querySelectorAll('.nav a').forEach(function (a) {
        if (a.dataset.vista === id) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });

      /* CADA VISTA PINTA A LA SEVA PRÒPIA CAPSA, I NO AL CONTENIDOR.
         -----------------------------------------------------------------
         Abans totes rebien el mateix `#vista`. Una petició al servidor triga
         un segon i mig, i si en aquell segon i mig canviaves de pantalla, la
         resposta de la que havies deixat arribava i s'escrivia al mateix
         `#vista` —que ara era d'una altra vista— i te la tornava a plantar
         al davant. Des de fora: obres un apartat, en surts, i al cap d'uns
         segons se't torna a obrir sol.

         Amb una capsa per render, la vista vella escriu a un tros de DOM que
         ja no penja d'enlloc: no es veu, i a més `arrel.isConnected` passa a
         ser fals, que és el que les vistes ja miren per no fer feina de
         franc. Val per a totes, i per a les que es facin d'ara endavant. */
      var contenidor = document.getElementById('vista');
      contenidor.innerHTML = '';
      var arrel = document.createElement('div');
      arrel.className = 'vista-capsa';
      contenidor.appendChild(arrel);

      window.scrollTo(0, 0);
      try { def.render(arrel, params || {}); }
      catch (err) { arrel.innerHTML = Comp.error(err, false); }
    },

    refresca: function () { App.ves(App.actual); },

    /**
     * ESTÀS TOCANT ALGUNA COSA ARA MATEIX?
     *
     * Les vistes es pinten dues vegades: primer amb el que hi havia desat i
     * després amb el que arriba del servidor. Aquesta segona vegada refà
     * l'HTML, i si en aquell moment tenies un desplegable obert o estaves
     * escrivint, allò desapareix: el menú es tanca sol i el que havies teclejat
     * es perd. Abans de repintar, es pregunta.
     */
    interactuant: function () {
      var a = document.activeElement;
      if (!a) return false;
      if (document.getElementById('fosc').dataset.obert === '1') return true;
      var t = a.tagName;
      return t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || a.isContentEditable;
    },

    pintaNav: function () {
      var nav = document.getElementById('nav');
      if (!nav) return;                    // sense barra de seccions: no és cap error
      var items = [{ id: 'inici', nom: 'Inici', icona: 'inici' }].concat(
        App.moduls.filter(function (m) { return m.teVista; })
      );
      nav.innerHTML = items.map(function (m) {
        return '<a href="#" data-vista="' + esc(m.id) + '">' +
               ic(m.icona || 'modul') + '<span>' + esc(m.nom) + '</span></a>';
      }).join('');
      nav.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function (ev) { ev.preventDefault(); App.ves(a.dataset.vista); });
      });
    },

    // ------------------------------------------------------------ indicadors

    enLinia: function (si) {
      if (App.enLiniaEstat === si) return;
      App.enLiniaEstat = si;
      document.getElementById('sense-xarxa').hidden = si;
    },

    pintaPendents: function () {
      var n = Cua.tot().length;
      var el = document.getElementById('pendents');
      el.hidden = n === 0;
      el.textContent = n === 1 ? '1 canvi pendent de desar' : n + ' canvis pendents de desar';
    },

    /**
     * REFER UNA PANTALLA SENSE QUE SE'T MOGUI DE LLOC.
     *
     * Repintar una llista sencera per un canvi petit té un preu que no es veu
     * llegint el codi i es veu de seguida fent servir l'app: has baixat fins a
     * la setena tasca, la marques, i la pàgina et torna a dalt de tot. O puges
     * la primera de tres fotos i has de tornar a baixar per pujar la segona.
     *
     * On el canvi és d'una sola cosa —treure una targeta— val més tocar només
     * aquella i no passar per aquí. Això és per als altres casos: quan el que
     * canvia és l'estructura i refer-ho és el més honest, però no hi ha cap
     * raó perquè a més et faci perdre el lloc on eres.
     *
     * No salta al buit: si la pàgina nova és més curta, es queda al final.
     */
    mantenintLaVista: function (fer) {
      var y = window.scrollY || document.documentElement.scrollTop || 0;
      fer();
      if (!y) return;
      requestAnimationFrame(function () {
