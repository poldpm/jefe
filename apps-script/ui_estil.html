                   color: var(--ink); border: 1px solid var(--neatline); border-radius: var(--r); }

/* Despesa o ingrés: la primera decisió, i la que canvia les categories. */
.tipus-tria { display: flex; border: 1px solid var(--neatline); margin-bottom: var(--e4); }
.tipus-tria button { flex: 1; min-height: 44px; background: none; border: 0;
                     border-right: 1px solid var(--neatline); font: inherit;
                     color: var(--ink-suau); cursor: pointer; }
.tipus-tria button:last-child { border-right: 0; }
.tipus-tria button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }

/* L'import mana: és l'únic camp que sempre has d'omplir. */
.camp-import { font-size: 1.75rem !important; font-weight: 700; text-align: center; }

.sugg { display: flex; flex-wrap: wrap; gap: var(--e2); margin: 0 0 var(--e3); }
.sugg:empty { display: none; }
.sugg button { min-height: 40px; padding: 0 var(--e3); background: none; font: inherit;
               font-size: .8125rem; border: 1px solid var(--neatline); color: var(--ink-suau);
               border-radius: var(--r); cursor: pointer; }
.sugg button:active { color: var(--ink); border-color: var(--ink); }

.form-ajustos label { display: block; margin-bottom: var(--e3); }
/* La casella amb la seva etiqueta al costat. `.form-ajustos label` és més
   específic que `.cat-exclou` i li posava `display:block`, i llavors el buit
   entre la casella i el text desapareixia: quedaven enganxats. */
.form-ajustos label.cat-exclou { display: flex; align-items: center; gap: var(--e2); }

/* `:not([type="checkbox"])` I `textarea`, i totes dues coses són arreglos.
   ---------------------------------------------------------------------
   Sense el `:not`, aquesta regla —que va més avall al full i per tant guanya
   a igualtat de pes— convertia qualsevol casella de verificació d'un tauler
   en un rectangle de 48 px d'alt i amplada sencera. Es veia als taulers de
   tasques («Prioritària») i del calendari («Tot el dia»): un bloc fosc surant
   sobre l'etiqueta.
   I el `textarea` no hi era: les notes es pintaven sense estil, petites i
   desalineades, al costat de camps que sí que en tenien. */
.form-ajustos input:not([type="checkbox"]),
.form-ajustos select,
.form-ajustos textarea {
  width: 100%; min-height: var(--toc);
  margin-top: var(--e1); padding: var(--e2) var(--e3);
  font: inherit; background: var(--paper);
  color: var(--ink); border: 1px solid var(--neatline);
  border-radius: var(--r); -webkit-appearance: none; appearance: none;
}
.form-ajustos input:not([type="checkbox"]) { padding: 0 var(--e3); }
.form-ajustos textarea { line-height: 1.5; resize: vertical; }
/* El ring de teclat, a part: apagar-lo deixava qui va amb tabulador sense
   saber on es, i el canvi de color d'una vora d'un pixel no compta. */
.form-ajustos input:focus-visible, .form-ajustos select:focus-visible,
.form-ajustos textarea:focus-visible { outline: 3px solid var(--utm); outline-offset: 1px; }
.form-ajustos input:focus, .form-ajustos select:focus, .form-ajustos textarea:focus {
  border-color: var(--utm);
}
.form-ajustos hr { border: 0; border-top: 3px double var(--neatline); margin: var(--e4) 0; }

/* Els botons d'un tauler van un sota l'altre i a amplada sencera. Un «Desa» i
   un «Treu-la» de costat, a més d'estrets, posen a la mateixa alçada i amb la
   mateixa pinta la cosa que vols fer i la que no vols fer mai sense pensar. */
.form-ajustos > button { width: 100%; }

/* -------------------------------------------------------------------- modal */

.fosc { position: fixed; inset: 0; z-index: 50; background: rgba(14,18,20,.6);
        display: flex; align-items: flex-end; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity .2s linear; }
.fosc[data-obert="1"] { opacity: 1; pointer-events: auto; }
.modal { width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto;
         background: var(--paper); border: 1.5px solid var(--neatline); border-bottom: 0;
         padding: var(--e4) var(--e4) calc(var(--e5) + env(safe-area-inset-bottom, 0px));
         transform: translateY(100%); transition: transform .32s var(--sortida); }
.fosc[data-obert="1"] .modal { transform: translateY(0); }
.modal-cap { display: flex; align-items: center; gap: var(--e3);
             margin-bottom: var(--e4); padding-bottom: var(--e3);
             border-bottom: 3px double var(--neatline); }
.modal-cap h2 { flex: 1; }
@media (min-width: 900px) {
  .fosc { align-items: center; }
  .modal { border-bottom: 1.5px solid var(--neatline); max-height: 84vh; }
}

.selector-data { display: flex; align-items: center; gap: var(--e2); }
.selector-data .data { flex: 1; text-align: center; }

.tira { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: var(--e3); }
.tira .xifra-gran { font-size: 1.75rem; line-height: 1; font-weight: 700;
                    font-style: italic; color: var(--corba-mestra); }

/* =========================================================================
   DISPOSICIÓ AMPLA — ha d'anar AL FINAL del full
   Si aquest bloc va abans de les regles base, la cascada les barreja: el
   `position` es perd però el `top` sobreviu, i la navegació es converteix en
   una capa fixa de pantalla sencera que tapa el contingut. Va passar.
   ========================================================================= */

@media (min-width: 900px) {
  /* El cos passa a columna per poder posar la navegació a dalt sense
     moure-la del final del document (que és on ha de ser per al teclat). */
  body { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: var(--e6); }
  #sense-xarxa, #pendents { order: -2; }
  .nav { order: -1; }
  main#vista { order: 0; flex: 1; display: flex; flex-direction: column; }
  /* La capsa de la vista ha de créixer com creixia la vista quan pintava
     directament a `#vista`. Vegeu `App.ves`: ara cada render té la seva. */
  .vista-capsa { flex: 1; min-height: 0; }

  .pagina { padding: var(--e5) var(--e5) var(--e7); }
  .dues-columnes { grid-template-columns: minmax(320px, 380px) 1fr; align-items: start; }

  /* A l'escriptori hi cap tot alhora: xifres i tancament a l'esquerra, els
     àpats a la dreta. Al mòbil manen l'ordre i l'espai; aquí, la vista de
     conjunt.

     `grid-template-rows: auto 1fr` és el que enganxa el tancament just sota
     les xifres. Amb files automàtiques, la columna dels àpats —que és molt
     més alta— repartia l'alçada entre les dues files i el tancament quedava
     surant al mig de l'esquerra, lluny de tot. */
  .nutri { display: grid; grid-template-columns: minmax(280px, 340px) 1fr;
           grid-template-areas: "dalt apats" "tanca apats";
           grid-template-rows: auto 1fr;
           align-items: start; column-gap: var(--e6); row-gap: var(--e5);
           max-width: 1100px; margin: 0 auto; }
  .nutri-dalt  { grid-area: dalt; }
  .nutri-apats { grid-area: apats; }
  .nutri-tanca { grid-area: tanca; }

  /* La capçalera segueix la mateixa amplada que el contingut. Estirada a tota
     la pantalla, la data quedava al centre de 1.900 px i els botons a dos
     pams de distància, sense relació amb res del que hi ha a sota. */
  .capcalera-nutri { padding: var(--e3) var(--e5) 0; }
  .capcalera-nutri .capcalera-fila,
  .capcalera-nutri .segments { max-width: 1100px; margin: 0 auto; }
  .capcalera-nutri .segments { margin-top: var(--e3); }

  /* -----------------------------------------------------------------------
     EL CALENDARI A L'ESCRIPTORI

     Aquí la peça grossa és la graella, no el panell: al revés que a
     nutrició. Amb les classes d'allà, el mes quedava encaixat en 340 px al
     racó d'una pantalla de 1.900 i la resta era negre.

     I les caselles deixen de ser un quadradet amb punts: hi caben els títols,
     i llavors el mes es LLEGEIX d'un cop en comptes d'obligar-te a anar
     tocant dies per saber què hi ha.
     ----------------------------------------------------------------------- */
  .cal-pagina {
    display: grid; grid-template-columns: 1fr minmax(300px, 380px);
    align-items: start; gap: var(--e6);
    max-width: 1500px; margin: 0 auto;
  }

  .mes-graella { grid-auto-rows: minmax(112px, auto); }
  .mes-dia { align-items: stretch; gap: 4px; padding: var(--e2); }
  .mes-dia .n { font-size: 1rem; text-align: left; }
  .mes-dia .punts { display: none; }

  .cal-titols { display: flex; flex-direction: column; gap: 2px;
                overflow: hidden; text-align: left; }
  .cal-cita {
    font-size: .75rem; line-height: 1.25; padding: 1px 4px;
    border-left: 3px solid var(--seu, var(--corba-mestra));
    background: var(--paper2); color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-cita b { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* EL DE TOT EL DIA ES DISTINGEIX PER LA BARRA, NO PER OMPLIR-SE.
     Omplert amb el color del calendari donava 3,8 amb el text a sobre, i no
     es pot arreglar triant millor: aquests colors els posa Google i poden ser
     qualsevol cosa, o sigui que no hi ha cap color de lletra que hi vagi bé
     sempre. Amb la barra gruixuda el text sempre va sobre un fons conegut, i
     de fet la pista més forta ja hi era: els que tenen hora la porten davant
     i aquests no. */
  .cal-cita[data-tot="1"] { border-left-width: 7px; font-weight: 600; }
  .cal-mes-n { font-size: .6875rem; color: var(--ink-suau); padding-left: 4px; }

  .mes-dia[aria-current="date"] .cal-cita { background: var(--paper); }
  .mes-dia[data-fora="1"] .cal-titols { opacity: .45; }

  .dia-cap-cal { margin: 0 0 var(--e2); }

  /* La capçalera segueix l'amplada del contingut, com a la resta. */
  .capcalera-nutri:has(+ .pagina .cal-pagina) .capcalera-fila { max-width: 1500px; }

  /* El formulari en una sola tira: a l'escriptori hi ha amplada de sobres i
     no cal fer-lo baixar set files. */
  .apat-form { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .apat-form select, .apat-form [data-nom] { grid-column: 1 / -1; }
  .apat-form [data-afegeix] { grid-column: 1 / 3; }
  .apat-form [data-desa-aliment] { grid-column: 3 / -1; }

  .nav {
    position: sticky; top: 0; bottom: auto;
    flex-direction: row; justify-content: center; gap: var(--e6);
    border-top: 0; border-bottom: 3px double var(--neatline);
    padding-bottom: 0;
  }
  .nav a { flex: none; flex-direction: row; gap: var(--e2); min-height: 52px; font-size: .8125rem; }

  h1 { font-size: 1.875rem; }
  .franja { min-height: 84px; }
  .cella { height: 30px; }
}

@media (min-width: 1200px) {
  .reixa tbody th { max-width: 260px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* ==========================================================================
   SEGUIMENT FÍSIC

   La pantalla té una jerarquia molt clara i el CSS l'ha de respectar: primer
   el veredicte, després per què, després la forma al llarg del temps. Tot el
   que hi ha aquí surt dels tokens que ja hi ha; no hi entra cap color nou.
   ========================================================================== */

/* LA CRIDA DE LA SETMANA PENDENT. És el motiu pel qual existeix el mòdul, o
   sigui que quan hi és mana per sobre de tot i es veu que es pot tocar. */
.seg-reclama {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  width: 100%; margin-bottom: var(--e3); padding: var(--e3);
  border: 1px solid var(--avis); background: color-mix(in srgb, var(--avis) 14%, var(--paper2));
  color: var(--ink); text-align: left;
  border-left: 3px solid var(--avis);
  transition: background-color .16s var(--entra), transform .12s var(--entra);
}
.seg-reclama b { font-size: .9375rem; }
.seg-reclama span { font-size: .8125rem; color: var(--ink-suau); }
.seg-reclama:active { transform: scale(.99); }

/* EL VEREDICTE. El fil s'encén segons com ha anat, però el color no hi va mai
   sol: el titular ja ho diu amb paraules. */
.seg-veredicte[data-mena="be"]   { border-color: var(--utm); }
.seg-veredicte[data-mena="avis"] { border-color: var(--avis); }
.seg-veredicte h2 { font-size: 1.25rem; }

.seg-xifres { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--e2);
              border-top: 1px solid var(--neatline); padding-top: var(--e3); }
.seg-xifres > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.seg-xifres b { font-family: var(--mono); font-size: 1.375rem; font-weight: 600;
                line-height: 1; font-variant-numeric: tabular-nums; }
.seg-xifres b i { font-style: normal; font-size: .6875rem; color: var(--ink-suau);
                  margin-left: 3px; font-weight: 400; }
.seg-delta { font-family: var(--mono); font-size: .6875rem; color: var(--ink-suau);
             font-variant-numeric: tabular-nums; }

/* ELS AVISOS. Cadascun amb la seva icona, perquè el nivell no depengui només
   del color: qui no distingeixi el cian de l'ambre ha de poder llegir-ho. */
.seg-avisos { display: flex; flex-direction: column; gap: var(--e2); margin: var(--e3) 0; }
.seg-avis { display: flex; gap: var(--e2); align-items: flex-start; margin: 0;
            padding: var(--e3); border: 1px solid var(--neatline);
            background: var(--paper2); font-size: .875rem; line-height: 1.45; }
.seg-avis .ic { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.seg-avis[data-n="avis"] { border-left: 3px solid var(--avis); }
.seg-avis[data-n="avis"] .ic { color: var(--avis); }
.seg-avis[data-n="be"]   { border-left: 3px solid var(--utm); }
.seg-avis[data-n="be"] .ic { color: var(--utm); }
.seg-avis[data-n="info"] .ic { color: var(--ink-suau); }

.seg-diu { margin: var(--e3) 0; padding: var(--e3); border: 1px solid var(--utm-suau);
           border-left: 3px solid var(--utm); background: var(--paper2);
           font-size: .9375rem; line-height: 1.5; white-space: pre-wrap; }

/* LES GRÀFIQUES. Una línia i prou: el que has de veure és la forma. */
.seg-grafiques { display: grid; gap: var(--e3); margin-top: var(--e4); }
@media (min-width: 700px) { .seg-grafiques { grid-template-columns: 1fr 1fr; } }
.seg-graf { display: block; width: 100%; height: 96px; margin-top: var(--e2); overflow: visible; }
.seg-linia { fill: none; stroke: var(--utm); stroke-width: 1.5;
             vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.seg-punt  { fill: var(--paper2); stroke: var(--utm); stroke-width: 1.5;
             vector-effect: non-scaling-stroke; }
.seg-ara   { fill: var(--utm); }
.seg-eix { display: flex; justify-content: space-between; margin-top: var(--e1);
           font-family: var(--mono); font-size: .625rem; color: var(--ink-suau);
           text-transform: uppercase; letter-spacing: .06em; }

/* LES FOTOS, PER ANGLE. Una foto sola no diu res; la de fa un mes al costat,
   sí. Per això la tira és horitzontal i el que s'alinea és el mateix angle. */
.seg-angle { margin-bottom: var(--e3); }
.seg-tira { display: flex; gap: var(--e2); overflow-x: auto; padding-bottom: var(--e1);
            scroll-snap-type: x mandatory; }
.seg-tira figure { margin: 0; flex: none; width: 118px; scroll-snap-align: start; }
.seg-tira img { display: block; width: 118px; height: 158px; object-fit: cover;
                border: 1px solid var(--neatline); background: var(--paper2); }
.seg-tira figcaption { margin-top: 3px; font-family: var(--mono); font-size: .625rem;
                       color: var(--ink-suau); text-transform: uppercase; letter-spacing: .06em; }
/* EL BOTO DE TREURE UNA FOTO. A la cantonada i petit de veure, pero de 32
   pixels de debo: prou per encertar-lo amb el dit i prou per no encertar-lo
   sense voler mentre passes la tira. Sobre fosc sempre, que a sota hi ha una
   fotografia i no es pot saber de quin color sera. */
.seg-tira figure { position: relative; }
.seg-treu {
  position: absolute; top: 3px; right: 3px;
  width: 32px; height: 32px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: 0;
  background: rgba(5, 8, 11, .74); color: #fff;
  transition: background-color .16s var(--entra), transform .12s var(--entra);
}
.seg-treu .ic { width: 15px; height: 15px; }
.seg-treu:active { background: var(--gr); transform: scale(.92); }
@media (hover: hover) and (pointer: fine) {
  .seg-treu:hover { background: var(--gr); }
}

.seg-puja { display: flex; gap: var(--e2); flex-wrap: wrap; margin: var(--e2) 0; }
.seg-puja .btn { flex: 1; min-width: 96px; cursor: pointer; }

/* L historic: una fila per control i prou. La graella de la pantalla d inici
   hi posava tres per fila al mobil i "Hi ha coses a corregir" queia en tres
   ratlles dins d una capsa de cent píxels. */
.seg-controls { display: flex; flex-direction: column; gap: var(--e2); }
.seg-fila { min-height: 0; flex-direction: row; align-items: center;
            justify-content: space-between; gap: var(--e3); }
.seg-fila[aria-current="true"] { background: var(--utm-suau); }
.seg-check { display: flex; align-items: center; gap: var(--e2); margin-top: var(--e2);
             font-size: .8125rem; color: var(--ink-suau); }
.seg-check input { width: 18px; height: 18px; flex: none; accent-color: var(--utm); }

/* La tria de tres opcions: energia, son, gana, dieta. Botons de debò, prou
   grossos per al dit, i l'estat el diu l'atribut i no només el color. */
.tria-fila { display: flex; gap: var(--e2); }
.tria-bt { flex: 1; min-height: 44px; padding: 0 var(--e2);
           border: 1px solid var(--neatline); background: transparent; color: var(--ink-suau);
           font-size: .8125rem;
           transition: border-color .16s var(--entra), color .16s var(--entra); }
.tria-bt[aria-pressed="true"] { border-color: var(--utm); color: var(--utm);
                                background: var(--utm-suau); }
.camp-fila { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--e2); }


/* ==========================================================================
   ESCOLA — la safata de l'automatització

   Substitueix una finestra de Telegram, però NO és un xat: el que hi arriba
   són avisos d'un automatisme, no conversa. Per això no hi ha bafarades ni
   alineació a dreta i esquerra: és una safata, i el que ha de cantar és què
   queda per llegir.
   ========================================================================== */

.esc-safata { display: flex; flex-direction: column; gap: var(--e2); }

.esc-msg {
  border: 1px solid var(--neatline); background: var(--paper2);
  padding: var(--e3);
}
.esc-msg header { display: flex; align-items: baseline; gap: var(--e2);
                  margin-bottom: var(--e1); }
.esc-mena { font-family: var(--mono); font-size: .6875rem; letter-spacing: .1em;
            text-transform: uppercase; color: var(--ink-suau); }
.esc-quan { margin-left: auto; font-family: var(--mono); font-size: .6875rem;
            color: var(--ink-suau); font-variant-numeric: tabular-nums; }
.esc-msg h3 { font-size: .9375rem; margin: 0 0 var(--e1); line-height: 1.3; }
/* La mesura, aturada: a l'escriptori aquest paràgraf feia tota l'amplada de la
   pàgina i una línia de cent-trenta caràcters no es llegeix, es recorre. */
.esc-msg p { margin: 0; max-width: 68ch; font-size: .875rem; line-height: 1.5;
             color: var(--ink-suau);
             white-space: pre-wrap; overflow-wrap: anywhere; }

/* EL QUE NO HAS LLEGIT. El fil viu a l'esquerra i la superfície encesa, la
   mateixa marca que fan servir els hàbits fets: dins d'aquesta app, «això et
   reclama» es diu sempre igual. I no ho diu només el color —hi ha el botó
   «Vist», que als llegits no hi és—. */
/* Sense pestanya de 3 px a l'esquerra: amb la vora encesa i la superfície
   tenyida, aquell tros de vora gruixuda només afegia pes a una fitxa que ja
   pesava més que la columna d'hores —que és el que has vingut a mirar—. */
.esc-nou { border-color: var(--utm);
           background: color-mix(in srgb, var(--utm) 8%, var(--paper2)); }
.esc-nou h3 { color: var(--ink); }
.esc-nou .esc-mena { color: var(--utm); }
/* Sobre la superfície tenyida, `--ink-suau` es queda a 4,1:1. El cos d'un avís
   que encara no has llegit és justament el que has de poder llegir. */
.esc-nou p { color: var(--ink); }

.esc-vist {
  margin-top: var(--e3); min-height: 36px; padding: 0 var(--e3);
  border: 1px solid var(--utm-suau); background: transparent; color: var(--utm);
  font-family: var(--mono); font-size: .75rem; letter-spacing: .1em;
  text-transform: uppercase;
  transition: border-color .16s var(--entra), background-color .16s var(--entra);
}
.esc-vist:active { background: var(--utm-suau); border-color: var(--utm); }
@media (hover: hover) and (pointer: fine) {
  .esc-vist:hover { border-color: var(--utm); }
}

/* L'HISTORIAL, PLEGAT. El que ja has despatxat no s'esborra mai, però tampoc
   t'ha d'ocupar la pantalla: al cap de dues setmanes era una llista
   inacabable de coses que ja havies llegit a la notificació. */
/* SORTIR DE LA SAFATA. La targeta no desapareix de cop: s'esvaeix i es plega,
   i així veus QUINA has despatxat. De cop, amb la llista movent-se avall, no
   saps si has tocat la que volies. Amb moviment reduït, fora directament. */
.esc-msg { transition: opacity .18s var(--entra), height .18s var(--entra),
                       margin .18s var(--entra), padding .18s var(--entra); }
.esc-despatxat { opacity: 0; height: 0 !important; margin: 0; padding-top: 0;
                 padding-bottom: 0; overflow: hidden; pointer-events: none; }

/* HA DE SEMBLAR UN BOTÓ. Era text pelat alineat a l'esquerra: allà hi ha
   quinze dies d'avisos al darrere i ningú no els obria perquè res no deia que
   allò es pogués tocar. Vora, i un galó que gira quan s'obre. */
.esc-obre-vistos {
  display: flex; align-items: center; gap: var(--e2);
  width: 100%; min-height: 44px; margin-top: var(--e3); padding: 0 var(--e3);
  border: 1px solid var(--neatline); background: transparent; color: var(--ink-suau);
  font-family: var(--mono); font-size: .6875rem; letter-spacing: .08em;
  text-transform: uppercase; text-align: left;
  transition: color .16s var(--entra), border-color .16s var(--entra);
}
.esc-obre-vistos .ic { width: 12px; height: 12px; flex: none;
                       transition: transform .16s var(--entra); }
.esc-obre-vistos[aria-expanded="true"] .ic { transform: rotate(90deg); }
.esc-obre-vistos:active { color: var(--utm); border-color: var(--utm); }
@media (hover: hover) and (pointer: fine) {
  .esc-obre-vistos:hover { color: var(--utm); border-color: var(--utm); }
}
.esc-obre-vistos + .esc-safata { margin-top: var(--e2); }

/* La resposta a una pregunta teva va JUST SOTA el botó que l'ha demanada, no
   al final de la pàgina: el que has demanat ha de sortir on estàs mirant. */


/* ==========================================================================
   ESCOLA — el que l'automatització ha trobat

   No és una safata de missatges: és el dia que l'automatisme ha extret. Per
   això mana la columna d'hores i no la llista de fitxes, i per això una
   substitució no es pinta com un canvi de fitxer al Drive.
   ========================================================================== */

.esc-secc { margin-top: var(--e5); }

/* LA COLUMNA D'HORES. El fil vertical és el dia; cada cosa hi penja pel seu
   punt. Les hores lliures hi són escrites: un forat entre dues cites no és un
   buit del disseny, és una hora que tens. */
/* El fil i els punts van amb `--ink-suau`, no amb `--neatline`: una vora de
   caixa pot ser fluixa perquè la caixa ja es veu, però aquí el fil ÉS el dia i
   amb `--neatline` sobre el fons quedava a 1,4:1 —o sigui, no s'hi veia—.
   L'opacitat el deixa a prop de 3,5:1, que és el mínim d'una cosa que has de
   distingir sense llegir-la. */
.esc-columna { position: relative; padding-left: 58px; }
.esc-columna::before {
  content: ""; position: absolute; left: 50px; top: 6px; bottom: 6px;
  width: 1px; background: var(--ink-suau); opacity: .8;
}
.esc-h {
  position: relative; margin-bottom: 2px; padding: var(--e3);
  border: 1px solid var(--neatline); background: var(--paper2);
}
.esc-h b { display: block; font-size: 1rem; font-weight: 600; line-height: 1.3; }
.esc-hora {
  position: absolute; left: -58px; top: 13px; width: 44px; text-align: right;
  font-family: var(--mono); font-size: .75rem; font-style: normal;
  color: var(--ink-suau); font-variant-numeric: tabular-nums;
}
.esc-h::after {
  content: ""; position: absolute; left: -9px; top: 17px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--paper); border: 1px solid var(--ink-suau);
}

/* LES HORES LLIURES. Sense opacitat: a .55 quedaven a 2,2:1 i eren just la
   informació que hi hem posat expressament —«aquesta estona és teva»—. I amb
   l'hora a la canal, com totes les altres: si se'n surt, la columna d'hores
   deixa de ser una columna i passa a ser una llista amb sagnats desiguals. */
.esc-lliure {
  position: relative; padding: var(--e2) var(--e3); margin-bottom: 2px;
  font-size: .8125rem; color: var(--ink-suau);
}
.esc-lliure .esc-hora { top: var(--e2); }

/* ARA. La pantalla promet «l'hora que ve» i fins ara no deia per on anaves. */
.esc-ara {
  position: relative; display: flex; align-items: center; gap: var(--e2);
  padding: var(--e1) 0 var(--e1) var(--e3); margin: var(--e1) 0 3px;
  border-top: 1px solid var(--utm);
  font-family: var(--mono); font-size: .6875rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--utm);
}
.esc-ara .esc-hora { top: 3px; color: var(--utm); letter-spacing: 0; }

/* UNA SUBSTITUCIÓ NO ÉS UN AVÍS MÉS. Si te'n perds una, una classe es queda
   sense mestre: és l'única cosa d'aquesta pantalla que va en vermell, i el
   color no hi va sol —hi ha l'etiqueta escrita al damunt—. */
/* La vora SENCERA i el punt del fil, no una pestanya a l esquerra. Amb el fil
   vertical al costat, un tros de vora gruixuda mes es llegia com un accessori;
   la caixa vermella entre dues de fosques ja canta prou.
   (El detector marca la pestanya lateral com el tell d IA mes reconeixible, i
   aqui no calia per res.) */
.esc-subs { border-color: var(--gr); }
.esc-subs::after { background: var(--gr); border-color: var(--gr); }
.esc-et {
  display: block; margin-bottom: 2px;
  font-family: var(--mono); font-size: .6875rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--gr);
}

/* ELS PENDENTS, UNA CAIXA PER LLISTA. Venen del Google Tasks, on ja estan
   repartits per llistes, i allà es miren per llistes. Posats en una tirallonga
   amb el nom entre claudàtors al davant de cada línia, el que ordena la feina
   d'un mestre queda reduït a un caràcter enmig del text: la caixa hi torna a
