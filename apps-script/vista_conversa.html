<style>
/* =========================================================================
   JEFE — sala de comandament
   Fons gairebé negre, quadrícula fina, nucli de partícules al centre,
   marc de cantonades i telemetria als marges.

   Diferència deliberada amb la referència: allà la telemetria és decorativa
   i il·legible. Aquí són dades teves de veritat —què ha consultat, quantes
   files, quants tokens, l'hora— i es poden llegir.
   ========================================================================= */

.hud {
  --neg:    #04070b;
  --fosc:   #071019;
  --linia:  #12293a;
  --cian:   #4fd6e0;
  --blau:   #2b7fd4;
  --clar:   #dff6f9;
  --apagat: #6f93a6;
  --calent: #e8a33c;
  --alerta: #ef5f52;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  position: fixed; left: 0; right: 0; top: 0;
  bottom: env(safe-area-inset-bottom, 0px);
  display: flex; flex-direction: column;
  /* Fosc al centre i clar cap a les vores: el nucli es retalla contra el buit
     en comptes de competir-hi, i el terreny apareix on hi ha lloc per mirar-lo.
     A l'inrevés —clar al mig— el nucli i el fons il·luminat es barallaven. */
  background:
    radial-gradient(ellipse 78% 58% at 50% 44%, var(--neg) 22%, transparent 76%),
    #0b2137;
  color: var(--clar);
  padding-top: env(safe-area-inset-top, 0px);
  overflow: hidden;
}
@media (min-width: 900px) { .hud { top: 0; bottom: 0; padding-top: 0; } }

/* Corbes de nivell de fons.
   Abans hi havia una quadrícula de línies rectes. Mateix color, mateix gruix
   i mateix esvaïment: només canvia que ara el terreny és de debò, calculat
   amb el mateix marching squares que el full de mes. */
/* La màscara va a l'inrevés que abans: el terreny s'esvaeix al centre, on hi
   ha el nucli, i es veu cap a fora. Les corbes deixen de passar per darrere
   les partícules, que és on molestaven i on no es podien llegir. */
.reticula {
  position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  mask-image: radial-gradient(ellipse 72% 56% at 50% 44%, transparent 26%, #000 68%);
  -webkit-mask-image: radial-gradient(ellipse 72% 56% at 50% 44%, transparent 26%, #000 68%);
}

/* ---------------------------------------------------------------- capçalera */

.hud-cap {
  position: relative; z-index: 2; flex: none;
  display: flex; align-items: center; gap: var(--e2);
  padding: var(--e2) var(--e3);
  font-family: var(--mono); font-size: .625rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--apagat);
}
@media (max-width: 359px) {
  .hud-cap #etiqueta-estat { max-width: 10ch; overflow: hidden; text-overflow: ellipsis;
                             white-space: nowrap; }
}
.hud-cap .creix { flex: 1; }
.llum { width: 7px; height: 7px; border-radius: 50%; background: var(--apagat); flex: none; }
.hud[data-estat="repos"]     .llum { background: var(--cian); box-shadow: 0 0 8px var(--cian); }
.hud[data-estat="pensant"]   .llum { background: var(--cian); box-shadow: 0 0 14px var(--cian); animation: bat .8s infinite; }
.hud[data-estat="escoltant"] .llum { background: var(--alerta); box-shadow: 0 0 12px var(--alerta); animation: bat .9s infinite; }
.hud[data-estat="apagat"]    .llum { background: var(--calent); }
@keyframes bat { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* Marc de cantonades. Apagades mentre no fa res, enceses quan t'escolta:
   així el marc no és decoració, és l'estat de l'aparell.

   El color va per variable i no per regla d'estat. Amb regles, un estat sense
   la seva —«apagat», per exemple— es quedava amb el color del text i les L
   sortien blanques i brillants: més cridaneres quan res funciona que quan tot
   va bé. Amb una variable, cap estat pot quedar-se sense color. */
.hud { --marc: rgba(79,214,224,.38); }
.hud[data-estat="escoltant"], .hud[data-estat="parlant"] { --marc: var(--cian); }
.hud[data-estat="apagat"] { --marc: rgba(232,163,60,.5); }

.cantonada { position: absolute; width: 26px; height: 26px; pointer-events: none; z-index: 3;
             transition: border-color .35s ease; }
.cantonada.dg { top: 10px; left: 10px;
                border-top: 2px solid var(--marc); border-left: 2px solid var(--marc); }
.cantonada.dd { top: 10px; right: 10px;
                border-top: 2px solid var(--marc); border-right: 2px solid var(--marc); }
.cantonada.bg { bottom: 10px; left: 10px;
                border-bottom: 2px solid var(--marc); border-left: 2px solid var(--marc); }
.cantonada.bd { bottom: 10px; right: 10px;
                border-bottom: 2px solid var(--marc); border-right: 2px solid var(--marc); }

/* LA VORA QUE RESPIRA.
   Mentre t'escolta, tota la pantalla batega amb el color del nucli. És l'únic
   moviment de la pantalla, i és el que et diu de lluny —sense mirar cap
   etiqueta, amb el telèfon damunt la taula— que el micròfon està obert. Un
   estat que no es veu des de l'altra punta de l'habitació no serveix de res. */
.vora {
  position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
  box-shadow: inset 0 0 30px 1px rgba(79,214,224,.55),
              inset 0 0 96px 20px rgba(79,214,224,.20);
  transition: opacity .45s ease;
}
.hud[data-estat="escoltant"] .vora { animation: respira 2.3s ease-in-out infinite; }
.hud[data-estat="parlant"] .vora { opacity: .55; }
@keyframes respira { 0%, 100% { opacity: .18; } 50% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .hud[data-estat="escoltant"] .vora { animation: none; opacity: .8; }
}

/* Telemetria de cantonada: dades teves de veritat —què ha consultat, quantes
   files, quants tokens—, no farciment decoratiu. Petita i al marge, però
   llegible: al 9 px ja és prou discreta sense haver de rebaixar-ne el
   contrast fins a fer-la endevinable. */
.telemetria {
  position: absolute; top: 42px; z-index: 1; pointer-events: none;
  font-family: var(--mono); font-size: .5625rem; line-height: 1.75;
  color: var(--apagat); letter-spacing: .04em; max-width: 38%;
}
.telemetria.esq { left: var(--e3); }
.telemetria.dre { right: var(--e3); text-align: right; }
.telemetria b { color: var(--cian); font-weight: 400; }
.telemetria .val { color: var(--clar); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------- cos

   El nucli al mig i res més. La conversa no viu aquí: apareix quan hi ha
   alguna cosa a dir i se'n va quan ja s'ha dit. Una transcripció permanent
   converteix una sala de comandament en una finestra de xat, i el que ha de
   manar aquí és l'ordre, no l'historial. */

.jefe-centre {
  position: relative; z-index: 2; flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--e3); padding: var(--e4) var(--e4) 0; text-align: center;
}

/* Sense nom a sota: el nucli ja diu qui és. La marca només repetia una
   paraula que ja saps, i li prenia lloc al que de debò mires. */
.nucli-caixa { flex: none; width: min(82vw, 46vh); aspect-ratio: 1; }

/* ------------------------------------------------------------- transcripció */

/* Només l'última resposta, i només mentre serveix de res. */
.transcripcio {
  width: 100%; max-width: 62ch; margin: 0 auto; min-height: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch; text-align: left;
}
.transcripcio:empty { display: none; }
.torn { max-width: 70ch; }
.torn .qui { font-family: var(--mono); font-size: .5625rem; letter-spacing: .22em;
             text-transform: uppercase; color: var(--apagat); margin-bottom: 5px; display: block; }
.torn .diu { font-size: 1rem; line-height: 1.55; white-space: pre-wrap; }
.torn[data-rol="usuari"] { align-self: flex-end; text-align: right; }
.torn[data-rol="usuari"] .qui { color: var(--blau); }
.torn[data-rol="usuari"] .diu { display: inline-block; text-align: left; color: var(--apagat); }
.torn[data-rol="assistent"] .qui { color: var(--cian); }

.traca { margin-top: var(--e2); font-family: var(--mono); font-size: .625rem;
         color: var(--apagat); display: flex; flex-wrap: wrap; gap: var(--e2); }
.traca span { border: 1px solid var(--linia); padding: 2px 7px; }
.traca b { color: var(--cian); font-weight: 400; }

.proposta { margin-top: var(--e3); border: 1px solid var(--calent);
            background: rgba(232,163,60,.08); padding: var(--e3) var(--e4); }
.proposta p { margin: 0 0 var(--e3); font-size: .9375rem; }
.proposta .accions { display: flex; gap: var(--e2); }
.proposta button { min-height: 44px; padding: 0 var(--e4); font: inherit; font-size: .875rem;
                   font-weight: 600; border: 1px solid var(--linia); background: transparent; color: var(--clar); }
.proposta button[data-si] { background: var(--calent); border-color: var(--calent); color: #171104; }

.avis-apagat { margin: var(--e4) var(--e5); padding: var(--e4); border: 1px solid var(--calent);
               background: rgba(232,163,60,.07); font-size: .875rem; line-height: 1.55; }
.avis-apagat strong { display: block; margin-bottom: var(--e2); color: var(--calent);
                      font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; font-size: .75rem; }
.hud code { font-family: var(--mono); background: var(--fosc); border: 1px solid var(--linia);
            padding: 1px 5px; color: var(--cian); }

/* ------------------------------------------------------------------ entrada */

.hud-entrada { position: relative; z-index: 2; flex: none;
               padding: var(--e3) var(--e4) 0; }
/* Barra del que està sentint. Sense això no pots saber si el micròfon
   t'ha sentit, t'ha entès una altra cosa, o directament ha petat. */
.oida { display: flex; align-items: center; gap: var(--e2); width: 100%; max-width: 62ch;
        margin: 0 auto; text-align: left;
        padding: var(--e2) var(--e3); border: 1px solid var(--alerta);
        background: rgba(239,95,82,.08); font-family: var(--mono); font-size: .6875rem; }
.oida-text { flex: 1; min-width: 0; color: var(--clar); overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
.oida[data-error="1"] { border-color: var(--calent); background: rgba(232,163,60,.1); }
.oida[data-error="1"] .oida-text { color: var(--calent); white-space: normal; }
.oida-clau { flex: none; min-height: 32px; padding: 0 var(--e2); border: 1px solid var(--linia);
             background: transparent; color: var(--apagat); font: inherit; font-size: .625rem; }
.oida-clau[aria-pressed="true"] { color: var(--cian); border-color: var(--cian); }

.ona { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
.ona i { width: 3px; background: var(--alerta); animation: ona .9s ease-in-out infinite; }
.ona i:nth-child(1) { height: 40%; animation-delay: 0s; }
.ona i:nth-child(2) { height: 90%; animation-delay: .15s; }
.ona i:nth-child(3) { height: 60%; animation-delay: .3s; }
.ona i:nth-child(4) { height: 100%; animation-delay: .45s; }
@keyframes ona { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

/* --------------------------------------------------------------- les ordres

   Dues maneres de manar, i totes dues a l'abast del polze. La veu és la
   principal; el llapis hi és perquè hi ha llocs —una reunió, una classe— on
   parlar-li en veu alta no és una opció, i sense escriptura l'assistent
   deixaria de servir just quan més el necessites. */

.jefe-ordre { position: relative; z-index: 2; flex: none;
              padding: var(--e4) var(--e4) var(--e3); }
.jefe-botons { display: flex; align-items: center; justify-content: center; gap: var(--e5); }

.ordre-bt {
  width: 76px; height: 76px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--linia); background: rgba(7,16,25,.7); color: var(--clar);
  transition: border-color .18s ease, color .18s ease, transform .18s var(--sortida);
}
.ordre-bt .ic { width: 30px; height: 30px; }
.ordre-bt:active { transform: scale(.94); }
#b-micro { border-color: var(--cian); color: var(--cian); }
#b-micro[data-actiu="1"] { border-color: var(--alerta); color: var(--alerta);
                           animation: pulsa2 1.4s ease-in-out infinite; }
@keyframes pulsa2 { 0%,100% { box-shadow: 0 0 0 0 rgba(239,95,82,.4); }
                    50% { box-shadow: 0 0 0 14px rgba(239,95,82,0); } }

.jefe-escriu { display: flex; align-items: flex-end; gap: var(--e2);
               max-width: 62ch; margin: 0 auto; }
.jefe-escriu textarea { flex: 1; min-width: 0; min-height: 52px; max-height: 150px; resize: none;
                        background: transparent; border: 1px solid var(--linia); color: var(--clar);
                        padding: var(--e3); font: inherit; line-height: 1.4; }
.jefe-escriu textarea:focus { outline: none; border-color: var(--cian); box-shadow: 0 0 0 1px var(--cian); }
.jefe-escriu textarea::placeholder { color: var(--apagat); }

.bt { flex: none; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--linia); background: transparent; color: var(--clar); }
.bt[data-primari] { border-color: var(--cian); color: var(--cian); }
.bt:disabled { opacity: .3; }
.bt-p { width: 44px; height: 44px; border-color: transparent; }
.bt-p[aria-pressed="true"] { color: var(--cian); }

/* ------------------------------------------------------------- els apartats */

.jefe-moduls { position: relative; z-index: 2; flex: none;
               display: flex; justify-content: center; gap: var(--e2);
               padding: var(--e2) var(--e3) calc(var(--e3) + env(safe-area-inset-bottom, 0px));
               border-top: 1px solid var(--linia); }
.jefe-moduls a { flex: 1 1 0; min-width: 0; max-width: 96px; min-height: 56px;
                 display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 5px; color: var(--apagat); text-decoration: none;
                 transition: color .18s ease; }

/* La mateixa rodona que el micròfon i el llapis, però més petita: són ordres
   del mateix sistema, no d'un altre. La jerarquia la posa la mida, no una
   forma diferent —parlar-li segueix manant sobre anar a un apartat. */
.jefe-moduls .rodona { width: 46px; height: 46px; border-radius: 50%; flex: none;
                       display: flex; align-items: center; justify-content: center;
                       border: 1px solid var(--linia); background: rgba(7,16,25,.7);
                       transition: border-color .18s ease; }
.jefe-moduls .rodona .ic { width: 22px; height: 22px; }
.jefe-moduls a:active { color: var(--cian); }
.jefe-moduls a:active .rodona { border-color: var(--cian); }
.jefe-moduls a span { font-family: var(--mono); font-size: .5625rem; letter-spacing: .12em;
                      text-transform: uppercase; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; max-width: 100%; }

@media (min-width: 900px) {
  .nucli-caixa { width: min(42vw, 62vh); }
  .jefe-centre { gap: var(--e4); }
  .ordre-bt { width: 84px; height: 84px; }
  .jefe-moduls { gap: var(--e5); padding-bottom: var(--e4); }
  .jefe-moduls a { max-width: 120px; }
}
</style>

<script>
/* JEFE — MÒDUL · Conversa (sala de comandament) */

App.registraVista('conversa', {
  render: function (arrel) {

    var idConversa = Cau.get('conversa.id', null);
    var missatges = Cau.get('conversa.missatges', []) || [];
    var ocupat = false, veuActiva = Cau.get('conversa.veu', false);
    var tokensSessio = 0, ultimesEines = [], estatIA = null, nucli = null, reconeixedor = null;

    var potEscoltar = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    var potParlar = !!window.speechSynthesis;

    arrel.innerHTML =
      '<div class="hud" id="hud" data-estat="repos">' +
        '<div class="reticula" id="reticula"></div>' +
        '<div class="vora"></div>' +
        '<i class="cantonada dg"></i><i class="cantonada dd"></i>' +
        '<i class="cantonada bg"></i><i class="cantonada bd"></i>' +

        '<div class="hud-cap">' +
          '<span class="llum"></span>' +
          '<span id="etiqueta-estat">iniciant</span>' +
          '<span class="creix"></span>' +
          (potParlar ? '<button class="bt bt-p" id="b-veu" aria-pressed="false" aria-label="Llegir en veu alta">' +
            ic('veu', 'ic-p') + '</button>' : '') +
          '<button class="bt bt-p" id="b-nova" aria-label="Comença de nou">' + ic('mes', 'ic-p') + '</button>' +
          '<button class="bt bt-p" id="b-vistes" aria-label="Ajustos de JEFE">' + ic('ajust', 'ic-p') + '</button>' +
        '</div>' +

        '<div class="telemetria esq" id="tel-esq"></div>' +
        '<div class="telemetria dre" id="tel-dre"></div>' +

        '<div class="jefe-centre">' +
          '<div class="nucli-caixa" id="nucli-caixa"></div>' +
          '<div class="transcripcio" id="transcripcio"></div>' +
        '</div>' +

        '<div class="hud-entrada">' +
          '<div class="oida" id="oida" hidden>' +
            '<span class="ona"><i></i><i></i><i></i><i></i></span>' +
            '<span class="oida-text" id="oida-text">escoltant…</span>' +
            '<button class="oida-clau" id="b-clau" aria-pressed="false">paraula clau: OFF</button>' +
          '</div>' +
        '</div>' +

        '<div class="jefe-ordre">' +
          '<div class="jefe-botons" id="botons">' +
            (potEscoltar ? '<button class="ordre-bt" id="b-micro" aria-label="Parla-li">' +
              ic('micro') + '</button>' : '') +
            '<button class="ordre-bt" id="b-llapis" aria-label="Escriu-li">' + ic('llapis') + '</button>' +
          '</div>' +
          '<div class="jefe-escriu" id="escriu" hidden>' +
            '<textarea id="camp" rows="1" placeholder="Escriu-li…" autocomplete="off"></textarea>' +
            '<button class="bt" data-primari id="b-envia" aria-label="Envia">' + ic('envia') + '</button>' +
          '</div>' +
        '</div>' +

        '<nav class="jefe-moduls" id="moduls" aria-label="Apartats"></nav>' +
      '</div>';

    var hud = arrel.querySelector('#hud');
    var tr = arrel.querySelector('#transcripcio');
    var camp = arrel.querySelector('#camp');

    nucli = Nucli.crea(arrel.querySelector('#nucli-caixa'));

    /* El terreny del fons es genera un sol cop: el SVG escala sol amb el
       contenidor, i la llavor és fixa perquè no balli a cada repintada. */
    arrel.querySelector('#reticula').innerHTML =
      // Més marcades que abans: ara viuen al marge il·luminat, no darrere del
      // nucli, i allà una línia al 16% no s'arriba a veure.
      Relleu.fons(1000, 1000, { color: 'rgba(79,214,224,.30)', gruix: 1, nivells: 14 });

    function posaEstat(e, etiqueta) {
      hud.dataset.estat = e;
      arrel.querySelector('#etiqueta-estat').textContent = etiqueta;
      nucli.estat(e === 'apagat' ? 'repos' : e);
      pintaTelemetria();
    }

    // --------------------------------------------------------- telemetria real

    function pintaTelemetria() {
      var esq = [];
      esq.push('<b>SESSIÓ</b>');
      esq.push('torns <span class="val">' + missatges.length + '</span>');
      esq.push('tokens <span class="val">' + tokensSessio + '</span>');
      if (ultimesEines.length) {
        esq.push('');
        esq.push('<b>ÚLTIMA CONSULTA</b>');
        ultimesEines.slice(0, 4).forEach(function (e) {
          esq.push(e.eina + ' <span class="val">' + (e.files === null ? '—' : e.files) + '</span>');
        });
      }
      var dre = ['<b>SISTEMA</b>'];
      dre.push('estat <span class="val">' + hud.dataset.estat + '</span>');
      if (estatIA && estatIA.model) dre.push('model <span class="val">' + esc(estatIA.model) + '</span>');
      dre.push('veu <span class="val">' + (veuActiva ? 'ON' : 'OFF') + '</span>');
      dre.push('escolta <span class="val">' + (continua ? 'CONTÍNUA' : 'OFF') + '</span>');
      dre.push('micro <span class="val">' + (potEscoltar ? 'OK' : 'NO') + '</span>');

      telemetriaActual = { esquerra: esq.join('<br>'), dreta: dre.join('<br>') };

      var e = arrel.querySelector('#tel-esq'), d = arrel.querySelector('#tel-dre');
      if (e) e.innerHTML = telemetriaActual.esquerra;
      if (d) d.innerHTML = telemetriaActual.dreta;
    }
    var telemetriaActual = { esquerra: '', dreta: '' };

    // ------------------------------------------------------------------ pintura

    /* LA RESPOSTA NOMÉS MENTRE ÉS D'ARA.
       En obrir l'app no s'ensenya res: una resposta d'ahir penjada sota el
       nucli no és informació, és brutícia. Apareix quan acaba de contestar i
       marxa al toc següent o quan tornes a preguntar.

       L'excepció són les propostes: una escriptura pendent de confirmar no pot
       desaparèixer sola, perquè llavors no la confirmaries mai. */
    var respostaFresca = false;

    function pinta() {
      var ultim = null;
      if (respostaFresca) {
        for (var i = missatges.length - 1; i >= 0; i--) {
          if (missatges[i].rol === 'assistent') { ultim = missatges[i]; break; }
        }
      }
      tr.innerHTML = ultim ? torn(ultim) : '';
      lligaPropostes();
      tr.scrollTop = 0;
      pintaTelemetria();
    }

    function amagaResposta() {
      var m = missatges[missatges.length - 1];
      if (m && m.propostes && m.propostes.length) return;   // encara l'has de confirmar
      respostaFresca = false;
      tr.innerHTML = '';
    }

    tr.addEventListener('click', function (ev) {
      if (ev.target.closest('.proposta') || ev.target.closest('button')) return;
      amagaResposta();
    });

    function torn(m) {
      var h = '<div class="torn" data-rol="' + esc(m.rol) + '">' +
        '<span class="qui">' + (m.rol === 'usuari' ? 'TU' : 'JEFE') + '</span>' +
        '<div class="diu">' + esc(m.text) + '</div>';
      if ((m.eines && m.eines.length) || m.temps) {
        h += '<div class="traca">' +
          (m.eines || []).map(function (e) {
            return '<span><b>' + esc(e.eina) + '</b> · ' +
                   (e.files === null || e.files === undefined ? 'ok' : e.files + ' files') + '</span>';
          }).join('') +
          (m.temps ? '<span title="on se n\'ha anat el temps"><b>' +
             (m.temps.total / 1000).toFixed(1) + 's</b> · ia ' + (m.temps.ia / 1000).toFixed(1) +
             ' · dades ' + ((m.temps.context + m.temps.eines) / 1000).toFixed(1) +
             ' · ' + m.temps.voltes + (m.temps.voltes === 1 ? ' volta' : ' voltes') + '</span>' : '') +
        '</div>';
      }
      if (m.propostes && m.propostes.length) {
        h += m.propostes.map(function (p, i) {
          return '<div class="proposta" data-proposta="' + i + '"><p>' + esc(p.etiqueta) + '</p>' +
            '<div class="accions"><button data-si="1">Confirma</button>' +
            '<button data-no="1">Deixa-ho</button></div></div>';
        }).join('');
      }
      return h + '</div>';
    }

    function lligaPropostes() {
      tr.querySelectorAll('.proposta').forEach(function (el) {
        var m = missatges[missatges.length - 1];
        var p = m && m.propostes ? m.propostes[Number(el.dataset.proposta)] : null;
        if (!p) return;
        el.querySelector('[data-no]').addEventListener('click', function () {
          el.innerHTML = '<p style="margin:0;color:var(--apagat)">Descartat.</p>';
        });
        el.querySelector('[data-si]').addEventListener('click', function (ev) {
          ev.currentTarget.disabled = true; ev.currentTarget.textContent = 'Desant…';
          crida('conversa', 'confirma', { eina: p.eina, args: p.args })
            .then(function () {
              el.innerHTML = '<p style="margin:0;color:var(--cian)">Fet.</p>';
              Cau.treu('habits.' + fmt.avui()); Cau.treu('habits.mes'); Cau.treu('inici');
              nucli.pols(1);
            })
            .catch(function (err) {
              el.innerHTML = '<p style="margin:0;color:var(--alerta)">' + esc(err.message) + '</p>';
            });
        });
      });
    }

    /* Dos problemes ben diferents que abans es mostraven igual: no arribar al
       servidor no és el mateix que arribar-hi i que no tingui clau d'IA. */
    function avisApagat(motiu, esXarxa) {
      var m = String(motiu || '');
      var noArriba = esXarxa || /failed to fetch|network|servidor ha respost|connexió/i.test(m);

      tr.innerHTML = noArriba
        ? '<div class="avis-apagat"><strong>No arribo al servidor</strong>' + esc(m) +
          '<p style="margin:var(--e3) 0 var(--e2)">Coses que ho provoquen, per ordre:</p>' +
          '<ol style="margin:0;padding-left:1.2em;line-height:1.8">' +
          '<li>El desplegament no és d\'accés <b>Qualsevol</b>. És la causa més freqüent, ' +
              'i torna a passar si es crea una versió nova amb el manifest mal posat.</li>' +
          '<li>L\'URL no acaba en <code>/exec</code>, o és la de <code>/dev</code>, ' +
              'que exigeix sessió de Google i no serveix des de fora.</li>' +
          '<li>No hi ha connexió.</li></ol>' +
          '<button class="btn btn-secundari btn-ple" data-reconnecta="1" ' +
          'style="margin-top:var(--e4)">Revisa l\'URL i la clau</button></div>'

        : '<div class="avis-apagat"><strong>Sense clau d\'IA</strong>' + esc(m) +
          '<p style="margin:var(--e3) 0 var(--e2)">Per engegar-me:</p>' +
          '<ol style="margin:0;padding-left:1.2em;line-height:1.8">' +
          '<li>Clau a <code>aistudio.google.com</code></li>' +
          '<li>Apps Script → Configuració del projecte → Propietats de l\'script → <code>CLAU_IA</code></li>' +
          '<li>Full <code>_Config</code> → <code>ia_activa</code> = <code>SI</code></li>' +
          '<li>Executa <code>triaModels</code> i després <code>provaIA</code></li></ol></div>';

      var b = tr.querySelector('[data-reconnecta]');
      if (b) b.addEventListener('click', function () { App.connecta(m); });
    }

    // -------------------------------------------------------------------- enviar

    function envia() {
      var text = camp.value.trim();
      if (!text || ocupat) return;
      ocupat = true; camp.value = ''; camp.style.height = 'auto';
      arrel.querySelector('#b-envia').disabled = true;
      // Enviada l'ordre, el camp se'n va i torna a manar el nucli.
      if (App._tancaEscriptura) App._tancaEscriptura();

      missatges.push({ rol: 'usuari', text: text });
      respostaFresca = false;          // la d'abans ja no val
      pinta();
      posaEstat('pensant', 'consultant dades');
      nucli.pols(1);

      // Comptador visible: si triga, que se sàpiga que està treballant i quant.
      var t0 = Date.now();
      clearInterval(App._cronometre);
      App._cronometre = setInterval(function () {
        var s = Math.round((Date.now() - t0) / 1000);
        var el = arrel.querySelector('#etiqueta-estat');
        if (el && ocupat) el.textContent = 'consultant · ' + s + 's';
      }, 1000);

      crida('conversa', 'envia', { text: text, id_conversa: idConversa })
        .then(function (r) {
          idConversa = r.id_conversa; Cau.set('conversa.id', idConversa);
          if (r.error) {
            missatges.push({ rol: 'assistent', text: r.error });
          } else {
            ultimesEines = r.eines || [];
            if (r.tokens) tokensSessio += (r.tokens.entrada || 0) + (r.tokens.sortida || 0);
            missatges.push({ rol: 'assistent', text: r.resposta, eines: r.eines,
                             propostes: r.propostes, temps: r.temps });
            if (veuActiva) parla(r.resposta);
          }
          Cau.set('conversa.missatges', missatges.slice(-40));
          acaba();
        })
        .catch(function (err) { missatges.push({ rol: 'assistent', text: err.message }); acaba(); });
    }

    function acaba() {
      ocupat = false;
      respostaFresca = true;           // acaba de dir-ho: ara sí que es veu
      clearInterval(App._cronometre);
      arrel.querySelector('#b-envia').disabled = false;
      posaEstat(estatIA && estatIA.disponible ? 'repos' : 'apagat',
                estatIA && estatIA.disponible ? 'a punt' : 'sense clau');
      pinta();
    }

    // ---------------------------------------------------------------------- veu

    function parla(text) {
      if (!potParlar) return;
      try {
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(String(text).slice(0, 600));
        u.lang = 'ca-ES'; u.rate = 1.05;
        // Mentre parla, s'apaga l'escolta: si no, se sentiria a ell mateix
        // i es respondria sol en bucle.
        parlantAra = true;
        if (reconeixedor) { try { reconeixedor.stop(); } catch (e) {} }

        u.onstart = function () { posaEstat('parlant', 'parlant'); };
        u.onboundary = function () { nucli.pols(0.7); };
        u.onend = function () {
          parlantAra = false;
          if (continua) { posaEstat('escoltant', 'escoltant'); arrencaReconeixedor(); }
          else posaEstat('repos', 'a punt');
        };
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    /* ---------------------------------------------------------------------
       ESCOLTA CONTÍNUA

       El botó del micròfon no és «prem i parla»: engega i es queda engegat.
       Chrome talla el reconeixement cada pocs segons de silenci, així que
       es torna a arrencar sol fins que l'apaguis.

       Perquè no salti cada cop que dius qualsevol cosa a casa, només actua
       quan sent la paraula clau. També s'atura mentre JEFE parla, per no
       sentir-se a ell mateix.
       --------------------------------------------------------------------- */

    var CLAUS = ['jefe', 'jefa', 'xefe', 'chef', 'hefe', 'gefe', 'jefes', 'efe', 'sefe'];
    var continua = false, aturaVoluntaria = false, parlantAra = false;
    var buffer = '', tempsBuffer = null, consumitFinsA = 0;

    /* La paraula clau és OPCIONAL i ve apagada de sèrie. Amb ella activada,
       si el reconeixedor no encerta el nom, sembla que l'app no faci res.
       Val més que enviï de més i que ho vegis, que no que calli sense dir res. */
    var usaParaulaClau = Cau.get('conversa.paraulaClau', false);

    function Utils_talla(t, n) {
      t = String(t || '');
      return t.length <= n ? t : t.slice(0, n) + '…';
    }

    function mostraOida(text, esError) {
      var b = arrel.querySelector('#oida');
      if (!b) return;
      b.hidden = false;
      b.dataset.error = esError ? '1' : '0';
      arrel.querySelector('#oida-text').textContent = text;
    }

    function amagaOida() {
      var b = arrel.querySelector('#oida');
      if (b) b.hidden = true;
    }

    function teParaulaClau(t) {
      var n = t.toLowerCase();
      for (var i = 0; i < CLAUS.length; i++) {
        var p = n.indexOf(CLAUS[i]);
        if (p !== -1) return n.slice(p + CLAUS[i].length).replace(/^[\s,.:;!?]+/, '');
      }
      return null;
    }

    function arrencaReconeixedor() {
      var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec || reconeixedor || parlantAra) return;

      reconeixedor = new Rec();
      reconeixedor.lang = 'ca-ES';
      reconeixedor.interimResults = true;
      reconeixedor.continuous = true;
      reconeixedor.maxAlternatives = 1;

      reconeixedor.onstart = function () {
        posaEstat('escoltant', 'escoltant');
        mostraOida('escoltant…', false);
      };

      /* S'envia PER SILENCI, no per resultat definitiu.
         En mode continu Chrome no marca res com a definitiu fins que la
         sessió s'acaba, o sigui fins que apagues el micròfon. Esperar-ho
         volia dir no enviar mai mentre parlaves. Ara compta el temps des
         de l'última paraula sentida, sigui provisional o no. */
      reconeixedor.onresult = function (ev) {
        var text = '';
        for (var i = consumitFinsA; i < ev.results.length; i++) {
          text += ev.results[i][0].transcript;
        }
        text = text.trim();
        if (!text) return;

        mostraOida(text, false);
        nucli.pols(Math.min(1, 0.35 + text.length / 40));

        clearTimeout(tempsBuffer);
        tempsBuffer = setTimeout(function () {
          consumitFinsA = ev.results.length;      // el que ve després és una frase nova
          var enviar = text;

          if (usaParaulaClau) {
            var ordre = teParaulaClau(enviar);
            if (ordre === null) {
              mostraOida('sentit «' + Utils_talla(enviar, 40) + '» · sense la paraula clau', false);
              return;
            }
            enviar = ordre.trim();
            if (enviar.length < 2) { mostraOida('has dit JEFE però res més', false); return; }
          }

          if (enviar.length < 2) return;
          mostraOida('enviat: ' + Utils_talla(enviar, 50), false);
          camp.value = enviar;
          envia();
        }, 900);   // silenci després de la darrera paraula
      };

      reconeixedor.onerror = function (ev) {
        if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
          continua = false; aturaVoluntaria = true;
          pintaMicro(); amagaOida(); diagnosticMicro();
          return;
        }
        if (ev.error === 'no-speech' || ev.error === 'aborted') return;   // normals, es rearrenca sol

        var explicacio = {
          'network': 'El reconeixement de veu de Chrome necessita internet: la transcripció la fa un servidor de Google, no el telèfon.',
          'audio-capture': 'No troba cap micròfon.',
          'language-not-supported': 'Aquest navegador no sap transcriure català. Prova-ho des de Chrome.',
          'bad-grammar': 'Error intern del reconeixedor.'
        }[ev.error] || ('Error del reconeixedor: ' + ev.error);

        mostraOida(explicacio, true);
      };

      reconeixedor.onend = function () {
        reconeixedor = null;
        consumitFinsA = 0;                 // sessió nova: els índexs tornen a zero
        if (continua && !aturaVoluntaria && !parlantAra) {
          setTimeout(arrencaReconeixedor, 250);          // Chrome talla sol: es rearrenca
        } else if (!continua) {
          posaEstat(estatIA && estatIA.disponible ? 'repos' : 'apagat',
                    estatIA && estatIA.disponible ? 'a punt' : 'sense clau');
        }
      };

      try { reconeixedor.start(); }
      catch (e) { reconeixedor = null; }
    }

    function alternaEscolta() {
      if (continua) {
        continua = false; aturaVoluntaria = true;
        if (reconeixedor) { try { reconeixedor.stop(); } catch (e) {} }
        buffer = '';
        pintaMicro(); amagaOida();
        posaEstat('repos', 'a punt');
        App.brindis('Escolta aturada');
        return;
      }
      continua = true; aturaVoluntaria = false;
      pintaMicro();
      mostraOida('engegant el micròfon…', false);
      arrencaReconeixedor();
      App.brindis(usaParaulaClau ? 'Escoltant. Digues «JEFE» i la pregunta.'
                                 : 'Escoltant. Parla quan vulguis.');
    }

    function pintaMicro() {
      var b = arrel.querySelector('#b-micro');
      if (b) b.dataset.actiu = continua ? '1' : '0';
      Cau.set('conversa.escolta', continua);
      pintaTelemetria();
    }

    /**
     * Per què no puc engegar el micròfon.
     * Apps Script serveix la pàgina dins d'un iframe que no té permís de
     * micròfon, i aleshores el navegador ni tan sols pregunta: falla de
     * seguida. Això ho comprova i t'ho diu amb el nom exacte de l'error.
     */
    function diagnosticMicro() {
      var dins = (window.self !== window.top);
      function informa(detall) {
        tr.insertAdjacentHTML('beforeend',
          '<div class="avis-apagat"><strong>Micròfon bloquejat</strong>' +
          esc(detall) +
          (dins ? '<p style="margin:var(--e3) 0 0">La pàgina s\'està servint <b>dins d\'un iframe</b> ' +
                  'd\'Apps Script, i aquest iframe no demana permís de micròfon. El navegador el ' +
                  'bloqueja sense preguntar-te res: per això no et surt cap finestreta.</p>' : '') +
          '<p style="margin:var(--e3) 0 var(--e2)"><b>Mentrestant pots dictar igual:</b></p>' +
          '<ul style="margin:0;padding-left:1.2em;line-height:1.8">' +
          '<li><b>Al mòbil:</b> toca el camp de text i prem el <b>micròfon del teclat</b> (Gboard). ' +
          'Transcriu igual de bé i no necessita cap permís de la pàgina.</li>' +
          '<li><b>Al PC:</b> clica el camp i prem <code>Windows + H</code> per dictar.</li>' +
          '</ul></div>');
        tr.scrollTop = tr.scrollHeight;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        informa('El navegador no exposa cap API de micròfon en aquest context.');
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (flux) {
          flux.getTracks().forEach(function (t) { t.stop(); });
          informa('El micròfon sí que és accessible, però el reconeixement de veu l\'ha rebutjat. ' +
                  'Torna-ho a provar; si insisteix, revisa els permisos del lloc al navegador.');
        })
        .catch(function (err) {
          informa('El navegador ha dit: ' + (err && err.name ? err.name : 'error desconegut') +
                  (err && err.message ? ' — ' + err.message : ''));
        });
    }

    function escolta() { alternaEscolta(); }

    // ------------------------------------------------------------------ lligams

    arrel.querySelector('#b-envia').addEventListener('click', envia);
    camp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); envia(); }
    });
    camp.addEventListener('input', function () {
      camp.style.height = 'auto'; camp.style.height = Math.min(150, camp.scrollHeight) + 'px';
    });
    if (potEscoltar) arrel.querySelector('#b-micro').addEventListener('click', escolta);

    /* El llapis. A una reunió o a classe no li pots parlar en veu alta, i
       sense escriptura l'assistent deixaria de servir justament allà. El camp
       apareix en lloc dels botons perquè, un cop escrivint, els botons rodons
       només farien nosa. */
    (function () {
      var bl = arrel.querySelector('#b-llapis');
      var botons = arrel.querySelector('#botons');
      var escriu = arrel.querySelector('#escriu');

      function obre() {
        botons.hidden = true; escriu.hidden = false;
        camp.focus();
      }
      function tanca() {
        escriu.hidden = true; botons.hidden = false;
        camp.value = ''; camp.style.height = 'auto';
      }
      App._tancaEscriptura = tanca;

      bl.addEventListener('click', obre);
      camp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') { ev.preventDefault(); tanca(); }
      });
      // Si el deixes buit i te'n vas, torna sol als botons: un camp de text
      // obert i buit ocupa el lloc de l'ordre que sí que faràs servir.
      camp.addEventListener('blur', function () {
        setTimeout(function () {
          if (!camp.value.trim() && document.activeElement !== camp &&
              !escriu.contains(document.activeElement)) tanca();
        }, 120);
      });
    })();

    /* Els apartats, drets a la vora de sota. Surten sols del registre de
       mòduls: un mòdul nou hi apareix sense tocar aquesta vista. */
    function pintaModuls() {
      var nav = arrel.querySelector('#moduls');
      if (!nav) return;
      var llista = (App.moduls && App.moduls.length) ? App.moduls : (Cau.get('moduls', []) || []);
      var items = llista.filter(function (m) { return m.teVista && m.id !== 'conversa'; });

      nav.innerHTML = items.map(function (m) {
        return '<a href="#" data-ves="' + esc(m.id) + '">' +
               '<i class="rodona">' + ic(m.icona || 'modul') + '</i>' +
               '<span>' + esc(m.nom) + '</span></a>';
      }).join('');

      nav.querySelectorAll('[data-ves]').forEach(function (a) {
        a.addEventListener('click', function (ev) { ev.preventDefault(); App.ves(a.dataset.ves); });
      });
    }
    pintaModuls();

    (function () {
      var bc = arrel.querySelector('#b-clau');
      if (!bc) return;
      function pintaClau() {
        bc.setAttribute('aria-pressed', usaParaulaClau ? 'true' : 'false');
        bc.textContent = 'paraula clau: ' + (usaParaulaClau ? 'ON' : 'OFF');
      }
      pintaClau();
      bc.addEventListener('click', function () {
        usaParaulaClau = !usaParaulaClau;
        Cau.set('conversa.paraulaClau', usaParaulaClau);
        pintaClau();
        App.brindis(usaParaulaClau ? 'Ara cal dir «JEFE» abans de la pregunta'
                                   : 'Ara envio tot el que sentis');
      });
    })();

    if (potParlar) {
      var bv = arrel.querySelector('#b-veu');
      bv.setAttribute('aria-pressed', veuActiva ? 'true' : 'false');
      bv.addEventListener('click', function () {
        veuActiva = !veuActiva;
        Cau.set('conversa.veu', veuActiva);
        bv.setAttribute('aria-pressed', veuActiva ? 'true' : 'false');
        if (!veuActiva) speechSynthesis.cancel();
        App.brindis(veuActiva ? 'Et parlaré en veu alta' : 'Veu desactivada');
        pintaTelemetria();
      });
    }

    arrel.querySelector('#b-nova').addEventListener('click', function () {
      crida('conversa', 'nova', {}).then(function (r) {
        idConversa = r.id_conversa; missatges = []; ultimesEines = []; tokensSessio = 0;
        Cau.set('conversa.id', idConversa); Cau.set('conversa.missatges', []);
        pinta(); nucli.pols(1);
      });
    });

    /* Els apartats ja són a la fila de sota. Aquí queda el que no s'ha de
       veure cada dia: notificacions i com està el sistema. */
    arrel.querySelector('#b-vistes').addEventListener('click', function () {
      var n = Notificacions.estat();
      var textNotif = !n.potSerHi ? 'Aquest navegador no en pot rebre'
                    : n.activades ? 'Actives en aquest dispositiu'
                    : n.permis === 'denied' ? 'Denegades — cal permetre-les al navegador'
                    : 'JEFE et pot avisar amb l\'app tancada';

      pintaTelemetria();
      var cos = App.modal('JEFE',
        '<p class="marge" style="margin:0 0 var(--e2)">Notificacions</p>' +
        '<button class="btn btn-ple ' + (n.activades ? 'btn-secundari' : 'btn-primari') + '" ' +
          'data-notifica="1"' + (n.activades || !n.potSerHi ? ' disabled' : '') + '>' +
          (n.activades ? 'Ja estan actives' : 'Activa les notificacions') + '</button>' +
        '<p class="menut" style="margin:var(--e2) 0 0" id="estat-notif">' + esc(textNotif) + '</p>' +

        '<p class="marge" style="margin:var(--e5) 0 var(--e2)">Com està el sistema</p>' +
        '<div class="menut" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));' +
          'gap:var(--e4);line-height:1.7">' +
          '<div>' + telemetriaActual.dreta + '</div>' +
          '<div>' + telemetriaActual.esquerra + '</div>' +
        '</div>');

      var bn = cos.querySelector('[data-notifica]');
      if (bn && !bn.disabled) bn.addEventListener('click', function () {
        bn.dataset.carregant = '1';
        // El permís s'ha de demanar des d'aquest toc: si es demana sol en
        // carregar, Chrome el denega sense preguntar i ja no hi ha marxa enrere.
        Notificacions.activa()
          .then(function () {
            bn.dataset.carregant = '0'; bn.disabled = true;
            bn.textContent = 'Ja estan actives';
            cos.querySelector('#estat-notif').textContent =
              'Actives. Prova-ho amb provaNotificacio() des de l\'editor d\'Apps Script.';
            App.brindis('Notificacions actives');
          })
          .catch(function (err) {
            bn.dataset.carregant = '0';
            cos.querySelector('#estat-notif').textContent = err.message;
          });
      });
    });

    window.addEventListener('resize', function () { if (nucli) nucli.redimensiona(); });

    // ---------------------------------------------------------------- arrencada

    pinta();
    posaEstat('repos', 'connectant');

    crida('conversa', 'estat', {}).then(function (e) {
      estatIA = e;
      posaEstat(e.disponible ? 'repos' : 'apagat', e.disponible ? 'a punt' : 'sense clau');
      if (!e.disponible) { avisApagat(e.motiu); return; }

      /* Si l'escolta estava engegada, es torna a engegar sola en obrir.
         Sense això havies de prémer el micròfon cada vegada que carregava
         la pàgina, que és exactament el contrari de tenir-lo sempre escoltant.
         Alguns navegadors exigeixen un toc previ; si peta, s'avisa i prou. */
      if (potEscoltar && Cau.get('conversa.escolta', false)) {
        continua = true; aturaVoluntaria = false;
        pintaMicro();
        mostraOida('reprenent l\'escolta…', false);
        try { arrencaReconeixedor(); }
        catch (err) {
          continua = false; pintaMicro();
          mostraOida('toca el micròfon per reprendre l\'escolta', true);
        }
      }

      if (!missatges.length) {
        crida('conversa', 'historial', { id_conversa: idConversa }).then(function (h) {
          if (h.missatges && h.missatges.length) {
            idConversa = h.id_conversa; missatges = h.missatges;
            Cau.set('conversa.id', idConversa); Cau.set('conversa.missatges', missatges.slice(-40));
            pinta();
          }
        }).catch(function () {});
      }
    }).catch(function (err) {
      estatIA = { disponible: false, motiu: err.message };
      posaEstat('apagat', 'sense connexió');
      avisApagat(err.message, true);
    });
  }
});
</script>
