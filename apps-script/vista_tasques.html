<script>
/* JEFE — MÒDUL · Tasques (Google Tasks)
   Món: full de mapa topogràfic.

   QUÈ ENSENYA I PER QUÈ AIXÍ:

     1. EL CAMP D'APUNTAR, sempre obert i a dalt. No demana llista ni data ni
        prioritat: cada camp obligatori al moment de capturar és una excusa per
        no capturar, i el que no s'apunta es perd. Cau a la llista principal de
        Google Tasks i ja ho mouràs.

     2. UNA CAIXA PER LLISTA, les mateixes caixes que a Escola —perquè és el
        mateix: llistes del Google Tasks—. Les vençudes NO surten en un bloc a
        part: sortirien dues vegades, i ja hem vist què passa llavors. Es
        marquen allà on són i el compte va a la capçalera.

     3. LES FETES es demanen, no es carreguen. No les mires cada cop que obres
        i costen una volta per llista.

   AQUÍ LA CASELLA ÉS DE DEBÒ. A Escola no n'hi ha perquè allò només mira; això
   escriu al Google Tasks, i el que marquis aquí ho veuràs al mòbil.

   I EL QUE APUNTES SURT A L'INSTANT, sense esperar el servidor: vegeu
   `afegeixEsperant`. Apuntar sis coses seguides no ha de ser sis pauses de
   segon i mig mirant la pantalla. */

App.registraVista('tasques', {
  render: function (arrel, params) {

    var dades = null;
    var previPintat = null;    // JSON del que hi ha pintat ara mateix
    var ajornat = null;        // pantalla que espera que pari d'escriure
    var esperant = 0;          // captures enviades i encara sense resposta
    var veureFetes = false;
    var lesFetes = null;       // les fetes, quan les hagi demanades
    var demanantFetes = false;

    // ------------------------------------------------------------- capçalera

    function capcalera() {
      var n = dades ? dades.tasques.length : 0;
      return '<header class="capcalera capcalera-nutri">' +
        '<div class="capcalera-fila">' +
          '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
            ic('conversa', 'ic-p') + '</button>' +
          '<span class="titol-periode" style="cursor:default">' +
            '<b>Tasques</b>' +
            '<span>' + (dades ? n + (n === 1 ? ' pendent' : ' pendents') : '') +
              (dades && dades.vencudes
                ? ' · ' + dades.vencudes + (dades.vencudes === 1 ? ' vençuda' : ' vençudes')
                : '') + '</span>' +
          '</span>' +
          '<button class="btn btn-fantasma btn-icona" data-ajustos="1" aria-label="Quines llistes vull veure">' +
            ic('ajust', 'ic-p') + '</button>' +
        '</div>' +
      '</header>';
    }

    // ---------------------------------------------------------------- pintura

    /* Una fila per tasca: la rodona de completar i el cos, que obre el detall.
       El text petit diu el que has de saber sense obrir-la —quan venç, si és
       prioritària, si hi estàs— i res més. */
    function fila(t) {
      var menut = [];
      if (t.vencEl) menut.push((t.vencuda ? 'vencia ' : '') + fmt.relativa(t.vencEl));
      if (t.prioritat === 'alta') menut.push('prioritària');
      if (t.fent) menut.push('hi estic');
      if (t.nota) menut.push('amb nota');

      return '<div class="tasca" data-t="' + esc(t.id) + '"' +
        (t.vencuda ? ' data-vencuda="1"' : '') + '>' +
        '<button class="tasca-marca" data-fet="' + esc(t.id) + '"' +
          ' data-llista="' + esc(t.llista) + '"' +
          ' aria-label="Fet: ' + esc(t.text) + '"></button>' +
        '<button class="tasca-cos" data-obre="' + esc(t.id) + '">' +
          '<span class="tasca-text">' + esc(t.text) + '</span>' +
          /* EL PRIMER PAS VA A LA FILA, i va per sobre de la resta del text
             petit. El títol d'una tasca encallada és justament el que fa que
             no la miris; el primer pas és el que sí que pots fer ara. Si l'has
             escrit, que es vegi sense haver d'obrir res. */
          (t.primerPas
            ? '<span class="tasca-pas">' + esc(t.primerPas) +
              (t.passQuan ? ' · ' + esc(t.passQuan) : '') + '</span>'
            : '') +
          (menut.length ? '<span class="menut">' + esc(menut.join(' · ')) + '</span>' : '') +
        '</button>' +
      '</div>';
    }

    /* El contenidor d'una caixa s'escriu SEMPRE, encara que la llista estigui
       buida i amagada: és on aterren les captures que encara no han tornat del
       servidor, i si no hi fos les hauria de fer aparèixer repintant. */
    function caixes(d) {
      if (!d.blocs.length) return '';
      return '<div class="caixes">' + d.blocs.map(function (b) {
        return '<section class="caixa" data-llista="' + esc(b.id) + '"' +
            (b.tasques.length ? '' : ' hidden') + '>' +
          /* Sense comptador, com a Escola: les tasques hi són totes a la vista
             i el número no deia res que no es veiés. */
          '<h3 class="caixa-cap"><span>' + esc(b.nom) + '</span></h3>' +
          '<div class="caixa-cos" data-coses="' + esc(b.id) + '">' +
            b.tasques.map(fila).join('') +
          '</div>' +
        '</section>';
      }).join('') + '</div>';
    }

    function blocFetes() {
      return '<div class="tsq-fetes">' +
        '<button class="desplega" data-fetes="1" aria-expanded="' +
          (veureFetes ? 'true' : 'false') + '">' +
          ic('dreta', 'ic-p') + '<span>' +
          (veureFetes ? 'Amaga les fetes' : 'Veure les fetes') + '</span>' +
        '</button>' +
        (veureFetes
          ? '<div id="tsq-fetes-cos">' +
              (lesFetes === null
                ? '<p class="menut">Un moment…</p>'
                : (lesFetes.length
                    /* Dins de `caixes` perquè a l'escriptori no faci una fila
                       de mil pixels d'ample amb quatre paraules a l'esquerra:
                       les fetes són una caixa més. */
                    ? '<div class="caixes"><div class="caixa"><div class="caixa-cos">' +
                        lesFetes.map(function (t) {
                          return '<div class="tasca" data-feta="1">' +
                            '<button class="tasca-marca" data-desfes="' + esc(t.id) + '"' +
                              ' data-llista="' + esc(t.llista) + '" data-fet="1"' +
                              ' aria-label="Torna-la a pendent: ' + esc(t.text) + '"></button>' +
                            '<span class="tasca-cos">' +
                              '<span class="tasca-text">' + esc(t.text) + '</span>' +
                              '<span class="menut">' + esc(t.llistaNom +
                                (t.fetEl ? ' · ' + fmt.relativa(t.fetEl) : '')) + '</span>' +
                            '</span>' +
                          '</div>';
                        }).join('') +
                      '</div></div></div>'
                    : '<p class="menut">Cap de feta aquestes tres setmanes.</p>')) +
            '</div>'
          : '') +
      '</div>';
    }

    function pinta(d, dEnCau) {
      dades = d;

      if (!d.hiHaServei) {
        arrel.innerHTML = capcalera() +
          '<div class="pagina">' +
            '<p class="marge">Google Tasks</p>' +
            '<p class="menut">Encara no li has donat permís. Obre l\'editor d\'Apps Script ' +
              'i executa <b>preparaTasques()</b> una vegada: després aquí hi haurà les teves ' +
              'llistes tal com són al mòbil.</p>' +
          '</div>';
        lliga();
        return;
      }

      var quina = (d.llistes.filter(function (l) { return l.principal; })[0] ||
                   d.llistes.filter(function (l) { return l.mostra; })[0] || {}).nom || '';

      arrel.innerHTML = capcalera() +
        '<div class="pagina">' +
          '<section>' +
            /* Sempre obert i sempre a dalt. Si has de prémer un botó per
               obrir-lo, ja has perdut la meitat del que volies apuntar. */
            '<label class="camp-captura tsq-capt">' +
              '<span class="marge">Apunta-ho i segueix' +
                (quina ? ' · va a ' + esc(quina) : '') + '</span>' +
              '<div class="captura-fila">' +
                '<input id="t-captura" placeholder="Què t\'acaba de passar pel cap?" autocomplete="off">' +
                '<button class="btn btn-primari" data-captura>' + ic('mes') + '</button>' +
              '</div>' +
            '</label>' +
          '</section>' +

          '<section class="secc">' +
            (d.tasques.length
              ? caixes(d)
              : (d.blocs.length
                  ? '<p class="menut">Res pendent. Bon senyal.</p>' + caixes(d)
                  : '<p class="menut">No mires cap llista. Tria-les al botó de dalt a la dreta.</p>')) +
          '</section>' +

          '<section class="secc">' + blocFetes() + '</section>' +
          (dEnCau ? '<p class="menut">Última còpia desada al telèfon.</p>' : '') +
        '</div>';

      lliga();
    }

    // ---------------------------------------------------------------- accions

    function lliga() {
      var bv = arrel.querySelector('[data-torna]');
      if (bv) bv.addEventListener('click', function () { App.ves('conversa'); });

      var ba = arrel.querySelector('[data-ajustos]');
      if (ba) ba.addEventListener('click', obreAjustos);

      var camp = arrel.querySelector('#t-captura');

      /**
       * APUNTAR NO POT FER ESPERAR.
       *
       * La línia surt a la seva caixa abans de sortir del telèfon i el camp
       * queda lliure de seguida: pots dir-ne quatre de seguides sense que la
       * pantalla et pari entre l'una i l'altra. Quan el servidor contesta,
       * torna la llista de debò i la provisional desapareix sola.
       *
       * Si falla, es desfà i el text et torna al camp. No es perd.
       */
      function captura() {
        var t = camp.value.trim();
        if (!t) return;
        camp.value = '';
        if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }

        var provisional = afegeixEsperant(t);
        esperant++;

        escriu('tasques', 'captura', { text: t })
          .then(function (r) { esperant--; aplica(r); })
          .catch(function (err) {
            esperant--;
            if (provisional && provisional.parentNode) provisional.parentNode.removeChild(provisional);
            camp.value = t;
            App.brindis(err.message, 'error');
          });
      }
      var bc = arrel.querySelector('[data-captura]');
      if (bc) bc.addEventListener('click', captura);
      if (camp) {
        camp.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') { ev.preventDefault(); captura(); }
        });
      }

      arrel.querySelectorAll('[data-fet]:not([data-fet="1"])').forEach(function (b) {
        b.addEventListener('click', function () {
          var t = b.closest('.tasca');
          t.dataset.fent = '1';
          escriu('tasques', 'completa', { id: b.dataset.fet, llista: b.dataset.llista })
            .then(function (r) { lesFetes = null; aplica(r); })
            .catch(function (err) { t.dataset.fent = '0'; App.brindis(err.message, 'error'); });
        });
      });

      arrel.querySelectorAll('[data-desfes]').forEach(function (b) {
        b.addEventListener('click', function () {
          b.disabled = true;
          escriu('tasques', 'completa',
                 { id: b.dataset.desfes, llista: b.dataset.llista, desfes: true })
            .then(function (r) { lesFetes = null; aplica(r); })
            .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
        });
      });

      var bf = arrel.querySelector('[data-fetes]');
      if (bf) bf.addEventListener('click', function () {
        veureFetes = !veureFetes;
        repinta();
      });

      /* Marcar una tasca invalida les fetes —n'hi ha una de nova— i si el bloc
         era obert es quedava a «Un moment…» per sempre, perquè ningú les
         tornava a demanar. Es demanen aquí, que és per on passa cada pintada. */
      if (veureFetes && lesFetes === null && !demanantFetes) demanaFetes();

      arrel.querySelectorAll('[data-obre]').forEach(function (b) {
        b.addEventListener('click', function () {
          var t = null;
          for (var i = 0; i < dades.tasques.length; i++) {
            if (dades.tasques[i].id === b.dataset.obre) t = dades.tasques[i];
          }
          if (t) obreTasca(t);
        });
      });
    }

    function repinta() {
      App.mantenintLaVista(function () { pinta(dades, false); });
    }

    function demanaFetes() {
      demanantFetes = true;
      crida('tasques', 'fetes', {})
        .then(function (r) {
          demanantFetes = false; lesFetes = r.fetes || [];
          if (veureFetes) repinta();
        })
        .catch(function (err) {
          demanantFetes = false; lesFetes = [];
          App.brindis(err.message, 'error');
          if (veureFetes) repinta();
        });
    }

    /** Una línia provisional a la caixa on caurà, mentre el servidor no contesta. */
    function afegeixEsperant(text) {
      var quina = (dades.llistes.filter(function (l) { return l.principal; })[0] ||
                   dades.llistes.filter(function (l) { return l.mostra; })[0] || {}).id;
      var caixa = arrel.querySelector('.caixa[data-llista="' + quina + '"]');
      var coses = arrel.querySelector('[data-coses="' + quina + '"]');
      if (!caixa || !coses) return null;
      caixa.hidden = false;

      var el = document.createElement('div');
      el.className = 'tasca';
      el.dataset.esperant = '1';
      el.innerHTML = '<span class="tasca-marca"></span>' +
                     '<span class="tasca-cos"><span class="tasca-text">' + esc(text) + '</span></span>';
      coses.appendChild(el);
      return el;
    }

    // ------------------------------------------------------------- el detall

    function obreTasca(t) {
      var cos = App.modal('Tasca',
        '<div class="form-ajustos">' +
          '<label><span class="marge">Què s\'ha de fer</span>' +
            '<input data-c="text" value="' + esc(t.text) + '" autocomplete="off"></label>' +
          '<label><span class="marge">A quina llista</span>' +
            '<select data-c="llista">' +
              dades.llistes.map(function (l) {
                return '<option value="' + esc(l.id) + '"' +
                       (t.llista === l.id ? ' selected' : '') + '>' + esc(l.nom) + '</option>';
              }).join('') +
            '</select></label>' +
          '<label><span class="marge">Per quan</span>' +
            '<input data-c="venc_el" type="date" value="' + esc(t.vencEl || '') + '" autocomplete="off"></label>' +
          '<label class="cat-exclou"><input type="checkbox" data-c="prioritat"' +
            (t.prioritat === 'alta' ? ' checked' : '') + '><span>Prioritària</span></label>' +
          '<label class="cat-exclou"><input type="checkbox" data-c="fent"' +
            (t.fent ? ' checked' : '') + '><span>Hi estic</span></label>' +
          /* EL PRIMER PAS. Va aquí i no en una pantalla a part perquè el
             moment en què serveix és quan tens la tasca oberta al davant i no
             saps per on agafar-la.
             Dues caselles i no una: el que fa que un pla es compleixi és que
             digui QUÈ i QUAN. Amb el «què» sol, torna a ser una tasca. */
          '<label><span class="marge">El primer pas, de deu minuts</span>' +
            '<input data-c="primer_pas" value="' + esc(t.primerPas || '') + '"' +
              ' placeholder="Obrir el document i escriure el títol" autocomplete="off"></label>' +
          '<label><span class="marge">Quan</span>' +
            '<input data-c="pas_quan" value="' + esc(t.passQuan || '') + '"' +
              ' placeholder="demà després de dinar" autocomplete="off"></label>' +
          '<p class="menut">Ha de ser tan petit que faci riure. El que costa és ' +
            'començar, no fer-ho.</p>' +
          '<label><span class="marge">Nota</span>' +
            '<textarea data-c="nota" rows="3">' + esc(t.nota || '') + '</textarea></label>' +
          '<p class="menut">La prioritat, el «hi estic» i el primer pas se\'ls guarda ' +
            'en JEFE: Google Tasks no els sap desar. La resta és la tasca de debò.</p>' +
          /* POSAR-S'HI DES D'AQUÍ. El moment en què decideixes treballar en
             una cosa és quan la tens oberta al davant, no quan vas a buscar
             un rellotge en una altra pantalla. */
          '<button class="btn btn-secundari" data-focus>' + ic('focus') +
            'Posa-t\'hi ara</button>' +
          '<button class="btn btn-primari" data-desa style="margin-top:var(--e2)">Desa</button>' +
          '<button class="btn btn-secundari" data-esborra style="margin-top:var(--e2)">' +
            'Esborra-la de Google Tasks</button>' +
        '</div>');

      var camps = {};
      cos.querySelectorAll('[data-c]').forEach(function (i) { camps[i.dataset.c] = i; });

      cos.querySelector('[data-focus]').addEventListener('click', function () {
        App.tancaModal();
        App.ves('focus', { tasca: t.id, tasca_llista: t.llista, tasca_text: t.text });
      });

      cos.querySelector('[data-desa]').addEventListener('click', function () {
        var b = this;
        b.disabled = true;
        escriu('tasques', 'edita', {
          id: t.id,
          llista: t.llista,
          llistaNova: camps.llista.value !== t.llista ? camps.llista.value : '',
          text: camps.text.value,
          venc_el: camps.venc_el.value,
          prioritat: camps.prioritat.checked,
          fent: camps.fent.checked,
          primer_pas: camps.primer_pas.value,
          pas_quan: camps.pas_quan.value,
          nota: camps.nota.value
        }).then(function (r) {
          App.tancaModal(); App.brindis('Desat');
          lesFetes = null;
          aplica(r);
        }).catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });

      /* ESBORRAR ÉS ESBORRAR. Al full antic, treure una tasca hi deixava la
         fila amb una data; aquí la tasca no és nostra, és de Google, i el que
         es fa és el que diu. Per això es pregunta i el botó no diu «treure». */
      cos.querySelector('[data-esborra]').addEventListener('click', function () {
        var segon = App.modal('Esborrar la tasca',
          '<div class="form-ajustos">' +
            '<p>«' + esc(t.text) + '» desapareixerà de Google Tasks, també del mòbil.</p>' +
            '<p class="menut">Això no es pot desfer. Si només l\'has acabada, tanca això i ' +
              'marca-la amb la rodona: així es queda a les fetes.</p>' +
            '<button class="btn btn-primari" data-si>Esborra-la</button>' +
            '<button class="btn btn-secundari" data-no style="margin-top:var(--e2)">Deixa-ho estar</button>' +
          '</div>');

        segon.querySelector('[data-no]').addEventListener('click', App.tancaModal);
        segon.querySelector('[data-si]').addEventListener('click', function () {
          var b = this;
          b.disabled = true;
          escriu('tasques', 'treu', { id: t.id, llista: t.llista })
            .then(function (r) {
              App.tancaModal(); App.brindis('Esborrada');
              aplica(r);
            })
            .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
        });
      });
    }

    // ------------------------------------------------------------- ajustos

    /* Quines llistes mires. Igual que al calendari: les tens totes i tries.
       «Torna a llegir-les» hi és perquè una llista nova feta al mòbil no
       apareix sola: qui les llegeix és aquesta crida. */
    function obreAjustos() {
      var cos = App.modal('Les teves llistes',
        '<div class="form-ajustos">' +
          '<p class="menut">Les que marquis són les que veuràs. Les tasques són de ' +
            'Google Tasks: aquí només tries quines mires.</p>' +
          '<div id="tsq-llistes">' +
            (dades.llistes.length
              ? dades.llistes.map(function (l) {
                  return '<label class="cat-exclou"><input type="checkbox" data-l="' + esc(l.id) + '"' +
                    (l.mostra ? ' checked' : '') + '><span>' + esc(l.nom) +
                    (l.principal ? ' · la principal' : '') + '</span></label>';
                }).join('')
              : '<p class="menut">Encara no n\'hi ha cap. Toca «Torna a llegir-les».</p>') +
          '</div>' +
          '<button class="btn btn-secundari" data-sincro style="margin-top:var(--e3)">' +
            'Torna a llegir-les de Google</button>' +
        '</div>');

      cos.querySelectorAll('[data-l]').forEach(function (c) {
        c.addEventListener('change', function () {
          c.disabled = true;
          escriu('tasques', 'mostra', { id: c.dataset.l, mostra: c.checked })
            .then(function (r) { c.disabled = false; aplica(r); })
            .catch(function (err) {
              c.disabled = false; c.checked = !c.checked;
              App.brindis(err.message, 'error');
            });
        });
      });

      cos.querySelector('[data-sincro]').addEventListener('click', function () {
        var b = this;
        b.disabled = true; b.textContent = 'Un moment…';
        escriu('tasques', 'sincronitza', {})
          .then(function (r) {
            App.tancaModal(); App.brindis('Llistes al dia');
            aplica(r);
          })
          .catch(function (err) {
            b.disabled = false; b.textContent = 'Torna a llegir-les de Google';
            App.brindis(err.message, 'error');
          });
      });
    }

    // ---------------------------------------------------------------- càrrega

    /**
     * Rebre una pantalla del servidor i pintar-la si toca.
     *
     * La torna CADA escriptura, no només `pantalla`: desar i tornar a demanar
     * la llista eren dos viatges, i a Apps Script el viatge és tot el cost.
     *
     * No es repinta mentre té un camp obert: repintar li tancaria el
     * desplegable o li esborraria el que estava escrivint. S'espera i es pinta
     * quan pari.
     */
    function aplica(r, dEnCau) {
      Cau.set('tasques.llista', r);
      var nou = JSON.stringify(r);
      if (nou === previPintat && !esperant) return;

      if (previPintat !== null && App.interactuant()) {
        var primer = !ajornat;
        ajornat = r;
        if (primer) setTimeout(quanPari, 400);
        return;
      }
      previPintat = nou;
      /* Marcar una tasca refà la llista sencera —la feta se'n va i canvien els
         comptadors—, i això és correcte. El que no ho és, és que a sobre et
         torni a dalt de tot quan n'estaves marcant una de la setena. */
      App.mantenintLaVista(function () { pinta(r, !!dEnCau); });
    }

    /* Es mira cada tant si ja ha acabat, en comptes d'esperar que salti el
       focus: mentre escrius al camp de captura les línies provisionals es
       queden a la vista, que és el que vols, i quan pares es posa al dia. */
    function quanPari() {
      if (!arrel.isConnected) { ajornat = null; return; }
      if (App.interactuant()) { setTimeout(quanPari, 400); return; }
      var r = ajornat;
      ajornat = null;
      if (r) aplica(r);
    }

    function carrega() {
      var desat = Cau.get('tasques.llista', null);
      if (desat) {
        try { previPintat = JSON.stringify(desat); pinta(desat, true); }
        catch (e) { previPintat = null; }
      }

      crida('tasques', 'pantalla', {})
        .then(function (r) { aplica(r); })
        .catch(function (err) {
          if (desat) App.brindis(err.message, 'error');
          else arrel.innerHTML = Comp.error(err, true);
        });
    }

    arrel.innerHTML = Comp.carregant(3);
    carrega();
  }
});
</script>
