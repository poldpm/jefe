<script>
/* JEFE — MÒDUL · Escola

   Aquesta pantalla substitueix una finestra de Telegram, i per això s'assembla
   més a una safata que a un xat: el que hi arriba no és conversa, són avisos
   d'un automatisme. El que has de poder fer d'un cop d'ull és veure què hi ha
   sense llegir i despatxar-ho.

   ELS BOTONS DE DALT SÍ QUE SÓN UNA PREGUNTA A L'ESCOLA i triguen: cada un és
   un viatge al seu script. Per això es marquen mentre esperen i la resposta
   arriba a la mateixa safata, com un missatge més. */

App.registraVista('escola', {
  render: function (arrel) {

    var d = null;
    var veureVistos = false;   // l'historial arrenca plegat, i es queda com el deixis

    /* LA RESPOSTA VIU AQUÍ I NO AL DOM.
       Si es quedés només pintada, marcar un avís com a vist —que refà la
       pantalla— te la faria desaparèixer just quan l'estàs llegint. */
    var resposta = null;       // { titol, text }

    function quan(iso) {
      if (!iso) return '';
      var t = String(iso).replace(' ', 'T');
      var x = new Date(t);
      if (isNaN(x)) return String(iso).slice(0, 16);
      var avui = new Date();
      var mateixDia = x.toDateString() === avui.toDateString();
      var h = ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2);
      if (mateixDia) return h;
      return x.getDate() + ' ' + ['gen','feb','març','abr','maig','juny','jul','ag','set','oct','nov','des'][x.getMonth()] + ' · ' + h;
    }

    var MENES = {
      acta:     'Acta',
      tasca:    'Tasca',
      event:    'Event',
      drive:    'Drive',
      resum:    'Resum',
      resposta: 'Resposta',
      avis:     'Avís'
    };

    function buida(nHaHagut) {
      return '<div class="estat">' + ic('escola', 'ic-g') +
        '<h2>' + (nHaHagut ? 'Res nou' : 'Encara no hi ha res') + '</h2>' +
        '<p>' + (nHaHagut
          ? 'Ho tens tot vist. Quan l\'escola enviï alguna cosa, t\'arribarà al telèfon i sortirà aquí.'
          : 'Aquí hi arribarà el que fins ara t\'enviava el bot: correus amb tasca o data, ' +
            'actes de primària, canvis a la carpeta de 2n i els resums del matí.') +
        '</p></div>';
    }

    /**
     * DESPATXAR UN AVÍS SENSE REFER LA PÀGINA.
     *
     * Repintar-ho tot per treure una targeta té un preu que es veu de seguida:
     * si has baixat fins a l'avís número set i el marques, la pàgina et torna
     * a dalt de tot i has de tornar a baixar. I amb dos tocs seguits, el segon
     * cau sobre un node que ja no existeix.
     *
     * Aquí es toca només el que canvia: la targeta, els dos comptadors i, si
     * era l'últim, el forat que deixa. L'scroll no es mou, la resposta que
     * tinguis oberta es queda, i el focus tampoc salta.
     */
    function despatxa(id, boto) {
      var art = boto.closest('.esc-msg');

      (d.missatges || []).forEach(function (x) {
        if (x.id === id && !x.llegit_el) x.llegit_el = 'ara';
      });
      var nous = (d.missatges || []).filter(function (x) { return !x.llegit_el; }).length;
      var vistos = (d.missatges || []).length - nous;
      d.pendents = nous;
      Cau.set('escola', d);

      var compte = arrel.querySelector('#esc-compte');
      if (compte) compte.textContent = nous ? nous + ' sense llegir' : 'tot llegit';
      var tot = arrel.querySelector('[data-totllegit]');
      if (tot) tot.hidden = !nous;
      var ov = arrel.querySelector('[data-vistos]');
      if (ov) ov.textContent = (veureVistos ? 'Amaga' : 'Veure') + ' els ' + vistos + ' ja vistos';

      var acaba = function () {
        if (art) art.remove();
        /* Si era l'últim, el que hi havia deixa de tenir sentit i el forat s'ha
           d'omplir. És l'únic canvi d'estructura, i és d'un sol contenidor. */
        if (!nous) {
          var caixa = arrel.querySelector('#esc-nous');
          if (caixa) caixa.innerHTML = buida((d.missatges || []).length);
        }
      };

      var quiet = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (art && !quiet) {
        art.style.height = art.offsetHeight + 'px';
        art.classList.add('esc-despatxat');
        setTimeout(acaba, 200);
      } else {
        acaba();
      }

      crida('escola', 'marcaLlegit', { id: id })
        .catch(function (err) { App.brindis(err.message, 'error'); carrega(true); });
    }

    function capcalera() {
      return '<header class="capcalera"><div class="capcalera-fila">' +
        '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
          ic('conversa', 'ic-p') + '</button>' +
        '<div style="flex:1;min-width:0">' +
          '<h1 style="font-size:1.0625rem;margin:0">Escola</h1>' +
          '<p class="marge" id="esc-compte" style="margin:2px 0 0">' +
            (d && d.pendents ? d.pendents + ' sense llegir' : 'tot llegit') + '</p>' +
        '</div>' +
        '<button class="btn btn-fantasma" data-totllegit="1"' +
          (d && d.pendents ? '' : ' hidden') + '>Llegit</button>' +
      '</div></header>';
    }

    function pinta() {
      var tots = d.missatges || [];
      var nous = tots.filter(function (x) { return !x.llegit_el; });
      var vistos = tots.filter(function (x) { return !!x.llegit_el; });

      /* NOMÉS EL QUE NO HAS LLEGIT.
         Aquesta pantalla ensenyava tot l'historial, i al cap de dues setmanes
         això és una llista inacabable de coses que ja vas llegir a la
         notificació quan van arribar. El que has vist ja no et reclama res: es
         queda desat i darrere d'una línia, no ocupant la pantalla. */
      var llista = function (fils) {
        return fils.map(function (x) {
          var nou = !x.llegit_el;
          return '<article class="esc-msg' + (nou ? ' esc-nou' : '') + '" data-id="' + esc(x.id) + '">' +
            '<header>' +
              '<span class="esc-mena">' + esc(MENES[x.mena] || 'Avís') + '</span>' +
              '<span class="esc-quan">' + esc(quan(x.rebut_el)) + '</span>' +
            '</header>' +
            '<h2>' + esc(x.titol) + '</h2>' +
            (x.cos ? '<p>' + esc(x.cos) + '</p>' : '') +
            (nou ? '<button class="esc-vist" data-vist="' + esc(x.id) + '">Vist</button>' : '') +
          '</article>';
        }).join('');
      };

      arrel.innerHTML = capcalera() +
        '<div class="pagina">' +

          /* PREGUNTAR A L'ESCOLA. Són els quatre comandaments que fins ara
             escrivies al bot. Si el pont no hi és, es diu i no s'amaguen: un
             botó que desapareix no ensenya res, i un que no hi és mai no
             s'entén. */
          '<section class="esc-comandes">' +
            (d.pont
              ? [['agenda', 'Agenda'], ['pendents', 'Pendents'],
                 ['correus', 'Correus'], ['setmana', 'Setmana']].map(function (c) {
                  return '<button class="btn btn-secundari" data-cmd="' + c[0] + '">' +
                    esc(c[1]) + '</button>';
                }).join('')
              : '<p class="menut" style="margin:0">Encara no pots preguntar-li res: falta ' +
                'engegar el pont amb el compte de l\'escola. Els avisos que t\'enviï ' +
                'sí que arriben.</p>') +
          '</section>' +

          /* LA RESPOSTA, JUST SOTA EL BOTÓ QUE L'HA DEMANADA.
             Abans anava al final de la pàgina: premies «Agenda» i la resposta
             et sortia sota tot l'historial, on no la veies. El que has demanat
             ha de sortir on estàs mirant. */
          '<div id="esc-resposta">' +
            (resposta
              ? '<article class="esc-msg esc-resposta">' +
                  '<header><span class="esc-mena">' + esc(resposta.titol) + '</span>' +
                  '<button class="esc-tanca-resposta" data-tancaresp="1" aria-label="Tanca la resposta">' +
                    ic('tancar') + '</button></header>' +
                  '<p>' + esc(resposta.text) + '</p>' +
                '</article>'
              : '') +
          '</div>' +

          '<div id="esc-nous">' +
            (nous.length ? '<div class="esc-safata">' + llista(nous) + '</div>' : buida(tots.length)) +
          '</div>' +

          /* L'HISTORIAL, DARRERE D'UNA LÍNIA. No s'esborra res mai; només que
             el que ja has despatxat no té per què ocupar-te la pantalla. */
          (vistos.length
            ? '<section class="esc-vistos">' +
                '<button class="esc-obre-vistos" data-vistos="1" aria-expanded="' +
                  (veureVistos ? 'true' : 'false') + '">' +
                  (veureVistos ? 'Amaga' : 'Veure') + ' els ' + vistos.length + ' ja vistos' +
                '</button>' +
                (veureVistos ? '<div class="esc-safata">' + llista(vistos) + '</div>' : '') +
              '</section>'
            : '') +
        '</div>';

      lliga();
    }

    function lliga() {
      var t = arrel.querySelector('[data-torna]');
      if (t) t.addEventListener('click', function () { App.ves('conversa'); });

      var tot = arrel.querySelector('[data-totllegit]');
      if (tot) tot.addEventListener('click', function () {
        tot.disabled = true;
        crida('escola', 'llegeixTot', {})
          .then(function () { carrega(true); })
          .catch(function (err) { tot.disabled = false; App.brindis(err.message, 'error'); });
      });

      var ov = arrel.querySelector('[data-vistos]');
      if (ov) ov.addEventListener('click', function () { veureVistos = !veureVistos; pinta(); });

      var tr = arrel.querySelector('[data-tancaresp]');
      if (tr) tr.addEventListener('click', function () { resposta = null; pinta(); });

      arrel.querySelectorAll('[data-vist]').forEach(function (b) {
        /* Un sol cop: sense això, dos tocs seguits envien dues crides i el
           segon es troba la targeta a mig desaparèixer. */
        b.addEventListener('click', function () {
          if (b.disabled) return;
          b.disabled = true;
          despatxa(b.dataset.vist, b);
        });
      });

      arrel.querySelectorAll('[data-cmd]').forEach(function (b) {
        b.addEventListener('click', function () {
          var caixa = arrel.querySelector('#esc-resposta');
          var abans = b.textContent;
          b.disabled = true; b.textContent = 'Demanant…';
          caixa.innerHTML = '<div class="esquelet" style="height:72px"></div>';
          crida('escola', 'comanda', { quina: b.dataset.cmd }).then(function (r) {
            resposta = { titol: abans, text: String(r && r.text || '(sense resposta)') };
            pinta();
          }).catch(function (err) {
            caixa.innerHTML = '';
            b.disabled = false; b.textContent = abans;
            App.brindis(err.message, 'error');
          });
        });
      });
    }

    function carrega(refresca) {
      var cau = Cau.get('escola', null);
      if (cau && !refresca) { d = cau; pinta(); }
      else if (!cau) arrel.innerHTML = Comp.carregant(3);

      crida('escola', 'pantalla', {}).then(function (r) {
        d = r; Cau.set('escola', r); pinta();
      }).catch(function (err) {
        if (d) { App.brindis('Sense connexió: dades del telèfon', 'error'); return; }
        arrel.innerHTML = Comp.error(err, true);
        var b = arrel.querySelector('[data-reintenta]');
        if (b) b.addEventListener('click', function () { App.ves('escola'); });
      });
    }

    carrega(false);
  }
});
</script>
