<!--
THESIS: aquesta pantalla és el que l'automatització de l'escola HA TROBAT, no
una segona eina de gestió d'aula —d'aquesta ja en té una—. Refusa la safata de
missatges plana, on una substitució i un canvi de fitxer valen igual.
OWN-WORLD: la consola de JEFE, sense inventar-ne cap altra. Fil viu, panells de
cara fosca, lletra de màquina per a les hores i els comptadors.
STORY: obre, veu l'hora que ve, què li queda pendent, i entra on ha d'entrar.
FIRST VIEWPORT: la columna d'hores del dia, amb les lliures dites com a lliures
i la substitució partint la columna amb el fil vermell. Sota, els pendents.
FORM: columna d'hores, la 1a de la llista ordenada; triada per en Pol sobre
l'assignada (graella, clau 7698648b), que és la seva prerrogativa.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, and DESIGN.md.
-->
<script>
/* JEFE — MÒDUL · Escola

   QUÈ ENSENYA I EN QUIN ORDRE, i l'ordre és la decisió:

     1. AVUI      la columna d'hores. El que ve, i les hores lliures dites com
                  a lliures, que també és informació.
     2. PENDENTS  el que has de fer, en una línia cadascun.
     3. ACCESSOS  les tres eines de fora.
     4. AVISOS    el que ha arribat, amb campaneta perquè es reconegui: sense
                  una marca que ho digui, una fitxa és una fitxa i prou.
     5. CONSULTES les quatre preguntes a l'escola, al peu. S'obren en un full
                  a part i d'una en una: són consulta, no el motiu d'entrar.

   Les hores i els pendents surten del resum que arriba cada matí a les set i
   que ja és al full: aquesta pantalla no va a buscar res enlloc. */

App.registraVista('escola', {
  render: function (arrel) {

    var d = null;
    var veureVistos = false;

    var ENLLACOS = [
      ['VedrunApp',      'escola', 'https://poldpm.github.io/VedrunApp/#home'],
      ['Coordinació 2n', 'cicle',  'https://poldpm.github.io/coordinaci-_2nPrim/'],
      ['BiblioWeb',      'domini de l\'escola',
       'https://script.google.com/a/macros/escorialvic.cat/s/AKfycbyg_SyFmoHPXUH63xoS3bSGjP0HwnXz9ynejyiaSejegJWQ4IHyxr0qEdaIIVeqOkzh/exec']
    ];

    var MENES = { acta: 'Acta', tasca: 'Tasca', event: 'Cita', drive: 'Drive',
                  resum: 'Resum', resposta: 'Resposta', avis: 'Avís' };

    function quan(iso) {
      if (!iso) return '';
      var x = new Date(String(iso).replace(' ', 'T'));
      if (isNaN(x)) return String(iso).slice(0, 16);
      var h = ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2);
      if (x.toDateString() === new Date().toDateString()) return h;
      return x.getDate() + ' ' + ['gen','feb','març','abr','maig','juny','jul','ag','set','oct','nov','des'][x.getMonth()];
    }

    /* Una substitució no és un avís més: si te'n perds una, una classe es queda
       sense mestre. És l'única cosa d'aquesta pantalla que es marca en vermell. */
    function esSubstitucio(t) {
      return /substituci/i.test(String(t || ''));
    }

    function ara() {
      var x = new Date();
      return ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2);
    }

    // ------------------------------------------------------------- capçalera
    function capcalera() {
      var n = d ? d.pendents : 0;
      return '<header class="capcalera"><div class="capcalera-fila">' +
        '<button class="btn btn-fantasma btn-icona" data-torna="1" aria-label="Torna a la conversa">' +
          ic('conversa', 'ic-p') + '</button>' +
        '<div style="flex:1;min-width:0">' +
          '<h1 style="font-size:1.0625rem;margin:0">Escola</h1>' +
          '<p class="marge" id="esc-compte" style="margin:2px 0 0">' +
            esc(fmt.relativa(d ? d.avui : fmt.avui())) + ' · ' + esc(ara()) +
            (n ? ' · ' + n + ' sense llegir' : '') + '</p>' +
        '</div>' +
      '</div></header>';
    }

    // ------------------------------------------------------ la columna d'hores
    /* LES HORES LLIURES ES DIUEN. Un forat entre dues cites no és un buit del
       disseny: és una hora que tens, i saber-ho és la meitat del que vens a
       mirar. Només s'omplen els forats INTERIORS: abans de la primera i
       després de l'última no hi ha res a dir. */
    function columna(hores) {
      if (!hores.length) return '';
      var files = [];
      var h0 = Number(hores[0].hora.slice(0, 2));
      var h1 = Number(hores[hores.length - 1].hora.slice(0, 2));

      var buides = [];
      var buidaFora = function () {
        if (!buides.length) return;
        /* Un tram lliure seguit va en UNA línia i no en cinc. Cinc «lliure»
           un sota l'altre entre les onze i les cinc omplien mitja pantalla
           per dir una cosa que cap en set caràcters. */
        var a = ('0' + buides[0]).slice(-2) + ':00';
        var b = ('0' + buides[buides.length - 1]).slice(-2) + ':00';
        files.push('<div class="esc-lliure">' +
          (buides.length === 1 ? a : a + '–' + b) + ' · lliure</div>');
        buides = [];
      };

      for (var h = h0; h <= h1; h++) {
        var aquesta = hores.filter(function (x) { return Number(x.hora.slice(0, 2)) === h; });
        if (aquesta.length) {
          buidaFora();
          aquesta.forEach(function (x) {
            var subs = esSubstitucio(x.que);
            files.push('<div class="esc-h' + (subs ? ' esc-subs' : '') + '">' +
              '<i class="esc-hora">' + esc(x.hora) + '</i>' +
              (subs ? '<span class="esc-et">Substitució</span>' : '') +
              '<b>' + esc(x.que) + '</b>' +
            '</div>');
          });
        } else {
          buides.push(h);
        }
      }
      buidaFora();
      return '<div class="esc-columna">' + files.join('') + '</div>';
    }

    // --------------------------------------------------------- els pendents
    /* UNA CAIXA PER LLISTA, com al Google Tasks —d'on surten—. Abans era una
       llista llarga amb el nom de la llista entre claudàtors al davant de cada
       línia: vint tasques seguides on el que les separa és un claudàtor no
       s'ordenen amb la vista, s'han de llegir una per una. La caixa fa la
       feina que feia el claudàtor, i el nom es diu un cop. */
    function agrupa(pendents) {
      var ordre = [], per = {};
      (pendents || []).forEach(function (x) {
        var k = String(x.llista || '').trim() || 'Sense llista';
        if (!per[k]) { per[k] = []; ordre.push(k); }
        per[k].push(x);
      });
      return ordre.map(function (k) { return { nom: k, coses: per[k] }; });
    }

    function caixesPendents(pendents) {
      return '<div class="esc-grups">' + agrupa(pendents).map(function (g) {
        return '<section class="esc-grup">' +
          '<h3 class="esc-grup-cap"><span>' + esc(g.nom) + '</span>' +
            '<b>' + g.coses.length + '</b></h3>' +
          '<ul class="esc-grup-coses">' + g.coses.map(function (x) {
            return '<li>' + esc(x.que) + '</li>';
          }).join('') + '</ul>' +
        '</section>';
      }).join('') + '</div>';
    }

    // ----------------------------------------------------------------- pinta
    function pinta() {
      var dia = d.dia || { hores: [], pendents: [], altres: [] };
      /* EL RESUM D'AVUI NO SURT COM A FITXA. El seu contingut ÉS aquesta
         pàgina —les hores de dalt i els pendents de sota surten d'ell—, i
         ensenyar-lo a més com a targeta era dir-ho tot dues vegades a la
         mateixa pantalla. Els d'altres dies sí que hi són, a les vistes. */
      var tots = (d.missatges || []).filter(function (x) {
        return !(x.mena === 'resum' && String(x.rebut_el).slice(0, 10) === d.avui);
      });
      var nous = tots.filter(function (x) { return !x.llegit_el; });
      var vistos = tots.filter(function (x) { return !!x.llegit_el; });

      var fitxa = function (x) {
        var nou = !x.llegit_el;
        return '<article class="esc-msg' + (nou ? ' esc-nou' : '') + '" data-id="' + esc(x.id) + '">' +
          '<header><span class="esc-mena">' + esc(MENES[x.mena] || 'Avís') + '</span>' +
          '<span class="esc-quan">' + esc(quan(x.rebut_el)) + '</span></header>' +
          '<h3>' + esc(x.titol) + '</h3>' +
          (x.cos ? '<p>' + esc(x.cos) + '</p>' : '') +
          (nou ? '<button class="esc-vist" data-vist="' + esc(x.id) + '">Vist</button>' : '') +
        '</article>';
      };

      arrel.innerHTML = capcalera() +
        '<div class="pagina">' +

          // ---- 1. AVUI
          '<section>' +
            '<p class="marge">Avui</p>' +
            (dia.hores.length
              ? columna(dia.hores)
              : '<p class="menut">' + (d.teResum
                  ? 'El resum d\'aquest matí no portava cap hora.'
                  : 'Encara no ha arribat el resum del matí. Arriba a les set.') + '</p>') +
          '</section>' +

          // ---- 2. PENDENTS
          (dia.pendents.length
            ? '<section class="esc-secc">' +
                '<p class="marge">Pendents</p>' +
                caixesPendents(dia.pendents) +
              '</section>'
            : '') +

          // ---- 3. ACCESSOS
          '<section class="esc-secc">' +
            '<p class="marge">Accessos</p>' +
            '<div class="esc-acc">' + ENLLACOS.map(function (e) {
              return '<a href="' + esc(e[2]) + '" target="_blank" rel="noopener">' +
                '<b>' + esc(e[0]) + '</b><span>' + esc(e[1]) + '</span></a>';
            }).join('') + '</div>' +
          '</section>' +

          // ---- 4. AVISOS
          '<section class="esc-secc">' +
            '<p class="marge esc-titol-avisos">' + ic('campana', 'ic-p') +
              'Notificacions' + (nous.length ? ' · ' + nous.length : '') + '</p>' +
            '<div id="esc-nous">' +
              (nous.length
                ? '<div class="esc-safata">' + nous.map(fitxa).join('') + '</div>'
                : '<p class="menut">Res nou. Quan l\'escola enviï alguna cosa, ' +
                  't\'arribarà al telèfon i sortirà aquí.</p>') +
            '</div>' +
            (vistos.length
              ? '<button class="esc-obre-vistos" data-vistos="1" aria-expanded="' +
                  (veureVistos ? 'true' : 'false') + '">' +
                  (veureVistos ? 'Amaga' : 'Veure') + ' les ' + vistos.length + ' ja vistes' +
                '</button>' +
                (veureVistos ? '<div class="esc-safata">' + vistos.map(fitxa).join('') + '</div>' : '')
              : '') +
          '</section>' +

          // ---- 5. CONSULTES
          '<section class="esc-secc esc-consultes">' +
            '<p class="marge">Preguntar a l\'escola</p>' +
            (d.pont
              ? '<div class="esc-cmd">' +
                  [['agenda', 'Agenda'], ['pendents', 'Pendents'],
                   ['correus', 'Correus'], ['setmana', 'Setmana']].map(function (c) {
                    return '<button data-cmd="' + c[0] + '">' + esc(c[1]) + '</button>';
                  }).join('') +
                '</div>'
              : '<p class="menut">Falta engegar el pont amb el compte de l\'escola. ' +
                'El que t\'enviï sí que arriba.</p>') +
          '</section>' +
        '</div>';

      lliga();
    }

    // ------------------------------------------------------------------ lliga
    function lliga() {
      var t = arrel.querySelector('[data-torna]');
      if (t) t.addEventListener('click', function () { App.ves('conversa'); });

      var ov = arrel.querySelector('[data-vistos]');
      if (ov) ov.addEventListener('click', function () { veureVistos = !veureVistos; pinta(); });

      arrel.querySelectorAll('[data-vist]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.disabled) return;
          b.disabled = true;
          despatxa(b.dataset.vist, b);
        });
      });

      /* LA RESPOSTA S'OBRE EN UN FULL A PART, i d'una en una.
         Abans queia a la pàgina i s'hi acumulava: preguntaves tres coses i
         tenies tres respostes llargues una sota l'altra, que és exactament el
         que no vols quan mires això entre classe i classe. Un full, una
         resposta, i el tanques. */
      arrel.querySelectorAll('[data-cmd]').forEach(function (b) {
        b.addEventListener('click', function () {
          var abans = b.textContent;
          b.disabled = true; b.textContent = '…';
          crida('escola', 'comanda', { quina: b.dataset.cmd }).then(function (r) {
            b.disabled = false; b.textContent = abans;
            obreResposta(abans, String(r && r.text || '(sense resposta)'));
          }).catch(function (err) {
            b.disabled = false; b.textContent = abans;
            App.brindis(err.message, 'error');
          });
        });
      });
    }

    /* La resposta de «Pendents» arriba amb el mateix «[llista] títol» que el
       resum del matí, o sigui que es capsa igual. Les línies amb claudàtor
       s'acumulen i surten totes juntes en caixes; qualsevol altra cosa les
       tanca i es pinta al seu lloc, que és com estaven. */
    function obreResposta(titol, text) {
      var linies = String(text).split('\n').filter(function (l) { return l.trim(); });
      var trossos = [], cua = [];

      var tancaCua = function () {
        if (!cua.length) return;
        trossos.push(caixesPendents(cua));
        cua = [];
      };

      linies.forEach(function (l) {
        var net = l.replace(/^[·•\-*]\s*/, '').trim();

        var g = net.match(/^\[([^\]]+)\]\s*(.+)$/);
        if (g) { cua.push({ llista: g[1].trim(), que: g[2].trim() }); return; }

        tancaCua();
        var m = net.match(/^(\d{1,2}[:.]\d{2})\s*[·\-–]?\s*(.+)$/);
        if (m) {
          trossos.push('<div class="esc-p"><i class="esc-hora-p">' + esc(m[1].replace('.', ':')) +
                       '</i><span>' + esc(m[2]) + '</span></div>');
          return;
        }
        if (net.slice(-1) === ':' || /^\d+$/.test(net)) {
          trossos.push('<p class="marge" style="margin:var(--e3) 0 var(--e1)">' +
                       esc(net.replace(/:$/, '')) + '</p>');
          return;
        }
        trossos.push('<div class="esc-p"><i>·</i><span>' + esc(net) + '</span></div>');
      });
      tancaCua();

      App.modal(titol, '<div class="esc-resp">' + trossos.join('') + '</div>');
    }

    // ------------------------------------------------------------- despatxar
    /* Es toca només el que canvia: la fitxa, el comptador de la capçalera i el
       de les vistes. Refer la pàgina et tornaria a dalt de tot. */
    function despatxa(id, boto) {
      var art = boto.closest('.esc-msg');

      (d.missatges || []).forEach(function (x) {
        if (x.id === id && !x.llegit_el) x.llegit_el = 'ara';
      });
      var nous = (d.missatges || []).filter(function (x) { return !x.llegit_el; }).length;
      var vistos = (d.missatges || []).length - nous;
      d.pendents = nous;
      Cau.set('escola', d);

      var compte = arrel.querySelector('#esc-compte');
      if (compte) {
        compte.textContent = fmt.relativa(d.avui) + ' · ' + ara() +
          (nous ? ' · ' + nous + ' sense llegir' : '');
      }
      var tit = arrel.querySelector('.esc-titol-avisos');
      if (tit) {
        var s = tit.querySelector('svg');
        tit.innerHTML = (s ? s.outerHTML : '') + 'Notificacions' + (nous ? ' · ' + nous : '');
      }
      var ov = arrel.querySelector('[data-vistos]');
      if (ov) ov.textContent = (veureVistos ? 'Amaga' : 'Veure') + ' les ' + vistos + ' ja vistes';

      var acaba = function () {
        if (art) art.remove();
        if (!nous) {
          var caixa = arrel.querySelector('#esc-nous');
          if (caixa) {
            caixa.innerHTML = '<p class="menut">Res nou. Quan l\'escola enviï alguna cosa, ' +
              't\'arribarà al telèfon i sortirà aquí.</p>';
          }
        }
      };
      var quiet = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (art && !quiet) {
        art.style.height = art.offsetHeight + 'px';
        art.classList.add('esc-despatxat');
        setTimeout(acaba, 200);
      } else { acaba(); }

      crida('escola', 'marcaLlegit', { id: id })
        .catch(function (err) { App.brindis(err.message, 'error'); carrega(true); });
    }

    // ----------------------------------------------------------------- càrrega
    function carrega(refresca) {
      var cau = Cau.get('escola', null);
      if (cau && !refresca) { d = cau; pinta(); }
      else if (!cau) arrel.innerHTML = Comp.carregant(3);

      crida('escola', 'pantalla', {}).then(function (r) {
        d = r; Cau.set('escola', r); pinta();
      }).catch(function (err) {
        if (d) { App.brindis('Sense connexió: dades del telèfon', 'error'); return; }
        arrel.innerHTML = Comp.error(err, true);
        var b = arrel.querySelector('[data-reintenta]');
        if (b) b.addEventListener('click', function () { App.ves('escola'); });
      });
    }

    carrega(false);
  }
});
</script>
