<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Simbologia de mapa, dibuixada a mà amb un sol gruix de traç.
       Els símbols d'hàbit surten del repertori d'un full 1:25.000: cim, font,
       refugi, fita, creu, cova, arbre, pont, gual, mina. A cada hàbit se li
       assigna un símbol de manera estable a partir del seu identificador,
       igual que una entrada de llegenda. -->

  <!-- ---- simbologia (hàbits) ---- -->
  <symbol id="sb-cim"    viewBox="0 0 24 24"><path d="M3 19h18L12 5z"/><circle cx="12" cy="15.5" r="1.4"/></symbol>
  <symbol id="sb-font"   viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.2"/><path d="M5 16c2-1.6 4-1.6 6 0s4 1.6 6 0"/><path d="M5 20c2-1.6 4-1.6 6 0s4 1.6 6 0"/></symbol>
  <symbol id="sb-refugi" viewBox="0 0 24 24"><path d="M4 12 12 5l8 7"/><path d="M6.5 11v8h11v-8"/><path d="M10.5 19v-4h3v4"/></symbol>
  <symbol id="sb-fita"   viewBox="0 0 24 24"><path d="M8 20h8"/><path d="M9 20v-4h6v4"/><path d="M10 16v-4h4v4"/><path d="M11 12V8h2v4"/></symbol>
  <symbol id="sb-creu"   viewBox="0 0 24 24"><path d="M12 4v16"/><path d="M7 9h10"/><path d="M8.5 20h7"/></symbol>
  <symbol id="sb-cova"   viewBox="0 0 24 24"><path d="M4 19c0-6 3.6-10 8-10s8 4 8 10"/><path d="M9.5 19c0-2.6 1.1-4.5 2.5-4.5s2.5 1.9 2.5 4.5"/></symbol>
  <symbol id="sb-arbre"  viewBox="0 0 24 24"><path d="M12 20v-5"/><path d="M12 15 6.5 9h11z"/><path d="M12 10 8 5.5h8z"/></symbol>
  <symbol id="sb-pont"   viewBox="0 0 24 24"><path d="M3 15c4.5 0 6-6 9-6s4.5 6 9 6"/><path d="M3 19h18"/><path d="M6 15v4M18 15v4"/></symbol>
  <symbol id="sb-gual"   viewBox="0 0 24 24"><path d="M3 9c2.6-1.8 5.2-1.8 7.8 0s5.2 1.8 7.8 0"/><path d="M3 14c2.6-1.8 5.2-1.8 7.8 0s5.2 1.8 7.8 0"/><path d="M3 19h18"/></symbol>
  <symbol id="sb-mina"   viewBox="0 0 24 24"><path d="M5 19 19 7"/><path d="M14 5h5v5"/><path d="M5 19h4"/></symbol>

  <!-- ---- consola ---- -->
  <symbol id="ic-conversa" viewBox="0 0 24 24">
    <path d="M3.5 5.5h17v11h-9.5L6 20.5v-4H3.5z"/><path d="M7.5 10h9M7.5 13h6"/>
  </symbol>
  <symbol id="ic-micro" viewBox="0 0 24 24">
    <rect x="9" y="2.5" width="6" height="11" rx="3"/>
    <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3.5"/><path d="M8.5 21.5h7"/>
  </symbol>
  <symbol id="ic-envia" viewBox="0 0 24 24">
    <path d="M3.5 12 20.5 4l-4 16-5-6z"/><path d="M11.5 14 20.5 4"/>
  </symbol>
  <symbol id="ic-veu" viewBox="0 0 24 24">
    <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/>
    <path d="M15.5 9.5a4 4 0 0 1 0 5"/><path d="M18 7a7.5 7.5 0 0 1 0 10"/>
  </symbol>

  <!-- ---- interfície ---- -->
  <symbol id="ic-inici" viewBox="0 0 24 24">
    <path d="M3.5 4.5h17v15h-17z"/><path d="M3.5 9h17M3.5 15h17M9 4.5v15M15 4.5v15"/>
  </symbol>
  <symbol id="ic-habits" viewBox="0 0 24 24">
    <path d="M2.5 17c3-4 5.5-4 8.5 0s6 4 10.5 0"/>
    <path d="M2.5 12c3-4 5.5-4 8.5 0s6 4 10.5 0"/>
    <path d="M4.5 7c2.4-3 4.4-3 6.8 0s4.8 3 8.4 0"/>
  </symbol>
  <!-- Nutrició: una balança. El que mesura aquest mòdul és un balanç —
       cremades contra ingerides— i no pas un plat. -->
  <symbol id="ic-nutricio" viewBox="0 0 24 24">
    <path d="M12 5.5v14M8.5 19.5h7"/>
    <path d="M4.5 8.5h15"/>
    <path d="M2 8.9 4.5 13.6 7 8.9"/>
    <path d="M17 8.9 19.5 13.6 22 8.9"/>
  </symbol>
  <!-- Finances: un perfil de terreny amb la línia de l'equilibri. El que
       mires cada mes és si vas per sobre o per sota, no una moneda. -->
  <symbol id="ic-finances" viewBox="0 0 24 24">
    <path d="M3 20h18"/>
    <path d="M3 14.5l4.5-4 3.5 3 4-6 5.5 5.5"/>
    <path d="M3 17h18" stroke-dasharray="2 2.5"/>
  </symbol>
  <!-- Estat buit: un anell obert. Era un mapa plegat, del mon d abans, i en
       una consola un mapa no vol dir res. Es l anell que surt a tot arreu
       pero sense tancar i sense res a dins: aqui encara no hi ha res.
       Ple i amb creu es el punxo, que vol dir el contrari; per aixo aquest
       va a traç partit i sense centre. -->
  <symbol id="ic-mapa" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3.4"/>
  </symbol>
  <symbol id="ic-captura" viewBox="0 0 24 24"><path d="M13.5 3 5.5 13.5h5.2L10 21l8.2-10.7h-5z"/></symbol>
  <symbol id="ic-tasques" viewBox="0 0 24 24">
    <path d="M10 6.5h10M10 12h10M10 17.5h7"/><path d="M3.5 6l1.4 1.4L7.6 4.7"/><path d="M3.5 11.5l1.4 1.4 2.7-2.7"/>
  </symbol>
  <symbol id="ic-diari" viewBox="0 0 24 24">
    <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H20v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M8.5 4v16"/>
  </symbol>

  <!-- El calendari: full quadriculat amb les dues anelles, com el de paret. -->
  <symbol id="ic-calendari" viewBox="0 0 24 24">
    <path d="M3.5 5.5h17v15h-17z"/>
    <path d="M3.5 10h17"/>
    <path d="M8 3v4M16 3v4"/>
    <path d="M8 13.5h2.5M13.5 13.5H16M8 17h2.5M13.5 17H16"/>
  </symbol>

  <symbol id="ic-esquerra" viewBox="0 0 24 24"><path d="M15 4.5 8 12l7 7.5"/></symbol>
  <symbol id="ic-dreta"    viewBox="0 0 24 24"><path d="M9 4.5 16 12l-7 7.5"/></symbol>
  <symbol id="ic-tancar"   viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="ic-mes"      viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="ic-menys"    viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="ic-llapis"   viewBox="0 0 24 24"><path d="M4 20h4.2L20.2 8 16 3.8 4 15.8z"/><path d="M14.2 5.8 18.2 9.8"/></symbol>
  <symbol id="ic-arxiva"   viewBox="0 0 24 24"><path d="M3.8 8h16.4v11.5H3.8z"/><path d="M2.8 4.5h18.4V8H2.8z"/><path d="M9.8 12h4.4"/></symbol>
  <symbol id="ic-llegenda" viewBox="0 0 24 24"><path d="M3.5 4.5h17v15h-17z"/><path d="M6.5 8.5h3v3h-3zM6.5 14h3v3h-3z"/><path d="M12 10h6M12 15.5h6"/></symbol>
  <symbol id="ic-ajust"    viewBox="0 0 24 24"><path d="M3.5 8h4M12.5 8h8M3.5 16h9M17.5 16h3"/><circle cx="10" cy="8" r="2.6"/><circle cx="15" cy="16" r="2.6"/></symbol>
  <symbol id="ic-avis"     viewBox="0 0 24 24"><path d="M12 4.2 21.2 20H2.8z"/><path d="M12 10.2v4.1"/><path d="M12 17.3v.1"/></symbol>
  <symbol id="ic-sense-xarxa" viewBox="0 0 24 24">
    <path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96"/><path d="M9.2 6.6A5.6 5.6 0 0 1 18 10.2a4.2 4.2 0 0 1 1.6 7.9"/><path d="M3 3l18 18"/>
  </symbol>
  <symbol id="ic-modul" viewBox="0 0 24 24">
    <rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/>
    <rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>
  </symbol>

  <!-- El punxó de control: la marca que deixa una picada d'orientació.
       No és una creu de verificació. -->
  <symbol id="ic-punxo" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3"/>
    <path d="M9 12h6M12 9v6"/>
  </symbol>
</svg>
